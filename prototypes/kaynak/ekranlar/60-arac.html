<!-- ekran: arac · ARAÇ
     Akışın hiçbir adımı buradan geçmez; başvuru ekranı. Neden var:
     K-005'in işe yaraması için — "bu parçayı geçen sefer müşteri
     getirmişti" bilgisi araç ikinci kez geldiğinde karşıya çıkmalı.

     ⚠️ 06.09 — SIRA CEMİL'İN İKİNCİ TARİFİYLE:

       künye+müşteri → İŞLEM BUTONLARI → ÖDEME DURUMU (varsa)
       → ruhsat (akordiyon) → kilometre (akordiyon) → bakım bilgileri
       → NOT (akordiyon) → geçmiş

     Cemil: *"Aracın borcu, ödemesi varsa, araç bilgilerinin altında bir
     alan açıp burada gösterebilirsin. Araç bilgileri, varsa ödeme
     durumu, ruhsat, kilometre, bakım bilgileri altına. Not alanı
     buttonlarda geçmişten önce gelsin. Not alanı gizli olsun. V1'de bu
     alanı güzel yapmıştık."*

     ⚠️ NOT ARTIK AKORDİYONDA — ve bu 04.09'da verdiğim kararı
     düzeltiyor. O gün notu düğmelerin hemen altına koymuştum, gerekçem
     "not en taze bilgi, dipte kimse görmüyor" idi. Gerekçe yanlış
     değildi ama ÖLÇÜ yanlıştı: dört araçtan üçünün notu BOŞ ve boş bir
     textarea, ekranın en üstünde iki satır yer kaplıyordu. Akordiyonun
     sayaçı notun dolu olup olmadığını AÇMADAN söylüyor — dolu not
     görünür, boş not yer kaplamaz.

     ÖDEME DURUMU NEDEN BURADA: veresiye ("almadım") bir ödeme yoludur
     (K-004) ve muhasebede "kimden alacağım" diye zaten okunuyor. Ama
     usta alacağını muhasebede değil, MÜŞTERİ KARŞISINDAYKEN hatırlamak
     istiyor — araç geldiğinde. Alan yalnız BORÇ VARSA açılır; borcu
     olmayan araçta "borç yok" yazmak, olmayan bir sorunu her açılışta
     hatırlatmak olurdu.

     BİLEŞENLER: .card · .arac-bas .plate-lg .veh-title .spec-strip
     · .section-label (.with-action .lbl-txt) · .btn-row .btn .btn-lg
     · .field · .akordiyon .akd-bas .akd-govde · .tutar-serit
     .tutar-sat .tv · .km-sat · .tl-item (ortak kayitSatiriHtml, sade)
     · .tel-link · .cip-grup .cip · .plate-hint · .bos-durum.

     ÜZERİNDE YOK: kontrol tarihleri (muayene/sigorta/kasko) · belge
     arşivi · araç silme · ayrı müşteri ekranı · km TAHMİNİ. -->
<section class="screen" id="screen-arac">

  <div class="card">
    <div id="arKunye"></div>
    <div id="arIletisim"></div>
  </div>

  <!-- ⚠️ 04.09 — BU EKRAN ÖLÜ UÇTU. Araç açılıyordu ama buradan
       hiçbir şey yapılamıyordu: aracı görüp servis kaydı açmak için
       ana ekrana dönüp ruhsat çekmek gerekiyordu. Oysa araç ZATEN
       kayıtlı; ruhsatı ikinci kez çekmek anlamsız iş.

       KAYITLI ARACA RUHSATSIZ KAYIT: aracın bilgileri elimizde, tek
       eksik "ne için geldi". O yüzden tür seçimi burada.

       ÜÇ DÜĞME TEK SATIRDA (Cemil, 04.09). Metinler bu yüzden kısa:
       375 px'te üç düğme ancak "Kayıt aç · Mesaj · Sesle" ile aynı
       satıra sığıyor ve üçü de 48 px dokunma hedefini koruyor. -->
  <div id="arEylem"></div>

  <!-- ÖDEME DURUMU — yalnız BORÇ VARSA çizilir (06.09). -->
  <div id="arOdeme"></div>

  <div id="arRuhsatBolum"></div>

  <div id="arKmBolum"></div>

  <div id="arBakim"></div>

  <!-- NOT — GİZLİ, akordiyonun içinde (Cemil, 06.09: "Not alanı gizli
       olsun"). Kendi mikrofonu duruyor: her serbest metin alanının
       kendi mikrofonu var (TASARIM-SISTEMI). Yeri geçmişten hemen
       önce — "not alanı geçmişten önce gelsin". -->
  <div class="akordiyon">
    <button class="akd-bas" aria-expanded="false" aria-controls="arNotGovde">
      <svg class="ico ico-sm"><use href="#i-file-text"></use></svg> Not
      <span class="akd-say" id="arNotSay"></span>
      <svg class="ico ico-sm akd-ok"><use href="#i-chevron-down"></use></svg>
    </button>
    <div class="akd-govde" id="arNotGovde" hidden>
      <div class="section-label with-action">
        <span class="lbl-txt">Araç notu</span>
        <button class="daire-btn" id="arNotMik" aria-label="Notu sesle yaz" title="Sesle">
          <svg class="ico"><use href="#i-mic"></use></svg>
        </button>
      </div>
      <div class="field">
        <textarea id="arNot" rows="3" aria-label="Araç notu"
                  placeholder="ör. arka cam kolu kırık — müşteri biliyor"></textarea>
      </div>
    </div>
  </div>

  <div class="section-label">
    <svg class="ico ico-sm"><use href="#i-clipboard-list"></use></svg> Geçmiş
  </div>
  <div id="arGecmis"></div>

</section>

<script>
Ekran.tanim('arac', {
  ciz: function () {
    var a = aracBul(ACIK_PLAKA);
    if (!a) return;

    document.getElementById('arKunye').innerHTML =
      '<div class="arac-bas">' + plakaHtml(a.plaka, 'plate-lg') +
        '<div class="veh-title">' + a.marka + ' ' + a.model +
          (a.yil ? ' <span class="yr">' + a.yil + '</span>' : '') + '</div>' +
        /* Renk kutucuğu künyenin şeridinde — listeyle AYNI yerde
           duruyor (renk adı yerine rengin kendisi, Cemil 04.09). */
        '<div class="spec-strip">' +
          (a.motor ? '<span class="spec-val">' + a.motor + '</span>' : '') +
          (a.yakit ? '<span class="spec-sep">·</span><span class="spec-val">' +
            a.yakit + '</span>' : '') +
          '<span class="spec-sep">·</span>' + renkKutuHtml(a.renk) +
        '</div>' +
      '</div>';

    /* TELEFON ARANABİLİR (v1'deki gibi): tel: bağlantısı, 44 px hedef.
       Ustanın elinde telefon var; numarayı okuyup elle tuşlamak
       gereksiz bir adım.

       İKİNCİ İLETİŞİM (Cemil, 04.09): ruhsat sahibi FİRMA olabilir;
       o zaman aranacak kişi başkasıdır ve adı olmadan numara işe
       yaramaz. */
    document.getElementById('arIletisim').innerHTML =
      '<div class="tl-veri" style="margin-top:10px">' +
        '<span>Sahibi <b>' + (a.sahipAd || 'yazılmamış') + '</b></span>' +
      '</div>' +
      (a.sahipTel
        ? telLinkHtml(a.sahipTel, a.sahipAd)
        : '<p class="plate-hint">Telefon yok — özet ve hatırlatma gönderilemez.</p>') +
      (a.iletisimTel || a.iletisimAd
        ? '<div class="ak-kisi">' +
            '<span class="ak-kisi-ad">İletişim: <b>' +
              (a.iletisimAd || 'ad yazılmamış') + '</b></span>' +
            (a.iletisimTel ? telLinkHtml(a.iletisimTel, a.iletisimAd) : '') +
          '</div>'
        : '');

    /* ---- EYLEMLER ----
       İçerideyse "kaydı aç" değil, AÇIK KAYDA GİT: aynı araca ikinci
       kayıt açmak, ustanın iki yerde iş yapması demek. */
    var acikKayit = icerideki().filter(function (k) { return k.plaka === a.plaka; })[0];
    document.getElementById('arEylem').innerHTML =
      '<div class="btn-row tek-satir">' +
        (acikKayit
          ? '<button class="btn btn-primary" data-kayit="' + acikKayit.id + '">' +
              '<svg class="ico"><use href="#i-clipboard-list"></use></svg> Açık kayıt</button>'
          : '<button class="btn btn-primary" id="arYeniKayit">' +
              '<svg class="ico"><use href="#i-plus"></use></svg> Kayıt aç</button>') +
        /* Hedef ruhsat sahibi OLMAYABILIR (A-M2): firma ruhsatli araçta
           ikinci iletişim aranır. Düğme sahipTel'e bakınca, telefonu
           yalnız ikinci iletişimde olan araçta kapalı kalıyordu. */
        /* Telefon yoksa dugme kapali VE nedeni uzerinde yaziyor
           (37. test): kunyedeki "Telefon yok" satiri gozle gorunur,
           title ise dugmenin KENDISINE bagli. */
        '<button class="btn btn-ghost" id="arMesaj"' +
          (mesajHedefi(a.plaka) && mesajHedefi(a.plaka).tel
            ? ''
            : ' disabled title="Telefon yok — önce araç kaydına telefon yaz"') + '>' +
          '<svg class="ico"><use href="#i-message-square"></use></svg> Mesaj</button>' +
        '<button class="btn btn-ghost" id="arSesle">' +
          '<svg class="ico"><use href="#i-mic"></use></svg> Sesle</button>' +
      '</div>';

    /* ---- NOT ----
       Yazılan not ARACA yazılır ve kalır; prototipte de öyle davranır
       (kaydedilmeyen bir not alanı, ustayı bir kez kandırır). */
    document.getElementById('arNot').value = a.not || '';
    arNotSayacCiz();

    /* ---- ÖDEME DURUMU ----
       Borç = teslim edilmiş ama ödemesi "almadım" olan kayıtların
       toplamı. Uydurma bir alan değil, var olan verinin okunması —
       muhasebedeki "Alacak" listesiyle AYNI kaynaktan. İki yerde iki
       ayrı hesap olsaydı, biri diğerini yalanlardı. */
    var borclular = aracKayitlari(a.plaka).filter(function (k) {
      return k.teslimTarihi && k.odemeYolu === 'almadim';
    });
    var borc = borclular.reduce(function (t, k) { return t + kayitToplami(k); }, 0);
    document.getElementById('arOdeme').innerHTML = borc
      ? '<div class="card">' +
          '<div class="section-label">' +
            '<svg class="ico ico-sm"><use href="#i-wallet"></use></svg> Ödeme durumu' +
          '</div>' +
          '<div class="tutar-serit">' +
            borclular.map(function (k) {
              return '<div class="tutar-sat" data-kayit="' + k.id + '" role="button" tabindex="0">' +
                '<span>' + (k.sikayet || TUR_AD[k.tur]) + ' · ' + k.teslimTarihi + '</span>' +
                '<span class="tv">' + tutar(kayitToplami(k)) + ' ₺</span></div>';
            }).join('') +
            '<div class="tutar-sat genel"><span>Alacak</span>' +
              '<span class="tv">' + tutar(borc) + ' ₺</span></div>' +
          '</div>' +
        '</div>'
      : '';

    /* ---- RUHSAT BİLGİLERİ (akordiyon) ----
       ⚠️ TC kimlik no ve adres ruhsatta VAR ama BURADA YOK
       (RUHSAT-OKUMA.md Bulgu 2: tutmadığın veri en güvenli veridir).
       Yakıt deposu ruhsatta yazmaz; araç bilgisi olarak tutuluyor. */
    var alanlar = [
      ['Şasi no (VIN)', a.vin], ['Motor no', a.motorNo],
      ['Motor hacmi', a.silindir ? a.silindir + ' cc' : ''],
      ['Motor gücü', a.guc ? a.guc + ' kW' : ''],
      ['Yakıt', a.yakit], ['Renk', a.renk],
      ['Koltuk', a.koltuk], ['İlk tescil', a.ilkTescil],
      ['Yakıt deposu', a.depo ? a.depo + ' litre' : '']
    ].filter(function (x) { return x[1]; });

    document.getElementById('arRuhsatBolum').innerHTML = akordiyonHtml(
      'arRuhsat', 'i-file-text', 'Ruhsat bilgileri',
      alanlar.length ? alanlar.length + ' alan' : 'boş',
      alanlar.length
        ? '<div class="tutar-serit">' + alanlar.map(function (x) {
            return '<div class="tutar-sat"><span>' + x[0] + '</span>' +
                   '<span class="tv">' + x[1] + '</span></div>';
          }).join('') + '</div>'
        : '<p class="plate-hint">Ruhsat okunmamış — bilgiler boş.</p>');

    /* ---- KİLOMETRE GEÇMİŞİ (akordiyon) ----
       ⚠️ 04.09, Cemil: "Km geçmişinde tahmin için alanı olmasın.
       Tahmin de olmasın. Tarih ve km." Günlük ortalama satırı ve
       "+8.700" farkı buradan KALKTI.

       HESAP KALKMADI: hatırlatmanın km yarısı (K-002) hâlâ gunlukKm()
       ile kuruluyor ve "Bakım bilgileri"nde sonucu görünüyor. Kalkan
       şey, ustanın önüne konan ham tahmin. */
    var g = kmGecmisi(a.plaka);
    document.getElementById('arKmBolum').innerHTML = akordiyonHtml(
      'arKm', 'i-clock', 'Kilometre',
      g.length ? g.length + ' ölçüm' : 'yok',
      g.length
        ? g.slice().reverse().map(function (x) {
            return '<div class="km-sat"><span class="km-tarih">' + x.tarih + '</span>' +
              '<span class="km-deger">' + x.km.toLocaleString('tr-TR') + ' km</span></div>';
          }).join('')
        : bosDurumHtml('i-clock', 'Kilometre yazılmamış',
            'Bakım kaydı açarken kilometre girilirse burada birikir.'));

    /* ---- BAKIM BİLGİLERİ ----
       04.09, Cemil: "Altına km bakım bilgileri diğer divler gibi
       başlıklı olsun." Uyarı şeridi (.notice) değil, kendi başlığı
       olan bir kart — çünkü bu bir uyarı değil, aracın bilgisi. */
    var son = sonBakim(a.plaka);
    document.getElementById('arBakim').innerHTML =
      '<div class="card">' +
        '<div class="section-label">' +
          '<svg class="ico ico-sm"><use href="#i-calendar-clock"></use></svg> Bakım bilgileri' +
        '</div>' +
        (son
          ? (function () {
              var hs = hatirlatmaHesapla(son);
              return '<div class="tutar-serit">' +
                '<div class="tutar-sat"><span>Son bakım</span>' +
                  '<span class="tv">' + son.teslimTarihi +
                  (son.km ? ' · ' + son.km + ' km' : '') + '</span></div>' +
                '<div class="tutar-sat"><span>Sıradaki bakım</span>' +
                  '<span class="tv">' + gunAyYil(hs.tarih) + '</span></div>' +
                (hs.kmHedef
                  ? '<div class="tutar-sat"><span>ya da kilometre</span>' +
                      '<span class="tv">' + hs.kmHedef.toLocaleString('tr-TR') +
                      ' km</span></div>'
                  : '') +
                '<div class="tutar-sat genel"><span>Hangisi önce gelirse</span>' +
                  '<span class="tv">' +
                  (hs.hangisi === 'km' ? 'kilometre' : 'zaman') + '</span></div>' +
              '</div>';
            })()
          : '<p class="plate-hint">Bu araca henüz bakım yapılmamış — ' +
            'hatırlatma ilk bakım teslim edilince kurulur.</p>') +
      '</div>';

    /* ---- GEÇMİŞ ----
       04.09, Cemil: "Başında icon yok. Bakım mı tamirat mı başlık.
       Marka model yazmasın. Ad soyad zaten belli. Başlık, açıklama,
       Tarih, teslim durumu. Basit olsun."
       Satır aynı ortak nesne, SADE hâli (kayitSatiriHtml sade:true). */
    var kayitlar = aracKayitlari(a.plaka);
    document.getElementById('arGecmis').innerHTML = kayitlar.length
      ? kayitlar.slice().reverse().map(function (k) {
          return kayitSatiriHtml(k, { sade: true });
        }).join('')
      : bosDurumHtml('i-clipboard-list', 'Geçmiş kayıt yok', 'Bu araç ilk kez geliyor.');
  }
});

/* Akordiyonun sayaçı: notun DOLU olup olmadığını açmadan söyler.
   "İçinde bir şey var mı" diye açtırmak, hiç açtırmamaktan kötüdür. */
function arNotSayacCiz() {
  var a = aracBul(ACIK_PLAKA);
  var e = document.getElementById('arNotSay');
  if (e) e.textContent = (a && a.not) ? 'dolu' : 'boş';
}

/* Not ARACA YAZILIR. Kaydedilmeyen not alanı, ustayı bir kez kandırır
   ve bir daha not yazmaz. */
document.addEventListener('input', function (e) {
  if (!e.target || e.target.id !== 'arNot') return;
  var a = aracBul(ACIK_PLAKA);
  if (a) a.not = e.target.value;
  arNotSayacCiz();
});

document.addEventListener('click', function (e) {
  var t = e.target.closest('button');
  if (!t || Ekran.adi() !== 'arac') return;
  var a = aracBul(ACIK_PLAKA);
  if (!a) return;

  /* KAYITLI ARACA RUHSATSIZ SERVİS KAYDI: araç zaten kayıtlı.
     ⚠️ 06.09 — ARADAKİ "NE İÇİN GELDİ?" ADIMI KALKTI. Cemil aynı
     soruyu kayıt açma ekranından da kaldırdı: tür önemli değil,
     yazılan işten çıkarılıyor (isTuruTahmin) ve kayıt ekranında
     düzeltilebiliyor. Burada bırakmak, aynı soruyu iki ekranda iki
     farklı biçimde sormak olurdu.

     Düğme artık DOĞRUDAN kaydı açıyor: bir dokunuş, bir sonuç. */
  if (t.id === 'arYeniKayit') {
    var yeni = {
      id: KAYITLAR.length + 1, plaka: a.plaka, tur: 'tamirat', km: '',
      sikayet: '', acilis: bugunMetin(), teslimTarihi: null, odemeYolu: null,
      hatirlatmaTarihi: null, hatirlatmaGonderildi: false,
      parcaBekliyor: false, bekliyorMusteriye: false, satirlar: []
    };
    KAYITLAR.push(yeni);
    ACIK_KAYIT = yeni.id;
    balon(a.plaka + ' için kayıt açıldı — ne istediğini yaz.', false, 2800);
    Ekran.ac('kayit');
    return;
  }

  if (t.id === 'arMesaj') {
    MESAJ_HEDEF = { plaka: a.plaka, sablon: 'ozet' };
    Ekran.ac('mesaj');
    return;
  }
  /* Notun kendi mikrofonu (TASARIM-SISTEMI: her serbest metin alanının
     KENDİ mikrofonu) — sesli işlem araç bağlamında açılır. */
  if (t.id === 'arNotMik') { sesleAc('genel'); return; }
  if (t.id === 'arSesle') { sesleAc('genel'); return; }
});
</script>
