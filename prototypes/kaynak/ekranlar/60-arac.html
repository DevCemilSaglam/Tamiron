<!-- ekran: arac · ARAÇ (EKRANLAR.md §6) — akış dışı, başvuru
     Akışın hiçbir adımı buradan geçmez. Neden var: K-005'in işe
     yaraması için. "Bu parçayı geçen sefer müşteri getirmişti"
     bilgisi araç ikinci kez geldiğinde KARŞIYA ÇIKMALI, yoksa
     tartışma çıkar.

     BİLEŞENLER v1'DEN: .card · .arac-bas .plate-lg .veh-title
     .spec-strip · .section-label · .notice · .tl-item (ortak
     kayitSatiriHtml) · .plate-hint. Yeni bileşen yazılmadı.

     GEÇMİŞ SATIRI ORTAK NESNE: ana ekranla aynı kayitSatiriHtml.
     Burada plaka gizleniyor (zaten aracın kendi sayfası).

     ÜZERİNDE YOK: kontrol tarihleri (muayene/sigorta/kasko)
     · yaklaşan kontroller · belge arşivi · ayrı müşteri ekranı. -->
<section class="screen" id="screen-arac">

  <div class="card">
    <div id="arKunye"></div>
  </div>

  <div id="arBakim"></div>

  <div class="section-label">
    <svg class="ico ico-sm"><use href="#i-clipboard-list"></use></svg> Geçmiş
  </div>
  <div id="arGecmis"></div>

  <div class="section-label">
    <svg class="ico ico-sm"><use href="#i-file-text"></use></svg> Not
  </div>
  <p class="plate-hint" id="arNot"></p>

</section>

<script>
Ekran.tanim('arac', {
  ciz: function () {
    var a = aracBul(ACIK_PLAKA);
    if (!a) return;

    document.getElementById('arKunye').innerHTML =
      '<div class="arac-bas">' + plakaHtml(a.plaka, 'plate-lg') +
        '<div class="veh-title">' + a.marka + ' ' + a.model +
          (a.yil ? ' <span class="yr">' + a.yil + '</span>' : '') + '</div>' +
        '<div class="spec-strip">' +
          (a.motor ? '<span class="spec-val">' + a.motor + '</span>' : '') +
          '<span class="spec-sep">·</span>' +
          '<span class="spec-val">' + (a.sahipAd || 'sahip yazılmamış') + '</span>' +
          '<span class="spec-sep">·</span>' +
          '<span class="spec-val">' + (a.sahipTel || 'telefon yok') + '</span>' +
        '</div>' +
      '</div>';

    /* Son bakım + bir sonraki hatırlatma. km burada işe yarıyor:
       "geçen bakım 142.500'de yapılmış" (K-002). */
    var bakimlar = aracKayitlari(a.plaka).filter(function (k) {
      return k.tur === 'bakim' && k.teslimTarihi;
    });
    var son = bakimlar[bakimlar.length - 1];
    document.getElementById('arBakim').innerHTML = son
      ? '<div class="notice accent">' +
          '<span class="n-ic"><svg class="ico ico-sm"><use href="#i-clock"></use></svg></span>' +
          '<span class="n-body">Son bakım <b>' + son.teslimTarihi + '</b>' +
            (son.km ? ' · ' + son.km + ' km' : '') +
            (son.hatirlatmaTarihi
              ? '<br>Hatırlatma: <b>' + son.hatirlatmaTarihi + '</b>' : '') +
          '</span>' +
        '</div>'
      : '';

    var kayitlar = aracKayitlari(a.plaka);
    document.getElementById('arGecmis').innerHTML = kayitlar.length
      ? kayitlar.map(function (k) { return kayitSatiriHtml(k, { plaka: false }); }).join('')
      : bosDurumHtml('i-clipboard-list', 'Geçmiş kayıt yok', 'Bu araç ilk kez geliyor.');

    document.getElementById('arNot').textContent = a.not || 'Not yok.';
  }
});
</script>
