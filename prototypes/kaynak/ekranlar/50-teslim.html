<!-- ekran: teslim · TESLİM ET (EKRANLAR.md §5)
     Akış Adım 7. Tamircinin dördüncü isteği: "teslim ettiğinde
     ödemeyi nasıl aldığını bilmek."

     AYRI EKRAN, ÇÜNKÜ AYRI AN. Servis kaydıyla birleştirilirse
     yanlışlıkla teslim edilir ve teslim geri alınamaz.

     BİLEŞENLER v1'DEN: .screen-head .eyebrow · .card · .arac-bas
     .plate-lg .veh-title .spec-strip · .tutar-serit .tutar-sat.genel
     .tv · .cip-grup .cip · .btn .btn-primary .btn-lg · .notice.
     Yeni bileşen yazılmadı.

     ÜZERİNDE YOK: taksit planı · cari hesap · borç yaşlandırma ·
     teslim alan kişi seçimi · fatura. Kısmi ödeme 24.10'da girdi
     (K-078 — Cemil: "elden taksit de x miktar aldım şeklinde olur");
     tek yeni çip, yeni ekran yok. -->
<section class="screen" id="screen-teslim">

  <div class="screen-head">
    <span class="eyebrow">
      <svg class="ico ico-sm"><use href="#i-wallet"></use></svg> Teslim et
    </span>
  </div>

  <div class="card">
    <div id="tsKunye"></div>
    <div class="tutar-serit" id="tsTutar"></div>
  </div>

  <div class="section-label">
    <svg class="ico ico-sm"><use href="#i-wallet"></use></svg> Ödeme nasıl alındı?
  </div>
  <div class="cip-grup" id="tsOdeme" role="group" aria-label="Ödeme yolu"></div>
  <div id="tsKismi"></div>

  <button class="btn btn-primary btn-lg" id="tsTeslim">
    <svg class="ico"><use href="#i-check"></use></svg> Teslim et
  </button>

  <div id="tsNot"></div>

</section>

<script>
/* "ALMADIM" BİR ÖDEME YOLUDUR. Veresiye gerçek ve teslimi
   bekletmemeli (EKRANLAR.md §5). */
var ODEME_YOLLARI = [
  { k: 'nakit', ad: 'Nakit' },
  { k: 'kart', ad: 'Kart' },
  { k: 'havale', ad: 'Havale' },
  { k: 'almadim', ad: 'Almadım' },
  /* K-078 · elden taksit: bir kısmı bugün, kalanı veresiye. Seçilince
     tutar ve yol sorulur; seçilmezse ekran bugünkünün aynısı. */
  { k: 'kismi', ad: 'Bir kısmını aldım' }
];
var tsSecili = null;
/* Teslim EDİLDİ mi — edildikten sonra ekran kapanmıyor, bir adım daha
   var: müşteriye haber. */
var tsBitti = false;

function tsCiz() {
  var k = kayitBul(ACIK_KAYIT);
  if (!k) return;
  var a = aracBul(k.plaka);

  /* Künye SERVİS KAYDIYLA AYNI — hangi aracı teslim ettiğini
     tanıdığı görünümden okusun, yeni bir düzen öğrenmesin. */
  document.getElementById('tsKunye').innerHTML =
    '<div class="arac-bas">' + plakaHtml(k.plaka, 'plate-lg') +
      '<div class="veh-title">' + (a ? a.marka + ' ' + a.model : '') +
        (a && a.yil ? ' <span class="yr">' + a.yil + '</span>' : '') + '</div>' +
      '<div class="spec-strip">' +
        '<span class="spec-val">' + TUR_AD[k.tur] + '</span>' +
        (a && a.motor
          ? '<span class="spec-sep">·</span><span class="spec-val">' + a.motor + '</span>' : '') +
      '</div>' +
    '</div>';

  document.getElementById('tsTutar').innerHTML =
    /* Rakam BİR KEZ yazılır. Üstte aynı tutarı tekrar etmek "iki ayrı
       rakam mı?" sorusunu doğuruyordu; üst satır yalnız neyin
       toplandığını söyler. */
    '<div class="tutar-sat"><span>' + (k.satirlar || []).length + ' satır</span>' +
      (fiyatiBekleyen(k)
        ? '<span class="pill muted">fiyatı girilmemiş satır var</span>' : '') +
      /* ⚠️ PARÇA HÂLÂ YOLDAYSA TESLİMDE SÖYLENİR (06.09, kuyruk 4).
         Bayrak kayıtta duruyordu ama teslim ekranı ondan habersizdi:
         usta *"parça bekliyor"* diye işaretlediği aracı, işaret hâlâ
         açıkken teslim edebiliyor ve ekran hiçbir şey demiyordu.

         ENGELLEMİYOR, SÖYLÜYOR. Bayrak durum değildir (K-034) —
         teslimi kilitlemez. Usta parçayı almış ve işareti kaldırmayı
         unutmuş olabilir; o zaman bu satır ona hatırlatır. */
      (k.parcaBekliyor
        ? '<span class="pill warn">parça bekliyor olarak işaretli</span>' : '') +
    '</div>' +
    '<div class="tutar-sat genel"><span>Alınacak</span>' +
      '<span class="tv">' + tutar(kayitToplami(k)) + ' ₺</span></div>';

  document.getElementById('tsOdeme').innerHTML = ODEME_YOLLARI.map(function (o) {
    return '<button class="cip" data-odeme="' + o.k + '" aria-pressed="' +
      (tsSecili === o.k) + '">' + o.ad + '</button>';
  }).join('');

  /* ⚠️ KAPANMIYOR, KONUSUYOR (K-033.3 · 37. test). Odeme yolu
     secilmeden basan usta, dugmenin bozuk oldugunu saniyordu. */
  document.getElementById('tsTeslim').hidden = tsBitti;
  document.getElementById('tsOdeme').hidden = tsBitti;

  /* KISMİ: tutar + yol. Alan YALNIZ İLK KEZ çizilir — her tazelemede
     yeniden çizilseydi ustanın yazdığı rakam silinirdi (K-033.12'nin
     dersi); yol çipleri DOM'da aria-pressed ile tutulur. */
  var kis = document.getElementById('tsKismi');
  if (tsSecili !== 'kismi' || tsBitti) kis.innerHTML = '';
  else if (!kis.innerHTML) {
    kis.innerHTML =
      '<div class="field"><label for="tsKismiTutar">Alınan</label>' +
        '<input id="tsKismiTutar" class="mono" data-giris="tutar" inputmode="numeric"' +
          ' autocomplete="off" placeholder="ör. 2.000" /></div>' +
      '<div class="cip-grup" role="group" aria-label="Nasıl alındı">' +
        ['nakit', 'kart', 'havale'].map(function (y) {
          return '<button class="cip" data-kismi-yol="' + y + '" aria-pressed="false">' +
                 ODEME_ETIKET[y] + '</button>';
        }).join('') +
      '</div>' +
      '<p class="plate-hint">Kalanı kayıtta "Ödeme alındı" ile yazarsın.</p>';
  }

  /* Bakımsa hatırlatmanın kurulacağını ÖNCEDEN söyle — sürpriz olmasın.
     Hangi tarihin kurulacağını da söylüyor: "6 ay sonra" demek yetmez,
     km'den gelen tarih daha erken olabilir. */
  /* ---- TESLİMDEN SONRA: MESAJ SORULUYOR (Cemil, 06.09) ----
     *"Teslim et deyince ödemenin nasıl olduğu da sormalı ve mesaj
     gönderilebilmeli veya geç deyip kapatabilir."*

     ⚠️ ESKİDEN BURADA YALAN VARDI. Teslim balonu telefonu olan araçta
     "Özet gönderildi." diyordu ve HİÇBİR ŞEY GÖNDERİLMİYORDU. Bir kez
     böyle kanan usta, bir daha hiçbir "gönderildi" yazısına inanmaz
     (04.09'da aynı hatayı "Onay iste" düğmesinde yapmıştım).

     Artık gönderim BİR ADIM: mesaj ekranına götürüyor, usta kendi
     WhatsApp'ından yolluyor (WHATSAPP.md A yolu). "Geç" de gerçek bir
     seçenek — müşteri zaten yanındaysa mesaj gereksiz. */
  if (tsBitti) {
    var hedefT = mesajHedefi(k.plaka);
    document.getElementById('tsNot').innerHTML =
      '<div class="notice ok">' +
        '<span class="n-ic"><svg class="ico ico-sm"><use href="#i-circle-check"></use></svg></span>' +
        '<span class="n-body"><b>' + k.plaka + ' teslim edildi.</b> ' +
          'Ödeme: ' + (k.odemeler ? odemeOzeti(k) : (ODEME_ETIKET[k.odemeYolu] || k.odemeYolu)) + '.' +
          (k.hatirlatmaTarihi
            ? '<br>Bakım hatırlatması <b>' + k.hatirlatmaTarihi + '</b> için kuruldu.'
            : '') +
        '</span>' +
      '</div>' +
      (hedefT && hedefT.tel
        ? '<button class="btn btn-primary btn-lg" id="tsMesaj" style="margin-top:12px">' +
            '<svg class="ico"><use href="#i-message-square"></use></svg>' +
            ' Müşteriye özet gönder</button>'
        : '<p class="plate-hint" style="margin-top:12px">' +
          'Telefon yok — mesaj gönderilemez. Araç kaydına telefon eklersen ' +
          'bir sonrakinde gönderebilirsin.</p>') +
      '<button class="btn btn-ghost" id="tsGec" style="margin-top:10px">' +
        (hedefT && hedefT.tel ? 'Geç, gönderme' : 'Kapat') + '</button>';
    return;
  }

  if (bakimIceriyor(k)) {
    var hs2 = hatirlatmaHesapla(k);
    document.getElementById('tsNot').innerHTML =
      '<div class="notice accent">' +
        '<span class="n-ic"><svg class="ico ico-sm"><use href="#i-clock"></use></svg></span>' +
        '<span class="n-body">Teslimden sonra <b>' + gunAyYil(hs2.tarih) +
          '</b> için bakım hatırlatması kurulacak' +
          (hs2.hangisi === 'km'
            ? ' — bu araç günde ortalama ' +
              Math.round(gunlukKm(k.plaka)).toLocaleString('tr-TR') +
              ' km gidiyor, <b>' + DUKKAN.bakimPeriyoduKm.toLocaleString('tr-TR') +
              ' km</b> aydan önce doluyor.'
            : ' (' + DUKKAN.bakimPeriyoduAy + ' ay).') +
        '</span>' +
      '</div>';
  } else {
    document.getElementById('tsNot').innerHTML = '';
  }
}

Ekran.tanim('teslim', {
  /* Ödeme seçimi ve "teslim edildi" hâli AÇILIŞA aittir: ekran her
     açılışta temiz başlar. Bunlar `ciz`de dururken her tazeleme
     ustanın seçtiği ödeme yolunu siliyordu — bugün ulaşılabilir bir
     yol yoktu ama olması an meselesiydi (K-040). */
  ac: function () {
    tsSecili = null; tsBitti = false;
    var kis = document.getElementById('tsKismi');
    if (kis) kis.innerHTML = '';
  },
  ciz: tsCiz
});

document.addEventListener('click', function (e) {
  var t = e.target.closest('button');
  if (!t) return;

  var o = t.getAttribute('data-odeme');
  if (o) { tsSecili = o; tsCiz(); }

  var ky = t.getAttribute('data-kismi-yol');
  if (ky) {
    document.querySelectorAll('[data-kismi-yol]').forEach(function (b) {
      b.setAttribute('aria-pressed', String(b === t));
    });
    return;
  }

  if (t.id === 'tsTeslim' && !tsSecili) {
    balon('Ödemeyi nasıl aldığını seç — almadıysan "Almadım" de.', false, 3000);
    return;
  }
  if (t.id === 'tsTeslim' && tsSecili) {
    var k = kayitBul(ACIK_KAYIT);
    /* KISMİ — teslimden ÖNCE sınanır: yanlış girişte araç teslim
       edilmiş görünmesin. Tamamı yazıldıysa bu kısmi değil, tam ödeme. */
    var kTutar = 0, kYol = null;
    if (tsSecili === 'kismi') {
      var kEl = document.getElementById('tsKismiTutar');
      var kR = ((kEl && kEl.value) || '').replace(/[^0-9]/g, '');
      kTutar = kR === '' ? 0 : parseInt(kR, 10);
      var kSec = document.querySelector('[data-kismi-yol][aria-pressed="true"]');
      kYol = kSec ? kSec.getAttribute('data-kismi-yol') : null;
      if (!(kTutar > 0)) { balon('Ne kadar aldığını yaz.', false, 3000); return; }
      if (!kYol) { balon('Nasıl aldığını seç: nakit, kart ya da havale.', false, 3000); return; }
      if (kTutar > kayitToplami(k)) {
        balon('Toplam ' + tutar(kayitToplami(k)) + ' ₺ — fazlası girilemez.', false, 3200); return;
      }
    }
    k.teslimTarihi = bugunMetin();        /* TEK DURUM ALANI — K-004 */
    if (tsSecili !== 'kismi') k.odemeYolu = tsSecili;
    else if (kTutar === kayitToplami(k)) k.odemeYolu = kYol;
    else { k.odemeYolu = 'almadim'; odemeEkle(k, kTutar, kYol, k.teslimTarihi); }

    /* Bakımsa hatırlatma KURULUR — AY **VEYA** KM, hangisi önce
       gelirse (K-002, 04.09 güncellemesi).
       ⚠️ Burada kendi hesabımı yapıyordum: yalnız ay sayıyordu ve araç
       ekranı ay+km gösteriyordu. Aynı soruya iki ekran iki ayrı cevap
       veriyordu. Hesap artık TEK YERDE: hatirlatmaHesapla(). */
    if (bakimIceriyor(k)) {
      var hs = hatirlatmaHesapla(k);
      k.hatirlatmaTarihi = gunAyYil(hs.tarih);
      k.hatirlatmaGonderildi = false;
    }

    /* ⚠️ BALON ARTIK GÖNDERİM İDDİA ETMİYOR. Ne olduğunu söylüyor,
       ne olmadığını uydurmuyor. */
    balon(k.plaka + ' teslim edildi.', false, 2600);
    tsBitti = true;
    tsCiz();
    return;
  }

  /* Mesaj adımı — ACIK_KAYIT burada BIRAKILMIYOR, çünkü mesaj ekranı
     özeti bu kayıttan üretecek. Kayıt teslim edilmiş olsa da özeti
     hâlâ gönderilebilir (msjOzetKaydi son kayda da bakıyor). */
  if (t.id === 'tsMesaj') {
    var kk = kayitBul(ACIK_KAYIT);
    if (!kk) return;
    MESAJ_HEDEF = { plaka: kk.plaka, sablon: 'ozet' };
    ACIK_KAYIT = null;
    Ekran.ac('mesaj');
    return;
  }
  if (t.id === 'tsGec') {
    ACIK_KAYIT = null;
    Ekran.ac('home');
  }
});

/* ================= SESLİ İŞ — bu ekranın şeması (Tur 8.3) =================
   Teslim iki yerden söylenir ve İKİ TANIYICISI var, tek şeması:
     baglamda — açık kaydın içinde: "teslim ettim nakit aldım", plaka yok
     tani     — genel yolda: "35 KLM 45 teslim ettim", plakadan */

/* Sesle söylenebilen ödeme yolları. "Almadım" BİLEREK YOK: "parayı
   almadım" cümlesi değerlendirme setinde bir TUZAK (4. cümle) — sesle
   veresiye yazmak yerine teslim ekranında seçiliyor. */
var SES_ODEME = { nakit: ODEME_ETIKET.nakit, kart: ODEME_ETIKET.kart,
                  havale: ODEME_ETIKET.havale };
/* Usta ödeme yolunu farklı sözlerle söyler (14.10 · büyük set): "peşin"
   nakittir; "EFT", "hesaba yatırdı" havaledir. Söylenmeyen ödeme null —
   nakit VARSAYILMAZ. */
function sesOdemeYolu(d) {
  return (d.indexOf('nakit') >= 0 || d.indexOf('pesin') >= 0) ? 'nakit'
       : (d.indexOf('kart') >= 0 || kelimeVarMi(d, ['kk'])) ? 'kart'   /* "kk" = kredi kartı (Cemil, 16.10) */
       : (d.indexOf('havale') >= 0 || kelimeVarMi(d, ['eft']) || d.indexOf('hesaba') >= 0) ? 'havale' : null;
}

/* "nakit DEĞİL kartla" (24.10 · E5): ilk geçen yolu almak yanlıştı — "değil" geçen cümlede
   düzeltmenin kuralı (değilden SONRAKİ yol) geçerli. sesDuzeltilenYol aşağıda tanımlı; çağrı
   anında yüklü. */
function sesTeslimOdemesi(d) {
  return d.indexOf('degil') >= 0 ? sesDuzeltilenYol(d) : sesOdemeYolu(d);
}

Islem.tanim('teslim', {
  ekran: 'teslim', baglam: ['kayit-icinde'], oncelik: 60,
  baslik: 'Araç teslim edilecek',
  eylem: function (o) { return o.odeme ? 'Teslim et' : 'Teslim ekranını aç'; },
  alanlar: [
    { ad: 'plaka', etiket: 'Araç', tip: 'plaka', aracla: true, zorunlu: true },
    { ad: 'toplam', etiket: 'Tutar', turet: function (o) {
        return tutar(kayitToplami(o.kayit)) + ' ₺'; } },
    { ad: 'odeme', etiket: 'Ödeme', tip: 'secim', secenek: SES_ODEME,
      bos: '— (teslim ekranında seçilecek)' }
  ],
  baglamda: function (c) {
    var k = c.kayit;
    if (!k || c.d.indexOf('teslim') < 0 || k.teslimTarihi) return null;
    return { tur: 'teslim', plaka: k.plaka, arac: aracBul(k.plaka),
             kayit: k, odeme: sesTeslimOdemesi(c.d) };
  },
  tani: function (c) {
    if (!c.p || !c.arac || c.dk.indexOf('teslim') < 0) return null;
    var plaka = c.p.plaka;
    var acik = icerideki().filter(function (k) { return k.plaka === plaka; })[0];
    if (!acik) return { tur: 'teslim-edilecek-kayit-yok', plaka: plaka, arac: c.arac };
    return { tur: 'teslim', plaka: plaka, arac: c.arac, kayit: acik,
             odeme: sesTeslimOdemesi(c.dk) };
  },
  /* Ödeme söylendiyse SEÇİLİ gelir ama teslimi usta onaylar: para
     işinde son dokunuş ustanın. Seçim ekranın kendi durumuna yazılıyor
     — eskiden ses ekranı buradaki düğmeye DIŞARIDAN tıklıyordu. */
  uygula: function (o) {
    ACIK_KAYIT = o.kayit.id;
    Ekran.ac('teslim');
    if (o.odeme) {
      tsSecili = o.odeme;
      tsCiz();
      balon('Ödeme "' + SES_ODEME[o.odeme] + '" seçildi — teslimi sen onayla.', false, 3200);
    }
  }
});

/* ---- ÖDEME YOLUNU DÜZELT (24.10 · K-077.2 · E5) ----
   Cemil: *"Nakit aldım dedi, karta döndürmek istedi. Tekrar sesle, nakit almadım, kredi kartı
   ile aldım diyebilir. Düzenle diyebilir ya da buttonla yapabilir."* API'de E1
   (`POST /records/{id}/payment`): teslim ve tahsil günü KORUNUR, yalnız yol değişir.

   SÖZ: "değil", "yanlış", "düzelt", "çevir", "değiştir" + bir ödeme yolu.
   HEDEF YOL: "değil"den SONRA söylenen ("nakit değil kartla" → kart, "kartla değil nakit" →
   nakit); "değil" yoksa EN SON söylenen ("nakit yanlış, kart olacak" → kart).
   ⚠️ "ALMADIM" SESLE DÜZELTİLMEZ: teslim ekranının tuzağı (değerlendirme setinin 4. cümlesi) —
   sesle veresiye yazılmaz; "almadım"a çevirmek düğmeyle. */
function sesOdemeDuzeltmeMi(d) {
  return d.indexOf('degil') >= 0 || d.indexOf('yanlis') >= 0 || d.indexOf('duzelt') >= 0 ||
         d.indexOf('cevir') >= 0 || d.indexOf('degistir') >= 0;
}
function sesDuzeltilenYol(d) {
  var i = d.indexOf('degil');
  var s = i >= 0 ? d.slice(i + 5) : d;
  /* En son söylenen yol: her yolun SON geçtiği yer; en sağdaki kazanır. */
  var yer = { nakit: Math.max(s.lastIndexOf('nakit'), s.lastIndexOf('pesin')),
              kart: Math.max(s.lastIndexOf('kart'), s.search(/(^|\s)kk(\s|$)/)),
              havale: Math.max(s.lastIndexOf('havale'), s.search(/(^|\s)eft(\s|$)/), s.lastIndexOf('hesaba')) };
  var en = null;
  Object.keys(yer).forEach(function (k) { if (yer[k] >= 0 && (en === null || yer[k] > yer[en])) en = k; });
  return en;
}

Islem.tanim('odeme-duzelt', {
  ekran: 'kayit', baglam: ['kayit-icinde'], oncelik: 55,
  baslik: 'Ödeme yolu düzeltilecek',
  eylem: 'Düzelt',
  alanlar: [
    { ad: 'plaka', etiket: 'Araç', tip: 'plaka', aracla: true, zorunlu: true },
    { ad: 'eski', etiket: 'Şimdiki', turet: function (o) { return ODEME_ETIKET[o.kayit.odemeYolu] || '—'; } },
    { ad: 'odeme', etiket: 'Doğrusu', tip: 'secim', secenek: SES_ODEME, zorunlu: true }
  ],
  /* Kayıt açıkken: o kayıt — ama yalnız TESLİM EDİLMİŞSE (teslim edilmemiş kayıtta ödeme yok;
     orada "nakit" teslim işidir). */
  baglamda: function (c) {
    var k = c.kayit, yol = sesDuzeltilenYol(c.d);
    /* VERESİYE düzeltilmez: "almadım" yazılı kayıtta "havaleye çevir" geriye dönük kasaya para
       yazardı — ustanın kastı "şimdi aldım"dır, o TAHSİLATTIR (E6 "x aldım"). */
    if (!k || !k.teslimTarihi || k.odemeYolu === 'almadim' || !yol || !sesOdemeDuzeltmeMi(c.d)) return null;
    return { tur: 'odeme-duzelt', plaka: k.plaka, arac: aracBul(k.plaka), kayit: k, odeme: yol };
  },
  /* Plakayla her yerden: aracın teslim edilmiş SON kaydı. */
  tani: function (c) {
    if (!c.p || !c.arac || !sesOdemeDuzeltmeMi(c.dk)) return null;
    var yol = sesDuzeltilenYol(c.dk);
    if (!yol) return null;
    var teslimli = aracKayitlari(c.p.plaka).filter(function (k) { return k.teslimTarihi && k.odemeYolu !== 'almadim'; });
    var k = teslimli[teslimli.length - 1];
    if (!k) return null;
    return { tur: 'odeme-duzelt', plaka: c.p.plaka, arac: c.arac, kayit: k, odeme: yol };
  },
  uygula: function (o) {
    ACIK_KAYIT = o.kayit.id;
    if (o.kayit.odemeYolu === o.odeme) {
      balon('Ödeme zaten "' + SES_ODEME[o.odeme] + '" yazılı.', false, 2800);
    } else {
      o.kayit.odemeYolu = o.odeme;
      balon('Ödeme "' + SES_ODEME[o.odeme] + '" olarak düzeltildi — teslim günü değişmedi.', false, 3200);
    }
    Ekran.ac('kayit');
  }
});
</script>
