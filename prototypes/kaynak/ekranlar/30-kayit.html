<!-- ekran: kayit · SERVİS KAYDI (EKRANLAR.md §3) — ÜRÜNÜN KALBİ
     Akışın dört adımı burada: 2 ne istiyor · 4 fiyat geldi ·
     5 parça geldi (kim getirdi) · 6 iş yapıldı.
     Kayıt TESLİM EDİLENE KADAR AÇIK ve satır eklenebilir (K-003).

     BİLEŞENLER v1'DEN: .card · .section-label .with-action .lbl-txt
     · .mic-round · .field · .kalem .k-tip .k-ad .k-tutar .k-sil
     · .tutar-serit .tutar-sat .tv · .btn .btn-row · .cip
     · .arac-bas .plate-lg. Yeni bileşen yazılmadı.

     ÜZERİNDE YOK: durum rozeti · kesinlik kademeleri · garanti süresi
     · katalog seçici · fiyat karşılaştırma · onay bekleme durumu
     · red paneli · kabul formu · iskonto mekanizması. -->
<section class="screen" id="screen-kayit">

  <div class="screen-head">
    <span class="eyebrow" id="kayitBaslik"></span>
  </div>

  <!-- Künyeye dokununca ARAÇ açılır: geçmiş, son bakım ve
       "parçayı geçen sefer kim getirmişti" orada (K-005). -->
  <div class="card" id="kayitKunye" data-arac-ac="1" role="button" tabindex="0"
       aria-label="Aracın geçmişini aç"></div>

  <div class="card">
    <div class="section-label with-action">
      <span class="lbl-txt"><svg class="ico ico-sm"><use href="#i-message-square"></use></svg> Ne istiyor?</span>
      <button class="mic-round" id="kSikayetMik" aria-label="Ne istediğini sesle yaz" title="Sesle">
        <svg class="ico"><use href="#i-mic"></use></svg>
      </button>
    </div>
    <div class="field">
      <input id="kSikayet" placeholder="ör. triger seti değişecek" autocomplete="off" aria-label="Ne istiyor" />
    </div>
  </div>

  <div class="card">
    <div class="section-label">
      <svg class="ico ico-sm"><use href="#i-clipboard-list"></use></svg> Yapılanlar
    </div>

    <div class="kalem-list" id="kSatirlar"></div>

    <div class="btn-row">
      <button class="btn btn-ghost" id="kParcaEkle">
        <svg class="ico"><use href="#i-plus"></use></svg> Parça
      </button>
      <button class="btn btn-ghost" id="kIscilikEkle">
        <svg class="ico"><use href="#i-plus"></use></svg> İşçilik
      </button>
      <!-- SERVİS KAYDI AÇIKKEN SESLİ İŞLEM (Cemil, 03.09: "Servis kaydı
           açıkken yine sesli işlem yapabilir, balata örneği gibi").
           Eli yağlı ustanın satır eklemek için klavyeye gitmesi
           gerekmiyor: "balata da değişecek" demesi yetiyor. -->
      <button class="btn btn-ghost" id="kSesleEkle">
        <svg class="ico"><use href="#i-mic"></use></svg> Sesle ekle
      </button>
    </div>

    <div class="tutar-serit" id="kToplam"></div>
  </div>

  <div class="btn-row">
    <button class="btn btn-ghost" data-git="parca-sor">
      <svg class="ico"><use href="#i-package"></use></svg> Parça fiyatı sor
    </button>
    <!-- ⚠️ 04.09 — "Onay iste" -> "Özet gönder" (ölü uç turu).
         Düğme "Onay iste" diyordu, bastığında balon "Özet gönderildi"
         diyordu ve GERÇEKTE HİÇBİR ŞEY GÖNDERİLMİYORDU. Üç ayrı sorun
         tek düğmede: düğme ile balon farklı şey söylüyor, sahte bir
         gönderim rapor ediliyor, ve mesaj ekranı ZATEN VARKEN oraya
         gidilmiyor.

         Ad neden değişti: tamirci onay için "işin içine katmayalım"
         dedi (S4, K-003). Düğmenin gerçekte yaptığı iş ise yedi işten
         altıncısı — MÜŞTERİYE ÖZET GÖNDERMEK (T-19). Ad artık yapılan
         işi söylüyor. Cemil onayına açık (A-M6). -->
    <button class="btn btn-ghost" id="kOzetGonder">
      <svg class="ico"><use href="#i-message-square"></use></svg> Özet gönder
    </button>
  </div>

  <button class="btn btn-primary btn-lg" data-git="teslim">
    <svg class="ico"><use href="#i-wallet"></use></svg> Teslim et
  </button>

</section>

<style>
/* Künye DOKUNULABİLİR bir hedef (araç geçmişini açıyor), o yüzden
   içi henüz doldurulmamışken bile dokunma hedefinden küçük olamaz.
   Denetim boş haldeyken 38 px ölçmüştü. */
#kayitKunye { min-height: var(--dokun); }

/* KİM GETİRDİ — bilgi alanı değil, ileride kimin ödeyeceğini
   belirleyen anahtar (K-005). Kalem satırının altında, v1'in .cip
   bileşeniyle; kendi görünümünü uydurmuyor. */
.k-getiren {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 6px;
  font-size: 12px;
  color: var(--muted);
}
</style>

<script>
function kayitToplamCiz(k) {
  document.getElementById('kToplam').innerHTML =
    '<div class="tutar-sat genel"><span>Toplam</span>' +
    '<span class="tv">' + tutar(kayitToplami(k)) + ' ₺</span></div>';
}

function kayitCiz() {
  var k = kayitBul(ACIK_KAYIT);
  if (!k) return;
  var a = aracBul(k.plaka);

  document.getElementById('kayitBaslik').innerHTML =
    '<svg class="ico ico-sm"><use href="#' + TUR_IKON[k.tur] + '"></use></svg> ' + TUR_AD[k.tur];

  document.getElementById('kayitKunye').innerHTML =
    '<div class="arac-bas">' + plakaHtml(k.plaka, 'plate-lg') +
      '<div class="veh-title">' + (a ? a.marka + ' ' + a.model : '') +
        (a && a.yil ? ' <span class="yr">' + a.yil + '</span>' : '') + '</div>' +
      '<div class="spec-strip">' +
        (a && a.motor ? '<span class="spec-val">' + a.motor + '</span>' : '') +
        (bakimIceriyor(k) && k.km
          ? '<span class="spec-sep">·</span><span class="spec-val mono">' + k.km + ' km</span>' : '') +
      '</div>' +
    '</div>';

  document.getElementById('kSikayet').value = k.sikayet || '';

  document.getElementById('kSatirlar').innerHTML = (k.satirlar || []).length
    ? k.satirlar.map(function (s, i) {
        return '<div class="kalem">' +
          '<span class="k-tip ' + (s.tip === 'parca' ? 'parca' : 'iscilik') + '">' +
            (s.tip === 'parca' ? 'PARÇA' : 'İŞÇİLİK') + '</span>' +
          '<input class="k-ad" value="' + (s.ad || '').replace(/"/g, '&quot;') +
            '" data-satir-ad="' + i + '" placeholder="' +
            (s.tip === 'parca' ? 'Parça adı' : 'Ne yapıldı') + '" aria-label="Satır adı" />' +
          '<button class="k-sil" data-satir-sil="' + i + '" aria-label="Satırı kaldır">' +
            '<svg class="ico ico-sm"><use href="#i-x"></use></svg></button>' +
          '<span class="k-tutar-satir">' +
            '<input class="k-tutar mono" value="' + (s.fiyat ? tutar(s.fiyat) : '') +
              '" data-satir-fiyat="' + i + '" inputmode="numeric" placeholder="fiyat" aria-label="Tutar" />' +
            /* Parçacıdan gelen fiyat MÜŞTERİYE SÖYLENECEK RAKAM DEĞİL:
               soluk ve küçük durur. Kol D'de müşteri parçayı kendi
               getirse bile bu rakam kayıtta kalır — "ne kadara
               alabileceği" bilgisi değerli (IS-AKISI Kol D). */
            (s.alis ? '<span class="k-katalog">parçacı ' + tutar(s.alis) + ' ₺</span>' : '') +
            /* ⚠️ 05.09 — "MÜŞTERİ GETİRDİ" BİR BAKIŞTA OKUNUYOR.
               Bilgi zaten aşağıdaki çiplerde vardı ama çip bir SEÇİM
               aracı: hangisinin basılı olduğunu anlamak için bakmak
               gerekiyordu. Oysa bu, K-005'in sorumluluk anahtarı —
               sorun çıktığında işçilik alınıp alınmayacağını belirler.
               Rozet yalnız MÜŞTERİ getirdiyse çıkar: tamirci getirmesi
               normal hâl, her satıra rozet koymak gürültü olurdu. */
            (s.tip === 'parca' && s.kimGetirdi === 'musteri'
              ? '<span class="pill muted">müşteri getirdi</span>' : '') +
          '</span>' +
          /* KOL B · cevap kimden geldi. Tek parçacıya sorulduysa çip
             çıkmaz — ana yol kalınlaşmaz. */
          (s.tip === 'parca' && (s.sorulan || []).length > 1
            ? '<span class="k-getiren">Cevap kimden geldi?' +
                s.sorulan.map(function (pi) {
                  return '<button class="cip" data-kaynak="' + i + '|' + pi +
                    '" aria-pressed="' + (s.kaynak === pi) + '">' +
                    PARCACILAR[pi].ad + '</button>';
                }).join('') +
              '</span>'
            : '') +
          (s.tip === 'parca'
            ? '<span class="k-getiren">Parçayı kim getirdi?' +
                '<button class="cip" data-getiren="' + i + '|tamirci" aria-pressed="' +
                  (s.kimGetirdi === 'tamirci') + '">Tamirci</button>' +
                '<button class="cip" data-getiren="' + i + '|musteri" aria-pressed="' +
                  (s.kimGetirdi === 'musteri') + '">Müşteri</button>' +
              '</span>'
            : '') +
        '</div>';
      }).join('')
    : '<p class="kalem-bos">Henüz bir şey yazılmadı — parça ya da işçilik ekle.</p>';

  kayitToplamCiz(k);
}

Ekran.tanim('kayit', { ciz: kayitCiz });

document.addEventListener('click', function (e) {
  var k = kayitBul(ACIK_KAYIT);
  if (!k) return;
  var t = e.target.closest('button, [data-arac-ac]');
  if (!t) return;

  if (t.getAttribute('data-arac-ac')) { ACIK_PLAKA = k.plaka; Ekran.ac('arac'); return; }

  if (t.id === 'kParcaEkle') {
    k.satirlar.push({ tip: 'parca', ad: '', fiyat: 0, alis: 0,
                      kimGetirdi: 'tamirci', marka: '', kod: '', tanim: 'tanimlanamadi' });
    Ekran.tazele();
  }
  if (t.id === 'kIscilikEkle') {
    k.satirlar.push({ tip: 'iscilik', ad: '', fiyat: 0, alis: 0, kimGetirdi: '' });
    Ekran.tazele();
  }
  if (t.id === 'kSikayetMik' || t.id === 'kSesleEkle') {
    /* İkisi de sesli işleme gider; bağlam "açık kayıt" olduğu için
       ekran örneklerini ona göre gösteriyor ("balata da değişecek"). */
    sesleAc('kayit-icinde');
    return;
  }
  /* K-003: onay bir AKIŞ değil, bir EYLEM. Kayıt beklemeye geçmez,
     durum değişmez — mesaj gider, iş yürümeye devam eder.

     ⚠️ ARTIK GERÇEKTEN GÖNDERİYOR: mesaj ekranına özet şablonuyla
     gidiyor. Önceden yalnız balon çıkarıyordu ve "gönderildi" diyordu;
     hiçbir şey gönderilmiyordu. Bir kez böyle kanan usta, bir daha
     hiçbir "gönderildi" yazısına inanmaz. */
  if (t.id === 'kOzetGonder') {
    var hedef = mesajHedefi(k.plaka);
    if (!hedef || !hedef.tel) {
      balon('Telefon yok — özet gönderilemez. Araç kaydına telefon ekle.', false, 3200);
      return;
    }
    MESAJ_HEDEF = { plaka: k.plaka, sablon: 'ozet' };
    Ekran.ac('mesaj');
    return;
  }

  var sil = t.getAttribute('data-satir-sil');
  if (sil !== null) { k.satirlar.splice(parseInt(sil, 10), 1); Ekran.tazele(); }

  var kay = t.getAttribute('data-kaynak');
  if (kay) {
    var pk = kay.split('|');
    k.satirlar[parseInt(pk[0], 10)].kaynak = parseInt(pk[1], 10);
    Ekran.tazele();
  }

  var g = t.getAttribute('data-getiren');
  if (g) {
    var p = g.split('|');
    var s = k.satirlar[parseInt(p[0], 10)];
    s.kimGetirdi = p[1];
    /* Müşteri getirdiyse satır fiyatsız kalır (S2, K-005) — AMA gelen
       fiyat SİLİNMEZ, alışa taşınır. Önce sıfırlıyordum: Kol D'nin
       "sonradan" hâlinde ("ucuza buldum, kendim alayım") parçacının
       verdiği rakam kayıttan uçuyordu. Belge onun kalmasını söylüyor. */
    if (p[1] === 'musteri') {
      if (s.fiyat && !s.alis) s.alis = s.fiyat;
      s.fiyat = 0;
    }
    Ekran.tazele();
  }
});

document.addEventListener('input', function (e) {
  var k = kayitBul(ACIK_KAYIT);
  if (!k || !e.target || !e.target.getAttribute) return;

  if (e.target.id === 'kSikayet') { k.sikayet = e.target.value; return; }

  var ad = e.target.getAttribute('data-satir-ad');
  if (ad !== null) { k.satirlar[parseInt(ad, 10)].ad = e.target.value; return; }

  var f = e.target.getAttribute('data-satir-fiyat');
  if (f !== null) {
    k.satirlar[parseInt(f, 10)].fiyat =
      parseInt((e.target.value || '').replace(/[^0-9]/g, ''), 10) || 0;
    /* Yalnız toplamı tazele — alanı yeniden çizmek imleci kaçırır. */
    kayitToplamCiz(k);
  }
});
</script>
