     .kalem satırı bir KART gibi davranıyordu: her satırda tip rozeti,

<style>

/* Kişi satırı: rol küçük ve soluk, ad büyük ve koyu; aradaki boşluk

}

}

/* Müşteri bloğu künyeden ayraçla ayrılır: üstü araç, altı kişi. */

}

/* ---- YAPILANLAR TABLOSU ----

/* ⚠️ 48 px DOKUNMA HEDEFİ — çerçevesiz ama KÜÇÜK DEĞİL (06.09).

/* ⚠️ HÜCRELER TEPEDEN HİZALI + ROZET ADIN YANINDA (06.09, ölçüm).
   Ekran görüntüsünde işçilik satırının tutarı adından 12 px YUKARIDA

   İki değişiklik: hücreler tepeden hizalanıyor, rozet de adın ÜSTÜNE

#screen-kayit .k-satir {

#screen-kayit .k-satir .pill { flex: none; }
#screen-kayit .tablo input {

/* Satırın ikincil bilgisi: kim getirdi rozeti + parçacı fiyatı.

   44 px'lik düğme, Cemil'in kaldırttığı gürültünün aynısı.

   Cemil zaten kaldırmıştı: *"Servis kayıtları listesinde parçayı
   müşteri getirdi alanına gerek yok. Listenin üzerinde müşteri getirdi

/* ⚠️ 320 px'TE AD ALANI SESSIZCE KIRPILIYORDU (06.09, kuyruk 9).

   usta ekranda "Bakım işç" görüyor ve **eksik olduğunu anlamıyor.**
   `<input>` taşan metni ne sarar ne üç nokta koyar; sessizce keser.
   K-025'in kuralı: kesilen metin, taşan metinden tehlikelidir.

   İki yerden yer açıldı, ikisi de yalnız dar ekranda:
   · tutar sütunu 96 → 74 px ("1.900 ₺" 50 px'e sığıyor)
   · tip rozeti küçülüyor (65 → ~52 px)
   Kazanç ~35 px; ad alanı 65 → ~101 px oluyor.

   375 px ve üstünde hiçbir şey değişmiyor — dar ekranın çözümü geniş

#screen-kayit .k-alis {

<script>
/* ⚠️ "TÜR ELLE SEÇİLDİ Mİ" BAYRAĞI KAYDIN ÜSTÜNDE (k.turElle), EKRANIN
   DEĞİL. Önce ekran değişkeni olarak yazmıştım (`var kTurElle`) ve
   `ciz()` her çizimde onu sıfırlıyordu: usta "Tamirat" diyor, sonraki
   harfte metin tahmini yeniden koşuyor ve seçim geri alınıyordu.
   Elle işletince çıktı — hiçbir test bunu görmezdi, çünkü ekran
   "çalışıyor"du.

   Ders: bir SEÇİM, ekranın değil VERİNİN bilgisidir. Ekran değişkeni
   çizimle birlikte ölür; kayıt yaşadığı sürece seçim de yaşamalı. */

/* Fotoğraftan okunan sahte parça listesi. Gerçek okuma bir servise
   bağlanacak; burada gösterilen şey DAVRANIŞ: okunan satır olur ve
   fiyatı BOŞ gelir — okunmamış bir rakamı doluymuş gibi göstermek,
   ustanın kontrol etmediği bir rakamı müşteriye söyletmek olurdu. */
var FOTO_PARCA_ORNEK = [
  ['Triger seti', 0], ['Devirdaim', 0], ['Antifriz 4 lt', 0]
];

function kayitToplamCiz(k) {
  var el = document.getElementById('kToplam');
  if (el) el.textContent = tutar(kayitToplami(k)) + ' ₺';
}

/* Parçaların HEPSİ müşteriden mi — düğmenin basılı görünmesi buna
   bakıyor. Hiç parça yoksa "hepsi" diye bir şey yok. */
function kHepsiMusteriMi(k) {
  var parcalar = (k.satirlar || []).filter(function (s) { return s.tip === 'parca'; });
  return parcalar.length > 0 && parcalar.every(function (s) {
    return s.kimGetirdi === 'musteri';
  });
}

/* ⚠️ 06.09 — BU FONKSİYON ARTIK HİÇBİR ŞEY SİLMİYOR (K-037).
   Eskiden müşteri parçasında `fiyat`ı sıfırlıyor, kaybolmasın diye
   `alis`e taşıyordu. İki sorun vardı:

   1. **Tek dokunuş, geri alınamaz kayıp.** "Parçaları müşteri getirdi"
      anahtarını açıp kapatan usta, yazdığı satış fiyatını bir daha
      bulamıyordu. K-032'nin kuralı burada da geçerli: görünmeyen bir
      sonuç doğuran bir dokunuş olmamalı.
   2. **`alis` başka bir şeydir** — BİZİM ödediğimiz. Müşteri kendi
      parçasını getirdiyse biz hiçbir şey ödemedik; oraya parçacının
      teklifini yazmak alanın anlamını bozuyordu.

   S2/K-005 aynen duruyor: müşteri parçası faturaya girmez. Kural artık
   `kayitToplami()`de işliyor — veri korunuyor, TOPLAM karar veriyor. */
function kGetireniAyarla(s, kim) {
  s.kimGetirdi = kim;
}

function kayitCiz() {
  var k = kayitBul(ACIK_KAYIT);
  if (!k) return;
  var a = aracBul(k.plaka);

  document.getElementById('kayitBaslik').innerHTML =
    '<svg class="ico ico-sm"><use href="#' + TUR_IKON[k.tur] + '"></use></svg> ' + TUR_AD[k.tur];

  document.getElementById('kayitKunye').innerHTML =
    '<div class="arac-bas">' + plakaHtml(k.plaka, 'plate-lg') +
      '<div class="veh-title">' + (a ? a.marka + ' ' + a.model : '') +
        (a && a.yil ? ' <span class="yr">' + a.yil + '</span>' : '') + '</div>' +
      '<div class="spec-strip">' +
        (a && a.motor ? '<span class="spec-val">' + a.motor + '</span>' : '') +
        (k.km ? '<span class="spec-sep">·</span><span class="spec-val mono">' +
                k.km + ' km</span>' : '') +
      '</div>' +
    '</div>';

  /* ---- MÜŞTERİ ----
     Ruhsat sahibi FİRMA olabilir; o zaman aranacak kişi başkasıdır
     (A-M2). İkisi de gösteriliyor, ikisi de aranabiliyor. */
  /* ⚠️ SAHİBİ ve İLETİŞİM AYNI DİLDE (Cemil, 07.09: "Servis kaydı
     detay sayfasında sahibi ve iletişim aynı fonttan olsun. Büyük
     olmalı." + "Sahibi yazısından sonra boşluk da olmalı.")

     İkisi farklı bileşenlerden geliyordu: sahibi `.tl-veri` (küçük,
     ikincil), iletişim `.ak-kisi` (araç kartından ödünç). Aynı soruya
     — *"kimi arayacağım"* — iki farklı görünüm veriyorlardı ve
     ikincisi birincisinden büyük duruyordu.

     Artık tek bileşen: rol küçük ve soluk (Sahibi / İletişim), AD
     büyük ve koyu. Rol ile ad arasındaki boşluk `gap` ile veriliyor —
     metin içindeki tek boşluğa güvenmiyor. */
  function kisiSatiri(rol, ad, tel) {
    return '<div class="k-kisi">' +
      '<span class="k-kisi-rol">' + rol + '</span>' +
      '<b class="k-kisi-ad">' + (ad || 'yazılmamış') + '</b>' +
    '</div>' + (tel ? telLinkHtml(tel, ad) : '');
  }
  document.getElementById('kayitMusteri').innerHTML = a
    ? kisiSatiri('Sahibi', a.sahipAd, a.sahipTel) +
      (a.sahipTel ? '' :
        '<p class="plate-hint">Telefon yok — özet ve hatırlatma gönderilemez.</p>') +
      (a.iletisimTel || a.iletisimAd
        ? kisiSatiri('İletişim', a.iletisimAd, a.iletisimTel)
        : '')
    : '<p class="plate-hint">Bu plaka araç listesinde yok.</p>';

  document.getElementById('kSikayet').value = k.sikayet || '';

  /* İŞ TÜRÜ — tahmin edilmiş hâli basılı görünür, elle değiştirilebilir. */
  document.getElementById('kTurGrup').innerHTML =
    ['tamirat', 'bakim', 'ikisi'].map(function (t) {
      return '<button class="cip" data-kayit-tur="' + t + '" aria-pressed="' +
        (k.tur === t) + '">' + TUR_AD[t] + '</button>';
    }).join('');

  /* ---- YAPILANLAR TABLOSU ---- */
  var satirlar = k.satirlar || [];
  document.getElementById('kSatirlar').innerHTML = satirlar.length
    ? '<div class="tablo-sar"><table class="tablo">' +
        '<thead><tr><th>İş</th><th class="sayi">Tutar</th></tr></thead><tbody>' +
        satirlar.map(function (s, i) {
          return '<tr class="kaydirilir" data-kaydir="' + i + '" tabindex="0"' +
              ' aria-label="' + (s.ad || 'satır') + ' — silmek için sola kaydır">' +
            '<td>' +
              '<span class="k-satir">' +
                '<span class="pill ' + (s.tip === 'parca' ? 'info' : 'muted') + '">' +
                  (s.tip === 'parca' ? 'PARÇA' : 'İŞÇİLİK') + '</span>' +
                '<input value="' + (s.ad || '').replace(/"/g, '&quot;') +
                  '" data-satir-ad="' + i + '" placeholder="' +
                  (s.tip === 'parca' ? 'Parça adı' : 'Ne yapıldı') +
                  '" aria-label="Satır adı" />' +
              '</span>' +
              /* ⚠️ KOL B GERİ KONDU (06.09, ölü uç turu).
                 Dün tabloyu yazarken bu çipler düştü ve fark etmedim:
                 `parca-sor` iki parçacıya soruyor, `s.sorulan`u
                 yazıyor, balonu *"cevaplar kayda düşecek"* diyor — ama
                 kaydı okuyan hiçbir şey kalmamıştı. `SelectedReplyId`
                 (modelde duran, akışta karşılığı olan bir alan) hiç
                 dolmuyordu: usta iki cevap aldığında hangisini
                 kullandığını yazacak yer yoktu.

                 TEK PARÇACIYA SORULDUYSA ÇIKMAZ — ana yol kalınlaşmaz.
                 Satırı uzatıyor, evet; ama yalnız uzatması gereken
                 durumda. */
              ((s.sorulan || []).length > 1
                ? '<span class="k-ikincil">Cevap kimden geldi?' +
                    s.sorulan.map(function (pi) {
                      return '<button class="cip" data-kaynak="' + i + '|' + pi +
                        '" aria-pressed="' + (s.kaynak === pi) + '">' +
                        PARCACILAR[pi].ad + '</button>';
                    }).join('') +
                  '</span>'
                : '') +
              /* ⚠️ A-M13 CEVAPLANDI (07.09) — SATIR BAŞINA GERİ GELDİ.
                 Cemil: *"Evet, olabilir"* — *"balatayı müşteri getirdi,
                 yağı ben aldım"* gerçek bir durum.

                 K-033.5'te bunu kaldırırken gerekçemi yanlış kurmuştum:
                 Cemil'in *"gerek yok"* dediği şey satır başına **iki
                 çipli SORU**ydu (etiket + Tamirci + Müşteri = üç öğe),
                 işaretin kendisi değil.

                 Şimdi **tek çip**: üstünde şu anki hâli yazıyor,
                 dokununca öbürüne geçiyor. Üç öğe yerine bir; ve `.cip`
                 zaten 44 px, K-040'ta 26 px'lik düğmeyle düştüğüm
                 tuzağa düşmüyor.

                 Listenin üstündeki "hepsi" anahtarı duruyor — biri
                 toptan, öteki tek tek. */
              (s.tip === 'parca'
                ? '<span class="k-ikincil">' +
                    '<button class="cip" data-getiren="' + i + '" aria-pressed="' +
                      (s.kimGetirdi === 'musteri') + '">' +
                      (s.kimGetirdi === 'musteri' ? 'müşteri getirdi' : 'tamirci getirdi') +
                    '</button>' +
                    /* Parçacıdan gelen fiyat MÜŞTERİYE SÖYLENECEK RAKAM
                       DEĞİL: soluk ve küçük durur. */
                    (s.alis ? '<span class="k-alis">parçacı ' + tutar(s.alis) + ' ₺</span>' : '') +
                  '</span>'
                : '') +
            '</td>' +
            /* Müşteri parçasının tutarı YAZILI ama TOPLAMA GİRMİYOR;
               üstü çizili duruyor ki usta rakamı görsün ama toplamda
               aramasın. Alan düzenlenebilir kalıyor: parçacının verdiği
               rakam ileride işine yarayabilir (Kol D). */
            '<td class="sayi' +
              (s.tip === 'parca' && s.kimGetirdi === 'musteri' ? ' tutar-disi' : '') + '">' +
              '<input value="' + (s.fiyat ? tutar(s.fiyat) : '') +
                '" data-satir-fiyat="' + i + '" data-giris="tutar" inputmode="numeric"' +
                ' placeholder="0" aria-label="Tutar"' +
                (s.tip === 'parca' && s.kimGetirdi === 'musteri'
                  ? ' title="Müşteri getirdi — toplama girmiyor"' : '') +
                ' /></td>' +
          '</tr>';
        }).join('') +
        '<tr class="genel"><td>Toplam</td>' +
          '<td class="sayi" id="kToplam">' + tutar(kayitToplami(k)) + ' ₺</td></tr>' +
        '</tbody></table></div>'
    : bosDurumHtml('i-clipboard-list', 'Henüz bir şey yazılmadı',
        'Parça ya da işçilik ekle. Parçacının listesini fotoğraflayarak ' +
        'da girebilirsin. Satırı silmek için sola kaydır.');

  document.getElementById('kHepsiMusteri')
    .setAttribute('aria-pressed', String(kHepsiMusteriMi(k)));

  /* ---- PARÇA BEKLİYOR ---- */
  document.getElementById('kBekliyor')
    .setAttribute('aria-pressed', String(!!k.parcaBekliyor));
  document.getElementById('kBekliyorGovde').innerHTML = k.parcaBekliyor
    ? '<div class="notice warn">' +
        '<span class="n-ic"><svg class="ico ico-sm"><use href="#i-clock"></use></svg></span>' +
        '<span class="n-body">Bu araç <b>parça bekliyor</b>. Servis kayıtları ' +
          'listesinde de böyle görünüyor.</span></div>' +
      /* ⚠️ A-M15 CEVAPLANDI (07.09): *"İsterse, evet."* — müşterinin
         özet sayfasında görünmesi ZORUNLU değil, USTANIN SEÇİMİ.
         K-038.3'te varsayım olarak "hep söylenir" yazmıştım; Cemil
         seçenek istedi. Bazı usta gecikmeyi duyurmak istemeyebilir ve
         bu onun müşterisiyle arasındaki iş. */
      '<div class="cip-grup" style="margin-top:10px">' +
        '<button class="cip" id="kBekliyorMusteriye" aria-pressed="' +
          (!!k.bekliyorMusteriye) + '">Müşterinin sayfasında da göster</button>' +
      '</div>' +
      '<button class="btn btn-ghost" id="kBekliyorMesaj" style="margin-top:10px">' +
        '<svg class="ico"><use href="#i-message-square"></use></svg>' +
        ' Müşteriye haber ver</button>'
    : '<p class="plate-hint">Parça sipariş edildi ve yolda ise işaretle — ' +
      'müşteriye tek dokunuşla haber verebilirsin.</p>';
}

/* ⚠️ ÇİZİM, KARARI SİLMEZ (06.09 — bu hatayı BİR TURDA İKİ KEZ yaptım).
   Önce `ciz` içinde `kSilinecek = null` vardı. `Ekran.tazele()` ciz()'i
   çağırıyor; kaydırma onayı açmak için tazeliyor; tazeleme onayı
   siliyordu. Sonuç: satır kayıyor, hiçbir şey açılmıyor — K-032'de
   yaşadığım işaret hatasının birebir aynısı, başka sebeple.

   Aynı gün aynı hatayı `kTurElle` ile de yaptım (o, kaydın üstüne
   taşındı). İkisini de hiçbir test yakalamadı; elle işletince çıktı.

   ⚠️ İLK ÇÖZÜMÜM YETERSİZDİ: `kCizilenKayit` diye bir bekçi koyup
   "kayıt değiştiyse sıfırla" demiştim. Doğru çalışıyordu ama sorunun
   KENDİSİNİ çözmüyordu — `ciz` hâlâ açılış işi yapıyordu ve aynı tuzak
   öteki ekranlarda duruyordu. Çekirdeğe `ac` kancası eklendi (K-040);
   sıfırlama oraya taşındı ve bekçi gereksiz kaldı. */
Ekran.tanim('kayit', {
  ciz: kayitCiz
});

/* Kaydırma davranışı ÇEKİRDEKTE (Kaydirma); burada yalnız bu ekranda
   ne anlama geldiği yazıyor: hangi satır silinecek. */
/* ⚠️ 07.09 — BU TABLO DA DOĞRUDAN SİLİYOR.
   Cemil yalnız GİDER için söyledi (*"Gideri sola kaydırdığında sil"*),
   ama aynı hareket iki tabloda var. İkisi farklı davranırsa **aynı
   jest iki anlama gelir** ve usta hangisinde ne olacağını akılda
   tutmak zorunda kalır. K-040'ta çekmece/katman için, K-042'de
   header/footer için verdiğim kararın aynısı: bir hareket, bir anlam.

   Cemil onayına açık (A-M19): gider için istediğini kayıt satırına da
   taşıdım. */
Kaydirma.tanim('kayit', function (anahtar) {
  var k = kayitBul(ACIK_KAYIT);
  if (!k) return;
  var i = parseInt(anahtar, 10);
  var silinen = k.satirlar[i];
  if (!silinen) return;
  k.satirlar.splice(i, 1);
  Ekran.tazele();
  balonGeriAl((silinen.ad || 'Satır') + ' silindi.', function () {
    k.satirlar.splice(i, 0, silinen);
    Ekran.tazele();
  });
});

document.addEventListener('click', function (e) {
  var k = kayitBul(ACIK_KAYIT);
  if (!k) return;
  var t = e.target.closest('button, [data-arac-ac]');
  if (!t) return;

  if (t.getAttribute('data-arac-ac')) { ACIK_PLAKA = k.plaka; Ekran.ac('arac'); return; }

  if (t.id === 'kParcaEkle') {
    k.satirlar.push({ tip: 'parca', ad: '', fiyat: 0, alis: 0,
                      kimGetirdi: 'tamirci', marka: '', kod: '', tanim: 'tanimlanamadi' });
    Ekran.tazele(); return;
  }
  if (t.id === 'kIscilikEkle') {
    k.satirlar.push({ tip: 'iscilik', ad: '', fiyat: 0, alis: 0, kimGetirdi: '' });
    Ekran.tazele(); return;
  }

  /* FOTOĞRAFTAN PARÇA LİSTESİ — okunanlar satır olur, fiyatları BOŞ. */
  if (t.id === 'kFotoParca') {
    FOTO_PARCA_ORNEK.forEach(function (p) {
      k.satirlar.push({ tip: 'parca', ad: p[0], fiyat: p[1], alis: 0,
        kimGetirdi: 'tamirci', marka: '', kod: '', tanim: 'tanimlanamadi' });
    });
    balon(FOTO_PARCA_ORNEK.length + ' parça okundu — fiyatlarını yaz.', false, 3000);
    Ekran.tazele(); return;
  }

  /* HEPSİ MÜŞTERİDEN — tek dokunuşta işaretler, ikinci dokunuşta geri
     alır. Geri alma şart: yanlışlıkla basılan bir düğme, on satırın
     fiyatını sıfırlıyor. */
  if (t.id === 'kHepsiMusteri') {
    var hepsi = kHepsiMusteriMi(k);
    (k.satirlar || []).forEach(function (s) {
      if (s.tip !== 'parca') return;
      if (hepsi) {
        /* Geri alma artık TAM: fiyat hiç silinmediği için satır
           olduğu gibi geri geliyor (K-037). Eskiden burada bir not
           vardı — "usta kendi rakamını yeniden yazar" — ve o not, bir
           veri kaybını kural gibi anlatıyordu. */
        s.kimGetirdi = 'tamirci';
      } else {
        kGetireniAyarla(s, 'musteri');
      }
    });
    balon(hepsi ? 'Parçalar tamirciye döndü.' : 'Tüm parçalar müşteriden sayıldı.',
          false, 2600);
    Ekran.tazele(); return;
  }

  if (t.id === 'kBekliyor') {
    k.parcaBekliyor = !k.parcaBekliyor;
    /* Bayrak kapanınca müşteriye gösterme seçimi de anlamını yitirir. */
    if (!k.parcaBekliyor) k.bekliyorMusteriye = false;
    Ekran.tazele(); return;
  }
  if (t.id === 'kBekliyorMusteriye') {
    k.bekliyorMusteriye = !k.bekliyorMusteriye;
    Ekran.tazele(); return;
  }
  if (t.id === 'kBekliyorMesaj') {
    var hb = mesajHedefi(k.plaka);
    if (!hb || !hb.tel) {
      balon('Telefon yok — haber verilemez. Araç kaydına telefon ekle.', false, 3200);
      return;
    }
    MESAJ_HEDEF = { plaka: k.plaka, sablon: 'bekliyor' };
    Ekran.ac('mesaj'); return;
  }

  if (t.id === 'kSikayetMik' || t.id === 'kSesleEkle') {
    sesleAc('kayit-icinde'); return;
  }

  /* K-003: onay bir AKIŞ değil, bir EYLEM. Kayıt beklemeye geçmez. */
  if (t.id === 'kOzetGonder') {
    var hedef = mesajHedefi(k.plaka);
    if (!hedef || !hedef.tel) {
      balon('Telefon yok — özet gönderilemez. Araç kaydına telefon ekle.', false, 3200);
      return;
    }
    MESAJ_HEDEF = { plaka: k.plaka, sablon: 'ozet' };
    Ekran.ac('mesaj'); return;
  }

  var tur = t.getAttribute('data-kayit-tur');
  if (tur) { k.tur = tur; k.turElle = true; Ekran.tazele(); return; }

  /* Hangi parçacının cevabı kullanıldı (Kol B). Seçim SATIRA yazılır,
     ekrana değil: aynı kayıtta iki parça iki ayrı parçacıdan gelebilir. */
  var kay = t.getAttribute('data-kaynak');
  if (kay) {
    var pk = kay.split('|');
    k.satirlar[parseInt(pk[0], 10)].kaynak = parseInt(pk[1], 10);
    Ekran.tazele(); return;
  }

  /* Satır başına "kim getirdi" — tek çip, dokununca öbürüne geçer. */
  var g = t.getAttribute('data-getiren');
  if (g !== null && g !== undefined && g !== '') {
    var sg = k.satirlar[parseInt(g, 10)];
    kGetireniAyarla(sg, sg.kimGetirdi === 'musteri' ? 'tamirci' : 'musteri');
    Ekran.tazele(); return;
  }

});

document.addEventListener('input', function (e) {
  var k = kayitBul(ACIK_KAYIT);
  if (!k || !e.target || !e.target.getAttribute) return;

  if (e.target.id === 'kSikayet') {
    k.sikayet = e.target.value;
    /* Tür metinden TAKİP EDİLİR — usta elle seçene kadar. Elle seçim
       tahmini kalıcı olarak yener. */
    if (!k.turElle) {
      var yeniTur = isTuruTahmin(k.sikayet);
      if (yeniTur !== k.tur) {
        k.tur = yeniTur;
        document.getElementById('kayitBaslik').innerHTML =
          '<svg class="ico ico-sm"><use href="#' + TUR_IKON[k.tur] +
          '"></use></svg> ' + TUR_AD[k.tur];
        document.getElementById('kTurGrup').innerHTML =
          ['tamirat', 'bakim', 'ikisi'].map(function (t) {
            return '<button class="cip" data-kayit-tur="' + t + '" aria-pressed="' +
              (k.tur === t) + '">' + TUR_AD[t] + '</button>';
          }).join('');
      }
    }
    return;
  }

  var ad = e.target.getAttribute('data-satir-ad');
  if (ad !== null) { k.satirlar[parseInt(ad, 10)].ad = e.target.value; return; }

  var f = e.target.getAttribute('data-satir-fiyat');
  if (f !== null) {
    k.satirlar[parseInt(f, 10)].fiyat =
      parseInt((e.target.value || '').replace(/[^0-9]/g, ''), 10) || 0;
    /* Yalnız toplamı tazele — alanı yeniden çizmek imleci kaçırır. */
    kayitToplamCiz(k);
  }
});
</script>
