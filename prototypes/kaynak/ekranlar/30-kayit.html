<!-- ekran: kayit · SERVİS KAYDI (EKRANLAR.md §3) — ÜRÜNÜN KALBİ
     Akışın dört adımı burada: 2 ne istiyor · 4 fiyat geldi ·
     5 parça geldi (kim getirdi) · 6 iş yapıldı.
     Kayıt TESLİM EDİLENE KADAR AÇIK ve satır eklenebilir (K-003).

     ÜZERİNDE YOK: durum rozeti · kesinlik kademeleri · garanti süresi
     · katalog seçici · fiyat karşılaştırma tablosu · onay bekleme
     durumu · red paneli · kabul formu · iskonto mekanizması. -->
<section class="screen" id="screen-kayit">

  <!-- Künyeye dokununca ARAÇ açılır: geçmiş, son bakım ve
       "parçayı geçen sefer kim getirmişti" orada (K-005). -->
  <button class="kayit-kunye" id="kayitKunye" data-arac-ac="1"
          aria-label="Aracın geçmişini aç"></button>

  <div class="alan">
    <label for="kSikayet">Ne istiyor?</label>
    <div class="metin-mikrofon">
      <input id="kSikayet" placeholder="ör. triger seti değişecek" autocomplete="off" />
      <button class="mik-btn" id="kSikayetMik" aria-label="Sesle söyle">
        <svg class="ico" aria-hidden="true"><use href="#i-mikrofon"></use></svg>
      </button>
    </div>
  </div>

  <h2 class="bolum-bas">Yapılanlar</h2>
  <div id="kSatirlar"></div>

  <div class="satir-ekle">
    <button class="ikincil-btn" id="kParcaEkle">
      <svg class="ico" aria-hidden="true"><use href="#i-ekle"></use></svg> Parça
    </button>
    <button class="ikincil-btn" id="kIscilikEkle">
      <svg class="ico" aria-hidden="true"><use href="#i-ekle"></use></svg> İşçilik
    </button>
  </div>

  <div class="toplam-serit" id="kToplam"></div>

  <button class="ikincil-btn genis" data-git="parca-sor">
    <svg class="ico" aria-hidden="true"><use href="#i-parca"></use></svg> Parça fiyatı sor
  </button>

  <button class="ikincil-btn genis" id="kOnayIste">
    <svg class="ico" aria-hidden="true"><use href="#i-tamam"></use></svg> Onay iste
  </button>

  <button class="ana-btn" data-git="teslim">
    <svg class="ico ico-lg" aria-hidden="true"><use href="#i-para"></use></svg>
    <span>Teslim et</span>
  </button>

</section>

<style>
.kayit-kunye {
  display: grid;
  gap: 8px;
  width: 100%;
  margin-bottom: 18px;
  padding: 14px;
  text-align: left;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  background: var(--surface);
}
.kayit-kunye:hover { border-color: var(--primary); }
.kunye-ust { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.kunye-arac { color: var(--muted); font-size: var(--tip-sm); }

.metin-mikrofon { display: flex; gap: 8px; }
.metin-mikrofon input { flex: 1; min-width: 0; }
.mik-btn {
  width: var(--dokun);
  flex: none;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  background: var(--surface);
  color: var(--primary);
}

/* SATIRLAR TEK LİSTE. Parça mı işçilik mi satırın kendi işareti;
   iki ayrı bölüm değil (EKRANLAR.md §3). */
.k-satir {
  display: grid;
  grid-template-columns: auto 1fr auto auto;
  align-items: center;
  gap: 10px;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  background: var(--surface);
  margin-bottom: 8px;
}
.k-tip {
  padding: 3px 8px;
  border-radius: var(--radius-pill);
  font-size: var(--tip-xs);
  font-weight: 600;
}
.k-tip.parca { background: var(--accent-soft); color: var(--accent); }
.k-tip.iscilik { background: color-mix(in srgb, var(--primary) 12%, transparent); color: var(--primary); }
.k-ad { min-width: 0; border: 0; background: transparent; font-size: var(--tip-md); }
.k-fiyat {
  width: 92px;
  text-align: right;
  border: 0;
  background: transparent;
  font-family: var(--font-mono);
  font-variant-numeric: tabular-nums;
  font-weight: 600;
}
.k-sil {
  width: 36px; height: 36px; min-height: 36px;
  border: 0; border-radius: var(--radius-pill);
  background: transparent; color: var(--faint);
}

/* KİM GETİRDİ — bilgi alanı değil, ileride kimin ödeyeceğini
   belirleyen anahtar (K-005). O yüzden satırda GÖRÜNÜR duruyor. */
.k-getiren {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: var(--tip-xs);
  color: var(--muted);
}
.k-getiren button {
  min-height: 32px;
  padding: 0 10px;
  border: 1px solid var(--line);
  border-radius: var(--radius-pill);
  background: var(--surface);
  font-size: var(--tip-xs);
  font-weight: 600;
}
.k-getiren button[aria-pressed="true"] {
  border-color: var(--primary);
  background: color-mix(in srgb, var(--primary) 12%, transparent);
  color: var(--primary);
}

.satir-ekle { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
.ikincil-btn.genis { margin-bottom: 10px; min-height: var(--dokun); }

.toplam-serit {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  padding: 16px;
  margin-bottom: 18px;
  border-radius: var(--radius-md);
  background: var(--surface-2);
}
.toplam-serit .etiket { font-size: var(--tip-md); font-weight: 600; }
.toplam-serit .deger {
  font-family: var(--font-mono);
  font-size: var(--tip-2xl);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
</style>

<script>
function kayitCiz() {
  var k = kayitBul(ACIK_KAYIT);
  if (!k) return;
  var a = aracBul(k.plaka);

  document.getElementById('kayitKunye').innerHTML =
    '<div class="kunye-ust">' + plakaHtml(k.plaka) +
      '<span class="kayit-tur ' + k.tur + '">' +
      (k.tur === 'bakim' ? 'Bakım' : 'Tamirat') + '</span></div>' +
    '<div class="kunye-arac">' +
      (a ? a.marka + ' ' + a.model + ' · ' + a.yil : '') +
      (k.tur === 'bakim' && k.km ? ' · ' + k.km + ' km' : '') +
    '</div>';

  document.getElementById('kSikayet').value = k.sikayet || '';

  var kap = document.getElementById('kSatirlar');
  kap.innerHTML = (k.satirlar || []).length
    ? k.satirlar.map(function (s, i) {
        return '<div class="k-satir">' +
          '<span class="k-tip ' + s.tip + '">' + (s.tip === 'parca' ? 'PARÇA' : 'İŞÇİLİK') + '</span>' +
          '<input class="k-ad" value="' + (s.ad || '').replace(/"/g, '&quot;') +
            '" data-satir-ad="' + i + '" placeholder="' +
            (s.tip === 'parca' ? 'Parça adı' : 'Ne yapıldı') + '" />' +
          '<input class="k-fiyat" value="' + (s.fiyat ? tutar(s.fiyat) : '') +
            '" data-satir-fiyat="' + i + '" inputmode="numeric" placeholder="—" aria-label="Fiyat" />' +
          '<button class="k-sil" data-satir-sil="' + i + '" aria-label="Satırı kaldır">✕</button>' +
          (s.tip === 'parca'
            ? '<span class="k-getiren">Parçayı kim getirdi?' +
                '<button data-getiren="' + i + '|tamirci" aria-pressed="' +
                  (s.kimGetirdi === 'tamirci') + '">Tamirci</button>' +
                '<button data-getiren="' + i + '|musteri" aria-pressed="' +
                  (s.kimGetirdi === 'musteri') + '">Müşteri</button>' +
              '</span>'
            : '') +
        '</div>';
      }).join('')
    : bosDurumHtml('Henüz bir şey yazılmadı',
        'Parça ya da işçilik ekle. Kayıt teslim edilene kadar açık kalır.');

  document.getElementById('kToplam').innerHTML =
    '<span class="etiket">Toplam</span>' +
    '<span class="deger">' + tutar(kayitToplami(k)) + ' ₺</span>';
}

Ekran.tanim('kayit', { ciz: kayitCiz });

document.addEventListener('click', function (e) {
  var k = kayitBul(ACIK_KAYIT);
  if (!k) return;
  var t = e.target.closest('button');
  if (!t) return;

  if (t.id === 'kParcaEkle') {
    k.satirlar.push({ tip: 'parca', ad: '', fiyat: 0, alis: 0,
                      kimGetirdi: 'tamirci', marka: '', kod: '', tanim: 'tanimlanamadi' });
    Ekran.tazele();
  }
  if (t.id === 'kIscilikEkle') {
    k.satirlar.push({ tip: 'iscilik', ad: '', fiyat: 0, alis: 0, kimGetirdi: '' });
    Ekran.tazele();
  }
  if (t.id === 'kSikayetMik') {
    document.getElementById('kSikayet').value = 'Triger seti değişecek';
    k.sikayet = 'Triger seti değişecek';
    balon('Duyduğumu yazdım — kontrol et.');
    Ekran.tazele();
  }
  /* K-003: onay bir AKIŞ değil, bir EYLEM. Kayıt beklemeye geçmez,
     durum değişmez — mesaj gider, iş yürümeye devam eder. */
  if (t.getAttribute('data-arac-ac')) { ACIK_PLAKA = k.plaka; Ekran.ac('arac'); return; }

  if (t.id === 'kOnayIste') {
    var a = aracBul(k.plaka);
    balon((a && a.sahipTel)
      ? 'Özet gönderildi — ' + a.sahipTel
      : 'Telefon yok; özet gönderilemedi.', !(a && a.sahipTel), 3000);
  }

  var sil = t.getAttribute('data-satir-sil');
  if (sil !== null) { k.satirlar.splice(parseInt(sil, 10), 1); Ekran.tazele(); }

  var g = t.getAttribute('data-getiren');
  if (g) {
    var p = g.split('|');
    k.satirlar[parseInt(p[0], 10)].kimGetirdi = p[1];
    /* Müşteri getirdiyse satır fiyatsız kalır (S2, K-005). */
    if (p[1] === 'musteri') k.satirlar[parseInt(p[0], 10)].fiyat = 0;
    Ekran.tazele();
  }
});

document.addEventListener('input', function (e) {
  var k = kayitBul(ACIK_KAYIT);
  if (!k || !e.target) return;

  if (e.target.id === 'kSikayet') { k.sikayet = e.target.value; return; }

  var ad = e.target.getAttribute && e.target.getAttribute('data-satir-ad');
  if (ad !== null && ad !== undefined) { k.satirlar[parseInt(ad, 10)].ad = e.target.value; return; }

  var f = e.target.getAttribute && e.target.getAttribute('data-satir-fiyat');
  if (f !== null && f !== undefined) {
    var n = parseInt((e.target.value || '').replace(/[^0-9]/g, ''), 10) || 0;
    k.satirlar[parseInt(f, 10)].fiyat = n;
    /* Yalnız toplamı tazele — alanı yeniden çizmek imleci kaçırır. */
    document.getElementById('kToplam').innerHTML =
      '<span class="etiket">Toplam</span>' +
      '<span class="deger">' + tutar(kayitToplami(k)) + ' ₺</span>';
  }
});
</script>
