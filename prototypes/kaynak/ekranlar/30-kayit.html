     5 parça geldi (kim getirdi) · 6 iş yapıldı.
     Kayıt TESLİM EDİLENE KADAR AÇIK ve satır eklenebilir (K-003).

     ⚠️ 06.09 — CEMİL'İN TARİFİYLE YENİDEN KURULDU:

       "Servis detay sayfasında müşterinin bilgileri de olsun."
       "Ne istiyor alanında text alanı daha büyük olmalı. Yapılan
        işlemler uzun olabilir. Ve bu alana satır satır ekleme
        yapılabilir."
       "Üstte parçaları müşteri getirdi button olsun. Buna basınca tüm
        parçaları işaretlesin."
       "Parça eklendikçe tablo olarak üstte dursun. Parça listesini ve
        işçilik vb listesi tabloda olsun. Böyle 10 tane parça eklense,
        okunabilir olmaz."
       "Parça bekliyor alanı olmalı. Parça beklediğine dair mesaj da
        gönderebiliriz."
       "Servis kayıtları listesinde parçayı müşteri getirdi alanına

     ---- NEDEN LİSTE DEĞİL TABLO ----
     .kalem satırı bir KART gibi davranıyordu: her satırda tip rozeti,
     ad, fiyat, silme düğmesi ve altında iki soru ("cevap kimden geldi",
     "parçayı kim getirdi") — satır başına 5-6 öğe. Üç satırda idare
     ediyordu, on satırda duvar oluyordu. Cemil haklı.

     Tablo iki sütun: **İş** ve **Tutar**. Rakamlar tek hizada, sağa
     yaslı; göz aşağı inerken tutarları karşılaştırabiliyor. İkincil
     bilgi (kim getirdi, parçacı fiyatı) adın ALTINDA küçük duruyor —
     kendi sütununu istemiyor (K-031: tablo sığar, kaydırılmaz).

     ---- SİLME: SOLA KAYDIR, ONAYLA ----
     Muhasebedeki giderler tablosuyla AYNI hareket, AYNI kod (çekirdek
     `Kaydirma`). İki tabloda iki farklı silme yolu öğretmek, hiç
     öğretmemekten kötü. K-032 duruyor: kaydırma silmez, sorar.

<style>
/* Künye DOKUNULABİLİR bir hedef (araç geçmişini açıyor), o yüzden
   içi henüz doldurulmamışken bile dokunma hedefinden küçük olamaz. */
#kayitKunye { min-height: var(--dokun); }

/* Kişi satırı: rol küçük ve soluk, ad büyük ve koyu; aradaki boşluk
   `gap` ile — metnin içindeki tek boşluk yeterli değildi (A8). */
#screen-kayit .k-kisi {
  display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
  margin-top: 8px;
}
#screen-kayit .k-kisi-rol {
  font-size: var(--tip-sm); color: var(--muted); flex: none;
}
#screen-kayit .k-kisi-ad {
  font-size: var(--tip-md); font-weight: 700; color: var(--text);
  min-width: 0; overflow-wrap: anywhere;
}

/* Müşteri bloğu künyeden ayraçla ayrılır: üstü araç, altı kişi. */
#kayitMusteri {
  margin-top: 12px; padding-top: 12px;
  border-top: 1px solid var(--line);
}

/* ---- YAPILANLAR TABLOSU ----
   Tablo hücresinin içindeki alanlar çerçevesiz duruyor: her satırda
   iki kutu çizmek, on satırda yirmi kutu demek. Alt çizgi "buraya
   yazılır" demeye yetiyor, kutu gürültü yapıyordu. */
/* ⚠️ 48 px DOKUNMA HEDEFİ — çerçevesiz ama KÜÇÜK DEĞİL (06.09).
   İlk yazımda `padding: 2px 0` vardı ve alanlar 28 px ölçüldü;
   denetim on iki kez üst üste söyledi. Görsel ağırlık ≠ dokunma alanı
   (K-024): alan hâlâ çerçevesiz görünüyor, yalnız dikey dolgusu
   parmağa yetiyor. */
/* ⚠️ HÜCRELER TEPEDEN HİZALI + ROZET ADIN YANINDA (06.09, ölçüm).
   Ekran görüntüsünde işçilik satırının tutarı adından 12 px YUKARIDA
   duruyordu: parça satırlarında adın altında ikinci bir satır (parçacı
   fiyatı) var, hücre uzuyor ve tarayıcı tutarı o uzun hücrenin
   ORTASINA yerleştiriyordu. Aynı tabloda satırdan satıra kayan bir
   hiza, tablonun tek işini — rakamları karşılaştırılabilir kılmayı —
   bozar.

   İki değişiklik: hücreler tepeden hizalanıyor, rozet de adın ÜSTÜNE
   değil YANINA geçiyor. Böylece her satırın ilk satırı aynı yükseklikte
   başlıyor. */
#screen-kayit .tablo td { vertical-align: top; }
#screen-kayit .k-satir {
  display: flex; align-items: center; gap: 8px;
}
#screen-kayit .k-satir .pill { flex: none; }
/* Rozet bir düğme oldu: dokunulabilir göründüğü kadar dursun, ama
   satırın içinde gürültü yapmasın — çerçeve yok, yalnız imleç. */
/* Odak halkası GENEL kuralda (stil/01-taban.css :focus-visible);
   burada tekrarlanmıyor — iki yerde durursa biri eskir. */
#screen-kayit .k-satir .k-tip { cursor: pointer; border: 0; font: inherit;
  font-size: 10.5px; font-weight: 700; letter-spacing: .04em; }
#screen-kayit .tablo input {
  width: 100%; background: transparent; border: 0;
  border-bottom: 1px dashed var(--line);
  color: var(--text); font: inherit;
  padding: 12px 0; min-height: var(--dokun);
}
#screen-kayit .tablo input:focus {
  outline: none; border-bottom-color: var(--primary);
}
#screen-kayit .tablo td.sayi input {
  text-align: right;
  font-family: var(--font-mono); font-variant-numeric: tabular-nums;
}
/* Satırın ikincil bilgisi: "kim getirdi" slotu + parçacı fiyatı.

   ⚠️ 08.09 — BU SATIRIN TARİHİ, AYNI HATANIN İKİ UCU:
     06.09  her parça satırına 26 px'lik iki çip koydum → denetim
            beşini birden ölçtü, çok küçüktü.
     07.09  tek çipe indi, 44 px oldu — ama HER SATIRDA duruyordu ve
            basılı değilken *"tamirci getirdi"* yazıyordu.
     08.09  Cemil: *"Bu konuyu abartmışsin sanki?"*

   Küçültmek de büyütmek de çözüm değildi; asıl soru **her satırda
   görünmesi gerekip gerekmediğiydi.** Gerekmiyor: slot yalnız
   sorulacak bir şey varsa (fiyat yazılmamışsa) ya da söylenecek bir
   şey varsa (müşteri getirmişse) doluyor. */
#screen-kayit .k-ikincil {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  margin-top: 6px;
}
/* ⚠️ 320 px'TE AD ALANI SESSIZCE KIRPILIYORDU (06.09, kuyruk 9).
   Ölçüldü: ad alanı 65 px görünüyor, "Bakım işçiliği" 88 px istiyor —
   usta ekranda "Bakım işç" görüyor ve **eksik olduğunu anlamıyor.**
   `<input>` taşan metni ne sarar ne üç nokta koyar; sessizce keser.
   K-025'in kuralı: kesilen metin, taşan metinden tehlikelidir.

   İki yerden yer açıldı, ikisi de yalnız dar ekranda:
   · tutar sütunu 96 → 74 px ("1.900 ₺" 50 px'e sığıyor)
   · tip rozeti küçülüyor (65 → ~52 px)
   Kazanç ~35 px; ad alanı 65 → ~101 px oluyor.

   375 px ve üstünde hiçbir şey değişmiyor — dar ekranın çözümü geniş
   ekrana bulaşmaz. */
@media (max-width: 359px) {
  #screen-kayit .tablo td.sayi,
  #screen-kayit .tablo th.sayi { width: 74px; }
  #screen-kayit .k-satir .pill {
    padding: 2px 5px;
    font-size: 10px;
    letter-spacing: 0;
  }
}

/* ⚠️ ADIM ŞERİDİ SARMAZ (08.09, ölçüm). `.tab` varsayılanı
   `flex: 1 1 0` — üç sekme eşit genişlikte oluyor ve "2 · Yapılanlar"
   375 px'te İKİ SATIRA sarıyordu: şerit 48 px'ten 76 px'e çıkıyor ve
   ekranın üstünden bir kart boyu yer yiyor. Sekmeler içeriklerine göre
   genişliyor, taşarsa şerit kayıyor — sarmıyor. */
#kAdimSerit { overflow-x: auto; }
#kAdimSerit .tab {
  flex: 1 1 auto; white-space: nowrap; padding-left: 6px; padding-right: 6px;
}

/* ⚠️ 08.09 — ÜSTÜ ÇİZİLİ TUTAR KALKTI (.tutar-disi).
   Cemil: *"Değişen parça fiyatı yerine bilgi olarak sadece
   yazılabilir."* Üstü çizili bir rakam hâlâ bir rakamdır: göz onu
   toplamda arar, bulamaz ve tabloya güveni azalır. Müşteri parçasının
   tutar hücresinde artık rakam değil, bir tire var. */
#screen-kayit .k-tutar-yok {
  color: var(--faint); font-family: var(--font-mono);
}

/* ---- "MÜŞTERİ GETİRDİ" — TEKLİF ve BİLGİ ----
   İkisi de DÜĞME, ikisi de 48 px (K-024: görsel ağırlık ≠ dokunma
   alanı — 06.09'da bu satıra 26 px'lik bir çip koymuştum ve denetim
   beşini birden ölçtü).

   TEKLİF soluk ve noktalı altı çizili: bir bağlantı gibi okunuyor,
   "istersen" diyor. BİLGİ vurgu renginde ve kalın: artık bir durum,
   ve dokunulunca geri alınıyor. */
#screen-kayit .k-getiren-sor,
#screen-kayit .k-getiren-bilgi {
  display: inline-flex; align-items: center;
  min-height: var(--dokun);
  padding: 0; border: 0; background: transparent;
  font-family: var(--font-body); font-size: var(--tip-xs);
  cursor: pointer;
}
#screen-kayit .k-getiren-sor {
  color: var(--muted); text-decoration: underline dotted;
}
#screen-kayit .k-getiren-sor:hover { color: var(--text); }
#screen-kayit .k-getiren-bilgi { color: var(--accent); font-weight: 700; }
/* Fiyat yazılınca teklif düşer — `hidden` tek başına yetmez, çünkü
   display açıkça verilmiş. */
#screen-kayit .k-getiren-sor[hidden] { display: none; }
#screen-kayit .k-alis {
  font-size: var(--tip-xs); color: var(--faint);
  font-family: var(--font-mono);
}
</style>

<script>
/* ⚠️ "TÜR ELLE SEÇİLDİ Mİ" BAYRAĞI KAYDIN ÜSTÜNDE (k.turElle), EKRANIN
   DEĞİL. Önce ekran değişkeni olarak yazmıştım (`var kTurElle`) ve
   `ciz()` her çizimde onu sıfırlıyordu: usta "Tamirat" diyor, sonraki
   harfte metin tahmini yeniden koşuyor ve seçim geri alınıyordu.
   Elle işletince çıktı — hiçbir test bunu görmezdi, çünkü ekran
   "çalışıyor"du.

   Ders: bir SEÇİM, ekranın değil VERİNİN bilgisidir. Ekran değişkeni
   çizimle birlikte ölür; kayıt yaşadığı sürece seçim de yaşamalı. */

/* Fotoğraftan okunan sahte parça listesi. Gerçek okuma bir servise
   bağlanacak; burada gösterilen şey DAVRANIŞ: okunan satır olur ve
   fiyatı BOŞ gelir — okunmamış bir rakamı doluymuş gibi göstermek,
   ustanın kontrol etmediği bir rakamı müşteriye söyletmek olurdu. */
var FOTO_PARCA_ORNEK = [
  ['Triger seti', 0], ['Devirdaim', 0], ['Antifriz 4 lt', 0]
];

/* ⚠️ EKLENEN SATIR GÖRÜNMÜYORDU (16.09 — bu turda çıkan asıl kusur).
   "Parça ekle" düğmesi ADIMLARIN ÜSTÜNDE, her adımda görünüyor; ama
   satır tablosu **2. adımın içinde**. Usta 1. adımdayken düğmeye
   basınca satır ekleniyor ve ekranda HİÇBİR ŞEY OLMUYOR. Üç kez
   basarsa üç görünmez boş satır birikiyor — sonra 2. adıma geçince
   nereden geldiği belli olmayan boş satırlar buluyor.

   Bunu elle denerken görmedim: ekran bir önceki denemeden 2. adımda
   kalmıştı. 49. denetim testi yakaladı — çünkü o, ekranı TEMİZ açıyor.

   Çözüm iki parçalı: önce satırın DURDUĞU adıma geç, sonra odaklan.
   Odak ÇİZİMDEN SONRA veriliyor; önce verilseydi yeni DOM onu silerdi. */
function kSatiraOdaklan(k, i) {
  if (k && k.adim !== 2) kAdimGit(k, 2);
  var e = document.querySelector('#kSatirlar [data-satir-ad="' + i + '"]');
  if (!e) return;
  try { e.focus({ preventScroll: true }); } catch (h) { e.focus(); }
  if (e.scrollIntoView) e.scrollIntoView({ block: 'center' });
}

function kayitToplamCiz(k) {
  var el = document.getElementById('kToplam');
  if (el) el.textContent = tutar(kayitToplami(k)) + ' ₺';
}

/* ================= ADIMLAR (08.09) =================
   Cemil: *"Adımlar birbirini takip etmeli."*

   Üç adım, IS-AKISI.md'nin yedi adımının bu ekrana düşen kısmı:
     1 · İş         → Adım 2 (ne istiyor)
     2 · Yapılanlar → Adım 3-4-5-6
     3 · Teslim     → Adım 7

   ⚠️ ADIM KAYDIN ÜSTÜNDE (k.adim), EKRANIN DEĞİL. Bu dosyanın en
   başındaki dersin aynısı (`k.turElle`): ekran değişkeni çizimle
   birlikte ölür. Usta kayıttan çıkıp araç geçmişine bakıp geri
   gelince, bıraktığı adımda olmalı — başa dönmemeli. */
var K_ADIMLAR = [
  { no: 1, ad: 'İş' },
  { no: 2, ad: 'Yapılanlar' },
  { no: 3, ad: 'Teslim' }
];

function kIsVar(k) { return !!(k.sikayet || '').trim(); }
function kSatirVar(k) { return ((k.satirlar || []).length > 0); }

/* Adım TAMAM MI — şeritteki onay işareti buna bakıyor. */
function kAdimTamam(k, no) {
  if (no === 1) return kIsVar(k);
  if (no === 2) return kSatirVar(k);
  return !!k.teslimTarihi;
}

/* Adıma GİDİLEBİLİR Mİ. Kilit değil, önkoşul: bir sonraki adımın
   anlamı olması için öncekinin bir şey üretmiş olması gerekiyor. */
function kAdimHazir(k, no) {
  if (no === 2) return kIsVar(k) || kSatirVar(k);
  if (no === 3) return kSatirVar(k);
  return true;
}

/* Kaydın şu anki adımı. `k.adim` ustanın seçimi; yoksa VERİDEN
   türetiliyor — eski kayıtlar ve örnek veri de doğru adımda açılsın.
   Seçim artık geçerli değilse (satırlar silinmişse) geri çekiliyor:
   var olmayan bir adımda durmak, boş ekran göstermektir. */
function kAdimNo(k) {
  var no = k.adim ||
    (k.teslimTarihi ? 3 : (kSatirVar(k) ? 2 : (kIsVar(k) ? 2 : 1)));
  while (no > 1 && !kAdimHazir(k, no)) no--;
  return no;
}

/* ⚠️ KAPALI SEKME YOK, KONUŞAN SEKME VAR (K-040.3).
   Hazır olmayan adıma dokunmak hiçbir şey yapmasaydı usta ekranı
   bozuk sanardı — Cemil'in bu turda müşteri listesi için söylediği
   şeyin aynısı: *"Tıklayınca herhangi bir şey yapmıyor."*
   Sekme ne eksik olduğunu söylüyor ve eksiğin durduğu adıma
   götürüyor. */
function kAdimGit(k, no) {
  if (kAdimHazir(k, no)) {
    k.adim = no;
    Ekran.tazele();
    var el = document.getElementById('screen-kayit');
    if (el) el.scrollTop = 0;
    return;
  }
  if (no === 2) {
    k.adim = 1; Ekran.tazele();
    balon('Önce ne yapılacağını yaz.', false, 3000);
    try { document.getElementById('kSikayet').focus(); } catch (x) {}
  } else {
    k.adim = 2; Ekran.tazele();
    balon('Önce yapılanları yaz — en az bir parça ya da işçilik.', false, 3400);
  }
}

/* Teslime hazır mı — EKSİKLERİ SÖYLER, YOLU KAPATMAZ.
   "Fiyat bekleniyor" gerçek bir durumdur (kayıt kartındaki rozet de
   onu diyor); teslimi engellemek, gerçek bir işi yazılıma
   uydurmaya çalışmak olurdu. */
function kEksikler(k) {
  var satirlar = k.satirlar || [];
  var eksik = [];
  var adsiz = satirlar.filter(function (s) { return !(s.ad || '').trim(); }).length;
  if (adsiz) eksik.push(adsiz + ' satırın adı yazılmamış');
  var fiyatsiz = satirlar.filter(function (s) {
    if (s.tip === 'parca' && s.kimGetirdi === 'musteri') return false;
    return !s.fiyat;
  }).length;
  if (fiyatsiz) eksik.push(fiyatsiz + ' satırın tutarı yazılmamış');
  if (k.parcaBekliyor) eksik.push('parça hâlâ "bekliyor" işaretli');
  var h = mesajHedefi(k.plaka);
  if (!h || !h.tel) eksik.push('telefon yok — özet gönderilemez');
  return eksik;
}

/* ⚠️ 06.09 — BU FONKSİYON ARTIK HİÇBİR ŞEY SİLMİYOR (K-037).
   Eskiden müşteri parçasında `fiyat`ı sıfırlıyor, kaybolmasın diye
   `alis`e taşıyordu. İki sorun vardı:

   1. **Tek dokunuş, geri alınamaz kayıp.** "Parçaları müşteri getirdi"
      anahtarını açıp kapatan usta, yazdığı satış fiyatını bir daha
      bulamıyordu. K-032'nin kuralı burada da geçerli: görünmeyen bir
      sonuç doğuran bir dokunuş olmamalı.
   2. **`alis` başka bir şeydir** — BİZİM ödediğimiz. Müşteri kendi
      parçasını getirdiyse biz hiçbir şey ödemedik; oraya parçacının
      teklifini yazmak alanın anlamını bozuyordu.

   S2/K-005 aynen duruyor: müşteri parçası faturaya girmez. Kural artık
   `kayitToplami()`de işliyor — veri korunuyor, TOPLAM karar veriyor. */
function kGetireniAyarla(s, kim) {
  s.kimGetirdi = kim;
}

function kayitCiz() {
  var k = kayitBul(ACIK_KAYIT);
  if (!k) return;
  var a = aracBul(k.plaka);

  document.getElementById('kayitBaslik').innerHTML =
    '<svg class="ico ico-sm"><use href="#' + TUR_IKON[k.tur] + '"></use></svg> ' + TUR_AD[k.tur];

  document.getElementById('kayitKunye').innerHTML =
    '<div class="arac-bas">' + plakaHtml(k.plaka, 'plate-lg') +
      '<div class="veh-title">' + (a ? a.marka + ' ' + a.model : '') +
        (a && a.yil ? ' <span class="yr">' + a.yil + '</span>' : '') + '</div>' +
      '<div class="spec-strip">' +
        (a && a.motor ? '<span class="spec-val">' + a.motor + '</span>' : '') +
        (k.km ? '<span class="spec-sep">·</span><span class="spec-val mono">' +
                k.km + ' km</span>' : '') +
      '</div>' +
    '</div>';

  /* ---- MÜŞTERİ ----
     Ruhsat sahibi FİRMA olabilir; o zaman aranacak kişi başkasıdır
     (A-M2). İkisi de gösteriliyor, ikisi de aranabiliyor. */
  /* ⚠️ SAHİBİ ve İLETİŞİM AYNI DİLDE (Cemil, 07.09: "Servis kaydı
     detay sayfasında sahibi ve iletişim aynı fonttan olsun. Büyük
     olmalı." + "Sahibi yazısından sonra boşluk da olmalı.")

     İkisi farklı bileşenlerden geliyordu: sahibi `.tl-veri` (küçük,
     ikincil), iletişim `.ak-kisi` (araç kartından ödünç). Aynı soruya
     — *"kimi arayacağım"* — iki farklı görünüm veriyorlardı ve
     ikincisi birincisinden büyük duruyordu.

     Artık tek bileşen: rol küçük ve soluk (Sahibi / İletişim), AD
     büyük ve koyu. Rol ile ad arasındaki boşluk `gap` ile veriliyor —
     metin içindeki tek boşluğa güvenmiyor. */
  function kisiSatiri(rol, ad, tel) {
    return '<div class="k-kisi">' +
      '<span class="k-kisi-rol">' + rol + '</span>' +
      '<b class="k-kisi-ad">' + (ad || 'yazılmamış') + '</b>' +
    '</div>' + (tel ? telLinkHtml(tel, ad) : '');
  }
  document.getElementById('kayitMusteri').innerHTML = a
    ? kisiSatiri('Sahibi', a.sahipAd, a.sahipTel) +
      (a.sahipTel ? '' :
        '<p class="plate-hint">Telefon yok — özet ve hatırlatma gönderilemez.</p>') +
      (a.iletisimTel || a.iletisimAd
        ? kisiSatiri('İletişim', a.iletisimAd, a.iletisimTel)
        : '')
    : '<p class="plate-hint">Bu plaka araç listesinde yok.</p>';

  document.getElementById('kSikayet').value = k.sikayet || '';

  /* İŞ TÜRÜ — tahmin edilmiş hâli basılı görünür, elle değiştirilebilir. */
  document.getElementById('kTurGrup').innerHTML =
    ['tamirat', 'bakim', 'ikisi'].map(function (t) {
      return '<button class="cip" data-kayit-tur="' + t + '" aria-pressed="' +
        (k.tur === t) + '">' + TUR_AD[t] + '</button>';
    }).join('');

  /* ---- YAPILANLAR TABLOSU ---- */
  var satirlar = k.satirlar || [];
  document.getElementById('kSatirlar').innerHTML = satirlar.length
    ? '<div class="tablo-sar"><table class="tablo">' +
        '<thead><tr><th>İş</th><th class="sayi">Tutar</th></tr></thead><tbody>' +
        satirlar.map(function (s, i) {
          return '<tr class="kaydirilir" data-kaydir="' + i + '" tabindex="0"' +
              ' aria-label="' + (s.ad || 'satır') + ' — silmek için sola kaydır">' +
            '<td>' +
              '<span class="k-satir">' +
                /* ⚠️ ROZET ARTIK DÜĞME (16.09 — Cemil: "parça ekle,
                   işçilik ekle düzenle vb daha kolay olmalı").
                   Önce yalnız bir etiketti: usta yanlış tipi seçtiyse
                   satırı SİLİP yeniden ekliyordu — yazdığı ad ve tutar
                   da onunla gidiyordu. Tek dokunuşla dönüyor. */
                '<button class="pill ' + (s.tip === 'parca' ? 'info' : 'muted') +
                  ' k-tip" data-satir-tip="' + i + '"' +
                  ' title="Dokun — ' + (s.tip === 'parca' ? 'işçiliğe' : 'parçaya') + ' çevir"' +
                  ' aria-label="Satır tipi: ' + (s.tip === 'parca' ? 'parça' : 'işçilik') +
                  ' — değiştirmek için dokun">' +
                  (s.tip === 'parca' ? 'PARÇA' : 'İŞÇİLİK') + '</button>' +
                '<input value="' + (s.ad || '').replace(/"/g, '&quot;') +
                  '" data-satir-ad="' + i + '" placeholder="' +
                  (s.tip === 'parca' ? 'Parça adı' : 'Ne yapıldı') +
                  '" aria-label="Satır adı" />' +
              '</span>' +
              /* ⚠️ KOL B GERİ KONDU (06.09, ölü uç turu).
                 Dün tabloyu yazarken bu çipler düştü ve fark etmedim:
                 `parca-sor` iki parçacıya soruyor, `s.sorulan`u
                 yazıyor, balonu *"cevaplar kayda düşecek"* diyor — ama
                 kaydı okuyan hiçbir şey kalmamıştı. `SelectedReplyId`
                 (modelde duran, akışta karşılığı olan bir alan) hiç
                 dolmuyordu: usta iki cevap aldığında hangisini
                 kullandığını yazacak yer yoktu.

                 TEK PARÇACIYA SORULDUYSA ÇIKMAZ — ana yol kalınlaşmaz.
                 Satırı uzatıyor, evet; ama yalnız uzatması gereken
                 durumda. */
              ((s.sorulan || []).length > 1
                ? '<span class="k-ikincil">Cevap kimden geldi?' +
                    s.sorulan.map(function (pi) {
                      return '<button class="cip" data-kaynak="' + i + '|' + pi +
                        '" aria-pressed="' + (s.kaynak === pi) + '">' +
                        PARCACILAR[pi].ad + '</button>';
                    }).join('') +
                  '</span>'
                : '') +
              /* ⚠️ 08.09 — "KİM GETİRDİ" TEK SLOTA İNDİ (Cemil:
                 *"Her yere parçayı müşteri getirdi bilgisini yazma. Bu
                 lazım olursa kullanılacak bir özellik. Değişen parça
                 fiyatı yerine bilgi olarak sadece yazılabilir ve sonra
                 servis kaydında bilgi olarak görünecek."*).

                 Önceki hâlde her parça satırında BASILI OLMAYAN bir çip
                 duruyordu ve üstünde *"tamirci getirdi"* yazıyordu —
                 yani hiçbir şey söylemeyen bir cümle, on satırda on kez.
                 Ustanın okuduğu şey gürültüydü.

                 ARTIK TEK SLOT, ÜÇ HÂLİ VAR:
                   müşteri getirdiyse → BİLGİ. Dokunulunca geri alınır.
                   fiyat yazılmamışsa → TEKLİF. "müşteri getirdi" yazan
                                        küçük, soluk bir bağlantı.
                   fiyat yazılmışsa   → HİÇBİR ŞEY. Parayı sen
                                        alıyorsan parçayı sen
                                        getirmişsindir; soru düşmüştür.

                 A-M13'ün cevabı (*"balatayı müşteri getirdi, yağı ben
                 aldım"*) korunuyor: işaret HÂLÂ SATIR BAŞINA. Değişen
                 tek şey, sorulmadığı zaman görünmemesi. */
              (s.tip === 'parca' && (s.kimGetirdi === 'musteri' || !s.fiyat || s.alis)
                ? '<span class="k-ikincil">' +
                    (s.kimGetirdi === 'musteri'
                      ? '<button class="k-getiren-bilgi" data-getiren="' + i + '"' +
                          ' title="Dokun — tutar yazmaya dön">müşteri getirdi</button>'
                      : (!s.fiyat
                          ? '<button class="k-getiren-sor" data-getiren="' + i + '">' +
                              'müşteri getirdi</button>'
                          : '')) +
                    /* Parçacıdan gelen fiyat MÜŞTERİYE SÖYLENECEK RAKAM
                       DEĞİL: soluk ve küçük durur. */
                    (s.alis ? '<span class="k-alis">parçacı ' + tutar(s.alis) + ' ₺</span>' : '') +
                  '</span>'
                : '') +
            '</td>' +
            /* ⚠️ MÜŞTERİ PARÇASINDA TUTAR HÜCRESİ BOŞ (08.09).
               Eskiden rakam yazılı ama üstü çizili duruyordu. Cemil:
               *"Değişen parça fiyatı yerine bilgi olarak sadece
               yazılabilir."* Üstü çizili bir rakam hâlâ bir rakamdır —
               göz onu toplamda arıyor, bulamıyor.

               VERİ SİLİNMİYOR (K-037): `s.fiyat` kayıtta duruyor ve
               işaret geri alınınca aynen geliyor. Görünmeyen şey rakam,
               kaybolan şey değil. */
            (s.tip === 'parca' && s.kimGetirdi === 'musteri'
              ? '<td class="sayi"><span class="k-tutar-yok">—</span></td>'
              : '<td class="sayi">' +
                  '<input value="' + (s.fiyat ? tutar(s.fiyat) : '') +
                    '" data-satir-fiyat="' + i + '" data-giris="tutar" inputmode="numeric"' +
                    ' placeholder="0" aria-label="Tutar" /></td>') +
          '</tr>';
        }).join('') +
        '<tr class="genel"><td>Toplam</td>' +
          '<td class="sayi" id="kToplam">' + tutar(kayitToplami(k)) + ' ₺</td></tr>' +
        '</tbody></table></div>'
    : bosDurumHtml('i-clipboard-list', 'Henüz bir şey yazılmadı',
        'Parça ya da işçilik ekle. Parçacının listesini fotoğraflayarak ' +
        'da girebilirsin. Satırı silmek için sola kaydır.');

  /* ---- ADIM ŞERİDİ + PANOLAR ---- */
  var adim = kAdimNo(k);
  document.getElementById('kAdimSerit').innerHTML = K_ADIMLAR.map(function (a) {
    return '<button class="tab" id="kAdimTab' + a.no + '" data-kadim="' + a.no + '"' +
      ' role="tab" aria-selected="' + (adim === a.no) + '"' +
      ' aria-controls="kAdim' + a.no + '">' +
      (kAdimTamam(k, a.no)
        ? '<svg class="ico ico-sm"><use href="#i-check"></use></svg>' : '') +
      a.no + ' · ' + a.ad +
    '</button>';
  }).join('');
  [1, 2, 3].forEach(function (n) {
    document.getElementById('kAdim' + n).hidden = (adim !== n);
  });

  /* ---- SÜREÇ — her adımda, ortak nesneden ---- */
  document.getElementById('kSurec').innerHTML = surecHtml(k);

  /* ---- ADIM 3 · TESLİM ÖZETİ ---- */
  if (adim === 3) {
    var sat = k.satirlar || [];
    var eksik = kEksikler(k);
    document.getElementById('kTeslimOzet').innerHTML =
      '<div class="tutar-serit">' +
        '<div class="tutar-sat"><span>' + sat.length + ' kalem</span>' +
          '<span class="tv">' + tutar(kayitToplami(k)) + ' ₺</span></div>' +
      '</div>' +
      (eksik.length
        ? '<div class="notice warn" style="margin-top:12px">' +
            '<span class="n-ic"><svg class="ico ico-sm">' +
              '<use href="#i-triangle-alert"></use></svg></span>' +
            '<span class="n-body">Eksik görünen: ' + eksik.join(' · ') +
              '. Yine de teslim edebilirsin.</span></div>'
        : '<p class="plate-hint">Her şey yazılmış görünüyor.</p>');
  }

  /* ---- PARÇA BEKLİYOR ---- */
  document.getElementById('kBekliyor')
    .setAttribute('aria-pressed', String(!!k.parcaBekliyor));
  document.getElementById('kBekliyorGovde').innerHTML = k.parcaBekliyor
    ? '<div class="notice warn">' +
        '<span class="n-ic"><svg class="ico ico-sm"><use href="#i-clock"></use></svg></span>' +
        '<span class="n-body">Bu araç <b>parça bekliyor</b>. Servis kayıtları ' +
          'listesinde de böyle görünüyor.</span></div>' +
      /* ⚠️ A-M15 CEVAPLANDI (07.09): *"İsterse, evet."* — müşterinin
         özet sayfasında görünmesi ZORUNLU değil, USTANIN SEÇİMİ.
         K-038.3'te varsayım olarak "hep söylenir" yazmıştım; Cemil
         seçenek istedi. Bazı usta gecikmeyi duyurmak istemeyebilir ve
         bu onun müşterisiyle arasındaki iş. */
      '<div class="cip-grup" style="margin-top:10px">' +
        '<button class="cip" id="kBekliyorMusteriye" aria-pressed="' +
          (!!k.bekliyorMusteriye) + '">Müşterinin sayfasında da göster</button>' +
      '</div>' +
      '<button class="btn btn-ghost" id="kBekliyorMesaj" style="margin-top:10px">' +
        '<svg class="ico"><use href="#i-message-square"></use></svg>' +
        ' Müşteriye haber ver</button>'
    : '<p class="plate-hint">Parça sipariş edildi ve yolda ise işaretle — ' +
      'müşteriye tek dokunuşla haber verebilirsin.</p>';
}

/* ⚠️ ÇİZİM, KARARI SİLMEZ (06.09 — bu hatayı BİR TURDA İKİ KEZ yaptım).
   Önce `ciz` içinde `kSilinecek = null` vardı. `Ekran.tazele()` ciz()'i
   çağırıyor; kaydırma onayı açmak için tazeliyor; tazeleme onayı
   siliyordu. Sonuç: satır kayıyor, hiçbir şey açılmıyor — K-032'de
   yaşadığım işaret hatasının birebir aynısı, başka sebeple.

   Aynı gün aynı hatayı `kTurElle` ile de yaptım (o, kaydın üstüne
   taşındı). İkisini de hiçbir test yakalamadı; elle işletince çıktı.

   ⚠️ İLK ÇÖZÜMÜM YETERSİZDİ: `kCizilenKayit` diye bir bekçi koyup
   "kayıt değiştiyse sıfırla" demiştim. Doğru çalışıyordu ama sorunun
   KENDİSİNİ çözmüyordu — `ciz` hâlâ açılış işi yapıyordu ve aynı tuzak
   öteki ekranlarda duruyordu. Çekirdeğe `ac` kancası eklendi (K-040);
   sıfırlama oraya taşındı ve bekçi gereksiz kaldı. */
Ekran.tanim('kayit', {
  ciz: kayitCiz
});

/* Kaydırma davranışı ÇEKİRDEKTE (Kaydirma); burada yalnız bu ekranda
   ne anlama geldiği yazıyor: hangi satır silinecek. */
/* ⚠️ 07.09 — BU TABLO DA DOĞRUDAN SİLİYOR.
   Cemil yalnız GİDER için söyledi (*"Gideri sola kaydırdığında sil"*),
   ama aynı hareket iki tabloda var. İkisi farklı davranırsa **aynı
   jest iki anlama gelir** ve usta hangisinde ne olacağını akılda
   tutmak zorunda kalır. K-040'ta çekmece/katman için, K-042'de
   header/footer için verdiğim kararın aynısı: bir hareket, bir anlam.

   Cemil onayına açık (A-M19): gider için istediğini kayıt satırına da
   taşıdım. */
Kaydirma.tanim('kayit', function (anahtar) {
  var k = kayitBul(ACIK_KAYIT);
  if (!k) return;
  var i = parseInt(anahtar, 10);
  var silinen = k.satirlar[i];
  if (!silinen) return;
  k.satirlar.splice(i, 1);
  Ekran.tazele();
  balonGeriAl((silinen.ad || 'Satır') + ' silindi.', function () {
    k.satirlar.splice(i, 0, silinen);
    Ekran.tazele();
  });
});

document.addEventListener('click', function (e) {
  var k = kayitBul(ACIK_KAYIT);
  if (!k) return;
  var t = e.target.closest('button, [data-arac-ac]');
  if (!t) return;

  if (t.getAttribute('data-arac-ac')) { ACIK_PLAKA = k.plaka; Ekran.ac('arac'); return; }

  if (t.id === 'kParcaEkle') {
    k.satirlar.push({ tip: 'parca', ad: '', fiyat: 0, alis: 0,
                      kimGetirdi: 'tamirci', marka: '', kod: '', tanim: 'tanimlanamadi' });
    Ekran.tazele(); kSatiraOdaklan(k, k.satirlar.length - 1); return;
  }
  if (t.id === 'kIscilikEkle') {
    k.satirlar.push({ tip: 'iscilik', ad: '', fiyat: 0, alis: 0, kimGetirdi: '' });
    Ekran.tazele(); kSatiraOdaklan(k, k.satirlar.length - 1); return;
  }

  /* Tip çevirme — ad ve tutar KORUNUR. */
  var tipNo = t.getAttribute('data-satir-tip');
  if (tipNo !== null) {
    var st = k.satirlar[parseInt(tipNo, 10)];
    if (st) {
      st.tip = (st.tip === 'parca') ? 'iscilik' : 'parca';
      /* İşçiliğin parçacısı olmaz: parçaya özel alanlar temizlenir,
         geri çevrilirse boş başlar. Kalsaydı işçilik satırında
         "parçacı 1450 ₺" yazardı. */
      if (st.tip === 'iscilik') { st.kimGetirdi = ''; st.alis = 0; st.sorulan = null; }
      else { st.kimGetirdi = 'tamirci'; }
      Ekran.tazele(); kSatiraOdaklan(k, parseInt(tipNo, 10));
    }
    return;
  }

  /* FOTOĞRAFTAN PARÇA LİSTESİ — okunanlar satır olur, fiyatları BOŞ. */
  if (t.id === 'kFotoParca') {
    FOTO_PARCA_ORNEK.forEach(function (p) {
      k.satirlar.push({ tip: 'parca', ad: p[0], fiyat: p[1], alis: 0,
        kimGetirdi: 'tamirci', marka: '', kod: '', tanim: 'tanimlanamadi' });
    });
    balon(FOTO_PARCA_ORNEK.length + ' parça okundu — fiyatlarını yaz.', false, 3000);
    /* Aynı tuzak burada da vardı: balon "fiyatlarını yaz" diyor ama
       1. adımdayken yazılacak satırlar görünmüyordu. */
    Ekran.tazele(); kSatiraOdaklan(k, k.satirlar.length - FOTO_PARCA_ORNEK.length);
    return;
  }

  /* ADIM ŞERİDİ ve "devam" düğmeleri AYNI YOLU kullanıyor (kAdimGit):
     iki ayrı yol olsaydı biri önkoşulu sorar öteki sormazdı. */
  var ad = t.getAttribute('data-kadim');
  if (ad) { kAdimGit(k, parseInt(ad, 10)); return; }
  if (t.id === 'kDevam1') { kAdimGit(k, 2); return; }
  if (t.id === 'kDevam2') { kAdimGit(k, 3); return; }

  if (t.id === 'kBekliyor') {
    k.parcaBekliyor = !k.parcaBekliyor;
    /* ⚠️ ZAMANSIZ BİR OLAY SIRAYA GİREMEZ (14.09). Bayrak kalkıyordu
       ama NE ZAMAN kalktığı hiçbir yerde yazmıyordu; süreç şeridi onu
       sıraya koyamazdı. Tek yeni alan bu — yeni bir DURUM değil
       (K-004 duruyor), var olan bayrağın tarihi. */
    k.bekliyorTarihi = k.parcaBekliyor ? bugunMetin() : null;
    /* Bayrak kapanınca müşteriye gösterme seçimi de anlamını yitirir. */
    if (!k.parcaBekliyor) k.bekliyorMusteriye = false;
    Ekran.tazele(); return;
  }
  if (t.id === 'kBekliyorMusteriye') {
    k.bekliyorMusteriye = !k.bekliyorMusteriye;
    Ekran.tazele(); return;
  }
  if (t.id === 'kBekliyorMesaj') {
    var hb = mesajHedefi(k.plaka);
    if (!hb || !hb.tel) {
      balon('Telefon yok — haber verilemez. Araç kaydına telefon ekle.', false, 3200);
      return;
    }
    MESAJ_HEDEF = { plaka: k.plaka, sablon: 'bekliyor' };
    Ekran.ac('mesaj'); return;
  }

  if (t.id === 'kSikayetMik' || t.id === 'kSesleEkle') {
    sesleAc('kayit-icinde'); return;
  }

  /* K-003: onay bir AKIŞ değil, bir EYLEM. Kayıt beklemeye geçmez. */
  if (t.id === 'kOzetGonder') {
    var hedef = mesajHedefi(k.plaka);
    if (!hedef || !hedef.tel) {
      balon('Telefon yok — özet gönderilemez. Araç kaydına telefon ekle.', false, 3200);
      return;
    }
    MESAJ_HEDEF = { plaka: k.plaka, sablon: 'ozet' };
    Ekran.ac('mesaj'); return;
  }

  var tur = t.getAttribute('data-kayit-tur');
  if (tur) { k.tur = tur; k.turElle = true; Ekran.tazele(); return; }

  /* Hangi parçacının cevabı kullanıldı (Kol B). Seçim SATIRA yazılır,
     ekrana değil: aynı kayıtta iki parça iki ayrı parçacıdan gelebilir. */
  var kay = t.getAttribute('data-kaynak');
  if (kay) {
    var pk = kay.split('|');
    k.satirlar[parseInt(pk[0], 10)].kaynak = parseInt(pk[1], 10);
    Ekran.tazele(); return;
  }

  /* Satır başına "kim getirdi" — tek çip, dokununca öbürüne geçer. */
  var g = t.getAttribute('data-getiren');
  if (g !== null && g !== undefined && g !== '') {
    var sg = k.satirlar[parseInt(g, 10)];
    kGetireniAyarla(sg, sg.kimGetirdi === 'musteri' ? 'tamirci' : 'musteri');
    Ekran.tazele(); return;
  }

});

document.addEventListener('input', function (e) {
  var k = kayitBul(ACIK_KAYIT);
  if (!k || !e.target || !e.target.getAttribute) return;

  if (e.target.id === 'kSikayet') {
    k.sikayet = e.target.value;
    /* Tür metinden TAKİP EDİLİR — usta elle seçene kadar. Elle seçim
       tahmini kalıcı olarak yener. */
    if (!k.turElle) {
      var yeniTur = isTuruTahmin(k.sikayet);
      if (yeniTur !== k.tur) {
        k.tur = yeniTur;
        document.getElementById('kayitBaslik').innerHTML =
          '<svg class="ico ico-sm"><use href="#' + TUR_IKON[k.tur] +
          '"></use></svg> ' + TUR_AD[k.tur];
        document.getElementById('kTurGrup').innerHTML =
          ['tamirat', 'bakim', 'ikisi'].map(function (t) {
            return '<button class="cip" data-kayit-tur="' + t + '" aria-pressed="' +
              (k.tur === t) + '">' + TUR_AD[t] + '</button>';
          }).join('');
      }
    }
    return;
  }

  var ad = e.target.getAttribute('data-satir-ad');
  if (ad !== null) { k.satirlar[parseInt(ad, 10)].ad = e.target.value; return; }

  var f = e.target.getAttribute('data-satir-fiyat');
  if (f !== null) {
    var sf = k.satirlar[parseInt(f, 10)];
    sf.fiyat = parseInt((e.target.value || '').replace(/[^0-9]/g, ''), 10) || 0;
    /* Yalnız toplamı tazele — alanı yeniden çizmek imleci kaçırır. */
    kayitToplamCiz(k);
    /* ⚠️ TEKLİF, YAZILAN RAKAMLA BİRLİKTE DÜŞER. Tam çizim yapılsaydı
       imleç kaçardı; o yüzden bu tek öğe elle gizleniyor. Rakam
       silinirse geri geliyor — kural tek cümle: fiyat varsa soru yok. */
    var satirEl = e.target.closest('tr');
    var teklif = satirEl ? satirEl.querySelector('.k-getiren-sor') : null;
    if (teklif) teklif.hidden = !!sf.fiyat;
  }
});

/* ================= SESLİ İŞLER — bu ekranın şeması (Tur 8.3) =================
   Kayıt ekranı üç işini kendisi bildiriyor; ses ekranı bunları tanır,
   şemadan onay ekranı çizer ve buradaki `uygula`yı çağırır.
   Öncesi: üç iş, ses ekranında üç ayrı yerde (çözümle · özet · uygula)
   elle yazılmış dallardı. */

/* Söylenenden satırın ADI — tutar ve komut kelimeleri atılır.
   kelimeleriAt kullanılıyor, \b DEĞİL: /\bde\b/ "değişecek"i
   "ğişecek" yapıyordu (K-018, çekirdekteki uyarıya bak). */
function sesSatirAdi(c) {
  return kelimeleriAt(sesTutarsiz(c.metin),
    ['parça', 'parca', 'işçilik', 'iscilik', 'da', 'de', 'ekle',
     'yap', 'oldu', 'olsun', 'fiyat', 'fiyatı', 'fiyati',
     'güncelle', 'guncelle']);
}

/* ⚠️ AÇIK KAYITTA SES ÜÇ İŞ YAPIYOR (14.09 — Cemil: "Bunlar parça
   olabilir, işçilik olabilir. Fiyat güncellenebilir. Teslime
   edilebilir."). SIRA DAR OLANDAN GENİŞE: teslim (60, teslim ekranında)
   → fiyat güncelleme (65) → satır ekleme (VARSAYILAN). Ters sırada
   "teslim ettim nakit aldım" kayda "teslim ettim" diye satır eklerdi. */

/* FİYAT GÜNCELLEME — söylenen ad VAR OLAN bir satıra uyuyorsa.
   ⚠️ TEK ADAY KURALI (A-M27'nin aynısı): iki satır birden uyuyorsa
   hangisi olduğunu bilmiyoruz demektir — o zaman güncelleme YOK, yeni
   satır eklenir ve usta görür. Tahmin etmek, ustanın yazdığı rakamı
   sessizce değiştirmenin yoludur. */
Islem.tanim('fiyat-guncelle', {
  ekran: 'kayit', baglam: ['kayit-icinde'], oncelik: 65,
  baslik: 'Satırın fiyatı değişecek',
  eylem: 'Fiyatı güncelle',
  alanlar: [
    { ad: 'satir', etiket: 'Ne', tip: 'satir', zorunlu: true },
    { ad: 'simdiki', etiket: 'Şimdiki', turet: function (o) {
        return o.satir.fiyat ? tutar(o.satir.fiyat) + ' ₺' : '— (boş)'; } },
    { ad: 'fiyat', etiket: 'Yeni', tip: 'para', zorunlu: true }
  ],
  baglamda: function (c) {
    var k = c.kayit, tutarR = sesTutarBul(c.d), ad = sesSatirAdi(c);
    if (!k || !tutarR || !ad) return null;
    var adN = norm(ad), uyan = [];
    (k.satirlar || []).forEach(function (s, i) {
      var sN = norm(s.ad || '');
      if (sN.length < 3 || adN.length < 3) return;
      if (sN === adN || sN.indexOf(adN) >= 0 || adN.indexOf(sN) >= 0) {
        uyan.push({ satir: s, indeks: i });
      }
    });
    if (uyan.length !== 1) return null;
    return { tur: 'fiyat-guncelle', kayit: k, indeks: uyan[0].indeks,
             satir: uyan[0].satir, fiyat: tutarR };
  },
  /* Satır nesnesi kaydın içinde duruyor; indeks de taşınıyor ki aynı
     adı taşıyan iki satır olsa bile doğru olan değişsin. */
  uygula: function (o) {
    var gk = kayitBul(o.kayit.id);
    var gs = gk && gk.satirlar ? gk.satirlar[o.indeks] : null;
    if (!gs) { balon('Satır bulunamadı.', false, 2600); return; }
    gs.fiyat = o.fiyat;
    ACIK_KAYIT = gk.id;
    balon((gs.ad || 'Satır') + ' → ' + tutar(o.fiyat) + ' ₺', false, 2800);
    Ekran.ac('kayit');
  }
});

/* SATIR EKLE — açık kaydın VARSAYILAN işi. Başka bir iş tanınırsa o asıl
   olur, bu ÖNERİ olarak durur (7.3); tanınmazsa bu olur.
   ⚠️ 16.09'a kadar bu dal bir çöplüktü: kayıt açıkken söylenen HER
   cümle ("servistekileri göster", "bugün ne kadar tahsilat") bir
   PARÇA oluyordu. */
Islem.tanim('satir-ekle', {
  ekran: 'kayit', baglam: ['kayit-icinde'], varsayilan: true,
  baslik: 'Açık kayda satır eklenecek',
  eylem: 'Satırı ekle',
  alanlar: [
    { ad: 'tip', etiket: 'Tür', tip: 'secim', zorunlu: true,
      secenek: { parca: 'Parça', iscilik: 'İşçilik' } },
    { ad: 'ad', etiket: 'Ne', tip: 'metin', zorunlu: true },
    { ad: 'fiyat', etiket: 'Tutar', tip: 'para', bos: '— (sonra yazılır)' }
  ],
  baglamda: function (c) {
    if (!c.kayitId) return null;
    var iscilikMi = c.d.indexOf('iscilik') >= 0;
    var ad = sesSatirAdi(c);
    /* "işçilik 750 lira" dendiğinde geriye ad kalmıyor — boş bırakmak
       yerine türün kendi adı yazılır, usta gerekirse düzeltir. */
    return { tur: 'satir-ekle', ad: ad || (iscilikMi ? 'İşçilik' : 'Parça'),
             tip: iscilikMi ? 'iscilik' : 'parca', fiyat: sesTutarBul(c.d) };
  },
  /* ⚠️ `alis: 0` BİLEREK DURUYOR — 8.3 davranış değiştirmez. Bilinmeyen
     alış 0 değil null olmalı (K-055.2); düzeltmesi 8.2'nin işi. */
  uygula: function (o) {
    var k = kayitBul(ACIK_KAYIT);
    if (!k) { balon('Açık kayıt yok.'); return; }
    k.satirlar.push({ tip: o.tip, ad: o.ad, fiyat: o.fiyat || 0, alis: 0,
      kimGetirdi: o.tip === 'parca' ? 'tamirci' : '',
      marka: '', kod: '', tanim: 'tanimlanamadi' });
    balon('Satır eklendi — fiyatını yaz.', false, 2800);
    Ekran.ac('kayit');
  }
});

/* SERVİS KAYDI AÇ — kayıtlı araç. Kayıtlı değilse aynı cümle
   yeni-arac'a (ruhsat ekranı, öncelik 70) düşer; bu en geniş kalıp,
   o yüzden en son denenir. */
Islem.tanim('servis-ac', {
  ekran: 'kayit', baglam: ['servis-ekle'], oncelik: 80,
  baslik: 'Servis kaydı açılacak',
  eylem: 'Kaydı aç',
  alanlar: [
    { ad: 'plaka', etiket: 'Araç', tip: 'plaka', aracla: true, zorunlu: true },
    { ad: 'isTuru', etiket: 'İş türü', tip: 'secim', secenek: SES_IS_TURU },
    { ad: 'is', etiket: 'Ne istiyor', tip: 'metin', bos: '— (sonra yazılır)' },
    { ad: 'km', etiket: 'Kilometre', tip: 'km', bosGizle: true }
  ],
  tani: function (c) {
    if (!c.p || !c.arac) return null;
    var s = sesServisOku(c);
    return { tur: 'servis-ac', plaka: c.p.plaka, arac: c.arac, isTuru: s.isTuru,
             km: s.km, is: s.is };
  },
  uygula: function (o) {
    var yeni = { id: KAYITLAR.length + 1, plaka: o.plaka, tur: o.isTuru,
      km: o.isTuru === 'bakim' ? o.km : '', sikayet: o.is || '',
      acilis: bugunMetin(), teslimTarihi: null, odemeYolu: null,
      hatirlatmaTarihi: null, hatirlatmaGonderildi: false,
      parcaBekliyor: false, bekliyorMusteriye: false, satirlar: [] };
    KAYITLAR.push(yeni); ACIK_KAYIT = yeni.id;
    balon('Kayıt açıldı — yanlış varsa düzelt.', false, 3000);
    Ekran.ac('kayit');
  }
});
</script>
