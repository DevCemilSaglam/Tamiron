<!-- ekran: kayitlar · SERVİS KAYITLARI
     Eski ana ekranın devamı. Ana ekran menüye dönünce "içerideki
     araçlar" listesi buraya taşındı ve genişledi: artık teslim
     edilmişler de görünüyor.

     ⚠️ 05.09 — LİSTE ARAÇ KARTI DİLİNE GEÇTİ (Cemil: "Servis kayıtları
     araç listelemesi gibi olsun. Araç bilgileri belirgin olacak.
     Sonra altına Tamirat, Bakım veya Tamirat + Bakım yazabilir.").
     Usta iki listede iki ayrı okuma alışkanlığı kurmasın: plaka aynı
     yerde, marka/model aynı yerde, renk aynı yerde.

     ⚠️ K-004 DURUYOR: tek durum alanı teslimTarihi. "İçeride" bir
     DURUM değil, o alandan TÜRETİLEN bir görünüm — süzgeç kalktı ama
     bilgi kalkmadı: içerideki kayıtlar ÜSTTE ve ÇERÇEVESİ FARKLI.

     BİLEŞENLER: .screen-head .eyebrow .eb-say · .search-box
     · .arac-kart (ortak kayitKartiHtml) · .bos-durum. -->
<section class="screen" id="screen-kayitlar">

  <div class="screen-head">
    <span class="eyebrow">
      <svg class="ico ico-sm"><use href="#i-clipboard-list"></use></svg> Servis kayıtları
      <span class="eb-say" id="kytSay"></span>
    </span>
  </div>

  <!-- ⚠️ 05.09 — ÜSTTEKİ "Yeni servis kaydı" DÜĞMESİ VE SÜZGEÇ KALKTI
       (Cemil: "Üstte yeni servis kaydı buttonunu kaldır. İçeride
       teslim edilmiş filtresini kaldır.").

       Düğme neden gereksizdi: menüde zaten "Servis kaydı ekle" satırı
       var ve bu ekrana da oradan geliniyor. Aynı işi iki yerde
       göstermek, "hangisinden gireceğim" sorusunu doğuruyordu — 03.09'da
       "Araç kaydı" menü maddesi tam bu sebeple kalkmıştı.

       Süzgeç neden gereksizdi: liste artık araç kartı dilini kullanıyor
       ve İÇERİDEKİLER ÜSTTE, ÇERÇEVESİ FARKLI duruyor (araçlar
       listesindeki kural). Süzgeç, çerçevenin zaten söylediği şeyi
       ikinci kez soruyordu. K-004 duruyor: "içeride" bir DURUM değil,
       teslimTarihi'nden türetilen bir görünüm. -->

  <div class="search-box" id="kytArama">
    <svg class="ico"><use href="#i-search"></use></svg>
    <input type="search" id="kytQ" placeholder="Plaka ya da yapılan iş…"
           autocomplete="off" aria-label="Kayıtlarda ara" />
    <button class="clear" id="kytQTemiz" aria-label="Aramayı temizle">
      <svg class="ico ico-sm"><use href="#i-x"></use></svg>
    </button>
    <button class="daire-btn ghost" data-sesle="kayitlar" aria-label="Kayıtlarda sesle ara">
      <svg class="ico"><use href="#i-mic"></use></svg>
    </button>
  </div>

  <div id="kytListe"></div>

</section>

<script>

Ekran.tanim('kayitlar', {
  ciz: function () {
    /* Sesten gelen arama: "balata ara" ya da "içeridekileri göster". */
    if (ARAMA_TERIMI && ARAMA_TERIMI.hedef === 'kayitlar') {
      document.getElementById('kytQ').value = ARAMA_TERIMI.terim || '';
      ARAMA_TERIMI = null;
    }
    var q = norm((document.getElementById('kytQ') || {}).value || '');

    /* Arama araç bilgilerinde de çalışır: liste artık marka ve sahibi
       GÖSTERDİĞİ için ustanın onları araması beklenir. Gösterilen bir
       şeyin aranamaması, ustaya "yok" dedirtir. */
    var liste = KAYITLAR.filter(function (k) {
      if (!q) return true;
      var a = aracBul(k.plaka) || {};
      return norm(k.plaka + ' ' + (k.sikayet || '') + ' ' + TUR_AD[k.tur] + ' ' +
                  (a.marka || '') + ' ' + (a.model || '') + ' ' +
                  (a.sahipAd || '')).indexOf(q) >= 0;
    });

    /* SIRA ARAÇ LİSTESİYLE AYNI (05.09): içeridekiler üstte, sonra en
       yenisi. Süzgeç kalktı; sıra ve çerçeve onun işini yapıyor. */
    liste = liste.slice().reverse().sort(function (x, y) {
      return (y.teslimTarihi ? 0 : 1) - (x.teslimTarihi ? 0 : 1);
    });

    var icerdeSay = liste.filter(function (k) { return !k.teslimTarihi; }).length;
    document.getElementById('kytSay').textContent = q
      ? liste.length + ' bulundu'
      : (icerdeSay ? icerdeSay + ' serviste · ' + liste.length + ' kayıt'
                   : liste.length + ' kayıt');
    document.getElementById('kytArama').classList.toggle('filled', !!q);

    document.getElementById('kytListe').innerHTML = liste.length
      ? liste.map(kayitKartiHtml).join('')
      : bosDurumHtml('i-clipboard-list',
          q ? 'Eşleşen kayıt yok' : 'Kayıt yok',
          q ? 'Plakanın, markanın, sahibin ya da işin bir kısmını yazman yeter.'
            : 'İlk işi menüdeki "Servis kaydı ekle"den aç.');
  }
});

document.addEventListener('click', function (e) {
  if (e.target.closest('#kytQTemiz')) {
    document.getElementById('kytQ').value = ''; Ekran.tazele();
  }
});
document.addEventListener('input', function (e) {
  if (e.target && e.target.id === 'kytQ') Ekran.tazele();
});
</script>
