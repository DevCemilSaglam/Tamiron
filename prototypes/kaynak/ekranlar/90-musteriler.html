<!-- ekran: musteriler · MÜŞTERİLER
     03.09'da menüden geldi.

     ⚠️ MÜŞTERİ TABLOSU YOK VE AÇILMADI. VERI-MODELI'nde Customer
     kasıtlı olarak yok — müşteri aracın üstünde duruyor (sahipAd,
     sahipTel). Bu ekran o veriden TÜRETİYOR: aynı ad+telefon tek
     satırda toplanıyor, araçları altında sıralanıyor.

     Neden tablo açılmadı: v1'de Party/Contact/VehicleContact üç
     tablolu bir müşteri dünyası vardı ve tamircinin "karmaşık" dediği
     yığının içindeydi. Ekran gerekliydi, tablo değil.

     BUNUN BEDELİ AÇIK: aynı kişinin iki aracında adı farklı yazılmışsa
     iki müşteri görünür. Birleştirme yok. Tamirci bundan şikâyet
     ederse tablo o zaman konuşulur (A-M1).

     ⚠️ 06.09 — LİSTE YENİDEN DÜZENLENDİ (Cemil: "Müşteriler listesini
     düzenle, plaka belli olsun. Plaka listelerken göstermesin. Bu alanı
     tekrar düzenle.").

     NE OLMUŞTU: müşterinin araçları en altta, `.cip` DÜĞMELERİNİN
     içinde plaka bileşeni olarak duruyordu. Çip bir SEÇİM aracıdır —
     süzgeç, şablon, tür seçimi hep çip. Plakayı çipin içine koyunca
     iki şey birden bozuldu: plaka "seçilecek bir şey" gibi göründü ve
     çipin kendi çerçevesi plakanın çerçevesiyle iç içe girdi. Aynı
     satırda "Mesaj" çipi de vardı; usta için plaka ile mesaj düğmesi
     aynı cinsten iki nesne gibi duruyordu.

     06.09'da müşteri bir KART olmuştu: ad, telefon, ayracın altında
     araç satırları, en altta mesaj düğmesi.

     ⚠️ 08.09 — O KART SATIRA İNDİ (Cemil, telefon testi: "Müşteriler
     sayfası neden çok boşluklu, bunu düzenleyelim." + "Müşteriler
     listesinde müşteriye tıklayıp müşteri detayı görebilmeliyim.").

     İki cümle aynı çözümü işaret ediyor: kartın taşıdığı ayrıntı
     LİSTEDE olmamalı, DETAYDA olmalı. Liste satıra indi (`.tl-item` —
     mesaj ekranındaki müşteri seçme listesiyle aynı satır), ayrıntı
     91-musteri.html'e taşındı. Hiçbir şey silinmedi; yeri değişti.

     BİLEŞENLER: .screen-head .eyebrow .eb-say · .search-box
     · .tl-item .tl-ic .tl-body .tl-title .tl-tip .tl-sub .tl-foot
     .tl-date · .tel-inline · .pill · .bos-durum.
     Ekrana özel sınıf KALMADI.

     ⚠️ YORUMUN İÇİNE ETİKET YAZILMAZ: burada bir kez "(aşağıdaki
     &lt;style&gt; içinde)" yazdım ve derleyicinin stil çıkarıcısı YORUMDAKİ
     etiketten başlayıp dosyanın sonundaki gerçek kapanışa kadar her şeyi
     yuttu — ekranın markup u komple silindi, derleme "id=screen-…
     bulunamadı" dedi. Yorum kod değildir ama derleyici için metindir. -->
<section class="screen" id="screen-musteriler">

  <div class="screen-head">
    <span class="eyebrow">
      <svg class="ico ico-sm"><use href="#i-users"></use></svg> Müşteriler
      <span class="eb-say" id="msSay"></span>
    </span>
  </div>

  <div class="search-box" id="msArama">
    <svg class="ico"><use href="#i-search"></use></svg>
    <input type="search" id="msQ" placeholder="Ad, telefon ya da plaka…"
           autocomplete="off" aria-label="Müşterilerde ara" />
    <button class="clear" id="msQTemiz" aria-label="Aramayı temizle">
      <svg class="ico ico-sm"><use href="#i-x"></use></svg>
    </button>
    <button class="daire-btn ghost" data-sesle="musteriler" aria-label="Müşterilerde sesle ara">
      <svg class="ico"><use href="#i-mic"></use></svg>
    </button>
  </div>

  <div id="msListe"></div>

</section>

<script>
Ekran.tanim('musteriler', {
  ciz: function () {
    /* Sesten gelen arama: "41 abc 43 ara" ya da "34 ABC 123 sahibini
       ara" — ikincisinde ses plakadan sahibi bulup adını yazıyor. */
    if (ARAMA_TERIMI && ARAMA_TERIMI.hedef === 'musteriler') {
      document.getElementById('msQ').value = ARAMA_TERIMI.terim || '';
      ARAMA_TERIMI = null;
    }
    var q = norm((document.getElementById('msQ') || {}).value || '');
    var liste = musteriler().filter(function (m) {
      if (!q) return true;
      var alan = m.ad + ' ' + m.tel + ' ' +
                 m.araclar.map(function (a) { return a.plaka + ' ' + a.marka; }).join(' ');
      return norm(alan).indexOf(q) >= 0;
    });

    document.getElementById('msSay').textContent =
      liste.length + (q ? ' bulundu' : ' müşteri');
    document.getElementById('msArama').classList.toggle('filled', !!q);

    /* ⚠️ 08.09 — KART SATIRA İNDİ (Cemil: "Müşteriler sayfası neden
       çok boşluklu, bunu düzenleyelim.").

       NE OLMUŞTU: her müşteri bir KARTTI ve kart dört şey taşıyordu —
       ad satırı, telefon bağlantısı, ayraçla ayrılmış araç satırları,
       en altta mesaj düğmesi. Üç müşteride 18 px iç boşluklu üç kart,
       telefon ekranının tamamını yiyordu; usta dördüncü müşteriyi
       görmek için kaydırıyordu. Liste ARAMAK içindir; okumak için
       değil.

       ARTIK: satır. Ad, araç sayısı, plakalar, telefon. Satıra
       dokunmak MÜŞTERİ DETAYINI açıyor — Cemil'in aynı turda istediği
       ikinci şey (*"müşteriye tıklayıp müşteri detayı görebilmeliyim"*)
       bu boşluğu doldurmanın da yolu oldu: taşınan ayrıntı silinmedi,
       yeri değişti.

       BİLEŞEN YENİ DEĞİL: `.tl-item` — mesaj ekranındaki müşteri seçme
       listesi zaten bu satırı kullanıyor. İki yerde müşteri seçiliyor
       ve ikisi artık aynı görünüyor. */
    document.getElementById('msListe').innerHTML = liste.length
      ? liste.map(function (m) {
          var kayitSay = m.araclar.reduce(function (t, a) {
            return t + aracKayitlari(a.plaka).length; }, 0);
          /* Plakalar SATIRIN İÇİNDE, düz metin olarak: usta plakayla
             arıyor, gördüğü şey aradığı şeyle aynı yazılmalı. Üçten
             fazlası satırı sarar — sayıyla söyleniyor. */
          var plakalar = m.araclar.slice(0, 3).map(function (a) { return a.plaka; }).join(' · ') +
            (m.araclar.length > 3 ? ' +' + (m.araclar.length - 3) : '');
          return '<div class="tl-item" data-musteri="' + m.anahtar + '"' +
              ' role="button" tabindex="0" aria-label="' + m.ad + ' — müşteriyi aç">' +
            '<span class="tl-ic"><svg class="ico ico-sm">' +
              '<use href="#i-user"></use></svg></span>' +
            '<div class="tl-body">' +
              '<div class="tl-title"><span class="tl-tip">' + m.ad + '</span></div>' +
              '<div class="tl-sub">' + plakalar + '</div>' +
              '<div class="tl-foot">' +
                (m.tel ? '<span class="tel-inline">' + m.tel + '</span>'
                       : '<span class="pill warn">telefon yok</span>') +
                '<span class="tl-date">' + m.araclar.length + ' araç · ' +
                  kayitSay + ' kayıt</span>' +
              '</div>' +
            '</div>' +
          '</div>';
        }).join('')
      : bosDurumHtml('i-users',
          q ? 'Eşleşen müşteri yok' : 'Müşteri yok',
          q ? 'Adın, telefonun ya da plakanın bir kısmını yazman yeter.'
            : 'Müşteri, aracın sahibi olarak kaydediliyor. Araç kaydında ad yazınca burada görünür.');
  }
});

document.addEventListener('click', function (e) {
  if (e.target.closest('#msQTemiz')) {
    document.getElementById('msQ').value = ''; Ekran.tazele();
    return;
  }
  /* [data-mesajla] ARTIK MÜŞTERİ DETAYINDA — dinleyici burada kaldı
     çünkü iki ekranda da aynı şeyi yapıyor ve ikiye bölmek onu iki
     kez düzeltmek demek olurdu. */
  var mp = e.target.closest('[data-mesajla]');
  if (mp) {
    e.stopPropagation();
    MESAJ_HEDEF = { plaka: mp.getAttribute('data-mesajla'), sablon: 'ozet' };
    Ekran.ac('mesaj');
  }
});
document.addEventListener('input', function (e) {
  if (e.target && e.target.id === 'msQ') Ekran.tazele();
});
</script>

<!-- ⚠️ 08.09 — BU EKRANIN KENDİ STİLİ KALMADI.
     .ms-* sınıfları müşteri DETAY ekranına (91-musteri.html) taşındı;
     liste artık ortak `.tl-item` satırını kullanıyor. Sınıf, kullanan
     ekranın yanında durur — iki ekranda tanımlı kalsaydı derleme
     denetiminin "aynı sınıf iki ekranda" testi haklı olarak bağırırdı. -->
