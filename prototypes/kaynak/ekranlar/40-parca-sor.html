<!-- ekran: parca-sor · PARÇA FİYATI SOR (EKRANLAR.md §4)
     Akış Adım 3–4. Tamirci: "Yedek parçacıdan fiyat alırken, ruhsatı
     ve gereken parçaları gönderiyor." (T-12)

     WHATSAPP.md ÖNERİSİ (A yolu) UYGULANDI: mesajı biz hazırlıyoruz,
     usta KENDİ WhatsApp'ından gönderiyor. Cevabı okuyamıyoruz — usta
     gelen fiyatı elle giriyor. Karşılığında hiçbir kurulum yok:
     Meta hesabı, işletme doğrulaması, şablon onayı gerekmiyor.

     BİLEŞENLER v1'DEN: .screen-head .eyebrow · .card · .section-label
     · .kalem-list .kalem .k-tip .k-ad · .cip-grup .cip
     · .notice .n-ic .n-body · .btn .btn-primary .btn-lg · .plate-hint.
     Yeni bileşen yazılmadı (03.09 — "Tasarım eskisi gibi devam etmeli").

     ÜZERİNDE YOK: parça arama · katalog · OEM kodu girme alanı
     (usta kodu bilmiyor — S7) · fiyat karşılaştırma tablosu. -->
<section class="screen" id="screen-parca-sor">

  <div class="screen-head">
    <span class="eyebrow">
      <svg class="ico ico-sm"><use href="#i-package"></use></svg> Parça fiyatı sor
    </span>
  </div>

  <div class="card">
    <div class="section-label">
      <svg class="ico ico-sm"><use href="#i-package"></use></svg> Sorulacak parçalar
    </div>
    <div class="kalem-list" id="psParcalar"></div>
  </div>

  <div class="section-label">
    <svg class="ico ico-sm"><use href="#i-user"></use></svg> Kime sorulacak?
  </div>
  <div class="cip-grup" id="psParcacilar" role="group" aria-label="Parçacı seç"></div>

  <div class="section-label">
    <svg class="ico ico-sm"><use href="#i-message-square"></use></svg> Gidecek mesaj
  </div>
  <div class="notice accent">
    <span class="n-ic"><svg class="ico ico-sm"><use href="#i-message-square"></use></svg></span>
    <span class="n-body ps-mesaj" id="psMesaj"></span>
  </div>

  <button class="btn btn-primary btn-lg" id="psGonder" disabled>
    <svg class="ico"><use href="#i-message-square"></use></svg>
    <span>WhatsApp ile gönder</span>
  </button>

  <p class="plate-hint" style="text-align:center">
    Cevap kendi WhatsApp'ına gelir. Gelen fiyatı servis kaydındaki
    satıra yazman yeter.
  </p>

</section>

<style>
/* Mesaj METNİN KENDİSİ — satır sonları korunmalı, yoksa parça listesi
   tek satıra yapışıp okunmaz olur. v1'in .notice'ına takılan tek delta. */
.notice .n-body.ps-mesaj { white-space: pre-wrap; }
</style>

<script>
/* KOL B (IS-AKISI): "Büyük bir iş ise parçalar farklı firmalardan
   araştırılabiliyor" (T-11). ÇOKLU seçim — ana yolda usta bir tane
   seçer, kolda birkaçını seçer. Ekran aynı, adım aynı; değişen tek
   şey seçimin tekil olmaması. */
var psSecililer = [];

function psParcaListesi(k) {
  /* Yalnız TAMİRCİNİN alacağı ve fiyatı henüz belli olmayan parçalar.
     Müşterinin getireceği parçanın fiyatını sormanın anlamı yok. */
  return (k.satirlar || []).filter(function (s) {
    return s.tip === 'parca' && s.kimGetirdi === 'tamirci' && !s.fiyat;
  });
}

function psCiz() {
  var k = kayitBul(ACIK_KAYIT);
  if (!k) return;
  var a = aracBul(k.plaka);
  var parcalar = psParcaListesi(k);

  document.getElementById('psParcalar').innerHTML = parcalar.length
    ? parcalar.map(function (s) {
        return '<div class="kalem">' +
          '<span class="k-tip parca">PARÇA</span>' +
          '<span class="k-ad">' + (s.ad || 'adı yazılmamış parça') + '</span>' +
        '</div>';
      }).join('')
    : bosDurumHtml('i-package', 'Sorulacak parça yok',
        'Servis kaydında fiyatı belli olmayan bir parça olmalı.');

  document.getElementById('psParcacilar').innerHTML = PARCACILAR.map(function (p, i) {
    return '<button class="cip" data-parcaci="' + i + '" aria-pressed="' +
      (psSecililer.indexOf(i) !== -1) + '">' + p.ad + '</button>';
  }).join('');

  /* Mesajın gövdesi DÜZ METİN — parçacıya giden şey bu, biçim değil. */
  var satirlar = parcalar.map(function (s) { return '· ' + (s.ad || '?'); }).join('\n');
  document.getElementById('psMesaj').textContent =
    (a ? a.marka + ' ' + a.model + ' ' + a.yil + ' · ' + a.motor + '\n' : '') +
    k.plaka + '\n\n' + (satirlar || '—') + '\n\nFiyat verebilir misiniz?' +
    '\n\n📎 ruhsat fotoğrafı eklenecek';

  var g = document.getElementById('psGonder');
  g.disabled = (!psSecililer.length || !parcalar.length);
  /* Düğme kaç kişiye gideceğini SÖYLER: çoklu seçimde "gönderdim
     sandım, birine gitti" hatası buradan çıkar. */
  g.querySelector('span').textContent = psSecililer.length > 1
    ? 'WhatsApp ile ' + psSecililer.length + ' parçacıya gönder'
    : 'WhatsApp ile gönder';
}

Ekran.tanim('parca-sor', {
  ciz: function () { psSecililer = []; psCiz(); }
});

document.addEventListener('click', function (e) {
  var t = e.target.closest('button');
  if (!t) return;

  var p = t.getAttribute('data-parcaci');
  if (p !== null) {
    var i = parseInt(p, 10), y = psSecililer.indexOf(i);
    if (y === -1) psSecililer.push(i); else psSecililer.splice(y, 1);
    psCiz();
  }

  if (t.id === 'psGonder' && psSecililer.length) {
    var k = kayitBul(ACIK_KAYIT);
    /* SORULDUĞU SATIRA YAZILIR. Adım 4'te "cevap kimden geldi"
       sorusunun cevabı burada üretiliyor; kayıt ekranı bunu okuyup
       fiyat satırının altına çip olarak koyuyor — ayrı bir
       karşılaştırma ekranı gerekmiyor (Kol B).

       ⚠️ 06.09 — BU YORUM BİR GÜN BOYUNCA YALANDI. Kayıt ekranı
       yeniden yazılırken çipler düştü; burası yazmaya devam etti,
       okuyan kalmadı. Yorum kodla birlikte çürüyor: *"kayıt ekranı
       bunu okuyor"* diyen bir cümle, kayıt ekranı değişince kendini
       düzeltmiyor. Çipler geri kondu. */
    psParcaListesi(k).forEach(function (s) {
      s.sorulan = psSecililer.slice();
    });
    /* ⚠️ BALON ARTIK VAAT ETMİYOR. Eskiden *"cevaplar kayda düşecek"*
       diyordu — cevap gelmiyor, DÜŞMÜYOR; usta parçacının WhatsApp'tan
       yazdığı rakamı kendi eliyle giriyor. Uygulamanın yapmadığı bir
       işi yapacakmış gibi söylemek, K-021'de bir kez düzelttiğim
       hatanın aynısı. */
    balon(psSecililer.length > 1
      ? psSecililer.length + ' parçacıya soruldu. Cevap gelince fiyatı sen yaz — ' +
        'hangi parçacıdan geldiğini kayıtta işaretleyebilirsin.'
      : PARCACILAR[psSecililer[0]].ad + ' — WhatsApp açılıyor, mesaj hazır.',
      false, 3600);
    Ekran.ac('kayit');
  }
});
</script>
