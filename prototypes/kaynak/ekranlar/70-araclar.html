<!-- ekran: araclar · KAYITLI ARAÇLAR
     03.09'da menüden geldi. Ana ekran menüye dönünce "hangi araçlar
     kayıtlı" sorusunun gidecek yeri kalmamıştı.

     ⚠️ 04.09 — LİSTE SATIRI CEMİL'İN TARİFİYLE YENİDEN YAZILDI.
     Önceden servis kaydı satırını (.tl-item) giyiyordu: sol tarafta
     araç ikonu, altta "1 kayıt · son bakım 15.03.2026" şeridi, sağda
     "içeride" rozeti. Cemil'in tarifi:

       "Araç iconı olmayacak. Sol üstte plaka, altında marka model
        motor renk (renk yazmak yerine kutucuk içerisinde rengi
        olsun). Altında ruhsat sahibi. İçeride olanları üstte olsun.
        Div çerçeve farklı olsun fakat divin içerisinde text olarak
        içeride yazmasına gerek yok. Ruhsat sahibi telefon. Eğer
        ikinci bir iletişim varsa adı ve Telefonu. Ruhsat sahibi
        firma da olabilir hani."
       "Altında 1 kayıt, son bakım vb yazmasın."
       "Ayrıca liste telefondan okunmak için daha iyi gözüksün."

     İÇERİDEKİLER ÜSTTE ve çerçeveleri farklı — iki liste yapmadan
     "hangisi bende" sorusu cevaplanıyor. Yazı yok: sıra ve çerçeve
     zaten söylüyor.

     BİLEŞENLER: .screen-head .eyebrow .eb-say · .search-box
     · .arac-kart (yalnız aracKartiHtml() üretir) · .bos-durum.

     ÜZERİNDE YOK: araç ekleme formu (ruhsattan gelir) · VIN
     · kontrol tarihleri · silme · kayıt sayısı · son bakım tarihi. -->
<section class="screen" id="screen-araclar">

  <div class="screen-head">
    <span class="eyebrow">
      <svg class="ico ico-sm"><use href="#i-car"></use></svg> Araçlar
      <span class="eb-say" id="arcSay"></span>
    </span>
  </div>

  <div class="search-box" id="arcArama">
    <svg class="ico"><use href="#i-search"></use></svg>
    <input type="search" id="arcQ" placeholder="Plaka, marka ya da sahip…"
           autocomplete="off" aria-label="Araçlarda ara" />
    <button class="clear" id="arcQTemiz" aria-label="Aramayı temizle">
      <svg class="ico ico-sm"><use href="#i-x"></use></svg>
    </button>
  </div>

  <div id="arcListe"></div>

</section>

<script>
Ekran.tanim('araclar', {
  ciz: function () {
    /* Ses buraya arama terimi bırakmış olabilir. Okunur ve TEMİZLENİR;
       bırakılsa bir sonraki açılışta yine aynı şeyi arardı. */
    if (ARAMA_TERIMI && ARAMA_TERIMI.hedef === 'araclar') {
      document.getElementById('arcQ').value = ARAMA_TERIMI.terim || '';
      ARAMA_TERIMI = null;
    }
    var q = norm((document.getElementById('arcQ') || {}).value || '');
    /* Arama plakada, markada, modelde, SAHİPTE ve İKİNCİ İLETİŞİMDE
       çalışır — usta plakayı değil, arayan kişinin adını hatırlıyor
       olabilir. */
    var liste = ARACLAR.filter(function (a) {
      if (!q) return true;
      return norm(a.plaka + ' ' + a.marka + ' ' + a.model + ' ' +
                  (a.sahipAd || '') + ' ' + (a.iletisimAd || '')).indexOf(q) >= 0;
    });

    /* İÇERİDEKİLER ÜSTTE (Cemil, 04.09). Sıralama listenin KENDİSİNDE
       yapılıyor, veri kaynağı bozulmuyor — slice() olmadan ARACLAR'ın
       kendi sırası kalıcı olarak değişirdi. */
    var icerdeMi = {};
    icerideki().forEach(function (k) { icerdeMi[k.plaka] = true; });
    liste = liste.slice().sort(function (x, y) {
      return (icerdeMi[y.plaka] ? 1 : 0) - (icerdeMi[x.plaka] ? 1 : 0);
    });

    document.getElementById('arcSay').textContent =
      liste.length + (q ? ' bulundu' : ' araç');
    document.getElementById('arcArama').classList.toggle('filled', !!q);

    document.getElementById('arcListe').innerHTML = liste.length
      ? liste.map(function (a) {
          return aracKartiHtml(a, !!icerdeMi[a.plaka]);
        }).join('')
      : bosDurumHtml('i-car',
          q ? 'Eşleşen araç yok' : 'Kayıtlı araç yok',
          q ? 'Plakanın ya da sahibin bir kısmını yazman yeter.'
            : 'İlk aracı "Servis kaydı ekle"den ruhsatı çekerek ekle.');
  }
});

/* [data-arac] davranisi 03-nesne.js'te — arac karti iki ekranda
   tiklaniyor (araclar, musteriler) ve ORTAK NESNE KURALI davranisin
   da ortak olmasini soyluyor. */
document.addEventListener('click', function (e) {
  if (e.target.closest('#arcQTemiz')) {
    document.getElementById('arcQ').value = ''; Ekran.tazele();
  }
});
document.addEventListener('input', function (e) {
  if (e.target && e.target.id === 'arcQ') Ekran.tazele();
});
</script>
