<!-- ekran: ruhsat · RUHSATI ÇEK (EKRANLAR.md §2 · Akış Adım 1)
     "Ruhsatı çekti, kayıt açıldı." (T-3)

     ARAŞTIRMADAN GELEN İKİ ŞEY (RUHSAT-OKUMA.md):
     · TELEFON ruhsatta YOK — ayrı alan, ZORUNLU DEĞİL (A-29)
     · TC kimlik no ve adres ruhsatta VAR ama OKUNMAZ, SAKLANMAZ

     BİLEŞENLER v1'DEN: .screen-head .eyebrow · .card .card.raised
     · .plate-input-wrap .plate-field .tr-tag · .field .field-2
     · .plate-hint · .cip-grup .cip · .btn. Yeni bileşen yazılmadı. -->
<section class="screen" id="screen-ruhsat">

  <div class="screen-head">
    <span class="eyebrow">
      <svg class="ico ico-sm"><use href="#i-camera"></use></svg> Ruhsatı çek
    </span>
  </div>

  <button class="btn btn-primary btn-lg" id="ruhsatCek">
    <svg class="ico"><use href="#i-camera"></use></svg> Ruhsatı çek
  </button>

  <p class="plate-hint" style="text-align:center">
    Ruhsat yoksa ya da okunmuyorsa
    <button class="btn btn-ghost" id="ruhsatElle" style="margin-top:8px">
      <svg class="ico"><use href="#i-file-text"></use></svg> Plakayı yaz
    </button>
  </p>

  <div id="ruhsatSonuc" hidden>

    <!-- PLAKA EN ÜSTTE VE BÜYÜK: yanlış okunursa kayıt YANLIŞ ARACA
         bağlanır. Doğrulanan tek alan bu (RUHSAT-OKUMA §5). -->
    <div class="card raised">
      <div class="plate-input-wrap">
        <div class="plate-field">
          <span class="tr-tag">TR</span>
          <input id="rPlaka" type="text" maxlength="11" placeholder="34 ABC 123"
                 autocomplete="off" spellcheck="false" aria-label="Plaka" />
        </div>
        <div class="plate-hint" id="rPlakaIpucu" role="status"></div>
      </div>
    </div>

    <div class="card">
      <div class="section-label">
        <svg class="ico ico-sm"><use href="#i-car"></use></svg> Araç
      </div>
      <div class="field-2">
        <div class="field"><label for="rMarka">Marka</label><input id="rMarka" /></div>
        <div class="field"><label for="rModel">Model</label><input id="rModel" /></div>
      </div>
      <div class="field-2">
        <div class="field"><label for="rYil">Yıl</label><input id="rYil" class="mono" /></div>
        <div class="field"><label for="rMotor">Motor</label><input id="rMotor" /></div>
      </div>

      <div class="field">
        <label for="rTel">Telefon</label>
        <input id="rTel" class="mono" inputmode="tel" placeholder="0532 000 00 00" autocomplete="off" />
        <div class="plate-hint">Ruhsatta yazmaz — isteğe bağlı. Bakım hatırlatması ve özet buraya gider.</div>
      </div>
    </div>

    <div class="section-label">
      <svg class="ico ico-sm"><use href="#i-wrench"></use></svg> Ne için geldi?
    </div>
    <div class="cip-grup" id="turGrup" role="group" aria-label="İş türü">
      <button class="cip" id="turTamirat" aria-pressed="false">Tamirat</button>
      <button class="cip" id="turBakim" aria-pressed="false">Bakım</button>
    </div>

    <!-- Km YALNIZ BAKIMDA (K-002). Bir kez yazılır, güncellenmez. -->
    <div class="field" id="kmAlan" hidden>
      <label for="rKm">Kilometre</label>
      <input id="rKm" class="mono" inputmode="numeric" placeholder="142.500" autocomplete="off" />
      <div class="plate-hint">Göstergeden oku. Bir sonraki bakımda işine yarar.</div>
    </div>

    <button class="btn btn-primary btn-lg" id="kaydiAc" disabled>
      <svg class="ico"><use href="#i-check"></use></svg> Kaydı aç
    </button>

  </div>

</section>

<script>
var rTur = null;

/* Plaka biçimi — yazarken de okunurken de AYNI biçimleyici (v1 kuralı). */
function plakaBicim(ham) {
  var t = (ham || '').toLocaleUpperCase('tr').replace(/[^0-9A-ZÇĞİÖŞÜ]/g, '');
  var il = t.slice(0, 2).replace(/[^0-9]/g, '');
  var kalan = t.slice(il.length);
  var harf = kalan.replace(/[^A-ZÇĞİÖŞÜ]/g, '').slice(0, 3);
  var rakam = kalan.slice(harf.length).replace(/[^0-9]/g, '').slice(0, 4);
  return [il, harf, rakam].filter(Boolean).join(' ');
}
function plakaGecerli(p) { return /^\d{2} [A-ZÇĞİÖŞÜ]{1,3} \d{2,4}$/.test(p); }

function ruhsatDurum() {
  var p = plakaBicim(document.getElementById('rPlaka').value);
  var ip = document.getElementById('rPlakaIpucu');
  if (p && !plakaGecerli(p)) {
    ip.textContent = 'Plaka eksik — ör. 34 ABC 123';
    ip.className = 'plate-hint warn';
  } else {
    var a = aracBul(p);
    ip.textContent = a ? a.marka + ' ' + a.model + ' — bu araç kayıtlı' : '';
    ip.className = 'plate-hint';
  }
  document.getElementById('kaydiAc').disabled = !(plakaGecerli(p) && rTur);
}

function turSec(t) {
  rTur = t;
  document.getElementById('turTamirat').setAttribute('aria-pressed', String(t === 'tamirat'));
  document.getElementById('turBakim').setAttribute('aria-pressed', String(t === 'bakim'));
  document.getElementById('kmAlan').hidden = (t !== 'bakim');
  ruhsatDurum();
}

Ekran.tanim('ruhsat', {
  ciz: function (kok) {
    /* Ekran her açılışta TEMİZ başlar — yarım kalmış kayıt sonrakine
       sızmasın. */
    rTur = null;
    kok.querySelector('#ruhsatSonuc').hidden = true;
    ['rPlaka', 'rMarka', 'rModel', 'rYil', 'rMotor', 'rTel', 'rKm'].forEach(function (id) {
      var e = document.getElementById(id); if (e) e.value = '';
    });
    turSec(null);
  }
});

/* ---- sahte okuma ----
   Gerçek okuma bir servise bağlanacak (RUHSAT-OKUMA.md C yolu).
   Burada ekranın DAVRANIŞI gösteriliyor: alanlar dolar, HEPSİ
   DÜZELTİLEBİLİR, hiçbiri kendiliğinden kaydedilmez. */
var RUHSAT_ORNEK = [
  { plaka: '41 P 3873', marka: 'Hyundai', model: 'i20', yil: '2020', motor: '1.4 MPI' },
  { plaka: '06 BFT 41', marka: 'Ford', model: 'Focus', yil: '2017', motor: '1.5 TDCi' }
];
var ruhsatSira = 0;

document.addEventListener('click', function (e) {
  var t = e.target.closest('button');
  if (!t) return;

  if (t.id === 'ruhsatCek') {
    var r = RUHSAT_ORNEK[ruhsatSira % RUHSAT_ORNEK.length];
    ruhsatSira++;
    document.getElementById('rPlaka').value = r.plaka;
    document.getElementById('rMarka').value = r.marka;
    document.getElementById('rModel').value = r.model;
    document.getElementById('rYil').value = r.yil;
    document.getElementById('rMotor').value = r.motor;
    document.getElementById('ruhsatSonuc').hidden = false;
    ruhsatDurum();
    balon('Okundu — yanlış varsa düzelt.');
  }

  if (t.id === 'ruhsatElle') {
    document.getElementById('ruhsatSonuc').hidden = false;
    document.getElementById('rPlaka').focus();
    ruhsatDurum();
  }

  if (t.id === 'turTamirat') turSec('tamirat');
  if (t.id === 'turBakim') turSec('bakim');

  if (t.id === 'kaydiAc') {
    var p = plakaBicim(document.getElementById('rPlaka').value);
    if (!aracBul(p)) {
      ARACLAR.push({
        plaka: p,
        marka: document.getElementById('rMarka').value,
        model: document.getElementById('rModel').value,
        yil: document.getElementById('rYil').value,
        motor: document.getElementById('rMotor').value,
        vin: '', sahipAd: '',
        sahipTel: document.getElementById('rTel').value,
        not: ''
      });
    }
    var yeni = {
      id: KAYITLAR.length + 1, plaka: p, tur: rTur,
      km: rTur === 'bakim' ? document.getElementById('rKm').value : '',
      sikayet: '', acilis: '03.09.2026', teslimTarihi: null, odemeYolu: null,
      hatirlatmaTarihi: null, hatirlatmaGonderildi: false, satirlar: []
    };
    KAYITLAR.push(yeni);
    ACIK_KAYIT = yeni.id;
    Ekran.ac('kayit');
  }
});

document.addEventListener('input', function (e) {
  if (e.target && e.target.id === 'rPlaka') {
    e.target.value = plakaBicim(e.target.value);
    try { e.target.setSelectionRange(e.target.value.length, e.target.value.length); } catch (x) {}
    ruhsatDurum();
  }
});
</script>
