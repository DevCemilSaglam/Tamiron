<!-- ekran: ruhsat · SERVİS KAYDI EKLE (EKRANLAR.md §2 · Akış Adım 1)
     "Ruhsatı çekti, kayıt açıldı." (T-3)

     ⚠️ 06.09 — CEMİL'İN İKİNCİ TURU. Ekran altı maddeyle yeniden
     kuruldu:

       "Servis kaydı için veya araç kaydı için kullanıcı konuşacak ya da
        plaka girecek. Eğer aracın ruhsatı yoksa, ruhsat çekme ekranı
        açılacak. Ruhsat çekmeden devam edebilir."
       "Ne için geldi ekranı olmayacak. Tamir, bakım vb çok önemli
        değil. Biz bu ai'ya json'da seçtirebiliriz."
       "'Ruhsat adımı geç ve kaydı aç' ve 'Ruhsatı çek' butonları
        olacak. Ruhsatı çek derse, diğer taba geçecek."
       "Ruhsat tabında ruhsatı çekebilir ya da galeriden seçebilir."
       "Ruhsatı çek butonuna basınca Plakayı yaz tabına döndü." (hata)
       "Ruhsat bilgileri eksik. Daha fazla alan gerekebilir."
       "Kaydı aç butonuna bastım, bir şey olmuyor." (hata)

     ---- "NE İÇİN GELDİ?" NEDEN KALKTI ----
     Üç çipli bir soruydu ve ana yolda HER kayıt açılışında soruluyordu.
     Cemil: tür önemli değil, iş metninden çıkarılabilir. Doğru: tamirci
     "yağ filtre bakım" diyor, biz de ona bakıp anlıyoruz.

     ⚠️ TÜR VERİ MODELİNDEN KALKMADI, EKRANDAN KALKTI. Tür bir şeye
     yarıyor (K-002: bakım km ister ve hatırlatma kurar). Artık iş
     metninden TAHMİN ediliyor (isTuruTahmin) ve **servis kaydının kendi
     ekranında düzeltilebiliyor**. Düzeltilemeyen bir tahmin, tahmin
     değil hükümdür.

     ---- "KAYDI AÇ" NEDEN ÇALIŞMIYORDU ----
     Düğme `disabled` idi ve tür seçilmeden açılmıyordu. Cemil türü
     seçmedi (seçmek zorunda olduğunu ekran söylemiyordu), bastı,
     hiçbir şey olmadı. **Kapalı düğme sessizdir**: neden kapalı
     olduğunu söylemez. Artık düğme HİÇ KAPANMIYOR — eksik varsa
     basınca SÖYLÜYOR ve eksik alana götürüyor.

     ---- İKİ SEKME, ARTIK ZIPLAMIYOR ----
     "Plakayı yaz"  — varsayılan, mikrofonlu
     "Ruhsatı çek"  — kamera + galeri
     Okuma bitince EKRAN SEKMEDE KALIR (eskiden plaka sekmesine
     atlıyordu; usta bastığı düğmenin sonucunu göremiyordu). Okunan
     plaka sekmenin içinde plaka bileşeniyle gösteriliyor.

     ARAŞTIRMADAN GELEN İKİ ŞEY (RUHSAT-OKUMA.md):
     · TELEFON ruhsatta YOK — ayrı alan, ZORUNLU DEĞİL (A-29)
     · TC kimlik no ve adres ruhsatta VAR ama OKUNMAZ, SAKLANMAZ

     BİLEŞENLER: .screen-head .eyebrow · .tab-grup .tab · .card
     .card.raised · .plate-input-wrap .plate-field .tr-tag · .field
     .field-2 · .plate-hint · .notice · .daire-btn · .btn · .btn-row
     · .akordiyon · .yigin · .arac-bas. Yeni bileşen yazılmadı. -->
<section class="screen" id="screen-ruhsat">

  <div class="screen-head">
    <span class="eyebrow">
      <svg class="ico ico-sm"><use href="#i-plus"></use></svg> Servis kaydı ekle
    </span>
  </div>

  <div class="tab-grup" role="tablist" aria-label="Araç bilgisi nasıl girilecek">
    <button class="tab" id="sekPlaka" role="tab" aria-selected="true" aria-controls="ruhsatGovde">
      <svg class="ico"><use href="#i-file-text"></use></svg> Plakayı yaz
    </button>
    <button class="tab" id="sekRuhsat" role="tab" aria-selected="false" aria-controls="ruhsatGovde">
      <svg class="ico"><use href="#i-camera"></use></svg> Ruhsatı çek
    </button>
  </div>

  <div id="ruhsatGovde" class="yigin" role="tabpanel">

    <!-- SEKME: RUHSATI ÇEK — iki kaynak (Cemil: "ruhsatı çekebilir ya
         da galeriden seçebilir"). Ruhsat çoğu zaman ZATEN çekilmiştir:
         müşteri WhatsApp'tan yollamıştır, usta bir kez fotoğraflamıştır.
         Yalnız kamera sunmak, o fotoğrafı ikinci kez çektiriyordu. -->
    <div id="sekmeRuhsat" class="yigin" hidden>
      <!-- ⚠️ ADI "Ruhsatı çek" DEĞİL "Kamerayı aç" (06.09, dokunuş
           ölçümünün yan bulgusu). Sekmenin adı da "Ruhsatı çek"ti:
           usta sekmeye dokunuyor, karşısına AYNI ADI TAŞIYAN bir düğme
           çıkıyor ve *"az önce buna basmadım mı"* diye duruyordu.
           03.09'da ana ekranda birebir aynı şey vardı ve o zaman da
           ölçüm yakalamıştı ("tek niyet, iki dokunuş").

           SEKME KAYNAĞI söyler (ruhsattan gireceğim), DÜĞME EYLEMİ
           (kamerayı aç / galeriden seç). İkisi aynı şeyi söylerse biri
           gereksizdir; ama sekme Cemil'in istediği yapı, o yüzden
           değişen düğmenin adı oldu. -->
      <button class="btn btn-primary btn-lg" id="ruhsatCek">
        <svg class="ico"><use href="#i-camera"></use></svg> Kamerayı aç
      </button>
      <button class="btn btn-ghost" id="ruhsatGaleri">
        <svg class="ico"><use href="#i-image"></use></svg> Galeriden seç
      </button>
      <!-- Okunan ne, BU SEKMEDE görünür. Eskiden okuma bitince ekran
           öbür sekmeye atlıyordu ve usta düğmesinin ne yaptığını
           göremiyordu. -->
      <div id="rOkuma"></div>
    </div>

    <!-- SEKME: PLAKAYI YAZ — varsayılan, mikrofonlu -->
    <div id="sekmePlaka" class="yigin">
      <div class="card raised">
        <div class="plate-input-wrap">
          <div class="plate-field">
            <span class="tr-tag">TR</span>
            <input id="rPlaka" type="text" data-giris="plaka" maxlength="11" placeholder="34 ABC 123"
                   autocomplete="off" spellcheck="false" aria-label="Plaka" />
            <button class="daire-btn ghost" data-sesle="servis-ekle"
                    aria-label="Plakayı ve işi sesle söyle" title="Sesle">
              <svg class="ico"><use href="#i-mic"></use></svg>
            </button>
          </div>
          <div class="plate-hint" id="rPlakaIpucu" role="status"></div>
        </div>
      </div>

      <!-- SESLE NE SÖYLENİR — ÖRNEKLE anlatılıyor (Cemil, 06.09:
           "bu alana birkaç örnek ver: plaka, sahibi ad soyad, sahibi
           telefon, yapılan işlem").

           Eskiden bir ALAN LİSTESİ vardı ("plaka · ne için geldiği ·
           sahibinin adı · telefonu"). Liste, ustaya cümleyi kurdurmuyor:
           hangi sırayla, nasıl söyleyeceğini yine bilmiyor. Örnek
           cümle, ustanın taklit edebileceği tek biçimdir. -->
      <div class="notice" id="rSesBekleniyor"></div>
    </div>

    <!-- PLAKA TANINDI MI — iki cevaptan biri, her zaman görünür -->
    <div id="rTanima"></div>

    <!-- ARAÇ BİLGİLERİ — yalnız araç KAYITSIZSA açılır -->
    <div class="card" id="rAracKart" hidden>
      <div class="section-label with-action">
        <span class="lbl-txt">
          <svg class="ico ico-sm"><use href="#i-car"></use></svg> Araç bilgileri
        </span>
        <button class="daire-btn" id="rAracMik" aria-label="Araç bilgilerini sesle söyle" title="Sesle">
          <svg class="ico"><use href="#i-mic"></use></svg>
        </button>
      </div>
      <div class="field-2">
        <div class="field"><label for="rMarka">Marka</label><input id="rMarka" /></div>
        <div class="field"><label for="rModel">Model</label><input id="rModel" /></div>
      </div>
      <div class="field-2">
        <div class="field"><label for="rYil">Yıl</label><input id="rYil" class="mono" data-giris="yil" inputmode="numeric" placeholder="2018" /></div>
        <div class="field"><label for="rMotor">Motor</label><input id="rMotor" placeholder="1.5 dCi" /></div>
      </div>
      <!-- RENK ve YAKIT ANA ALANDA (06.09, "ruhsat bilgileri eksik").
           İkisi de ruhsatta yazıyor ve ikisi de ARANAN bilgi: araç
           listesinde renk kutucuğu bunlardan besleniyor, boş kalırsa
           kutucuk "bilinmeyen" çıkıyordu. -->
      <div class="field-2">
        <div class="field"><label for="rRenk">Renk</label><input id="rRenk" placeholder="Gri Metalik" /></div>
        <div class="field"><label for="rYakit">Yakıt</label><input id="rYakit" placeholder="Dizel" /></div>
      </div>
      <div class="field">
        <label for="rSahip">Sahibi</label>
        <input id="rSahip" placeholder="ad soyad ya da firma" autocomplete="off" />
      </div>
      <div class="field">
        <label for="rTel">Telefon</label>
        <input id="rTel" class="mono" data-giris="tel" inputmode="tel" placeholder="0532 000 00 00" autocomplete="off" />
        <div class="plate-hint">Ruhsatta yazmaz — isteğe bağlı. Bakım hatırlatması ve özet buraya gider.</div>
      </div>

      <!-- ⚠️ RUHSATIN GERİ KALANI AKORDİYONDA (06.09).
           Cemil "ruhsat bilgileri eksik, daha fazla alan gerekebilir"
           dedi ve haklı: araç ekranı şasi no, motor no, motor hacmi,
           güç, koltuk ve ilk tescili GÖSTERİYOR ama hiçbir yerde
           GİRİLEMİYORDU. Gösterilen ama girilemeyen alan, sonsuza
           kadar boş kalır.

           Neden akordiyonda: bunlar ruhsat okununca kendiliğinden
           dolan, elle yılda bir kez yazılan alanlar. Ana yolun
           üstünde durursa ekran bütçesini (A-2) yer. Akordiyon
           kapalı açılır — isteyen açar. -->
      <div class="akordiyon">
        <button class="akd-bas" aria-expanded="false" aria-controls="rDetayGovde">
          <svg class="ico ico-sm"><use href="#i-file-text"></use></svg> Ruhsattaki diğer bilgiler
          <span class="akd-say" id="rDetaySay"></span>
          <svg class="ico ico-sm akd-ok"><use href="#i-chevron-down"></use></svg>
        </button>
        <div class="akd-govde" id="rDetayGovde" hidden>
          <div class="field">
            <label for="rVin">Şasi no (VIN)</label>
            <input id="rVin" class="mono" data-giris="kod" placeholder="VF1RFB00858123456" autocomplete="off" />
          </div>
          <div class="field">
            <label for="rMotorNo">Motor no</label>
            <input id="rMotorNo" class="mono" data-giris="kod" placeholder="K9K872C123456" autocomplete="off" />
          </div>
          <div class="field-2">
            <div class="field"><label for="rSilindir">Motor hacmi (cc)</label>
              <input id="rSilindir" class="mono" data-giris="km" inputmode="numeric" placeholder="1461" /></div>
            <div class="field"><label for="rGuc">Motor gücü (kW)</label>
              <input id="rGuc" class="mono" data-giris="km" inputmode="numeric" placeholder="110" /></div>
          </div>
          <div class="field-2">
            <div class="field"><label for="rKoltuk">Koltuk</label>
              <input id="rKoltuk" class="mono" data-giris="km" inputmode="numeric" placeholder="5" /></div>
            <div class="field"><label for="rDepo">Yakıt deposu (lt)</label>
              <input id="rDepo" class="mono" data-giris="km" inputmode="numeric" placeholder="50" /></div>
          </div>
          <div class="field">
            <label for="rIlkTescil">İlk tescil</label>
            <input id="rIlkTescil" class="mono" data-giris="tarih" inputmode="numeric" placeholder="14.06.2018" autocomplete="off" />
          </div>
          <!-- ⚠️ TC KİMLİK NO ve ADRES BURAYA DA GİRMEDİ. Ruhsatta
               varlar; RUHSAT-OKUMA.md Bulgu 2: tutmadığın veri en
               güvenli veridir. Tamircinin yedi işinden hiçbiri
               bunları istemiyor. -->
          <p class="plate-hint">
            TC kimlik no ve adres ruhsatta yazar ama burada tutulmaz —
            işine yaramıyor, saklanması risk.
          </p>
        </div>
      </div>
    </div>

    <!-- ⚠️ KİLOMETRE BU EKRANDAN KALKTI (Cemil, 07.09):
         *"Servis kaydı alanında km ilk aşamada olmayacak. Sesle
         kaydedilir ve km varsa zaten işleyecektir."*

         Doğru: kayıt AÇMA anı, ustanın göstergeye bakmadığı andır —
         araç daha yeni girdi. Km bakımda gerekiyor (K-002) ama
         gerektiği yer burası değil, **servis kaydının kendisi**: usta
         aracın başına geçtiğinde yazıyor.

         SESLE GELEN KM KAYBOLMUYOR: ses "kilometre 88 bin" duyarsa
         RUHSAT_ONDOLGU.km ile geliyor ve kayda doğrudan işleniyor —
         ekranda alan olmasa da. Söylenen bilgi, sorulmayan alandan
         bağımsız. -->

    <div id="rUyari"></div>

    <!-- EYLEM DÜĞMELERİ — kayıtlı/kayıtsız araca göre değişir. -->
    <div id="rEylem"></div>

  </div>

</section>

<script>
var rSekme = 'plaka';
/* Ruhsat okundu mu — okunduysa "ruhsatı çek" teklifi tekrar edilmez. */
var rOkundu = false;
/* Sesin taşıdığı ama ruhsatta karşılığı olmayan iş açıklaması. */
var rSesNotu = null;

/* plakaBicim() ve plakaGecerli() ÇEKİRDEKTE — plaka üç ekranda
   görünen ortak nesne, biçimi de ortak. */

var R_ALANLAR = ['rPlaka', 'rMarka', 'rModel', 'rYil', 'rMotor', 'rRenk',
  'rYakit', 'rSahip', 'rTel', 'rVin', 'rMotorNo', 'rSilindir',
  'rGuc', 'rKoltuk', 'rDepo', 'rIlkTescil'];

function rDeger(id) {
  var e = document.getElementById(id);
  return e ? e.value.trim() : '';
}

function ruhsatSekme(hangi) {
  rSekme = hangi;
  document.getElementById('sekPlaka').setAttribute('aria-selected', String(hangi === 'plaka'));
  document.getElementById('sekRuhsat').setAttribute('aria-selected', String(hangi === 'ruhsat'));
  document.getElementById('sekmePlaka').hidden = (hangi !== 'plaka');
  document.getElementById('sekmeRuhsat').hidden = (hangi !== 'ruhsat');
  ruhsatDurum();
}

/* Akordiyonun sayacı: kaç alan dolu. "İçinde bir şey var mı" diye
   açtırmamak için (akordiyon kuralı). */
function rDetaySayac() {
  var dolu = ['rVin', 'rMotorNo', 'rSilindir', 'rGuc', 'rKoltuk', 'rDepo', 'rIlkTescil']
    .filter(function (id) { return rDeger(id); }).length;
  var e = document.getElementById('rDetaySay');
  if (e) e.textContent = dolu ? dolu + ' alan dolu' : '';
}

/* ---- PLAKA KAPININ KENDİSİ ----
   kayıtlı  → ruhsat İSTENMEZ, tek düğme: kaydı aç
   kayıtsız → ruhsat TEKLİF EDİLİR ama ZORUNLU DEĞİL (Cemil: "ruhsat
              çekmeden devam edebilir") */
function ruhsatDurum() {
  var p = plakaBicim(document.getElementById('rPlaka').value);
  var ip = document.getElementById('rPlakaIpucu');
  var tanima = document.getElementById('rTanima');
  var aracKart = document.getElementById('rAracKart');
  var a = plakaGecerli(p) ? aracBul(p) : null;

  if (p && !plakaGecerli(p)) {
    ip.textContent = 'Plaka eksik — ör. 34 ABC 123';
    ip.className = 'plate-hint warn';
  } else {
    ip.textContent = '';
    ip.className = 'plate-hint';
  }

  if (!plakaGecerli(p)) {
    tanima.innerHTML = '';
    aracKart.hidden = true;
  } else if (a) {
    /* DAHA ÖNCE GELMİŞ ARAÇ — RUHSATA GEREK YOK. */
    var acik = icerideki().filter(function (k) { return k.plaka === p; })[0];
    tanima.innerHTML =
      '<div class="notice ok">' +
        '<span class="n-ic"><svg class="ico ico-sm"><use href="#i-circle-check"></use></svg></span>' +
        '<span class="n-body"><b>Bu araç kayıtlı</b> — ' + a.marka + ' ' + a.model +
          (a.sahipAd ? ' · ' + a.sahipAd : '') + '.<br>' +
          (acik
            ? 'Zaten <b>serviste</b> ve açık bir kaydı var.'
            : 'Ruhsat çekmene gerek yok.') +
        '</span>' +
      '</div>' +
      (acik
        ? '<button class="btn btn-ghost" data-kayit="' + acik.id + '" style="margin-top:12px">' +
            '<svg class="ico"><use href="#i-clipboard-list"></use></svg>' +
            ' Açık kayda git</button>'
        : '');
    aracKart.hidden = true;
  } else {
    /* KAYITSIZ ARAÇ — ruhsat teklif edilir, alanlar elle/sesle dolar. */
    tanima.innerHTML =
      '<div class="notice warn">' +
        '<span class="n-ic"><svg class="ico ico-sm"><use href="#i-triangle-alert"></use></svg></span>' +
        '<span class="n-body"><b>Bu araç kayıtlı değil.</b> ' +
          /* ⚠️ 07.09 — METİN CEMİL'İN DÜZELTMESİYLE.
             Eskiden *"Söylediklerin ruhsat ekranına yazıldı; ruhsatı
             çekince marka, model ve motor kendiliğinden dolar"* diyordu.
             Cemil: *"Bu açıklama doğru değil. Araç kayıtlı değil.
             Ruhsatı çekebilir ya da bu aşamayı atlayabilirsin."*

             Haklı: uzun cümle ustaya BİR ŞEY ÖĞRETMEYE çalışıyordu.
             Oysa ekranda zaten iki düğme var ve ikisi ne yapılacağını
             söylüyor. Açıklama, düğmelerin söylediğini tekrar
             ediyordu. */
          (rOkundu
            ? 'Ruhsat okundu — alanları kontrol et, yanlış varsa düzelt.'
            : 'Ruhsatı çekebilirsin ya da bu aşamayı atlayabilirsin.') +
        '</span>' +
      '</div>';
    aracKart.hidden = false;
  }

  /* ---- YIL ve TELEFON: yazarken değil, YAZILDIKTAN sonra denetlenir. */
  var yilEl = document.getElementById('rYil');
  var telEl = document.getElementById('rTel');
  var uyari = [];
  if (yilEl && yilEl.value.length === 4 && !yilGecerli(yilEl.value)) {
    uyari.push('Model yılı 1950 ile ' + (BUGUN.getFullYear() + 1) + ' arasında olmalı.');
  }
  if (telEl && telEl.value && !telGecerli(telEl.value)) {
    uyari.push('Telefon 11 hane olmalı ve 0 ile başlamalı.');
  }
  var uy = document.getElementById('rUyari');
  if (uy) {
    uy.innerHTML = uyari.length
      ? '<div class="notice warn">' +
          '<span class="n-ic"><svg class="ico ico-sm"><use href="#i-triangle-alert"></use></svg></span>' +
          '<span class="n-body">' + uyari.join('<br>') + '</span></div>'
      : '';
  }

  rDetaySayac();
  rEylemCiz(plakaGecerli(p), !!a);
}

/* ---- DÜĞMELER ----
   ⚠️ HİÇBİRİ `disabled` DEĞİL (06.09). Kapalı düğme sessizdir: Cemil
   "Kaydı aç"a bastı, hiçbir şey olmadı ve neden olmadığını ekran
   söylemedi. Düğme artık her zaman basılabilir; eksik varsa BASINCA
   söylüyor ve eksik alana götürüyor. */
function rEylemCiz(plakaTamam, kayitli) {
  var el = document.getElementById('rEylem');
  if (!el) return;

  /* Ruhsat TEKLİFİ yalnız: plaka geçerli · araç kayıtsız · ruhsat
     henüz okunmamış · plaka sekmesindeyiz. Dördü de doğruysa Cemil'in
     istediği iki düğme çıkar. */
  var ruhsatTeklif = plakaTamam && !kayitli && !rOkundu && rSekme === 'plaka';

  el.innerHTML = ruhsatTeklif
    ? '<button class="btn btn-primary btn-lg" id="kaydiAc">' +
        '<svg class="ico"><use href="#i-check"></use></svg>' +
        ' Ruhsat adımını geç ve kaydı aç</button>' +
      '<button class="btn btn-ghost" id="ruhsataGit" style="margin-top:10px">' +
        '<svg class="ico"><use href="#i-camera"></use></svg> Ruhsatı çek</button>'
    /* ⚠️ 08.09 — PLAKA YOKKEN "KAYDI AÇ" GÖRÜNMÜYOR.
       Cemil (telefon testi): *"Sayfada herşey yapılabiliyor gözüküyor.
       Adımlar birbirini takip etmeli."* Bunu servis kaydı ekranı için
       söyledi ama aynı kusurun küçük hâli buradaydı: ekran açılır
       açılmaz, daha tek harf yazılmadan, en alttaki birincil düğme
       *"Kaydı aç"* diyordu. Basılınca hiçbir şey olmuyordu (balon
       plakayı isterdi) — yani ekranın en büyük, en renkli öğesi
       ustadan bir şey yapmasını istiyor ama yapılacak şey henüz yok.

       K-040.3 ("kapalı düğme yok, konuşan düğme var") burada
       çiğnenmiyor: düğme SÖNÜK DEĞİL, HENÜZ YOK. Sönük düğme "burası
       bozuk" der; olmayan düğme "sıra sende değil" der. Yerinde ne
       yapılacağını söyleyen bir satır duruyor. */
    : (plakaTamam
        ? '<button class="btn btn-primary btn-lg" id="kaydiAc">' +
            '<svg class="ico"><use href="#i-check"></use></svg> Kaydı aç</button>'
        : '<p class="plate-hint">Plakayı yaz ya da mikrofona söyle — ' +
          'kaydı açan düğme burada çıkacak.</p>');
}

Ekran.tanim('ruhsat', {
  /* ⚠️ HEPSİ AÇILIŞ İŞİ (K-040). Bu gövde `ciz`deyken her tazeleme
     ustanın YAZDIĞI PLAKAYI siliyordu. Bugün ruhsat ekranında
     tazeleyen bir yol yoktu — ama bir tane eklemek tek satırlık bir
     iş ve o satırı yazan kişi bunun plakayı sileceğini bilemezdi. */
  ac: function () {
    /* Ekran her açılışta TEMİZ başlar — yarım kalmış kayıt sonrakine
       sızmasın. */
    R_ALANLAR.forEach(function (id) {
      var e = document.getElementById(id); if (e) e.value = '';
    });
    rOkundu = false;
    ruhsatSekme('plaka');

    /* MİKROFONUN YANINDA ÖRNEK CÜMLE VAR (Cemil, 06.09). Alan listesi
       değil, taklit edilebilir cümleler: plaka + ad soyad + telefon +
       yapılan iş. */
    document.getElementById('rSesBekleniyor').innerHTML =
      '<span class="n-ic"><svg class="ico ico-sm"><use href="#i-mic"></use></svg></span>' +
      '<span class="n-body"><b>Mikrofona bas ve söyle.</b> Örnek:' +
        '<br><i>"34 ABC 123, Mehmet Kaya, 0532 215 30 00, triger seti değişecek"</i>' +
        '<br><i>"41 KV 5588, Ahmet Yılmaz, 0532 111 22 33, debriyaj kaçırıyor"</i>' +
        '<br><i>"06 TMR 07, yağ ve filtre bakımı, kilometre 88 bin"</i>' +
      '</span>';

    /* SESTEN GELEN ÖN DOLGU — usta söylediğini İKİNCİ KEZ yazmasın.
       Not okunur ve TEMİZLENİR; bırakılsa bir sonraki açılışa sızardı. */
    if (RUHSAT_ONDOLGU) {
      var o = RUHSAT_ONDOLGU; RUHSAT_ONDOLGU = null;
      if (o.plaka) document.getElementById('rPlaka').value = plakaBicim(o.plaka);
      if (o.sahipAd) document.getElementById('rSahip').value = o.sahipAd;
      if (o.sahipTel) document.getElementById('rTel').value = o.sahipTel;
      /* ⚠️ SESİN ÇÖZDÜĞÜ TÜR ÇÖPE GİDİYORDU (06.09, ölü uç turu).
         Ses ekranı "bakıma geldi" cümlesinden türü zaten çıkarıyor ve
         RUHSAT_ONDOLGU.tur'a yazıyor; dün buradaki okuma satırını
         kaldırınca alan ölü veri oldu ve tür metinden YENİDEN tahmin
         edilmeye başladı. İkinci tahmin birincisinden iyi değil —
         üstelik ses, türü `is` metninde geçmeyen bir sözden çıkarmış
         olabilir. Söylenen bilgi, tahmin edilen bilgiyi yener. */
      rSesNotu = { is: o.is || '', tur: o.tur || null, km: o.km || '' };
      ruhsatDurum();
      if (o.is) {
        document.getElementById('rSesBekleniyor').innerHTML =
          '<span class="n-ic"><svg class="ico ico-sm"><use href="#i-mic"></use></svg></span>' +
          '<span class="n-body">Söylediğin yazıldı: <b>' + o.is + '</b>.' +
          ' Kayıt açılınca "ne istiyor" alanına düşecek.</span>';
      }
    } else {
      rSesNotu = null;
      ruhsatDurum();
    }
  },
  /* Tazeleme yalnız DURUMU yeniden çizer; alanlara dokunmaz. */
  ciz: function () { ruhsatDurum(); }
});

/* ---- sahte okuma ----
   Gerçek okuma bir servise bağlanacak (RUHSAT-OKUMA.md C yolu).
   Burada ekranın DAVRANIŞI gösteriliyor: alanlar dolar, HEPSİ
   DÜZELTİLEBİLİR, hiçbiri kendiliğinden kaydedilmez.

   Örnek kayıtlar ARTIK TAM: renk, yakıt, şasi, motor no, hacim, güç,
   koltuk, ilk tescil. Yarım örnek, "bu alanlar zaten dolmaz" diye
   yanlış bir izlenim bırakıyordu. */
var RUHSAT_ORNEK = [
  { plaka: '41 P 3873', marka: 'Hyundai', model: 'i20', yil: '2020',
    motor: '1.4 MPI', renk: 'Beyaz', yakit: 'Benzin',
    vin: 'NLHB351CALZ123456', motorNo: 'G4LAJH123456',
    silindir: '1368', guc: '74', koltuk: '5', depo: '50',
    ilkTescil: '09.07.2020' },
  { plaka: '06 BFT 41', marka: 'Ford', model: 'Focus', yil: '2017',
    motor: '1.5 TDCi', renk: 'Gri Metalik', yakit: 'Dizel',
    vin: 'WF0PXXGCHPHR12345', motorNo: 'XWDA1234567',
    silindir: '1499', guc: '88', koltuk: '5', depo: '52',
    ilkTescil: '28.02.2017' }
];
var ruhsatSira = 0;

/* Kamera ve galeri AYNI SONUCU verir — ikisi de bir görüntüden alan
   doldurur. Ayrı davranmaları için bir sebep yok; ayrı davransalardı
   iki ayrı hata sınıfı doğardı. */
function ruhsatOku(kaynak) {
  var r = RUHSAT_ORNEK[ruhsatSira % RUHSAT_ORNEK.length];
  ruhsatSira++;
  var esle = { rPlaka: 'plaka', rMarka: 'marka', rModel: 'model', rYil: 'yil',
    rMotor: 'motor', rRenk: 'renk', rYakit: 'yakit', rVin: 'vin',
    rMotorNo: 'motorNo', rSilindir: 'silindir', rGuc: 'guc',
    rKoltuk: 'koltuk', rDepo: 'depo', rIlkTescil: 'ilkTescil' };
  Object.keys(esle).forEach(function (id) {
    var e = document.getElementById(id);
    if (e) e.value = r[esle[id]] || '';
  });
  rOkundu = true;

  /* ⚠️ SEKME DEĞİŞMİYOR (Cemil'in bildirdiği hata). Okunan plaka
     BURADA gösteriliyor ki usta bastığı düğmenin sonucunu görsün. */
  document.getElementById('rOkuma').innerHTML =
    '<div class="card" style="margin-top:12px">' +
      '<div class="arac-bas">' + plakaHtml(r.plaka, 'plate-lg') +
        '<div class="veh-title">' + r.marka + ' ' + r.model +
          ' <span class="yr">' + r.yil + '</span></div>' +
        '<div class="spec-strip">' +
          '<span class="spec-val">' + r.motor + '</span>' +
          '<span class="spec-sep">·</span>' + renkKutuHtml(r.renk) +
        '</div>' +
      '</div>' +
      '<p class="plate-hint">' + (kaynak === 'galeri' ? 'Galeriden okundu' : 'Ruhsattan okundu') +
        ' — aşağıdaki alanlarda hepsi düzeltilebilir.</p>' +
    '</div>';

  ruhsatDurum();
  balon('Ruhsat okundu — yanlış varsa aşağıdan düzelt.', false, 3000);
}

document.addEventListener('click', function (e) {
  var t = e.target.closest('button');
  if (!t || Ekran.adi() !== 'ruhsat') return;

  if (t.id === 'sekPlaka') { ruhsatSekme('plaka'); return; }
  if (t.id === 'sekRuhsat' || t.id === 'ruhsataGit') { ruhsatSekme('ruhsat'); return; }

  if (t.id === 'ruhsatCek') { ruhsatOku('kamera'); return; }
  if (t.id === 'ruhsatGaleri') { ruhsatOku('galeri'); return; }

  /* Araç alanlarının mikrofonu: bağlam "servis-ekle". */
  if (t.id === 'rAracMik') { sesleAc('servis-ekle'); return; }

  if (t.id === 'kaydiAc') {
    var p = plakaBicim(document.getElementById('rPlaka').value);

    /* ⚠️ DÜĞME ARTIK SESSİZ DEĞİL. Eksik olan neyse SÖYLENİYOR ve
       imleç oraya gidiyor. Kapalı düğme yerine konuşan düğme. */
    if (!plakaGecerli(p)) {
      ruhsatSekme('plaka');
      balon('Önce plakayı yaz — ör. 34 ABC 123.', false, 3000);
      var pe = document.getElementById('rPlaka');
      if (pe) { try { pe.focus(); } catch (x) {} }
      return;
    }

    if (!aracBul(p)) {
      ARACLAR.push({
        plaka: p,
        marka: rDeger('rMarka'), model: rDeger('rModel'),
        yil: rDeger('rYil'), motor: rDeger('rMotor'),
        renk: rDeger('rRenk'), yakit: rDeger('rYakit'),
        vin: rDeger('rVin'), motorNo: rDeger('rMotorNo'),
        silindir: rDeger('rSilindir'), guc: rDeger('rGuc'),
        koltuk: rDeger('rKoltuk'), depo: rDeger('rDepo'),
        ilkTescil: rDeger('rIlkTescil'),
        sahipAd: rDeger('rSahip'), sahipTel: rDeger('rTel'),
        not: ''
      });
    }

    var isMetni = (rSesNotu && rSesNotu.is) || '';
    var yeni = {
      id: KAYITLAR.length + 1, plaka: p,
      /* TÜR EKRANDA SORULMUYOR (Cemil, 06.09). Sesle geldiyse SESİN
         çözdüğü tür, yoksa iş metninden tahmin. İkisi de kayıt
         ekranında düzeltilebilir. */
      tur: (rSesNotu && rSesNotu.tur) || isTuruTahmin(isMetni),
      turElle: !!(rSesNotu && rSesNotu.tur),
      /* Km ekranda sorulmuyor (07.09); yalnız sesin duyduğu değer
         geçiyor. Yoksa boş kalır ve servis kaydında yazılır. */
      km: (rSesNotu && rSesNotu.km) || '',
      /* Sesle söylenen iş şikâyet olarak düşer. */
      sikayet: isMetni,
      acilis: bugunMetin(), teslimTarihi: null, odemeYolu: null,
      hatirlatmaTarihi: null, hatirlatmaGonderildi: false,
      parcaBekliyor: false, bekliyorMusteriye: false, satirlar: []
    };
    KAYITLAR.push(yeni);
    ACIK_KAYIT = yeni.id;
    Ekran.ac('kayit');
  }
});

/* Biçimleme ÇEKİRDEKTE (data-giris), burada yalnız ekranın durumu
   tazeleniyor. */
document.addEventListener('input', function (e) {
  if (!e.target || Ekran.adi() !== 'ruhsat') return;
  if (['rPlaka', 'rYil', 'rTel'].indexOf(e.target.id) >= 0) { ruhsatDurum(); return; }
  if (e.target.closest('#rDetayGovde')) rDetaySayac();
});
</script>
