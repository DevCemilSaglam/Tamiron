<!-- ekran: mesaj · MÜŞTERİYE MESAJ
     03.09 — Cemil: "Müşteriye mesaj yaz ekranı kullanılabilir. Sesle
     işlem yapılabilir. x plaka sahibine whatsapp mesajı gönder gibi
     bir işlem olabilir."

     WHATSAPP.md'DEKİ A YOLU: mesajı BİZ hazırlıyoruz, usta KENDİ
     WhatsApp'ından gönderiyor. Karşılığında hiçbir kurulum yok —
     Meta hesabı, işletme doğrulaması, şablon onayı gerekmiyor.
     Parça sorma ekranı da aynı yolu kullanıyor; iki yerde iki ayrı
     yöntem olsaydı biri mutlaka bozuk kalırdı.

     ALTI ŞABLON, HER BİRİ BİR KOŞULLA (14.09):
       özet        → serviste VE özeti gönderilmemiş   (altıncı iş)
       bekliyor    → serviste VE gerçekten parça bekliyor
       hazır       → serviste                          (teslim öncesi haber)
       teslim      → teslim edilmiş VE hiç mesaj gitmemiş
       hatırlatma  → serviste değil VE bakımı var      (yedinci iş)
       serbest     → her zaman  (ustanın kendi cümlesi · sesli yol)

     ⚠️ 14.09 — GÖNDERİM GEÇMİŞİ ARTIK VAR (Cemil: "Gönderilen mesajlar
     listelenebilmeli"). Bu ekranın "ÜZERİNDE YOK" listesinden çıktı.
     Geçmiş iki işi birden yapıyor: ustaya ne gönderdiğini gösteriyor ve
     şablon koşullarını besliyor (K-045.3: kayıtlar üç yıl saklanır).

     ÜZERİNDE YOK: okundu bilgisi · mesaj şablonu düzenleyici.

     BİLEŞENLER v1'DEN: .screen-head .eyebrow · .card · .section-label
     · .search-box · .mus-kart · .tl-item · .cip-grup .cip · .field
     · .notice · .btn · .plate · .tel-link · .akordiyon.
     Yeni bileşen yazılmadı. -->

    <!-- GÖNDERİLEN MESAJLAR (14.09) — Cemil: "Gönderilen mesajlar

         AKORDİYON, EKRAN DEĞİL: bu bir BAŞVURU listesi — usta günde bir
         kez "şunu göndermiş miydim" diye bakar. Kendi ekranı olsaydı

    <div id="msjArsiv"></div>

  <div id="msjYazim" class="yigin" hidden>
    <!-- ⚠️ MÜŞTERİ DEĞİŞTİRME YUKARIDA (Cemil, 06.09: "Müşteriye mesaj
         alanında müşteri seçilebilir olmalı").

         Düğme vardı ama EKRANIN DİBİNDEYDİ — metnin, önizlemenin ve

    <div class="section-label with-action">

        <svg class="ico ico-sm"><use href="#i-user"></use></svg> Kime gidiyor

      <button class="cip" id="msjBaskasi">Değiştir</button>
    </div>
    <div class="card" id="msjKunye"></div>

    <!-- ⚠️ 14.09 — BU MÜŞTERİYE DAHA ÖNCE NE GİTTİ (Cemil: "Müşteriye

         listelensin, açılabilsin ve detayı görülebilsin.").

         KAPALI AÇILIYOR ve bu bilinçli: usta mesaj yazmaya geldi,
         geçmiş okumaya değil. Ama "bunu zaten yazmış mıydım" sorusu

    <div id="msjGecmis"></div>

    <div class="section-label">
      <svg class="ico ico-sm"><use href="#i-message-square"></use></svg> Ne yazılsın?

    <div class="cip-grup" id="msjSablon" role="group" aria-label="Mesaj şablonu"></div>

    <div class="card">
      <div class="section-label with-action">
        <span class="lbl-txt">Mesaj</span>
        <!-- ⚠️ DİKTE, KOMUT DEĞİL (08.09). Bu mikrofon mesajın METNİNİ
             yazdırıyor; ses ekranını açmıyor. Kime gönderileceğini
             söylemek isteyen usta yukarıdaki arama kutusunun

        <button class="daire-btn" id="msjMik" data-dikte="msjMetin"

           PROTOTİPTE DÜZELTME SAHTE ve bu ekranda YAZILI. Gerçek model
           backend ister (anahtar tarayıcıda duramaz — YAPAY-ZEKA.md §4);
           bugün yazılan şey AKIŞ: düzelt → ÖNCE/SONRA karşılaştır →
           onayla ya da vazgeç.

           Neden akışı şimdi yazıyoruz: model bağlandığında değişecek
           tek şey düzeltmeyi kimin yaptığı. Onay adımı olmasaydı model
           ustanın cümlesini sessizce değiştirirdi — K-017'nin kuralı

      <button class="btn btn-ghost" id="msjZeka">

    <div id="msjUyari"></div>

    <!-- ÖZETİ GÖR — 04.09. Mesaj artık liste değil LİNK taşıyor (T-20);

    <div id="msjOnizle"></div>

    <!-- ⚠️ ÜÇ KANAL (Cemil, 06.09: "whatsapp, telefon uygulama, mesaj
         olarak gönderebiliriz").

         WHATSAPP BİRİNCİL ÇÜNKÜ BEDAVA. SMS paralı ve İYS kaydı
         istiyor (SMS.md); yine de duruyor, çünkü WhatsApp'ı olmayan
         müşteri var ve o zaman tek yol SMS. "Ara" bir mesaj kanalı
         değil ama aynı sorunun cevabı: bazı müşteriye yazmak değil,
         söylemek gerekir.

         ÜÇÜ DE AYNI METNİ TAŞIR. Kanala göre farklı metin üretmek —
         "SMS kısa olsun" gibi — ustanın gördüğü metinle giden metni
         ayırırdı; gönderdiğinden başka bir şeyin gittiğini ancak
         müşteri sorunca öğrenirdi. -->
    <!-- ⚠️ SEBEP DUGMEYE BAGLI (37. test). Telefon yoksa uc dugme de
         kapali kaliyor ve nedenini #msjUyari yaziyor; aria-describedby

    <button class="btn btn-primary btn-lg" id="msjGonder" aria-describedby="msjUyari">
      <svg class="ico"><use href="#i-message-square"></use></svg> WhatsApp ile gönder
    </button>
    <div class="btn-row">
      <button class="btn btn-ghost" id="msjSms" aria-describedby="msjUyari">
        <svg class="ico"><use href="#i-message-square"></use></svg> SMS

      <button class="btn btn-ghost" id="msjAra" aria-describedby="msjUyari">
        <svg class="ico"><use href="#i-phone"></use></svg> Ara

    </div>
  </div>

</section>

<script>
var msjPlaka = null;
var msjSablonSecili = 'ozet';
/* Katmanda gosterilen duzeltme onerisi — onaylanana kadar metne
   YAZILMAZ (K-017: onaysiz hicbir sey). */
var msjZekaOneri = null;
/* Hangi hedefe gidiyor — null ise varsayilan (telefonu olan ilk sira). */
var msjHedefSecili = null;

/* ⚠️ 06.09 — DÖRDÜNCÜ ŞABLON: PARÇA BEKLİYORUZ (Cemil: "Parça
   beklediğine dair mesaj da gönderebiliriz").

   Bu mesaj yeni bir iş değil, VAR OLAN İŞİN sessiz kalan yarısı:
   müşteri aracını bıraktı ve haber bekliyor. Haber gelmeyince
   müşteri arıyor, usta telefonda vakit kaybediyor — tamircinin
   şikâyet ettiği şeylerden biri. */
/* ⚠️ 14.09 — ŞABLON LİSTESİ DEĞİL, ŞABLON KURALI (Cemil, telefon
   testi): *"Teslim edilmiş ve mesaj gönderilmemiş araca teslim edildi
   mesajı gönderebilir. Yine serviste olan ve işin özeti gönderilmemiş
   araca işin özeti gönderilebilir. Ve gerçekten parça bekliyor
   durumunda olana parça bekleniyor mesajı gidebilir."*

   Üç cümlenin ortak yanı: her şablonun bir KOŞULU var ve koşul iki
   şeyden okunuyor — kaydın durumu (serviste · teslim · parça bekliyor)
   ve **daha önce ne gönderildiği** (mesaj arşivi). İkincisi bugüne
   kadar hiç yoktu; o yüzden "işin özeti" gönderilmiş araca ikinci kez
   teklif ediliyordu.

   KOŞUL ŞABLONUN YANINDA DURUR. Süzme kuralını çizim yerine yazsaydım
   aynı kural iki yere (çip listesi ve metin üretimi) dağılırdı; burada
   şablon kendi koşulunu taşıyor, ekran yalnız `uygun()` soruyor.

   `serbest` HER ZAMAN VAR: koşulların hepsi elense bile ustanın
   söyleyeceği bir şey olabilir (*"selam mesajı gönder"*). Şablonsuz
   kalan bir ekran, ustayı boş bir kutuyla baş başa bırakır. */
/* ⚠️ 14.09 — ŞABLON KURALLARI BU EKRANDAN ÇIKTI (MESAJ_SABLONLARI,
   02-veri.js). Sebep: aynı kuralı SÜREÇ ŞERİDİ de soruyor ("şimdi ne
   gönderilebilir"). İki yerde iki kural, iki ayrı cevap demektir
   (K-019.1) — ekran "özet gönderilebilir" derken süreç sessiz kalırdı.
   Ekranda kalan tek şey çizim. */

/* Balonun ne diyeceği kanala göre değişir — ama HEPSİ "açılıyor" der,
   "gönderildi" DEMEZ. Uygulama mesajı bizim yerimize göndermiyor;
   ustanın WhatsApp'ını mesaj hazır hâlde açıyor (WHATSAPP.md A yolu).
   "Gönderildi" demek, 04.09'da bir kez yaptığım yalanı tekrar etmek
   olurdu. */
var KANAL_METIN = {
  whatsapp: 'WhatsApp açılıyor',
  sms: 'Mesaj uygulaması açılıyor',
  ara: 'Aranıyor'
};

/* Hangi kaydın özeti — TEK YERDE. Metin bir kayıttan, önizleme başka
   bir kayıttan üretilseydi usta gönderdiğinden farklı bir şey görürdü
   ve bunu ancak müşteri sorunca anlardı. */
function msjOzetKaydi(plaka) {
  return acikKayit(plaka) || sonKayit(plaka);
}

/* ⚠️ 14.09 — METİN ÜRETİMİ BU EKRANDAN ÇIKTI (mesajMetniUret,
   03-nesne.js). Sesli işlem de mesaj göndermeye başladı ve ekran
   betikleri kendi IIFE'sine sarıldığı için buradaki fonksiyonu
   göremiyordu. İkinci kopya, ustanın onay ekranında gördüğü metinle
   gerçekte gidenin ayrılması demekti.

   Ekranda kalan tek şey, ekrana ait olan: hangi hedef seçili. */
function msjMetinUret(plaka, sablon) {
  return mesajMetniUret(plaka, sablon, msjHedefSecili);
}

/* ---- SAHTE DÜZELTME (14.09) ----
   ⚠️ BU BİR YAPAY ZEKA DEĞİL, üç kuralı olan bir temizleyici:
     · satır içi fazla boşluklar toparlanır
     · ilk harf büyütülür
     · imza (dükkân adı + telefon) yoksa eklenir
   Bilerek küçük. Zeki görünen sahte bir çıktı — "modelin yazdığı güzel
   cümle" — olmayan bir yeteneği göstermek olurdu.

   ⚠️ TÜRKÇE BÜYÜK HARF `toLocaleUpperCase('tr')` İLE: `toUpperCase()`
   "istanbul"u "ISTANBUL" yapıyor, "İSTANBUL" değil (K-018'in akrabası —
   Türkçe, ASCII varsayımlarını sessizce bozar). */
function msjSahteDuzelt(metin, plaka) {
  var imza = mesajImzasi().trim();
  var govde = String(metin).replace(/[ \t]{2,}/g, ' ')
                           .replace(/\n{3,}/g, '\n\n')
                           .trim();
  /* İmzayı ayır, gövdeyi düzelt, sonra geri ekle — imzanın içindeki
     boşluklarla oynamak dükkân adını bozardı. */
  if (imza && govde.indexOf(imza) >= 0) {
    govde = govde.slice(0, govde.indexOf(imza)).trim();
  }
  if (govde) {
    govde = govde.charAt(0).toLocaleUpperCase('tr') + govde.slice(1);
  }
  return govde + mesajImzasi();
}

function msjSecimCiz() {
  /* ⚠️ 14.09 — LİSTE MÜŞTERİLER EKRANININ AYNISI (Cemil: "Müşteriye
     mesaj ve müşteriler sayfasının listelemeleri aynı olacak.").

     NE OLMUŞTU: burada ARAÇ BAŞINA bir satır vardı, müşteriler
     ekranında MÜŞTERİ başına. İki aracı olan müşteri burada iki kez,
     ötekinde bir kez görünüyordu — aynı veri, iki ayrı dünya. Şimdi
     ikisi de `musteriListesi()` süzüyor ve `musteriKartiHtml()`
     çiziyor; servistekiler ikisinde de üstte ve çerçevesi renkli.

     SATIR HANGİ ARACI GÖSTERİYORSA MESAJ ONA GİDER (musteriAraci):
     serviste olan ilk araç, yoksa ilk araç. Başka bir aracına mesaj
     yazılacaksa "Tüm araçlar" müşteri detayını açıyor. */
  var q = (document.getElementById('msjQ') || {}).value || '';
  var liste = musteriListesi(q);
  document.getElementById('msjArama').classList.toggle('filled', !!q);

  document.getElementById('msjListe').innerHTML = liste.length
    ? liste.map(function (m) { return musteriKartiHtml(m, 'mesaj'); }).join('')
    : bosDurumHtml('i-users', 'Eşleşen müşteri yok',
        'Adın, telefonun ya da plakanın bir kısmını yazman yeter.');

  /* ⚠️ 14.09 — ARŞİV BURADAN KENDİ SAYFASINA TAŞINDI (Cemil:
     *"Gönderilen mesajlar binlerce olduğunda nasıl listelenecek?
     Yeni bir sayfa daha uygun olabilir."*).

     Sabah yazdığım akordiyon üç mesajla güzel görünüyordu; üç yüzle
     kullanılamaz olurdu. Burada kalan tek şey KAPI: sayıyı söyleyen
     bir düğme. */
  var arsiv = mesajArsivi();
  document.getElementById('msjArsiv').innerHTML =
    '<button class="btn btn-ghost" data-git="mesajlar">' +
      '<svg class="ico"><use href="#i-message-square"></use></svg> ' +
      (arsiv.length ? 'Gönderilen mesajlar · ' + arsiv.length
                    : 'Gönderilen mesajlar') +
    '</button>';
}

function msjYazimCiz() {
  var a = aracBul(msjPlaka);
  if (!a) return;

  var hedefler = mesajHedefleri(msjPlaka);
  var hedef = mesajHedefi(msjPlaka, msjHedefSecili);

  document.getElementById('msjKunye').innerHTML =
    '<div class="arac-bas">' + plakaHtml(msjPlaka, 'plate-lg') +
      '<div class="veh-title">' + (a.sahipAd || 'sahip yazılmamış') + '</div>' +
      '<div class="spec-strip"><span class="spec-val">' +
        a.marka + ' ' + a.model + '</span></div>' +
    '</div>' +
    /* KİME GİDİYOR, GÖNDERMEDEN ÖNCE GÖRÜNÜR (A-M2). Ruhsat firmanınsa
       santral numarası ile aracı getiren kişinin numarası ayrı; hangisine
       gittiği yazmıyorsa usta yanlış kişiye özet gönderir ve bunu
       ancak karşı taraf sorunca öğrenir. */
    (hedefler.length > 1
      ? '<div class="section-label" style="margin-top:14px">Kime gidecek?</div>' +
        '<div class="cip-grup">' + hedefler.map(function (x) {
          return '<button class="cip" data-hedef="' + x.anahtar + '" aria-pressed="' +
            (hedef && hedef.anahtar === x.anahtar) + '"' +
            (x.tel ? '' : ' disabled') + '>' + x.rol + ': ' +
            (x.ad || 'ad yok') + (x.tel ? '' : ' (telefon yok)') + '</button>';
        }).join('') + '</div>'
      : '') +
    (hedef && hedef.tel
      ? telLinkHtml(hedef.tel, hedef.ad)
      : '');

  /* SON BEŞ MESAJ — kapalı akordiyon, altında tümüne giden link.
     Beş sayısı Cemil'in: ekranda kalabalık yapmayan, "son ne oldu"
     sorusuna yeten sayı. Tamamı kendi sayfasında. */
  var gecmis = mesajArsivi(msjPlaka);
  document.getElementById('msjGecmis').innerHTML = akordiyonHtml(
    'msjGecmisGovde', 'i-clock', 'Bu müşteriye gidenler',
    gecmis.length ? gecmis.length + ' mesaj' : 'yok',
    (gecmis.length
      ? gecmis.slice(0, 5).map(mesajSatiriHtml).join('')
      : bosDurumHtml('i-message-square', 'Bu araca mesaj gitmemiş',
          'Gönderdiğin ilk mesaj burada görünecek.')) +
    (gecmis.length > 5
      ? '<button class="btn btn-ghost" id="msjTumMesajlar" style="margin-top:10px">' +
          '<svg class="ico"><use href="#i-message-square"></use></svg>' +
          ' Tüm mesajları (' + gecmis.length + ')</button>'
      : (gecmis.length
          ? '<button class="btn btn-ghost" id="msjTumMesajlar" style="margin-top:10px">' +
              '<svg class="ico"><use href="#i-message-square"></use></svg>' +
              ' Tüm mesajları</button>'
          : '')));

  /* ⚠️ ŞABLONU KOŞULU SÜZER (07.09'dan beri, 14.09'da genişledi).
     07.09: *"Serviste olmayan araca işin özeti, parça bekliyoruz
     alanları olmamalı."* — iki şablon da AÇIK BİR İŞİ anlatıyor.
     14.09: koşullar "daha önce ne gönderildi" sorusunu da soruyor.
     Kural artık şablonun kendi üstünde (MSJ_SABLON[].uygun). */
  var uygun = uygunSablonlar(msjPlaka);
  /* Seçili şablon elenmiş olabilir — o zaman ilk uyguna düşülür,
     yoksa ekran "hiçbiri seçili değil" hâlinde kalır. */
  if (!uygun.filter(function (s) { return s.k === msjSablonSecili; }).length) {
    msjSablonSecili = uygun.length ? uygun[0].k : null;
    document.getElementById('msjMetin').value =
      msjSablonSecili ? msjMetinUret(msjPlaka, msjSablonSecili) : '';
  }
  document.getElementById('msjSablon').innerHTML = uygun.map(function (s) {
    return '<button class="cip" data-sablon="' + s.k + '" aria-pressed="' +
      (msjSablonSecili === s.k) + '">' + SABLON_AD[s.k] + '</button>';
  }).join('');

  /* TELEFON YOKSA GÖNDERİLEMEZ ve bu ÖNCEDEN söylenir — düğmeye
     bastıktan sonra öğrenmek, ustayı boşuna uğraştırır. */
  var tel = hedef && hedef.tel;
  /* ⚠️ TELEFON YOKSA ÇIKIŞ YOLU BURADA (Cemil, 07.09: "Telefon
     eklemelisiniz uyarı mesajı ve telefon yazabileceği basit bir
     popup açılabilir.").

     Eskiden uyarı *"önce araç kaydına telefon yaz"* diyordu ve usta
     mesaj ekranından çıkıp aracı bulup telefonu yazıp geri gelmek
     zorundaydı — dört ekran. Uyarının çözümü kendi yanında olmalı:
     ölü uç turunun (K-021) kuralı. */
  document.getElementById('msjUyari').innerHTML = tel ? '' :
    '<div class="notice warn">' +
      '<span class="n-ic"><svg class="ico ico-sm"><use href="#i-triangle-alert"></use></svg></span>' +
      '<span class="n-body">Bu aracın <b>telefonu yok</b>. Mesaj gönderilemez.' +
      '</span></div>' +
    '<button class="btn btn-primary" id="msjTelEkle" style="margin-top:10px">' +
      '<svg class="ico"><use href="#i-phone"></use></svg> Telefon ekle</button>';
  ['msjGonder', 'msjSms', 'msjAra'].forEach(function (id) {
    var d = document.getElementById(id);
    if (d) d.disabled = !tel;
  });

  /* Önizleme YALNIZ özet şablonunda: linki taşıyan tek şablon o.
     "Hazır" ve "hatırlatma" mesajlarında gösterilecek bir sayfa yok. */
  var ozetK = msjOzetKaydi(msjPlaka);
  document.getElementById('msjOnizle').innerHTML =
    (msjSablonSecili === 'ozet' && ozetK)
      ? '<button class="btn btn-ghost" id="msjOzetGor">' +
          '<svg class="ico"><use href="#i-file-text"></use></svg>' +
          ' Müşteri ne görecek?</button>'
      : '';
}

Ekran.tanim('mesaj', {
  /* ⚠️ 08.09 — "MÜŞTERİ SEÇ" BİR ADIMDIR, EKRAN DEĞİL.
     Cemil: *"Müşteriye mesaj gönder ekranında bir müşteri seçilip geri
     gelince ana menüye atıyor."*

     Doğrusu: seçim yapıldıysa geri tuşu SEÇİM LİSTESİNE döner; ekrandan
     çıkmak ikinci geri. "Başkasına gönder" düğmesi duruyor ama artık
     geri tuşunun işini yapan ikinci bir yol değil — aynı işin adı
     konmuş hâli. */
  geriVar: function () { return !!msjPlaka; },
  geriAl: function () { msjPlaka = null; msjHedefSecili = null; },
  ciz: function () {
    /* Ses buraya hedef bırakmış olabilir. Okunur ve TEMİZLENİR;
       bırakılsa bir sonraki açılışa sızardı. */
    if (MESAJ_HEDEF) {
      msjPlaka = MESAJ_HEDEF.plaka;
      msjSablonSecili = MESAJ_HEDEF.sablon || 'ozet';
      msjHedefSecili = null;      /* yeni müşteri, varsayılan hedefe dön */
      MESAJ_HEDEF = null;
      document.getElementById('msjMetin').value = msjMetinUret(msjPlaka, msjSablonSecili);
    }
    var yaziyor = !!msjPlaka;
    document.getElementById('msjSecim').hidden = yaziyor;
    document.getElementById('msjYazim').hidden = !yaziyor;
    /* ⚠️ SEÇİM ADIMI GİZLİYKEN DE TAZELENİR (14.09). Eskiden yalnız
       görünen adım çiziliyordu; gizli kalan adımın DOM'u eskiyordu ve
       bugün arşiv listesi oraya girince tuzak işledi — gönderilmiş
       mesaj sayısını hidden bir kaptan okuyup yanlış sayıyı gördüm
       (K-040.5'in aynısı: "duran bir şey er ya da geç okunur").
       Yazım adımı msjPlaka olmadan çizilemez, o yüzden koşullu. */
    msjSecimCiz();
    if (yaziyor) msjYazimCiz();
  }
});

document.addEventListener('click', function (e) {
  /* ⚠️ SATIRIN İÇİNDEKİ İKİ ÇIKIŞ SATIRIN İŞİ DEĞİL (14.09).
     Ortak müşteri satırı iki şey taşıyor: telefon bağlantısı (dokunan
     ARAMAK istiyor) ve "Tüm araçlar" (dokunan MÜŞTERİYİ açmak istiyor).
     İkisi de satırın kendi işini tetiklememeli — yoksa numaraya
     dokunan usta hem arar hem mesaj ekranına düşer. Aynı korumanın
     ilki 03-nesne.js'te yazılıydı; kural kabı değişince taşınmadı. */
  if (e.target.closest('[data-tel]') || e.target.closest('.mus-link')) return;

  var t = e.target.closest('button, [data-mesaj-plaka]');
  if (!t) return;

  var p = t.getAttribute('data-mesaj-plaka');
  if (p) {
    msjPlaka = p; msjSablonSecili = 'ozet';
    document.getElementById('msjMetin').value = msjMetinUret(p, 'ozet');
    Ekran.tazele(); return;
  }

  var s = t.getAttribute('data-sablon');
  if (s) {
    msjSablonSecili = s;
    document.getElementById('msjMetin').value = msjMetinUret(msjPlaka, s);
    Ekran.tazele(); return;
  }

  if (t.id === 'msjBaskasi') { msjPlaka = null; Ekran.tazele(); return; }

  /* ---- YAPAY ZEKA DÜZELTMESİ (14.09) ----
     ⚠️ PROTOTİPTE SAHTE VE ÖYLE YAZIYOR. Yaptığı iş gerçek bir
     düzeltme değil, ustanın GÖRECEĞİ AKIŞ: iki metin yan yana, fark
     görünür, onay ustada.

     Sahte düzeltme bilerek KÜÇÜK: boşlukları toparlıyor, cümle başını
     büyütüyor, imzayı garantiliyor. Zeki görünen sahte bir çıktı
     yazsaydım — "modelin yazdığı güzel cümle" — Cemil'e olmayan bir
     yetenek göstermiş olurdum; bu depoda en pahalı yalan o. */
  if (t.id === 'msjZeka') {
    var alan = document.getElementById('msjMetin');
    var once = alan.value || '';
    if (!once.trim()) { balon('Önce bir metin olsun.', false, 2400); return; }
    var sonra = msjSahteDuzelt(once, msjPlaka);
    if (sonra === once) { balon('Metin zaten düzgün görünüyor.', false, 2600); return; }
    Katman.ac('Yapay zeka düzeltmesi',
      '<div class="notice warn">' +
        '<span class="n-ic"><svg class="ico ico-sm"><use href="#i-triangle-alert"></use></svg></span>' +
        '<span class="n-body">Bu prototipte düzeltmeyi <b>yapay zeka yapmıyor</b>; ' +
          'akışı görüyorsun. Gerçek düzeltme sunucu tarafında çalışacak ' +
          '(<b>YAPAY-ZEKA.md</b>).</span></div>' +
      '<div class="section-label" style="margin-top:14px">Şimdiki</div>' +
      '<div class="card"><p class="plate-hint">' + once.replace(/\n/g, '<br>') + '</p></div>' +
      '<div class="section-label" style="margin-top:14px">Önerilen</div>' +
      '<div class="card"><p class="plate-hint">' + sonra.replace(/\n/g, '<br>') + '</p></div>' +
      '<button class="btn btn-primary btn-lg" id="ktmZekaUygula" style="margin-top:14px">' +
        '<svg class="ico"><use href="#i-check"></use></svg> Öneriyi uygula</button>');
    /* Metin katmanın içinde değil, ekranın alanında duruyor; uygulama
       anında oradan okunacak diye geçici olarak saklanıyor. */
    msjZekaOneri = sonra;
    return;
  }
  if (t.id === 'ktmZekaUygula') {
    if (msjZekaOneri === null) return;
    var ma = document.getElementById('msjMetin');
    ma.value = msjZekaOneri;
    msjZekaOneri = null;
    Katman.kapa();
    balon('Metin güncellendi — göndermeden önce bir daha bak.', false, 2800);
    return;
  }

  /* TÜM MESAJLAR — arşiv sayfası, bu aracın süzgeciyle (Cemil:
     "Tüm mesajlarına link olsun"). Süzgeç ekranda çip olarak
     görünüyor ve kaldırılabiliyor. */
  if (t.id === 'msjTumMesajlar') {
    MESAJ_SUZGEC = { plaka: msjPlaka };
    Ekran.ac('mesajlar');
    return;
  }

  /* Özet sayfasını AÇAR — usta linkin ucundakini görsün. Geri düğmesi
     mesaja döndürüyor, mesaj yazımı bozulmuyor (msjPlaka duruyor). */
  /* ⚠️ EKRAN DEĞİL KATMAN (Cemil, 07.09: "Müşteri ne görecek popup
     açılsın. Sadece mesaj gözüksün.").

     Eskiden ayrı bir ekrana gidiyordu: usta mesajı yazıyor, önizlemeye
     bakmak için ekrandan çıkıyor, geri geliyor. Bakmak için işi
     bırakmak gerekiyordu.

     "SADECE MESAJ": katman `ozetGovdeHtml()` çağırıyor — müşterinin
     gerçekten göreceği. Ustanın önizleme şeridi ("bu şerit yalnız
     sende görünüyor") KATMANDA YOK; olsaydı "sadece müşterinin
     gördüğü" olmazdı.

     ⚠️ YORUM: Cemil "sadece mesaj gözüksün" dedi; bunu *"bizim
     eklediğimiz açıklama olmasın, yalnız müşterinin gördüğü"* diye
     okudum. Mesaj METNİNİN kendisi zaten üstteki alanda duruyor ve
     ikinci kez göstermek onu tekrar etmek olurdu. Cemil onayına açık
     (A-M18). */
  if (t.id === 'msjOzetGor') {
    var ok = msjOzetKaydi(msjPlaka);
    if (!ok) return;
    /* ⚠️ ÖZET EKRANI YETİM KALMASIN (07.09). Önizleme katmana
       taşınınca `ozet` ekranına giden tek yol koptu ve denetimin YETIM
       testi anında söyledi: *"ozet | gidilmiyor"*.

       Ekran silinmedi çünkü o **müşterinin sayfasının kendisi** —
       linkin ucundaki şey. Katmanda hızlı bakış var; tam sayfayı
       görmek isteyen usta buradan açıyor. Ana yolda değil, katmanın
       dibinde: bakmak isteyene açık, akışa binmiyor. */
    Katman.ac('Müşteri ne görecek',
      ozetGovdeHtml(ok) +
      '<button class="btn btn-ghost" id="ktmOzetSayfa">' +
        '<svg class="ico"><use href="#i-file-text"></use></svg>' +
        ' Tam sayfayı aç</button>');
    return;
  }

  if (t.id === 'ktmOzetSayfa') {
    var os = msjOzetKaydi(msjPlaka);
    if (!os) return;
    OZET_KAYIT = os.id;
    Katman.kapa();
    Ekran.ac('ozet');
    return;
  }

  /* A15 — telefon ekleme katmanı. */
  if (t.id === 'msjTelEkle') {
    var av = aracBul(msjPlaka);
    if (!av) return;
    Katman.ac('Telefon ekle',
      '<div class="card">' +
        '<div class="arac-bas">' + plakaHtml(av.plaka, 'plate-lg') +
          '<div class="veh-title">' + av.marka + ' ' + av.model + '</div>' +
          '<div class="spec-strip"><span class="spec-val">' +
            (av.sahipAd || 'sahip yazılmamış') + '</span></div>' +
        '</div>' +
      '</div>' +
      '<div class="field">' +
        '<label for="ktmTel">Telefon</label>' +
        '<input id="ktmTel" class="mono" data-giris="tel" inputmode="tel"' +
          ' placeholder="0532 000 00 00" autocomplete="off" />' +
        '<div class="plate-hint" id="ktmTelIpucu" role="status">' +
          '11 hane, 0 ile başlar. Özet ve bakım hatırlatması buraya gider.' +
        '</div>' +
      '</div>' +
      '<button class="btn btn-primary btn-lg" id="ktmTelKaydet">' +
        '<svg class="ico"><use href="#i-check"></use></svg> Kaydet</button>',
      /* Katman kapanınca ekran tazelenir: telefon eklendiyse gönderme
         düğmeleri kendiliğinden açılmalı. */
      function () { if (Ekran.adi() === 'mesaj') Ekran.tazele(); });
    return;
  }

  if (t.id === 'ktmTelKaydet') {
    var ay = aracBul(msjPlaka);
    var alan = document.getElementById('ktmTel');
    if (!ay || !alan) return;
    var deg = alan.value.trim();
    /* ⚠️ KAPALI DÜĞME YOK, KONUŞAN DÜĞME VAR (K-040.3). */
    if (!deg) {
      balon('Telefonu yaz — 11 hane, 0 ile başlar.', false, 2800);
      try { alan.focus(); } catch (x) {}
      return;
    }
    if (!telGecerli(deg)) {
      balon('Telefon 11 hane olmalı ve 0 ile başlamalı.', false, 3000);
      try { alan.focus(); } catch (x) {}
      return;
    }
    /* Telefonu OLMAYAN araçta ruhsat sahibinin numarası da boştur —
       o yüzden hedef net: `sahipTel`. İkinci iletişim ayrı bir karar
       ve araç ekranından yazılıyor. */
    ay.sahipTel = deg;
    balon(ay.plaka + ' için telefon kaydedildi.', false, 2600);
    Katman.kapa();
    return;
  }
  if (t.id === 'msjQTemiz') { document.getElementById('msjQ').value = ''; Ekran.tazele(); return; }

  /* msjMik ARTIK BURADA DEĞİL: `data-dikte` ile çekirdeğe bağlı.
     Kalan tek komut mikrofonu seçim listesindeki — "kime" sorusunun
     cevabını duyan o. */
  if (t.id === 'msjSecimMik') {
    sesleAc('mesaj'); return;
  }

  /* Hedef degistirilince metin YENIDEN URETILIR: hitap hedefe gore
     degisiyor ve eski hitap kalirsa mesaj yanlis kisiye "Bey/Hanim"
     diye gider. Usta metni ELLE degistirmisse korunur. */
  var hd = t.getAttribute('data-hedef');
  if (hd) {
    var eskiMetin = document.getElementById('msjMetin').value;
    var uretilmis = msjMetinUret(msjPlaka, msjSablonSecili);
    msjHedefSecili = hd;
    if (eskiMetin === uretilmis) {
      document.getElementById('msjMetin').value = msjMetinUret(msjPlaka, msjSablonSecili);
    }
    msjYazimCiz();
    return;
  }

  /* GÖNDERİM TEK YERDE, KANAL PARAMETRE. Üç ayrı işleyici yazsaydım
     "hatırlatma gönderildi sayılır" kuralını üç yere kopyalamam
     gerekirdi ve biri unutulunca aynı hatırlatma her gün çıkardı. */
  var kanal = (t.id === 'msjGonder') ? 'whatsapp'
            : (t.id === 'msjSms') ? 'sms'
            : (t.id === 'msjAra') ? 'ara' : null;
  if (kanal) {
    var a = aracBul(msjPlaka);
    var hedef = mesajHedefi(msjPlaka, msjHedefSecili);
    if (!a || !hedef || !hedef.tel) return;
    /* Şablon "hatırlatma" ise hatırlatma GÖNDERİLDİ sayılır — yedinci
       işin döngüsü burada kapanıyor, yoksa aynı uyarı her gün çıkardı.
       ARAMA DA SAYILIR: usta telefonla söylediyse hatırlatma yapılmıştır;
       "yazmadın" diye ikinci kez uyarmak ustayı kızdırır. */
    if (msjSablonSecili === 'hatirlatma') {
      aracKayitlari(msjPlaka).forEach(function (k) {
        if (k.hatirlatmaTarihi && !k.hatirlatmaGonderildi) k.hatirlatmaGonderildi = true;
      });
    }
    /* ⚠️ GÖNDERİLEN MESAJ ARŞİVE DÜŞER (14.09) — ama YALNIZ mesaj.
       "Ara" bir mesaj değil; arşive yazılsaydı liste "gönderilen
       mesajlar" olmaktan çıkar, "yaptıklarım" olurdu ve şablon
       koşulları da yanlış beslenirdi: telefonla aranmış bir müşteriye
       "özeti gönderdin" denirdi. */
    if (kanal !== 'ara') {
      var gk = msjOzetKaydi(msjPlaka);
      mesajKaydet({ plaka: msjPlaka, ad: hedef.ad, tel: hedef.tel, kanal: kanal,
                    sablon: msjSablonSecili || 'serbest',
                    kayit: gk ? gk.id : null,
                    metin: document.getElementById('msjMetin').value });
    }
    balon(KANAL_METIN[kanal] + ' — ' + hedef.ad + ' · ' + hedef.tel +
          (kanal === 'ara' ? '.' : ', mesaj hazır.'), false, 3200);
    msjPlaka = null;
    msjHedefSecili = null;
    Ekran.ac('home');
  }
});

document.addEventListener('input', function (e) {
  if (e.target && e.target.id === 'msjQ') Ekran.tazele();
});

/* ================= SESLİ İŞLER — bu ekranın şeması (Tur 8.3) =================
   İki iş, iki SORULAN alan: kanal ve metin onay ekranında ustaya
   sorulur (`sor: true`) — satır olarak değil, seçilip düzenlenerek.
   Usta neyi gönderdiğini gönderMEDEN önce okur. */

/* KANAL: söylenmediyse WhatsApp (WHATSAPP.md A yolu — bedava ve
   kurulumsuz). SMS parayla ve İYS kaydı istiyor; varsayılan olamaz. */
function sesKanali(d) {
  if (d.indexOf('sms') >= 0) return 'sms';
  return 'whatsapp';
}
var SES_KANAL = { whatsapp: KANAL_AD.whatsapp, sms: KANAL_AD.sms };

/* TOPLU MU — *"tüm müşterilere"*, *"bütün müşterilere"*, *"herkese"*.
   ⚠️ Türkçede kelime sınırı aranmaz (K-018); "tum musteri" gibi İKİ
   KELİMELİK bir dizi aranıyor — "müşteri" tek başına her cümlede
   geçebilir ve tek kelimeye bakmak her mesajı toplu sanmaya götürürdü. */
function sesTopluMu(d) {
  return d.indexOf('tum musteri') >= 0 || d.indexOf('butun musteri') >= 0 ||
         kelimeVarMi(d, ['herkese', 'hepsine']);
}

/* "yaz" KELİME OLARAK aranıyor: "beyaz" içinde geçiyordu ve "34 ABC 123
   beyaz araba geldi" mesaj sanılıyordu (K-018).
   `sms` tek başına yeter (*"herkese sms at yarın kapalıyız"*).
   **"sahibine" yönelme hâli (mesaj), "sahibini" belirtme hâli (arama)**;
   ikisi ayrı kelime, eşitlikle ayrılıyor. */
function sesMesajKomutu(d) {
  return d.indexOf('mesaj') >= 0 || d.indexOf('whatsapp') >= 0 ||
         d.indexOf('sms') >= 0 ||
         kelimeVarMi(d, ['yaz', 'yazdir', 'sahibine']) ||
         d.indexOf('gonder') >= 0;
}

/* ⚠️ TOPLU MESAJ (14.09) — Cemil: *"Mesela tüm müşterilere bayram
   mesajı gönder diyecek sesli olarak."* TEK MESAJDAN ÖNCE (öncelik 30 <
   40) çünkü cümlede plaka YOK; plakasız bir mesaj komutu bugüne kadar
   sessizce düşüyordu.
   ⚠️ K-045.2 ile ÇELİŞİYOR (*"kampanya bu fazda yazılmaz"*); Cemil
   kapsamı genişletti, onun sözü kazanır. Gerekçe silinmedi: onay
   ekranı riski YAZIYOR ve prototip hiçbir şey göndermiyor. */
Islem.tanim('toplu-mesaj', {
  ekran: 'mesaj', baglam: ['mesaj'], oncelik: 30,
  baslik: function () { return topluAlicilar().length + ' müşteriye mesaj'; },
  tarif: 'Telefonu olan bütün müşterilere mesaj',
  /* ⚠️ RİSK ONAY EKRANINDA YAZILI (K-045.2). Kendi numaradan toplu
     gönderim Meta'nın şartlarına aykırı, numara engellenebilir —
     engellenirse özet ve bakım hatırlatması da durur. */
  notice: 'Toplu mesaj, izin vermiş müşterilere gönderilmelidir. ' +
          'Kendi numaranızdan toplu gönderim, numaranızın ' +
          'engellenmesine yol açabilir.',
  eylem: function () {
    return topluAlicilar().length ? 'Onayla ve gönder' : 'Telefonu olan müşteri yok';
  },
  alanlar: [
    /* KİMLERE GİDİYOR, ADLARIYLA. Toplu gönderim geri alınamaz; usta
       onayladığı şeyi görmeli. Üçten fazlası sayıyla söyleniyor. */
    { ad: 'kime', etiket: 'Kime', turet: function () {
        var a = topluAlicilar();
        return a.length
          ? a.slice(0, 3).map(function (x) { return x.ad; }).join(', ') +
            (a.length > 3 ? ' +' + (a.length - 3) : '')
          : 'telefonu olan müşteri yok'; } },
    { ad: 'kac', etiket: 'Kaç kişi', turet: function () {
        return topluAlicilar().length + ' müşteri'; } },
    { ad: 'metinTuru', etiket: 'Ne', tip: 'secim', secenek: SABLON_AD,
      bos: 'Serbest mesaj' },
    { ad: 'kanal', etiket: 'Gönderim kanalı', soru: 'Nereden gitsin?',
      tip: 'secim', secenek: SES_KANAL, sor: true, zorunlu: true },
    { ad: 'govde', etiket: 'Gidecek mesaj', tip: 'uzunMetin', sor: true, zorunlu: true }
  ],
  tani: function (c) {
    if (!sesMesajKomutu(c.d) || !sesTopluMu(c.d)) return null;
    var hzT = hazirMetinBul(c.metin);
    /* Hazır metin tanınmadıysa söylenen cümlenin kalanı metin olur —
       usta "tüm müşterilere yarın kapalıyız yaz" diyebilir. */
    var kalanT = kelimeleriAt(c.metin, ['tüm', 'tum', 'bütün', 'butun', 'herkese',
      'hepsine', 'müşterilere', 'musterilere', 'müşteriye', 'musteriye',
      'mesaj', 'mesajı', 'mesaji', 'gönder', 'gonder', 'at', 'yaz',
      'whatsapp', 'sms', 'üzerinden', 'uzerinden', 'ile']);
    /* Toplu olduğu belli ama NE gideceği belli değil: anlaşılmadı.
       Burada durulur — cümle başka bir işe düşmesin. */
    if (!hzT && !kalanT) return Islem.anlasilmadi(c.metin);
    return { tur: 'toplu-mesaj', metinTuru: hzT ? hzT.k : 'serbest',
             govde: hzT ? hzT.metin : kalanT, kanal: sesKanali(c.d) };
  },
  /* HER ALICI KENDİ KAYDINI ALIR. Tek bir "toplu gönderim" kaydı
     kolaydı ama ispat yükü KİŞİ BAŞINA (K-045.3). */
  uygula: function (o) {
    var alicilar = topluAlicilar();
    if (!alicilar.length) { balon('Telefonu olan müşteri yok.', false, 2800); return; }
    alicilar.forEach(function (x) {
      mesajKaydet({ plaka: x.plaka, ad: x.ad, tel: x.tel, kanal: o.kanal,
                    sablon: o.metinTuru, toplu: true,
                    metin: mesajHitabi(x.plaka) + o.govde + mesajImzasi() });
    });
    balon(alicilar.length + ' müşteriye ' + KANAL_AD[o.kanal] + ' mesajı hazırlandı.',
          false, 3400);
    Ekran.ac('mesaj');
  }
});

/* ⚠️ 14.09 — ONAY EKRANI GÖNDERİYOR (Cemil: "Buradan mesaj sesli
   olarak gönderebilmeliyiz." + "Burada da bir onay ekranı gerekli.").
   Eskiden sesli yol mesaj ekranını AÇIYORDU ve usta bir kez daha
   gönder'e basıyordu — aynı soruyu iki kez sormak. "Ekranda aç"
   duruyor: hedefi değiştirmek isteyen oraya gider (ölü uç yok). */
Islem.tanim('mesaj-gonder', {
  ekran: 'mesaj', baglam: ['mesaj'], oncelik: 40,
  baslik: 'Mesaj gönderilecek',
  notice: function (o) {
    var hd = mesajHedefi(o.plaka);
    return (hd && hd.tel) ? '' :
      'Bu aracın telefonu yok — mesaj gönderilemez. "Ekranda aç" ile ' +
      'numarayı ekleyebilirsin.';
  },
  eylem: function (o) { var hd = mesajHedefi(o.plaka); return (hd && hd.tel) ? 'Gönder' : 'Ekranda aç'; },
  eylem2: function (o) { var hd = mesajHedefi(o.plaka); return (hd && hd.tel) ? 'Ekranda aç' : ''; },
  alanlar: [
    { ad: 'kime', etiket: 'Kime', turet: function (o) {
        var hd = mesajHedefi(o.plaka);
        return (hd && hd.ad ? hd.ad : 'sahip yazılmamış') +
               (hd && hd.tel ? ' · ' + hd.tel : ' · telefon yok'); } },
    { ad: 'plaka', etiket: 'Araç', tip: 'plaka', zorunlu: true },
    { ad: 'sablon', etiket: 'Ne', tip: 'secim', secenek: SABLON_AD, bos: 'Mesaj' },
    { ad: 'kanal', etiket: 'Gönderim kanalı', soru: 'Nereden gitsin?',
      tip: 'secim', secenek: SES_KANAL, sor: true, zorunlu: true },
    { ad: 'govde', etiket: 'Gidecek mesaj', tip: 'uzunMetin', sor: true }
  ],
  tani: function (c) {
    if (!sesMesajKomutu(c.d) || !c.p) return null;
    /* Plaka kayıtlı değil: yanlış duyulmuş olabilir (A-M27). Öneri
       varsa onay ekranı SORAR. */
    if (!c.arac) return { tur: 'bilinmeyen-arac', plaka: c.p.plaka,
                          oneri: benzerPlaka(c.p.plaka) };
    /* ŞABLON: önce adı söylenen hazır metin, sonra iş şablonları.
       "selam mesajı" bir şablon adı değil ama ustanın söylediği şey. */
    var hz = hazirMetinBul(c.metin), d = c.d;
    var sablon = hz ? hz.k
               : d.indexOf('hatirlatma') >= 0 ? 'hatirlatma'
               : d.indexOf('bekliyor') >= 0 ? 'bekliyor'
               : d.indexOf('hazir') >= 0 ? 'hazir'
               : d.indexOf('teslim') >= 0 ? 'teslim' : 'ozet';
    return { tur: 'mesaj-gonder', plaka: c.p.plaka, arac: c.arac, sablon: sablon,
             kanal: sesKanali(d),
             /* Metin ŞİMDİ üretiliyor ve onay ekranında GÖRÜNÜYOR. */
             govde: mesajMetniUret(c.p.plaka, sablon) };
  },
  /* Gönderim ve ARŞİVE YAZMA aynı yerden: mesajKaydet(). Mesaj ekranı da
     onu çağırıyor (43. denetim testi). */
  uygula: function (o) {
    var hedef = mesajHedefi(o.plaka);
    /* Telefon yoksa gönderilmez — ekrana götürülür, orada numara
       eklenebiliyor (K-021: uyarının çözümü kendi yanında olmalı). */
    if (!hedef || !hedef.tel || o.ekranaGit) {
      MESAJ_HEDEF = { plaka: o.plaka, sablon: o.sablon };
      Ekran.ac('mesaj');
      if (!hedef || !hedef.tel) balon('Bu aracın telefonu yok — önce numarayı ekle.', false, 3200);
      return;
    }
    if (o.sablon === 'hatirlatma') {
      aracKayitlari(o.plaka).forEach(function (k) {
        if (k.hatirlatmaTarihi && !k.hatirlatmaGonderildi) k.hatirlatmaGonderildi = true;
      });
    }
    var gk = acikKayit(o.plaka) || sonKayit(o.plaka);
    mesajKaydet({ plaka: o.plaka, ad: hedef.ad, tel: hedef.tel, kanal: o.kanal,
                  sablon: o.sablon, kayit: gk ? gk.id : null, metin: o.govde });
    balon(KANAL_AD[o.kanal] + ' açılıyor — ' + hedef.ad + ', mesaj hazır.', false, 3200);
    Ekran.ac('home');
  }
});
</script>
