<script>
/* ================= BAĞLAM =================
   Her giriş noktası kendi örneklerini getirir. Ustanın "ne
   diyebilirim" sorusu, geldiği yere göre farklı. Genel bir örnek
   listesi göstermek, ekranı herkes için biraz yanlış yapıyordu. */
/* ⚠️ 14.09 — ÖRNEKLER SABİT METİN DEĞİL, VERİDEN DOLUYOR.
   45. test üç örneğin yalan söylediğini gösterdi: "41 ABC 43 ara"
   diyen çip, ÖYLE BİR ARAÇ OLMADIĞI için boş liste döndürüyordu.
   Ekranın kendi örneği "sonuç bulunamadı" veriyorsa usta sesi bir
   daha denemez.

   Sabit plaka yazmak, veriyi iki yerde tutmaktır: tohum veri değişince
   örnek bayatlar ve kimse fark etmez. Yer tutucular çizim anında
   GERÇEK kayıtlardan dolduruluyor — {plaka} kayıtlı bir araç,
   {serviste} şu an serviste olan bir araç, {sahip} gerçek bir müşteri.
   Örnek artık bayatlayamaz. */
var SES_BAGLAM = {
  genel: {
    ad: 'Sesli işlem',
    ipucu: 'Plakayı ve ne yapılacağını söylemen yeter.',
    ornekler: [
      '{plaka} triger seti değişecek',
      '{serviste} bakıma geldi kilometre 88 bin',
      '{serviste} teslim ettim nakit aldım'
    ]
  },
  'servis-ekle': {
    ad: 'Servis kaydı ekle',
    ipucu: 'Plakayı, sahibini, numarasını ve yapılacak işi söyle.',
    ornekler: [
      '{plaka} triger seti değişecek',
      '41 KV 5588 Ahmet Yılmaz 0532 111 22 33 debriyaj kaçırıyor',
      '{serviste} bakıma geldi kilometre 88 bin'
    ]
  },
  araclar: {
    ad: 'Araçlarda ara',
    ipucu: 'Plaka, marka ya da sahip adı söyleyebilirsin.',
    ornekler: ['{plaka} ara', '{marka} ara', '{sahip} ara']
  },
  kayitlar: {
    ad: 'Servis kayıtlarında ara',
    ipucu: 'Plaka ya da yapılan iş söyleyebilirsin.',
    ornekler: ['{plaka} ara', 'balata ara', 'servistekileri göster']
  },
  musteriler: {
    ad: 'Müşterilerde ara',
    ipucu: 'Plaka, ad ya da telefon söyleyebilirsin.',
    ornekler: ['{plaka} ara', '{plaka} sahibini ara', '{sahip} ara']
  },
  mesaj: {
    ad: 'Müşteriye mesaj',
    ipucu: 'Kime, ne göndereceğini söyle. "Tüm müşterilere" dersen toplu gider.',
    /* 14.09 — örnekler Cemil'in söylediği cümleler oldu: birincisi
       ses kaydında geçen cümlenin aynısı, üçüncüsü toplu gönderim. */
    ornekler: [
      '{serviste} sahibine WhatsApp üzerinden selam mesajı gönder',
      '{teslimli} sahibine bakım hatırlatması gönder',
      'tüm müşterilere bayram mesajı gönder'
    ]
  },
  muhasebe: {
    ad: 'Muhasebe',
    ipucu: 'Gideri söylemen yeter — tutar ve açıklama ayrılır.',
    ornekler: [
      '2400 TL elektrik faturası ekle',
      '850 lira kira gideri ekle',
      'bugün ne kadar tahsil ettim'
    ]
  },
  'kayit-icinde': {
    ad: 'Açık servis kaydı',
    ipucu: 'Ne yapıldığını söyle — açık kayda satır olarak düşer.',
    ornekler: [
      'balata da değişecek',
      'işçilik 750 lira',
      'yağ filtresi 260 lira parça'
    ]
  }
};

/* Yer tutucuları GERÇEK veriyle doldurur. Veri boşsa yer tutucu
   ekranda kalmasın diye son çare olarak ilk araç kullanılıyor. */
function sesOrnekDoldur(c) {
  var ilk = ARACLAR[0] || {};
  var icerdeKayit = icerideki()[0];
  var servisteki = icerdeKayit ? aracBul(icerdeKayit.plaka) : null;
  var teslimli = ARACLAR.filter(function (a) {
    return !aracServiste(a.plaka) && aracKayitlari(a.plaka).length;
  })[0] || ilk;
  var sahipli = ARACLAR.filter(function (a) { return a.sahipAd; })[0] || ilk;
  return String(c)
    .replace(/\{plaka\}/g, ilk.plaka || '')
    .replace(/\{serviste\}/g, (servisteki || ilk).plaka || '')
    .replace(/\{teslimli\}/g, teslimli.plaka || '')
    .replace(/\{marka\}/g, ilk.marka || '')
    .replace(/\{sahip\}/g, sahipli.sahipAd || '');
}
/* Ekranın gösterdiği liste ile tıklanınca işlenen cümle AYNI yerden
   çıkar — ikisi ayrılırsa usta gördüğünden başka bir şey söylemiş
   olur. */
function sesOrnekleri() {
  return (sesBaglam().ornekler || []).map(sesOrnekDoldur);
}

var sesDurumu = 'bos';      /* bos · dinliyor · anlasildi · anlasilmadi */
var sesCumle = '';
/* Plaka onerisi kabul edildi mi — ekrandaki "Duyulan" etiketi buna
   gore degisiyor (A-M27). */
var sesDuzeltildi = false;
var sesIslem = null;
var sesTanima = null;       /* Web Speech API nesnesi */

function sesBaglam() {
  return SES_BAGLAM[SESLI_NIYET] || SES_BAGLAM.genel;
}

/* ================= ÇÖZÜMLEME =================
   Gerçek motor geldiğinde değişecek olan BURASI, ekran değil.
   Sıra önemli: en dar kalıp önce denenir. */
/* GERÇEK MOTORUN DÖNDÜRDÜĞÜ METİN DÜZGÜN DEĞİL. Tanıma "34 ABC 123"
   yerine "34 a b c 123" (harf harf), "34ABC123" (bitişik) ya da
   "34 Abc 123" döndürebiliyor. Plakayı aramadan ÖNCE tek harfler
   birleştiriliyor — yoksa doğru duyulmuş bir plaka bulunamıyor. */
/* ⚠️ BU FONKSİYON BİR KEZ `\b` İLE YAZILDI VE BOZDU — K-018'i yazdıktan
   SONRA. Desen şuydu: /\b([A-Za-z…])(\s+[A-Za-z…])+\b/
   "beş yüz" içinde "ş y" ikilisini TEK HARF DİZİSİ sandı, çünkü 'e' ile
   'ş' arasında `\b` var (ş, ASCII kelime karakteri değil) ve 'y' ile
   'ü' arasında da var. Sonuç "beşyüz" oldu, sayı çözümlenemedi.
   Kural bir kez daha: Türkçede sınır aramak yerine BOŞLUKTAN BÖL. */
function sesHarfleriBirlestir(metin) {
  var t = (metin || '').split(/\s+/).filter(Boolean);
  var cikti = [], i = 0;
  var tekHarf = function (p) { return p.length === 1 && /[A-Za-zÇĞİÖŞÜçğıöşü]/.test(p); };
  while (i < t.length) {
    if (!tekHarf(t[i])) { cikti.push(t[i]); i++; continue; }
    var j = i;
    while (j < t.length && tekHarf(t[j])) j++;
    /* Tek başına duran bir harf harf dizisi değildir — dokunma. */
    if (j - i >= 2) cikti.push(t.slice(i, j).join(''));
    else cikti.push(t[i]);
    i = j;
  }
  return cikti.join(' ');
}

/* TANIMA MOTORU SAYIYI KELİME OLARAK DÖNDÜREBİLİR: "otuz dört ABC yüz
   yirmi üç". Rakama çevrilmezse plaka hiç bulunamıyor.

   ⚠️ TEK KELİMELİK SAYI ÇEVRİLMEZ — "bir de balata değişecek" cümlesi
   "1 de balata değişecek" olurdu. İstisna: peşinden birim geliyorsa
   ("elli lira", "seksen kilometre") çevrilir, orada sayı olduğu kesin. */
var SES_SAYI = {
  'sifir': 0, 'bir': 1, 'iki': 2, 'uc': 3, 'dort': 4, 'bes': 5,
  'alti': 6, 'yedi': 7, 'sekiz': 8, 'dokuz': 9, 'on': 10, 'yirmi': 20,
  'otuz': 30, 'kirk': 40, 'elli': 50, 'altmis': 60, 'yetmis': 70,
  'seksen': 80, 'doksan': 90
};
var SES_BIRIM = { 'lira': 1, 'tl': 1, '₺': 1, 'km': 1, 'kilometre': 1 };

function sesSayilariCevir(metin) {
  var parcalar = metin.split(/(\s+)/);
  var cikti = [], i = 0;

  function sayiMi(p) {
    var n = norm((p || '').replace(/[.,!?]/g, ''));
    return SES_SAYI[n] !== undefined || n === 'yuz' || n === 'bin';
  }

  while (i < parcalar.length) {
    if (!sayiMi(parcalar[i])) { cikti.push(parcalar[i]); i++; continue; }

    /* Sayı sözcüklerinden oluşan diziyi topla (aradaki boşluklar dahil). */
    var basla = i, kelimeler = [];
    while (i < parcalar.length) {
      if (/^\s+$/.test(parcalar[i])) { i++; continue; }
      if (!sayiMi(parcalar[i])) break;
      kelimeler.push(norm(parcalar[i].replace(/[.,!?]/g, '')));
      i++;
    }

    var sonrakiBirim = false;
    for (var j = i; j < parcalar.length; j++) {
      if (/^\s+$/.test(parcalar[j])) continue;
      sonrakiBirim = SES_BIRIM[norm(parcalar[j].replace(/[.,!?]/g, ''))] === 1;
      break;
    }

    /* Tek kelimeyse ve peşinden birim gelmiyorsa DOKUNMA. */
    if (kelimeler.length < 2 && !sonrakiBirim) {
      for (var k = basla; k < i; k++) cikti.push(parcalar[k]);
      continue;
    }

    /* BAŞTA "SIFIR" VARSA RAKAM RAKAM SÖYLENİYOR demektir:
       "sıfır altı" → "06", toplayarak "6" olurdu ve plakanın il kodu
       iki hane olmak zorunda. */
    var deger;
    if (kelimeler[0] === 'sifir' && kelimeler.every(function (w) {
          return SES_SAYI[w] !== undefined && SES_SAYI[w] < 10;
        })) {
      deger = kelimeler.map(function (w) { return SES_SAYI[w]; }).join('');
    } else {
      var toplam = 0, gecerli = 0;
      kelimeler.forEach(function (w) {
        if (w === 'yuz') gecerli = (gecerli || 1) * 100;
        else if (w === 'bin') { toplam += (gecerli || 1) * 1000; gecerli = 0; }
        else gecerli += SES_SAYI[w];
      });
      deger = String(toplam + gecerli);
    }
    /* ⚠️ SONA BOŞLUK ŞART: dizi toplanırken aradaki boşluklar yutuldu.
       Konmazsa "otuz dört abc" → "34abc" oluyor ve plaka deseni
       tutmuyordu. */
    cikti.push(deger + ' ');
  }
  return cikti.join('').replace(/\s+/g, ' ').trim();
}

/* ⚠️ Birleştirme ÇÖZÜMLEMENİN GİRİŞİNDE bir kez yapılır, burada
   değil: indeks/uzunluk döndüren bir fonksiyon metni değiştirirse,
   çağıran taraf ORİJİNAL metni yanlış yerden keser. */
function sesPlakaBul(metin) {
  var m = metin.toLocaleUpperCase('tr')
               .match(/\b(\d{2})\s*([A-ZÇĞİÖŞÜ]{1,3})\s*(\d{2,4})\b/);
  if (!m) return null;
  return { plaka: m[1] + ' ' + m[2] + ' ' + m[3], indeks: m.index, uzunluk: m[0].length };
}

function sesTelefonBul(metin) {
  var m = metin.replace(/\s/g, '').match(/0\d{10}/);
  if (!m) return null;
  var t = m[0];
  return t.slice(0, 4) + ' ' + t.slice(4, 7) + ' ' + t.slice(7, 9) + ' ' + t.slice(9);
}

function sesTutarBul(d) {
  /* "2400 TL", "850 lira", "iki bin dört yüz" değil — rakam bekliyoruz.
     Motor Türkçe sayıyı rakama çeviriyor; çevirmezse usta düzeltir. */
  var m = d.match(/(\d[\d.]*)\s*(tl|lira|₺)/);
  if (m) return parseInt(m[1].replace(/\./g, ''), 10);
  return 0;
}

/* KANAL: söylenmediyse WhatsApp (WHATSAPP.md A yolu — bedava ve
   kurulumsuz). SMS parayla ve İYS kaydı istiyor; varsayılan olamaz. */
function sesKanali(d) {
  if (d.indexOf('sms') >= 0) return 'sms';
  return 'whatsapp';
}

/* TOPLU MU — *"tüm müşterilere"*, *"bütün müşterilere"*, *"herkese"*.
   ⚠️ Türkçede kelime sınırı aranmaz (K-018); "tum musteri" gibi İKİ
   KELİMELİK bir dizi aranıyor — "müşteri" tek başına her cümlede
   geçebilir ve tek kelimeye bakmak her mesajı toplu sanmaya götürürdü. */
function sesTopluMu(d) {
  return d.indexOf('tum musteri') >= 0 || d.indexOf('butun musteri') >= 0 ||
         kelimeVarMi(d, ['herkese', 'hepsine']);
}

function sesCozumle(c) {
  /* Ham metnin düzeltmeleri BURADA, tek giriş noktasında: harf harf
     söylenen plaka birleşiyor, kelimeyle söylenen sayı rakama
     dönüyor. Böylece bütün indeksler aynı metne göre. */
  var metin = sesSayilariCevir(sesHarfleriBirlestir((c || '').trim()));
  var d = norm(metin);
  var p = sesPlakaBul(metin);
  var baglam = SESLI_NIYET || 'genel';

  /* --- AÇIK KAYDA SATIR (Cemil: "servis kaydı açıkken yine sesli
         işlem yapabilir, balata örneği gibi") --- */
  if (baglam === 'kayit-icinde' && ACIK_KAYIT) {
    var acikK = kayitBul(ACIK_KAYIT);
    var tutarR = sesTutarBul(d);
    var iscilikMi = d.indexOf('iscilik') >= 0;
    /* kelimeleriAt kullanılıyor, \b DEĞİL: /\bde\b/ "değişecek"i
       "ğişecek" yapıyordu (çekirdekteki uyarıya bak). */
    var ad = kelimeleriAt(metin.replace(/(\d[\d.]*)\s*(tl|lira|₺)/gi, ''),
                          ['parça', 'parca', 'işçilik', 'iscilik', 'da', 'de', 'ekle',
                           'yap', 'oldu', 'olsun', 'fiyat', 'fiyatı', 'fiyati',
                           'güncelle', 'guncelle']);

    /* ⚠️ 14.09 — AÇIK KAYITTA SES ÜÇ İŞ YAPIYOR (Cemil: "Yeni işlemler
       için sesli olarak söyleyebilir. Bunlar parça olabilir, işçilik
       olabilir. Fiyat güncellenebilir. Teslime edilebilir.").

       SIRA DAR OLANDAN GENİŞE: teslim → fiyat güncelleme → satır ekleme.
       Ters sırada olsaydı "teslim ettim nakit aldım" cümlesi kayda
       "teslim ettim" diye bir satır eklerdi. */
    if (acikK && d.indexOf('teslim') >= 0 && !acikK.teslimTarihi) {
      var odemeYolu = d.indexOf('nakit') >= 0 ? 'nakit'
                    : d.indexOf('kart') >= 0 ? 'kart'
                    : d.indexOf('havale') >= 0 ? 'havale' : null;
      return { tur: 'teslim', plaka: acikK.plaka, arac: aracBul(acikK.plaka),
               kayit: acikK, odeme: odemeYolu };
    }

    /* FİYAT GÜNCELLEME — söylenen ad VAR OLAN bir satıra uyuyorsa.
       "yağ filtresi 300 lira" iki şey demek olabilir: yeni satır ya da
       duran satırın fiyatı. Ayırt eden şey kaydın kendisi.

       ⚠️ TEK ADAY KURALI (A-M27'nin aynısı): iki satır birden uyuyorsa
       hangisi olduğunu bilmiyoruz demektir — o zaman güncelleme YOK,
       yeni satır eklenir ve usta görür. Tahmin etmek, ustanın
       yazdığı rakamı sessizce değiştirmenin yoludur. */
    if (acikK && tutarR && ad) {
      var adN = norm(ad);
      var uyan = [];
      (acikK.satirlar || []).forEach(function (s, i) {
        var sN = norm(s.ad || '');
        if (sN.length < 3 || adN.length < 3) return;
        if (sN === adN || sN.indexOf(adN) >= 0 || adN.indexOf(sN) >= 0) {
          uyan.push({ satir: s, indeks: i });
        }
      });
      if (uyan.length === 1) {
        return { tur: 'fiyat-guncelle', kayit: acikK, indeks: uyan[0].indeks,
                 satir: uyan[0].satir, fiyat: tutarR };
      }
    }

    /* "işçilik 750 lira" dendiğinde geriye ad kalmıyor — boş bırakmak
       yerine türün kendi adı yazılır, usta gerekirse düzeltir. */
    var satirIslemi = { tur: 'satir-ekle', ad: ad || (iscilikMi ? 'İşçilik' : 'Parça'),
             tip: iscilikMi ? 'iscilik' : 'parca', fiyat: tutarR };

    /* ⚠️ BU DAL BİR ÇÖPLÜKTÜ (16.09 — Cemil: "Kullanıcı farklı ekranda
       farklı bir işlem yapmak isteyebilir. Google aramada olduğu gibi
       'bunu mu demek istediniz' diye yönlendirebilelim.").

       Önce kayıt açıkken SÖYLENEN HER CÜMLE satır oluyordu:
         "servistekileri göster"        -> adı bu olan bir PARÇA
         "34 ABC 123 sahibine selam at" -> adı bu olan bir PARÇA
         "bugün ne kadar tahsilat"      -> adı bu olan bir PARÇA
       Usta onaylarsa kayda saçma bir satır giriyor; onaylamazsa
       istediği iş hiç yapılmıyor. İkisi de sessiz.

       Artık cümle GENEL yola da veriliyor. Orada tanınmış bir iş
       çıkarsa o asıl olur ve satır ekleme ÖNERİ olarak sunulur —
       kendiliğinden bağlam değiştirmiyoruz, SORUYORUZ. */
    var genelIslem = sesGenel(metin, d, p, 'genel');
    if (genelIslem && SES_GUCLU_TUR.indexOf(genelIslem.tur) >= 0) {
      genelIslem.baskaIslem = satirIslemi;
      return genelIslem;
    }
    return satirIslemi;
  }

  return sesGenel(metin, d, p, baglam);
}

/* Bağlamdan BAĞIMSIZ çözümleme. Ayrı bir fonksiyon oldu ki kayıt
   içindeki dal da ona sorabilsin: aynı cümle iki yerde iki ayrı
   şekilde anlaşılmasın (tek yol, tek sonuç — A-M27'nin kuralı). */
var SES_GUCLU_TUR = ['mesaj-gonder', 'toplu-mesaj', 'ara', 'tahsilat-sor',
  'gider-ekle', 'teslim', 'servis-ac', 'yeni-arac', 'bilinmeyen-arac'];

function sesGenel(metin, d, p, baglam) {
  /* ⚠️ `baglam` PARAMETRE OLARAK GEÇİYOR. Ayırma sırasında bunu
     unutmuştum: genel yol `baglam`ı sesCozumle'nin yerel değişkeni
     olarak kullanıyordu, ayrılınca ReferenceError atıyor ve hata
     sessizce yutuluyordu — öneri hiç çıkmıyordu, sebebi de görünmüyordu.
     Kayıt içinden çağrılırken 'genel' veriliyor: orada bağlam zaten
     "bu ekran değil" demek. */
  baglam = baglam || 'genel';
  /* --- TAHSİLAT SORUSU (14.09) ---
     Ekranın kendi örneği *"bugün ne kadar tahsil ettim"* diyordu ve
     çözümleyicide karşılığı YOKTU — 45. test yakaladı. Örneği silmek
     de bir seçenekti; soru tamircinin DÖRDÜNCÜ işinin ta kendisi
     (*"teslimde ödemeyi nasıl aldığını bilmek"*) ve cevabı zaten
     kayıtlı veriden çıkıyor. Yeni alan istemeyen bir soru, yeni
     özellik değil — var olanın sesle sorulması.

     ⚠️ TUTAR VARSA BU BİR SORU DEĞİL, GİDER GİRİŞİDİR: "2400 TL
     elektrik faturası" cümlesi buraya düşmesin diye tutar kontrolü
     başta duruyor. */
  if (!sesTutarBul(d) && (d.indexOf('tahsil') >= 0 || d.indexOf('kasa') >= 0)) {
    var sorulanDonem = (d.indexOf('bugun') >= 0) ? 'bugun'
                     : (d.indexOf('yil') >= 0) ? 'yil'
                     : (d.indexOf('ay') >= 0) ? 'ay' : 'bugun';
    return { tur: 'tahsilat-sor', donem: sorulanDonem };
  }

  /* --- GİDER EKLE --- */
  if (d.indexOf('gider') >= 0 || d.indexOf('fatura') >= 0 || d.indexOf('kira') >= 0 ||
      (baglam === 'muhasebe' && sesTutarBul(d))) {
    var t = sesTutarBul(d);
    if (t) {
      var aciklama = kelimeleriAt(metin.replace(/(\d[\d.]*)\s*(tl|lira|₺)/gi, ''),
                                  ['ekle', 'gider', 'olarak', 'için', 'icin']);
      return { tur: 'gider-ekle', tutar: t, aciklama: aciklama || 'Gider' };
    }
  }

  /* --- MESAJ GÖNDER --- */
  /* "yaz" KELİME OLARAK aranıyor: "beyaz" içinde geçiyordu ve
     "34 ABC 123 beyaz araba geldi" mesaj sanılıyordu (K-018). */
  /* ⚠️ 14.09 — DEĞERLENDİRME SETİ İKİ EKSİK BULDU (ses-seti.json).
     `sms`  : *"herkese sms at yarın kapalıyız"* hiç anlaşılmıyordu —
              cümlede mesaj/whatsapp/yaz/gönder yok, ama "sms" tek
              başına yeterince ayırt edici (başka kelimenin içine
              düşmüyor).
     `sahibine`: *"...sahibine parça bekliyoruz de"* servis kaydı
              sanılıyordu. Türkçe burada işi kolaylaştırıyor —
              **"sahibine" yönelme hâli (mesaj), "sahibini" belirtme
              hâli (arama)**; ikisi ayrı kelime, eşitlikle ayrılıyor
              (K-018: boşluktan böl, eşitlikle karşılaştır). */
  var mesajKomutu = (d.indexOf('mesaj') >= 0 || d.indexOf('whatsapp') >= 0 ||
                     d.indexOf('sms') >= 0 ||
                     kelimeVarMi(d, ['yaz', 'yazdir', 'sahibine']) ||
                     d.indexOf('gonder') >= 0);

  /* ⚠️ TOPLU MESAJ (14.09) — Cemil: *"Mesela tüm müşterilere bayram
     mesajı gönder diyecek sesli olarak. Uygun bir bayram mesajı bulacak
     ve onay ekranı ile SMS yada WhatsApp üzerinden mesaj gönderecek."*

     TEK MESAJDAN ÖNCE BAKILIYOR çünkü cümlede plaka YOK; plakasız bir
     mesaj komutu bugüne kadar sessizce düşüyordu.

     ⚠️ Bu özellik K-045.2 ile ÇELİŞİYOR: orada *"kampanya bu fazda
     yazılmaz"* demiştim, gerekçesi de sağlamdı (izin yok · toplu
     gönderim ustanın WhatsApp numarasını riske atıyor). Cemil kapsamı
     genişletti — onun sözü kazanır (CLAUDE.md). Gerekçe silinmedi:
     onay ekranı riski YAZIYOR ve prototip hiçbir şey göndermiyor. */
  if (mesajKomutu && sesTopluMu(d)) {
    var hzT = hazirMetinBul(metin);
    /* Hazır metin tanınmadıysa söylenen cümlenin kalanı metin olur —
       usta "tüm müşterilere yarın kapalıyız yaz" diyebilir. */
    var kalanT = kelimeleriAt(metin, ['tüm', 'tum', 'bütün', 'butun', 'herkese',
      'hepsine', 'müşterilere', 'musterilere', 'müşteriye', 'musteriye',
      'mesaj', 'mesajı', 'mesaji', 'gönder', 'gonder', 'at', 'yaz',
      'whatsapp', 'sms', 'üzerinden', 'uzerinden', 'ile']);
    if (!hzT && !kalanT) return { tur: 'plakasiz', metin: metin };
    return { tur: 'toplu-mesaj', metinTuru: hzT ? hzT.k : 'serbest',
             govde: hzT ? hzT.metin : kalanT, kanal: sesKanali(d) };
  }

  if (mesajKomutu && p) {
    var ar = aracBul(p.plaka);
    /* Plaka kayıtlı değil: yanlış duyulmuş olabilir (A-M27). Öneri
       varsa onay ekranı SORAR; yoksa bugünkü davranış aynen sürer. */
    if (!ar) return { tur: 'bilinmeyen-arac', plaka: p.plaka,
                      oneri: benzerPlaka(p.plaka) };
    /* ŞABLON: önce adı söylenen hazır metin, sonra iş şablonları.
       "selam mesajı" bir şablon adı değil ama ustanın söylediği şey. */
    var hz = hazirMetinBul(metin);
    /* "parça bekliyoruz" şablonu da adıyla söylenebiliyor — değerlendirme
       seti 28. cümlede bunu sordu ve motor cevaplayamıyordu. */
    var sablon = hz ? hz.k
               : d.indexOf('hatirlatma') >= 0 ? 'hatirlatma'
               : d.indexOf('bekliyor') >= 0 ? 'bekliyor'
               : d.indexOf('hazir') >= 0 ? 'hazir'
               : d.indexOf('teslim') >= 0 ? 'teslim' : 'ozet';
    return { tur: 'mesaj-gonder', plaka: p.plaka, arac: ar, sablon: sablon,
             kanal: sesKanali(d),
             /* Metin ŞİMDİ üretiliyor ve onay ekranında GÖRÜNÜYOR —
                usta neyi gönderdiğini gönderMEDEN önce okuyor. */
             govde: mesajMetniUret(p.plaka, sablon) };
  }

  /* --- ARAMA --- */
  /* ⚠️ ÜÇ KOMUT KELİMESİ DE KELİME OLARAK ARANIYOR (K-018, 04.09).
     Önce " ara" diye İÇİNDE aranıyordu ve "yeni ARAÇ" bunu tutuyordu;
     "GÖSTERGE paneli" de "göster"i tutuyordu. Usta aracını tarif
     edince program arama yapıyordu. */
  if (kelimeVarMi(d, ['ara', 'bul', 'goster']) ||
      ['araclar', 'kayitlar', 'musteriler'].indexOf(baglam) >= 0) {
    /* \b DEĞİL: /\bara\b/ deseni "araç" kelimesini "ç"ye indiriyordu. */
    var terim = kelimeleriAt(metin,
      ['ara', 'bul', 'göster', 'goster', 'sahibini', 'sahibi', 'aracını', 'aracini']);
    var hedef = baglam === 'musteriler' ? 'musteriler'
              : baglam === 'kayitlar' ? 'kayitlar' : 'araclar';
    /* "34 ABC 123 sahibini ara" — müşteriye plakadan gidilir. */
    if (p && d.indexOf('sahib') >= 0) {
      var a2 = aracBul(p.plaka);
      terim = a2 && a2.sahipAd ? a2.sahipAd : p.plaka;
      hedef = 'musteriler';
    }
    /* ⚠️ 14.09 — "SERVİSTEKİLER" BURADA YOKTU VE ÖRNEK ÇİP ÇALIŞMIYORDU.
       Cemil: *"Servis kayıtları listesinde sesli olarak servistekileri
       göster seçeneğini seçtim ama sonuç bulunamadı çıktı."*

       Sebep: 07.09'da *"içeride"* kelimesi **"serviste"** oldu (K-046'nın
       turu) ve ekranların hepsi güncellendi — ama çözümleyici hâlâ
       yalnız `iceridek` arıyordu. Örnek çip *"servistekileri göster"*
       diyordu; cümle süzgece değil DÜZ ARAMAYA düşüyor, arama kutusuna
       "servistekileri" yazılıyor ve liste boş dönüyordu.

       Bir terimi değiştirmek, o terimi ARAYAN yerleri de değiştirmektir.
       Örnek çipin kendisi negatif testti ve kimse dokunmamıştı —
       45. test (ORNEK-CUMLE) artık her örneği işletiyor. */
    if (d.indexOf('iceridek') >= 0 || d.indexOf('servistek') >= 0) {
      return { tur: 'ara', hedef: 'kayitlar', terim: '', suzgec: 'serviste' };
    }
    if (terim) return { tur: 'ara', hedef: hedef, terim: terim };
  }

  if (!p) return { tur: 'plakasiz', metin: metin };

  var plaka = p.plaka;
  var kalan = (metin.slice(0, p.indeks) + metin.slice(p.indeks + p.uzunluk))
              .replace(/\s+/g, ' ').trim();
  var dk = norm(kalan);
  var arac = aracBul(plaka);

  /* --- TESLİM --- */
  if (dk.indexOf('teslim') >= 0 && arac) {
    var acik = icerideki().filter(function (k) { return k.plaka === plaka; })[0];
    if (!acik) return { tur: 'teslim-edilecek-kayit-yok', plaka: plaka, arac: arac };
    var yol = dk.indexOf('nakit') >= 0 ? 'nakit'
            : dk.indexOf('kart') >= 0 ? 'kart'
            : dk.indexOf('havale') >= 0 ? 'havale' : null;
    return { tur: 'teslim', plaka: plaka, arac: arac, kayit: acik, odeme: yol };
  }

  /* --- SERVİS KAYDI (kayıtlı ya da yeni araç) --- */
  var isTuru = (dk.indexOf('bakim') >= 0 || dk.indexOf('periyodik') >= 0) ? 'bakim' : 'tamirat';
  var km = '';
  var kmE = dk.match(/(\d[\d.]*)\s*(bin)?\s*(km|kilometre)/) ||
            dk.match(/(?:km|kilometre)\s*(\d[\d.]*)\s*(bin)?/);
  if (kmE) {
    km = kmE[1].replace(/\./g, '');
    if ((kmE[2] || '') === 'bin') km = String(parseInt(km, 10) * 1000);
    km = parseInt(km, 10).toLocaleString('tr-TR');
  }
  var tel = sesTelefonBul(kalan);
  /* Sahip adı: telefon ve km çıkarıldıktan sonra kalan BAŞ HARFİ BÜYÜK
     iki kelime. Kaba ama ustanın söyleyiş sırasına uyuyor:
     "plaka · ad soyad · telefon · iş". */
  var adE = kalan.match(/\b([A-ZÇĞİÖŞÜ][a-zçğıöşü]+)\s+([A-ZÇĞİÖŞÜ][a-zçğıöşü]+)\b/);
  var sahip = adE ? adE[0] : '';

  var is = kalan
    .replace(/(\d[\d.]*)\s*(bin)?\s*(km|kilometre)/gi, '')
    .replace(/(km|kilometre)\s*(\d[\d.]*)\s*(bin)?/gi, '')
    .replace(/0\s*\d[\d\s]{9,}/g, '')
    .replace(sahip, '')
    .replace(/\s+/g, ' ').trim();

  if (!arac) {
    /* Aynı tuzak burada da var (A-M27): yanlış duyulan bir harf,
       kayıtlı aracı "yeni araç" yapıp ustayı ruhsat çekmeye gönderir. */
    return { tur: 'yeni-arac', plaka: plaka, sahip: sahip, tel: tel,
             is: is, isTuru: isTuru, km: km, oneri: benzerPlaka(plaka) };
  }
  return { tur: 'servis-ac', plaka: plaka, arac: arac, isTuru: isTuru, km: km, is: is };
}

/* ================= ANLAŞILANI YAZIYLA GÖSTER ================= */
function sesOzet(o) {
  if (o.tur === 'servis-ac') return {
    baslik: 'Servis kaydı açılacak',
    satirlar: [['Araç', o.plaka + ' · ' + o.arac.marka + ' ' + o.arac.model],
               ['İş türü', TUR_AD[o.isTuru]],
               ['Ne istiyor', o.is || '— (sonra yazılır)']]
              .concat(o.km ? [['Kilometre', o.km + ' km']] : []),
    eylem: 'Kaydı aç' };

  if (o.tur === 'yeni-arac') return {
    baslik: 'Yeni araç — önce ruhsat',
    satirlar: [['Plaka', o.plaka],
               ['Sahibi', o.sahip || '— (ruhsattan gelecek)'],
               ['Telefon', o.tel || '— (ruhsatta yazmaz)'],
               ['Ne istiyor', o.is || '—']],
    eylem: 'Ruhsatı çek',
    notice: 'Bu araç kayıtlı değil. Söylediklerin ruhsat ekranına yazıldı; ' +
            'ruhsatı çekince marka, model ve motor kendiliğinden dolar.' };

  if (o.tur === 'teslim') return {
    baslik: 'Araç teslim edilecek',
    satirlar: [['Araç', o.plaka + ' · ' + o.arac.marka + ' ' + o.arac.model],
               ['Tutar', tutar(kayitToplami(o.kayit)) + ' ₺'],
               ['Ödeme', o.odeme ? ODEME_AD_SES[o.odeme] : '— (teslim ekranında seçilecek)']],
    eylem: o.odeme ? 'Teslim et' : 'Teslim ekranını aç' };

  if (o.tur === 'satir-ekle') return {
    baslik: 'Açık kayda satır eklenecek',
    satirlar: [['Tür', o.tip === 'iscilik' ? 'İşçilik' : 'Parça'],
               ['Ne', o.ad],
               ['Tutar', o.fiyat ? tutar(o.fiyat) + ' ₺' : '— (sonra yazılır)']],
    eylem: 'Satırı ekle' };

  /* SORUNUN CEVABI ONAY EKRANINDA. Muhasebeyi açıp ustayı rakamı
     aramaya bırakmak, sorduğu şeyi cevaplamamaktır. */
  if (o.tur === 'tahsilat-sor') return {
    baslik: donemAdi(o.donem) + ' tahsilat',
    satirlar: [['Tahsil edilen', tutar(tahsilatToplami(o.donem)) + ' ₺'],
               ['Alacak (veresiye)', tutar(veresiyeToplami()) + ' ₺']],
    eylem: 'Muhasebeyi aç' };

  if (o.tur === 'fiyat-guncelle') return {
    baslik: 'Satırın fiyatı değişecek',
    satirlar: [['Ne', o.satir.ad || '—'],
               ['Şimdiki', o.satir.fiyat ? tutar(o.satir.fiyat) + ' ₺' : '— (boş)'],
               ['Yeni', tutar(o.fiyat) + ' ₺']],
    eylem: 'Fiyatı güncelle' };

  if (o.tur === 'gider-ekle') return {
    baslik: 'Gider eklenecek',
    satirlar: [['Açıklama', o.aciklama], ['Tutar', tutar(o.tutar) + ' ₺'],
               ['Tarih', bugunMetin()]],
    eylem: 'Gideri ekle' };

  /* ⚠️ 14.09 — ONAY EKRANI ARTIK GÖNDERİYOR (Cemil: "Buradan mesaj
     sesli olarak gönderebilmeliyiz." + "Burada da bir onay ekranı
     gerekli.").

     Eskiden sesli yol mesaj ekranını AÇIYORDU: usta söylüyor, ekran
     açılıyor, bir kez daha gönder düğmesine basıyordu. Onay ekranı
     zaten bir onaydı; ikinci onay, aynı soruyu iki kez sormaktı.

     GÖNDERİLECEK METİN BURADA VE DÜZENLENEBİLİR: usta neyi gönderdiğini
     gönderMEDEN önce okuyor. "Ekranda aç" duruyor — özet linkine
     bakmak ya da hedefi değiştirmek isteyen oraya gider (ölü uç yok). */
  if (o.tur === 'mesaj-gonder') {
    var hd = mesajHedefi(o.plaka);
    return {
      baslik: 'Mesaj gönderilecek',
      satirlar: [['Kime', (hd && hd.ad ? hd.ad : 'sahip yazılmamış') +
                          (hd && hd.tel ? ' · ' + hd.tel : ' · telefon yok')],
                 ['Araç', o.plaka],
                 ['Ne', SABLON_AD[o.sablon] || 'Mesaj']],
      kanal: true, metin: true,
      notice: (hd && hd.tel) ? '' :
        'Bu aracın telefonu yok — mesaj gönderilemez. "Ekranda aç" ile ' +
        'numarayı ekleyebilirsin.',
      eylem: (hd && hd.tel) ? 'Gönder' : 'Ekranda aç',
      eylem2: (hd && hd.tel) ? 'Ekranda aç' : '' };
  }

  if (o.tur === 'toplu-mesaj') {
    var alici = topluAlicilar();
    return {
      baslik: alici.length + ' müşteriye mesaj',
      /* KİMLERE GİDİYOR, ADLARIYLA. "3 müşteri" demek yetmiyordu:
         toplu gönderim geri alınamaz ve usta onayladığı şeyi
         görmeli. Üçten fazlası satırı şişirir, sayıyla söyleniyor. */
      satirlar: [['Kime', alici.length
                    ? alici.slice(0, 3).map(function (x) { return x.ad; }).join(', ') +
                      (alici.length > 3 ? ' +' + (alici.length - 3) : '')
                    : 'telefonu olan müşteri yok'],
                 ['Kaç kişi', alici.length + ' müşteri'],
                 ['Ne', SABLON_AD[o.metinTuru] || 'Serbest mesaj']],
      kanal: true, metin: true,
      /* ⚠️ RİSK ONAY EKRANINDA YAZILI (K-045.2). Toplu gönderim,
         ustanın KENDİ WhatsApp numarasından yapılırsa Meta'nın
         şartlarına aykırı ve numara engellenebilir — engellenirse
         yalnız kampanya değil, özet ve bakım hatırlatması da durur.
         İzinsiz ticari ileti ayrıca cezalı. Cemil kapsamı genişletti;
         gerekçeyi silmek yerine ustanın gözüne yazdım. */
      notice: 'Toplu mesaj, izin vermiş müşterilere gönderilmelidir. ' +
              'Kendi numaranızdan toplu gönderim, numaranızın ' +
              'engellenmesine yol açabilir.',
      eylem: alici.length ? 'Onayla ve gönder' : 'Telefonu olan müşteri yok' };
  }

  if (o.tur === 'ara') return {
    baslik: 'Aranacak',
    satirlar: [['Nerede', ({ araclar: 'Araçlar', kayitlar: 'Servis kayıtları',
                             musteriler: 'Müşteriler' })[o.hedef]],
               ['Ne', o.terim || 'servistekiler']],
    eylem: 'Ara' };

  if (o.tur === 'bilinmeyen-arac') return {
    baslik: 'Bu araç kayıtlı değil',
    satirlar: [['Duyulan plaka', o.plaka]], eylem: 'Ruhsatı çek' };

  /* ⚠️ ÖNERİ ÖZETİN İÇİNDE DEĞİL, KENDİ DÜĞMESİNDE (14.09). Satır
     olarak yazılsaydı ("Benziyor: 34 ABC 123") usta okur ve ne
     yapacağını bilemezdi. Soru bir düğmedir: dokunursan düzeltilir,
     dokunmazsan ekran olduğu gibi kalır. sesCiz `o.oneri`yi görünce
     çiziyor; işlemdeki `oneri` alanı çözümleyiciden geliyor. */

  if (o.tur === 'teslim-edilecek-kayit-yok') return {
    baslik: 'Bu araç zaten serviste değil',
    satirlar: [['Araç', o.plaka + ' · ' + o.arac.marka + ' ' + o.arac.model]],
    eylem: 'Aracın geçmişini aç' };

  return null;
}

var ODEME_AD_SES = { nakit: 'Nakit', kart: 'Kart', havale: 'Havale' };
/* ⚠️ 14.09 — ŞABLON ADLARI BURADAN KALKTI, veri katmanına taşındı
   (SABLON_AD). Burada kendi kopyası vardı ve adlar mesaj ekranındaki
   çiplerle AYNI DEĞİLDİ: onay ekranı "Yapılan işin özeti" diyor, çip
   "İşin özeti" diyordu — usta iki ekranda iki ad görüyordu. */

/* ================= UYGULA ================= */
function sesUygula(o) {
  if (o.tur === 'servis-ac') {
    var yeni = { id: KAYITLAR.length + 1, plaka: o.plaka, tur: o.isTuru,
      km: o.isTuru === 'bakim' ? o.km : '', sikayet: o.is || '',
      acilis: bugunMetin(), teslimTarihi: null, odemeYolu: null,
      hatirlatmaTarihi: null, hatirlatmaGonderildi: false,
      parcaBekliyor: false, bekliyorMusteriye: false, satirlar: [] };
    KAYITLAR.push(yeni); ACIK_KAYIT = yeni.id;
    balon('Kayıt açıldı — yanlış varsa düzelt.', false, 3000);
    Ekran.ac('kayit'); return;
  }
  if (o.tur === 'yeni-arac') {
    /* Söylenenler ruhsat ekranına TAŞINIR — usta aynı şeyi iki kez
       söylemesin. Ruhsat çekilince üstüne yazılır. */
    RUHSAT_ONDOLGU = { plaka: o.plaka, sahipAd: o.sahip, sahipTel: o.tel,
                       is: o.is, tur: o.isTuru, km: o.km };
    Ekran.ac('ruhsat'); return;
  }
  if (o.tur === 'teslim') {
    ACIK_KAYIT = o.kayit.id; Ekran.ac('teslim');
    if (o.odeme) {
      var dg = document.querySelector('#tsOdeme [data-odeme="' + o.odeme + '"]');
      if (dg) dg.click();
      balon('Ödeme "' + ODEME_AD_SES[o.odeme] + '" seçildi — teslimi sen onayla.', false, 3200);
    }
    return;
  }
  if (o.tur === 'satir-ekle') {
    var k = kayitBul(ACIK_KAYIT);
    if (!k) { balon('Açık kayıt yok.'); return; }
    k.satirlar.push({ tip: o.tip, ad: o.ad, fiyat: o.fiyat || 0, alis: 0,
      kimGetirdi: o.tip === 'parca' ? 'tamirci' : '',
      marka: '', kod: '', tanim: 'tanimlanamadi' });
    balon('Satır eklendi — fiyatını yaz.', false, 2800);
    Ekran.ac('kayit'); return;
  }
  if (o.tur === 'fiyat-guncelle') {
    /* Satır nesnesi kaydın içinde duruyor; indeks de taşınıyor ki
       aynı adı taşıyan iki satır olsa bile doğru olan değişsin. */
    var gk = kayitBul(o.kayit.id);
    var gs = gk && gk.satirlar ? gk.satirlar[o.indeks] : null;
    if (!gs) { balon('Satır bulunamadı.', false, 2600); return; }
    gs.fiyat = o.fiyat;
    ACIK_KAYIT = gk.id;
    balon((gs.ad || 'Satır') + ' → ' + tutar(o.fiyat) + ' ₺', false, 2800);
    Ekran.ac('kayit');
    return;
  }

  if (o.tur === 'tahsilat-sor') {
    /* Dönem muhasebe ekranıyla ORTAK (çekirdekteki muhDonemSecili):
       usta sorduğu pencereyi ekranda da bulsun. */
    muhDonemSecili = o.donem;
    Ekran.ac('muhasebe');
    return;
  }
  if (o.tur === 'gider-ekle') {
    GIDERLER.push({ id: GIDERLER.length + 1, tarih: bugunMetin(),
      aciklama: o.aciklama, tutar: o.tutar, tur: 'fatura' });
    balon(o.aciklama + ' — ' + tutar(o.tutar) + ' ₺ eklendi.', false, 3000);
    Ekran.ac('muhasebe'); return;
  }
  /* ⚠️ 14.09 — SESLİ YOL ARTIK GERÇEKTEN GÖNDERİYOR. Gönderim ve
     ARŞİVE YAZMA aynı yerden: mesajKaydet(). Mesaj ekranı da onu
     çağırıyor; iki yol iki ayrı kayıt yazsaydı biri er ya da geç
     unutulurdu (43. denetim testi tam bunu ölçüyor). */
  if (o.tur === 'mesaj-gonder') {
    var hedef = mesajHedefi(o.plaka);
    /* Telefon yoksa gönderilmez — ekrana götürülür, orada numara
       eklenebiliyor (K-021: uyarının çözümü kendi yanında olmalı). */
    if (!hedef || !hedef.tel || o.ekranaGit) {
      MESAJ_HEDEF = { plaka: o.plaka, sablon: o.sablon };
      Ekran.ac('mesaj');
      if (!hedef || !hedef.tel) balon('Bu aracın telefonu yok — önce numarayı ekle.', false, 3200);
      return;
    }
    if (o.sablon === 'hatirlatma') {
      aracKayitlari(o.plaka).forEach(function (k) {
        if (k.hatirlatmaTarihi && !k.hatirlatmaGonderildi) k.hatirlatmaGonderildi = true;
      });
    }
    var gk = acikKayit(o.plaka) || sonKayit(o.plaka);
    mesajKaydet({ plaka: o.plaka, ad: hedef.ad, tel: hedef.tel, kanal: o.kanal,
                  sablon: o.sablon, kayit: gk ? gk.id : null, metin: o.govde });
    balon(KANAL_AD[o.kanal] + ' açılıyor — ' + hedef.ad + ', mesaj hazır.', false, 3200);
    Ekran.ac('home');
    return;
  }

  if (o.tur === 'toplu-mesaj') {
    var alicilar = topluAlicilar();
    if (!alicilar.length) { balon('Telefonu olan müşteri yok.', false, 2800); return; }
    /* HER ALICI KENDİ KAYDINI ALIR. Tek bir "toplu gönderim" kaydı
       yazmak kolaydı ama ispat yükü KİŞİ BAŞINA (K-045.3): hangi
       numaraya, ne zaman, hangi metin. */
    alicilar.forEach(function (x) {
      mesajKaydet({ plaka: x.plaka, ad: x.ad, tel: x.tel, kanal: o.kanal,
                    sablon: o.metinTuru, toplu: true,
                    metin: mesajHitabi(x.plaka) + o.govde + mesajImzasi() });
    });
    balon(alicilar.length + ' müşteriye ' + KANAL_AD[o.kanal] + ' mesajı hazırlandı.',
          false, 3400);
    Ekran.ac('mesaj');
    return;
  }
  if (o.tur === 'ara') {
    ARAMA_TERIMI = { hedef: o.hedef, terim: o.terim, suzgec: o.suzgec || null };
    Ekran.ac(o.hedef); return;
  }
  if (o.tur === 'bilinmeyen-arac') {
    RUHSAT_ONDOLGU = { plaka: o.plaka }; Ekran.ac('ruhsat'); return;
  }
  if (o.tur === 'teslim-edilecek-kayit-yok') {
    ACIK_PLAKA = o.plaka; Ekran.ac('arac'); return;
  }
}

/* ================= ÇİZİM ================= */
function sesCiz() {
  var b = sesBaglam();
  document.getElementById('sesBaslik').textContent =
    (SESLI_NIYET && SESLI_NIYET !== 'genel') ? 'Sesli işlem · ' + b.ad : 'Sesli işlem';

  var orb = document.getElementById('sesOrb');
  orb.className = 'ses-orb' +
    (sesDurumu === 'dinliyor' ? ' dinliyor'
     : sesDurumu === 'anlasildi' ? ' tamam'
     : sesDurumu === 'anlasilmadi' ? ' hata' : '');

  /* ⚠️ GIZLEYINCE ICERIK DE SILINIR (06.09). Eskiden yalniz
     `hidden` veriliyordu ve eski cumle iceride duruyordu. Gozle
     gorunmuyor — ama `textContent` onu okuyor ve beni bir kez
     yanilltti: `ac` kancasinin cumleyi temizlemedigini sandim,
     oysa temizlemisti. Ekranda olmayan bir sey DOM'da da durmasin;
     duran bir sey er ya da gec okunur. */
  var duy = document.getElementById('sesDuyulan');
  duy.hidden = !sesCumle;
  /* ⚠️ DÜZELTİLEN CÜMLE "DUYULAN" DEĞİLDİR (14.09). Plaka önerisi
     kabul edilince cümle değişiyor; etiketi "Duyulan" bırakmak,
     ustaya söylemediği bir şeyi söylemiş gibi göstermek olurdu. */
  duy.innerHTML = sesCumle
    ? '<span class="sd-lbl">' + (sesDuzeltildi ? 'Düzeltildi' : 'Duyulan') +
      '</span>' + sesCumle
    : '';

  var durum = document.getElementById('sesDurum');
  var acik = document.getElementById('sesAciklama');
  var gov = document.getElementById('sesGovde');

  /* ⚠️ ÖRNEKLER YALNIZ BOŞ HÂLDE (Cemil, 07.09): *"Ses kaydı alırken
     'şunları da diyebilirsin' olmasın. Kafa karıştırmasın."*

     Haklı: usta konuşmuşken ekranın altında ona başka cümleler
     önermek, söylediğinin yanlış olduğunu ima ediyor. Örnek, cümleyi
     KURMADAN ÖNCE işe yarar; kurulduktan sonra gürültü.

     Tamamen silmedim çünkü prototipte **konuşmanın tek yolu** bu
     çipler — gerçek mikrofon yalnız güvenli adreste çalışıyor (K-015).
     Silseydim sesli yol prototipte denenemez olurdu. Cemil onayına
     açık (A-M16). */
  var ornekAcik = (sesDurumu === 'bos');
  document.getElementById('sesOrnekBas').hidden = !ornekAcik;
  document.getElementById('sesOrnekler').hidden = !ornekAcik;

  if (sesDurumu === 'bos') {
    durum.textContent = sesMotorVar() ? 'Dokun ve söyle' : 'Örneklerden birine dokun';
    acik.textContent = b.ipucu;
    gov.innerHTML = ''; return;
  }
  if (sesDurumu === 'dinliyor') {
    durum.textContent = 'Dinliyorum…';
    acik.textContent = 'Bitince duraklaman yeter.';
    gov.innerHTML = ''; return;
  }
  if (sesDurumu === 'anlasilmadi') {
    durum.textContent = 'Anlayamadım';
    acik.textContent = 'Ne yapılacağını çıkaramadım. Tekrar söyler misin?';
    gov.innerHTML = '<div class="notice warn">' +
      '<span class="n-ic"><svg class="ico ico-sm"><use href="#i-triangle-alert"></use></svg></span>' +
      '<span class="n-body">Yanlış anladıysam <b>hiçbir şey yapmadım</b> — ' +
      'kayıt açılmadı, bir şey değişmedi.</span></div>';
    return;
  }

  var o = sesOzet(sesIslem);
  durum.textContent = o.baslik;
  acik.textContent = 'Doğruysa onayla, değilse tekrar söyle.';
  gov.innerHTML =
    (o.notice ? '<div class="notice"><span class="n-ic">' +
      '<svg class="ico ico-sm"><use href="#i-info"></use></svg></span>' +
      '<span class="n-body">' + o.notice + '</span></div>' : '') +
    '<div class="tutar-serit">' +
      o.satirlar.map(function (s) {
        return '<div class="tutar-sat"><span>' + s[0] + '</span>' +
               '<span class="tv">' + s[1] + '</span></div>';
      }).join('') +
    '</div>' +
    /* ⚠️ YANLIŞ DUYULAN PLAKA — SORU, DÜZELTME DEĞİL (A-M27).
       Tanıma "34 ABC 123" yerine "34 QBC 123" duyunca akış duruyordu.
       Kendiliğinden düzeltmek yanlış araca iş açardı; düzeltmemek
       ustayı ruhsat çekmeye gönderiyordu. Üçüncü yol: SOR. */
    (sesIslem.oneri
      ? '<button class="btn btn-ghost" id="sesOneri" style="margin-top:12px">' +
          '<svg class="ico"><use href="#i-search-check"></use></svg>' +
          ' Bunu mu demek istedin: ' + sesIslem.oneri + '</button>'
      : '') +
    /* ⚠️ BAŞKA İŞ ÖNERİSİ (16.09) — plaka önerisinin kardeşi.
       Orada "başka bir ARAÇ mı demek istedin", burada "başka bir İŞ
       mi". İkisi de SORU: dokunmazsan hiçbir şey değişmiyor. Kendi
       kendine bağlam değiştirmek, ustanın onayladığından başka bir
       işi yapmak olurdu. */
    (sesIslem.baskaIslem
      ? '<button class="btn btn-ghost" id="sesBaskaIs" style="margin-top:12px">' +
          '<svg class="ico"><use href="#i-search-check"></use></svg>' +
          ' Bunu mu demek istedin: ' + sesOzet(sesIslem.baskaIslem).baslik + '</button>'
      : '') +
    /* KANAL SEÇİMİ ONAY EKRANINDA (Cemil: "SMS yada WhatsApp üzerinden
       mesaj gönderecek"). Söylenmediyse WhatsApp seçili gelir; usta
       tek dokunuşla değiştirir. Çip bir SEÇİM aracıdır — doğru bileşen. */
    (o.kanal
      ? '<div class="section-label" style="margin-top:14px">Nereden gitsin?</div>' +
        '<div class="cip-grup" role="group" aria-label="Gönderim kanalı">' +
          ['whatsapp', 'sms'].map(function (k) {
            return '<button class="cip" data-ses-kanal="' + k + '" aria-pressed="' +
              (sesIslem.kanal === k) + '">' + KANAL_AD[k] + '</button>';
          }).join('') +
        '</div>'
      : '') +
    /* GİDECEK METİN GÖRÜNÜR VE DÜZENLENEBİLİR. Onay ekranı "ne
       yapılacağını" söylüyor; mesajda yapılacak şey METNİN KENDİSİ.
       Göstermeseydik usta neyi onayladığını bilmeden onaylardı. */
    (o.metin
      ? '<div class="field" style="margin-top:12px">' +
          '<label for="sesMesajMetni">Gidecek mesaj</label>' +
          '<textarea id="sesMesajMetni" rows="5" aria-label="Gidecek mesaj">' +
            (sesIslem.govde || '') + '</textarea>' +
        '</div>'
      : '') +
    '<div class="btn-row" style="margin-top:14px">' +
      '<button class="btn btn-ghost" id="sesVazgec">' +
        '<svg class="ico"><use href="#i-x"></use></svg> Tekrar söyle</button>' +
      '<button class="btn btn-primary" id="sesOnayla">' +
        '<svg class="ico"><use href="#i-check"></use></svg> ' + o.eylem + '</button>' +
    '</div>' +
    (o.eylem2
      ? '<button class="btn btn-ghost" id="sesEkrandaAc" style="margin-top:10px">' +
          '<svg class="ico"><use href="#i-message-square"></use></svg> ' +
          o.eylem2 + '</button>'
      : '');
}

/* ⚠️ MOTOR TESPİTİ ÇEKİRDEĞE TAŞINDI (08.09).
   `sesMotorSinifi` / `sesMotorVar` / `sesMotorNotu` artık
   betik/01-cekirdek.js içinde. Sebep: mikrofon ARTIK İKİ İŞ yapıyor —
   bu ekranda KOMUT çözümlüyor, mesaj ekranında DİKTE ediyor. İkisi
   aynı motoru soruyor; iki kopya olsaydı biri "https şart" der öteki
   demezdi. Aşağıdaki çağrılar aynen duruyor. */

function sesDinlemeyiBaslat() {
  var Sinif = sesMotorSinifi();
  if (!Sinif || !sesMotorVar()) {
    balon('Mikrofon açılamıyor — aşağıdaki örneklerden birine dokun.', false, 3200);
    return;
  }
  try {
    sesTanima = new Sinif();
    sesTanima.lang = 'tr-TR';
    /* ARA SONUÇ AÇIK: usta konuşurken metni GÖRSÜN. Kapalıyken ekran
       konuşma bitene kadar hiçbir şey göstermiyor ve "beni duyuyor mu"
       sorusu cevapsız kalıyor. */
    sesTanima.interimResults = true;
    sesTanima.maxAlternatives = 1;

    sesTanima.onresult = function (e) {
      var kesin = '', gecici = '';
      for (var i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) kesin += e.results[i][0].transcript;
        else gecici += e.results[i][0].transcript;
      }
      if (kesin) { sesCumleIsle(kesin); return; }
      /* Geçici metni yalnız GÖSTER, çözümleme yapma — yarım cümleyi
         işleme çevirmek yanlış işlem demek. */
      sesCumle = gecici;
      var duy = document.getElementById('sesDuyulan');
      duy.hidden = !gecici;
      if (gecici) duy.innerHTML = '<span class="sd-lbl">Duyuluyor…</span>' + gecici;
    };

    sesTanima.onerror = function (e) {
      sesDurumu = 'bos'; sesCiz();
      /* Hata kodlarını TÜRKÇE VE EYLEMLİ söyle: "not-allowed" yazan bir
         balon ustaya hiçbir şey anlatmıyor. */
      var mesaj = ({
        'not-allowed': 'Mikrofon izni verilmedi. Adres çubuğundaki kilit simgesinden izin ver.',
        'service-not-allowed': 'Tarayıcı mikrofonu engelledi. Sayfayı https ya da localhost üzerinden aç.',
        'no-speech': 'Ses duyulmadı. Mikrofona biraz daha yakın söyle.',
        'audio-capture': 'Mikrofon bulunamadı.',
        'network': 'Tanıma sunucusuna ulaşılamadı — internet bağlantısını kontrol et.',
        'aborted': ''
      })[e.error];
      if (mesaj === undefined) mesaj = 'Mikrofon hatası: ' + (e.error || 'bilinmiyor');
      if (mesaj) balon(mesaj, false, 4000);
    };
    sesTanima.onend = function () {
      if (sesDurumu === 'dinliyor') { sesDurumu = 'bos'; sesCiz(); }
    };
    sesDurumu = 'dinliyor'; sesCumle = ''; sesCiz();
    sesTanima.start();
  } catch (x) {
    sesDurumu = 'bos'; sesCiz();
    balon('Mikrofon başlatılamadı.', false, 2600);
  }
}

/* ---- TEST KÖPRÜSÜ ----
   Ekran betikleri derlemede kendi IIFE'sine sarılıyor (v1'in sekiz
   var-sızıntısı hatası bu yüzden imkânsız). İyi bir kural, ama
   çözümlemeyi dışarıdan sınamayı da imkânsız kılıyordu: gerçek tanıma
   metinleri ("34 abc 123" gibi küçük harfli, noktalamasız) ancak
   mikrofonla denenebiliyordu.
   Denetimin showScreen köprüsüyle aynı gerekçe: sınanamayan kod,
   sınanmamış koddur. */
window.SES_COZUMLE = function (c) { return sesCozumle(c); };
/* ⚠️ ÖRNEK ÇİPLER DE SINANABİLİR OLMALI (14.09). Bağlam tablosu bu
   ekranın IIFE'sinde duruyordu ve denetim onu göremiyordu; ekranın
   ustaya önerdiği cümlelerin çalıştığını kimse ölçmüyordu. Nitekim
   biri çalışmıyordu ("servistekileri göster"). */
window.SES_BAGLAMLAR = function () {
  var c = {};
  Object.keys(SES_BAGLAM).forEach(function (ad) {
    /* Denetim ekranda GÖRÜNEN cümleyi sınamalı — yer tutucu hâlini
       değil. Doldurma bağlamdan bağımsız olduğu için burada tek tek
       geçiliyor. */
    c[ad] = (SES_BAGLAM[ad].ornekler || []).map(sesOrnekDoldur);
  });
  return c;
};
/* Ham metnin düzeltilmiş hâli — hata ararken hangi adımın bozduğunu
   görmek için. */
window.SES_METIN = function (c) {
  var h = sesHarfleriBirlestir((c || '').trim());
  return { harf: h, sayi: sesSayilariCevir(h) };
};
window.SES_SOYLE = function (c) { sesCumleIsle(c); return sesIslem; };

/* Duyulan cümleyi işle — motordan da gelse, örnekten de gelse AYNI yol.
   İki ayrı yol yazmak, örneklerle çalışıp gerçekte çalışmayan bir
   ekran demek olurdu. */
function sesCumleIsle(cumle) {
  sesCumle = cumle;
  sesIslem = sesCozumle(cumle);
  sesDurumu = (sesIslem.tur === 'plakasiz') ? 'anlasilmadi' : 'anlasildi';
  sesCiz();
}

Ekran.tanim('ses', {
  /* ⚠️ DUYULAN CUMLE ACILISTA SILINIR, HER CIZIMDE DEGIL (K-040).
     Bu ucu `ciz`in ilk satirindaydi: ekranı tazeleyen herhangi bir
     sey ustanin az once soyledigi cumleyi siliyordu. Bugun tek
     tazeleyen yol sesleAc()'ti ve orada silmek DOGRUydu (yeni baglam,
     eski cumle bayat) — ama dogru olusu tesadüftü, kural degil.
     sesleAc artik goster() cagiriyor: acilis acikca acilis. */
  ac: function () {
    sesDurumu = 'bos'; sesCumle = ''; sesIslem = null;
    /* Düzeltme işareti de AÇILIŞA ait: bırakılsa bir sonraki cümle
       "Düzeltildi" diye etiketlenirdi (K-040'ın kuralı). */
    sesDuzeltildi = false;
  },
  ciz: function () {
    var b = sesBaglam();
    document.getElementById('sesOrnekler').innerHTML = sesOrnekleri().map(function (c, i) {
      return '<button class="cip" data-ornek="' + i + '">' + c + '</button>';
    }).join('');
    /* ⚠️ MOTOR NOTU ARTIK YAZILMIYOR (Cemil, 07.09): *"Altta
       mikrofona dokun ve şöyle alanı da olmasın. Bu bilgi gereksiz."*
       Şerit "mikrofon yalnız güvenli adreste açılır" diyordu — bu
       PROTOTIPIN sorunu, ustanın değil. Ustaya kendi telefonunda
       hiç karşılaşmayacağı bir kısıtı anlatıyordu. */
    document.getElementById('sesMotorNot').textContent = '';
    sesCiz();
  }
});

document.addEventListener('click', function (e) {
  var t = e.target.closest('button');
  if (!t) return;

  var o = t.getAttribute('data-ornek');
  if (o !== null) {
    /* Örnek de gerçek cümle gibi işlenir; kısa gecikme "dinliyor"
       hâlinin görülmesi için. */
    var c = sesOrnekleri()[parseInt(o, 10)];
    sesCumle = c; sesDurumu = 'dinliyor'; sesCiz();
    setTimeout(function () { sesCumleIsle(c); }, 700);
    return;
  }
  if (t.id === 'sesOrb') { sesDinlemeyiBaslat(); return; }
  if (t.id === 'sesVazgec') {
    if (sesTanima) { try { sesTanima.abort(); } catch (x) {} }
    sesDurumu = 'bos'; sesCumle = ''; sesIslem = null;
    sesDuzeltildi = false; sesCiz(); return;
  }
  /* KANAL DEĞİŞİNCE YAZILAN METİN KAYBOLMAZ (14.09). Çizim `sesIslem`
     üzerinden üretiliyor; usta metni elle düzeltmişse önce oraya
     yazılır, sonra ekran tazelenir. Yoksa tek bir kanal dokunuşu
     ustanın cümlesini siler — v1'in "ciz() kararı da siliyor"
     hatasının (K-033.12) aynısı. */
  var ka = t.getAttribute('data-ses-kanal');
  if (ka && sesIslem) {
    sesMetniAl();
    sesIslem.kanal = ka;
    sesCiz();
    return;
  }

  if (t.id === 'sesOneri' && sesIslem && sesIslem.oneri) {
    sesPlakayiDuzelt(sesIslem.oneri);
    return;
  }

  /* Öneriye dokunmak işlemi DEĞİŞTİRİR, yapmaz: ekranda yine onay
     bekliyor. Eski işlem yeni öneri oluyor — usta fikir değiştirirse
     tek dokunuşla geri dönüyor, yoksa cümleyi tekrar söylemesi
     gerekirdi. */
  if (t.id === 'sesBaskaIs' && sesIslem && sesIslem.baskaIslem) {
    var eski = sesIslem, yeni = sesIslem.baskaIslem;
    eski.baskaIslem = null;
    yeni.baskaIslem = eski;
    sesIslem = yeni;
    sesDurumu = 'anlasildi';
    Iz.supheli('ses-baglam-disi-is', { kabul: true });
    sesCiz();
    return;
  }

  if (t.id === 'sesEkrandaAc' && sesIslem) {
    sesMetniAl();
    sesIslem.ekranaGit = true;
    sesUygula(sesIslem);
    return;
  }

  if (t.id === 'sesOnayla' && sesIslem) { sesMetniAl(); sesUygula(sesIslem); return; }
});

/* ⚠️ ÖNERİ KABUL EDİLİNCE CÜMLE DÜZELTİLİR, İŞLEM DEĞİL (A-M27).
   İşlemi elle düzeltmek ikinci bir çözümleme yolu açardı: plakayı
   değiştirip şablonu, kanalı ve metni eski hâlinde bırakan bir işlem,
   ustanın onayladığından başka bir şey gönderirdi. Cümledeki plaka
   değiştirilip AYNI çözümleyiciye veriliyor — tek yol, tek sonuç.

   Onaysız hiçbir şey olmuyor: bu fonksiyon yalnız ekranı yeniden
   çiziyor, gönderme sesOnayla'da duruyor. */
function sesPlakayiDuzelt(yeniPlaka) {
  var metin = sesSayilariCevir(sesHarfleriBirlestir((sesCumle || '').trim()));
  var p = sesPlakaBul(metin);
  if (!p || !yeniPlaka) return;
  var duzeltilmis = metin.slice(0, p.indeks) + yeniPlaka +
                    metin.slice(p.indeks + p.uzunluk);
  sesCumleIsle(duzeltilmis);
  sesDuzeltildi = true;
  sesCiz();
  balon('Plaka ' + yeniPlaka + ' olarak düzeltildi — göndermeden önce bak.', false, 3000);
}

/* Onay ekranındaki metin alanı varsa içeriğini işleme yaz — gönderilen
   şey ustanın EKRANDA GÖRDÜĞÜ metin olsun. */
function sesMetniAl() {
  var el = document.getElementById('sesMesajMetni');
  if (el && sesIslem) sesIslem.govde = el.value;
}
</script>
