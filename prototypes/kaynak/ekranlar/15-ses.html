<script>
/* ================= BAĞLAM =================
   Her giriş noktası kendi örneklerini getirir. Ustanın "ne
   diyebilirim" sorusu, geldiği yere göre farklı. Genel bir örnek
   listesi göstermek, ekranı herkes için biraz yanlış yapıyordu. */
/* ⚠️ 14.09 — ÖRNEKLER SABİT METİN DEĞİL, VERİDEN DOLUYOR.
   45. test üç örneğin yalan söylediğini gösterdi: "41 ABC 43 ara"
   diyen çip, ÖYLE BİR ARAÇ OLMADIĞI için boş liste döndürüyordu.
   Ekranın kendi örneği "sonuç bulunamadı" veriyorsa usta sesi bir
   daha denemez.

   Sabit plaka yazmak, veriyi iki yerde tutmaktır: tohum veri değişince
   örnek bayatlar ve kimse fark etmez. Yer tutucular çizim anında
   GERÇEK kayıtlardan dolduruluyor — {plaka} kayıtlı bir araç,
   {serviste} şu an serviste olan bir araç, {sahip} gerçek bir müşteri.
   Örnek artık bayatlayamaz. */
var SES_BAGLAM = {
  genel: {
    ad: 'Sesli işlem',
    ipucu: 'Plakayı ve ne yapılacağını söylemen yeter.',
    ornekler: [
      '{plaka} triger seti değişecek',
      '{serviste} bakıma geldi kilometre 88 bin',
      '{serviste} teslim ettim nakit aldım'
    ]
  },
  'servis-ekle': {
    ad: 'Servis kaydı ekle',
    ipucu: 'Plakayı, sahibini, numarasını ve yapılacak işi söyle.',
    ornekler: [
      '{plaka} triger seti değişecek',
      '41 KV 5588 Ahmet Yılmaz 0532 111 22 33 debriyaj kaçırıyor',
      '{serviste} bakıma geldi kilometre 88 bin'
    ]
  },
  araclar: {
    ad: 'Araçlarda ara',
    ipucu: 'Plaka, marka ya da sahip adı söyleyebilirsin.',
    ornekler: ['{plaka} ara', '{marka} ara', '{sahip} ara']
  },
  kayitlar: {
    ad: 'Servis kayıtlarında ara',
    ipucu: 'Plaka ya da yapılan iş söyleyebilirsin.',
    ornekler: ['{plaka} ara', 'balata ara', 'servistekileri göster']
  },
  musteriler: {
    ad: 'Müşterilerde ara',
    ipucu: 'Plaka, ad ya da telefon söyleyebilirsin.',
    ornekler: ['{plaka} ara', '{plaka} sahibini ara', '{sahip} ara']
  },
  mesaj: {
    ad: 'Müşteriye mesaj',
    ipucu: 'Kime, ne göndereceğini söyle. "Tüm müşterilere" dersen toplu gider.',
    /* 14.09 — örnekler Cemil'in söylediği cümleler oldu: birincisi
       ses kaydında geçen cümlenin aynısı, üçüncüsü toplu gönderim. */
    ornekler: [
      '{serviste} sahibine WhatsApp üzerinden selam mesajı gönder',
      '{teslimli} sahibine bakım hatırlatması gönder',
      'tüm müşterilere bayram mesajı gönder'
    ]
  },
  muhasebe: {
    ad: 'Muhasebe',
    ipucu: 'Gideri söylemen yeter — tutar ve açıklama ayrılır.',
    ornekler: [
      '2400 TL elektrik faturası ekle',
      '850 lira kira gideri ekle',
      'bugün ne kadar tahsil ettim'
    ]
  },
  'kayit-icinde': {
    ad: 'Açık servis kaydı',
    ipucu: 'Ne yapıldığını söyle — açık kayda satır olarak düşer.',
    ornekler: [
      'balata da değişecek',
      'işçilik 750 lira',
      'yağ filtresi 260 lira parça'
    ]
  }
};

/* Yer tutucuları GERÇEK veriyle doldurur. Veri boşsa yer tutucu
   ekranda kalmasın diye son çare olarak ilk araç kullanılıyor. */
function sesOrnekDoldur(c) {
  var ilk = ARACLAR[0] || {};
  var icerdeKayit = icerideki()[0];
  var servisteki = icerdeKayit ? aracBul(icerdeKayit.plaka) : null;
  var teslimli = ARACLAR.filter(function (a) {
    return !aracServiste(a.plaka) && aracKayitlari(a.plaka).length;
  })[0] || ilk;
  var sahipli = ARACLAR.filter(function (a) { return a.sahipAd; })[0] || ilk;
  return String(c)
    .replace(/\{plaka\}/g, ilk.plaka || '')
    .replace(/\{serviste\}/g, (servisteki || ilk).plaka || '')
    .replace(/\{teslimli\}/g, teslimli.plaka || '')
    .replace(/\{marka\}/g, ilk.marka || '')
    .replace(/\{sahip\}/g, sahipli.sahipAd || '');
}
/* Ekranın gösterdiği liste ile tıklanınca işlenen cümle AYNI yerden
   çıkar — ikisi ayrılırsa usta gördüğünden başka bir şey söylemiş
   olur. */
function sesOrnekleri() {
  return (sesBaglam().ornekler || []).map(sesOrnekDoldur);
}

var sesDurumu = 'bos';      /* bos · dinliyor · anlasildi · anlasilmadi */
var sesCumle = '';
/* Plaka onerisi kabul edildi mi — ekrandaki "Duyulan" etiketi buna
   gore degisiyor (A-M27). */
var sesDuzeltildi = false;
var sesIslem = null;
var sesTanima = null;       /* Web Speech API nesnesi */

function sesBaglam() {
  return SES_BAGLAM[SESLI_NIYET] || SES_BAGLAM.genel;
}

/* ================= ÇÖZÜMLEME =================
   Gerçek motor geldiğinde değişecek olan BURASI, ekran değil.
   Sıra önemli: en dar kalıp önce denenir. */
/* GERÇEK MOTORUN DÖNDÜRDÜĞÜ METİN DÜZGÜN DEĞİL. Tanıma "34 ABC 123"
   yerine "34 a b c 123" (harf harf), "34ABC123" (bitişik) ya da
   "34 Abc 123" döndürebiliyor. Plakayı aramadan ÖNCE tek harfler
   birleştiriliyor — yoksa doğru duyulmuş bir plaka bulunamıyor. */
/* ⚠️ BU FONKSİYON BİR KEZ `\b` İLE YAZILDI VE BOZDU — K-018'i yazdıktan
   SONRA. Desen şuydu: /\b([A-Za-z…])(\s+[A-Za-z…])+\b/
   "beş yüz" içinde "ş y" ikilisini TEK HARF DİZİSİ sandı, çünkü 'e' ile
   'ş' arasında `\b` var (ş, ASCII kelime karakteri değil) ve 'y' ile
   'ü' arasında da var. Sonuç "beşyüz" oldu, sayı çözümlenemedi.
   Kural bir kez daha: Türkçede sınır aramak yerine BOŞLUKTAN BÖL. */
function sesHarfleriBirlestir(metin) {
  var t = (metin || '').split(/\s+/).filter(Boolean);
  var cikti = [], i = 0;
  var tekHarf = function (p) { return p.length === 1 && /[A-Za-zÇĞİÖŞÜçğıöşü]/.test(p); };
  while (i < t.length) {
    if (!tekHarf(t[i])) { cikti.push(t[i]); i++; continue; }
    var j = i;
    while (j < t.length && tekHarf(t[j])) j++;
    /* Tek başına duran bir harf harf dizisi değildir — dokunma. */
    if (j - i >= 2) cikti.push(t.slice(i, j).join(''));
    else cikti.push(t[i]);
    i = j;
  }
  return cikti.join(' ');
}

/* TANIMA MOTORU SAYIYI KELİME OLARAK DÖNDÜREBİLİR: "otuz dört ABC yüz
   yirmi üç". Rakama çevrilmezse plaka hiç bulunamıyor.

   ⚠️ TEK KELİMELİK SAYI ÇEVRİLMEZ — "bir de balata değişecek" cümlesi
   "1 de balata değişecek" olurdu. İstisna: peşinden birim geliyorsa
   ("elli lira", "seksen kilometre") çevrilir, orada sayı olduğu kesin. */
var SES_SAYI = {
  'sifir': 0, 'bir': 1, 'iki': 2, 'uc': 3, 'dort': 4, 'bes': 5,
  'alti': 6, 'yedi': 7, 'sekiz': 8, 'dokuz': 9, 'on': 10, 'yirmi': 20,
  'otuz': 30, 'kirk': 40, 'elli': 50, 'altmis': 60, 'yetmis': 70,
  'seksen': 80, 'doksan': 90
};
var SES_BIRIM = { 'lira': 1, 'tl': 1, '₺': 1, 'km': 1, 'kilometre': 1 };

function sesSayilariCevir(metin) {
  var parcalar = metin.split(/(\s+)/);
  var cikti = [], i = 0;

  function sayiMi(p) {
    var n = norm((p || '').replace(/[.,!?]/g, ''));
    return SES_SAYI[n] !== undefined || n === 'yuz' || n === 'bin';
  }

  while (i < parcalar.length) {
    if (!sayiMi(parcalar[i])) { cikti.push(parcalar[i]); i++; continue; }

    /* Sayı sözcüklerinden oluşan diziyi topla (aradaki boşluklar dahil). */
    var basla = i, kelimeler = [];
    while (i < parcalar.length) {
      if (/^\s+$/.test(parcalar[i])) { i++; continue; }
      if (!sayiMi(parcalar[i])) break;
      kelimeler.push(norm(parcalar[i].replace(/[.,!?]/g, '')));
      i++;
    }

    var sonrakiBirim = false;
    for (var j = i; j < parcalar.length; j++) {
      if (/^\s+$/.test(parcalar[j])) continue;
      sonrakiBirim = SES_BIRIM[norm(parcalar[j].replace(/[.,!?]/g, ''))] === 1;
      break;
    }

    /* Tek kelimeyse ve peşinden birim gelmiyorsa DOKUNMA. */
    if (kelimeler.length < 2 && !sonrakiBirim) {
      for (var k = basla; k < i; k++) cikti.push(parcalar[k]);
      continue;
    }

    /* BAŞTA "SIFIR" VARSA RAKAM RAKAM SÖYLENİYOR demektir:
       "sıfır altı" → "06", toplayarak "6" olurdu ve plakanın il kodu
       iki hane olmak zorunda. */
    var deger;
    if (kelimeler[0] === 'sifir' && kelimeler.every(function (w) {
          return SES_SAYI[w] !== undefined && SES_SAYI[w] < 10;
        })) {
      deger = kelimeler.map(function (w) { return SES_SAYI[w]; }).join('');
    } else {
      var toplam = 0, gecerli = 0;
      kelimeler.forEach(function (w) {
        if (w === 'yuz') gecerli = (gecerli || 1) * 100;
        else if (w === 'bin') { toplam += (gecerli || 1) * 1000; gecerli = 0; }
        else gecerli += SES_SAYI[w];
      });
      deger = String(toplam + gecerli);
    }
    /* ⚠️ SONA BOŞLUK ŞART: dizi toplanırken aradaki boşluklar yutuldu.
       Konmazsa "otuz dört abc" → "34abc" oluyor ve plaka deseni
       tutmuyordu. */
    cikti.push(deger + ' ');
  }
  return cikti.join('').replace(/\s+/g, ' ').trim();
}

/* ================= ÇÖZÜMLEME → ŞEMA (Tur 8.3 · 12.10) =================
   Bu ekran artık hiçbir işi TANIMIYOR. Yaptığı iki şey kaldı:
     1) tanıma motorunun bozuk metnini düzeltmek (harf · sayı — yukarıda)
     2) metni, bağlamı ve açık kaydı şema sistemine vermek
   İşleri, işin SAHİBİ ekran bildiriyor (`Islem.tanim`, betik/04-islem.js):
     kayıt · teslim · araç · ruhsat · mesaj · muhasebe · araçlar.

   ÖNCESİ (rakamla): çözümleyici zincirinde 15 `return {tur…}`, onay
   ekranında 12, uygulamada 12 elle yazılmış `o.tur ===` dalı — üç yerde
   aynı 12 iş (+ "anlaşılmadı"). Şimdi bu dosyada işe özgü dal SIFIR. Yeni bir iş eklemek
   bir şema yazmaktır; ses ekranına dokunulmaz.

   ⚠️ PLAKA / TUTAR / TELEFON OKUYUCULARI çekirdeğe (04-islem.js) taşındı:
   şemalar başka ekranlarda duruyor ve ekran betikleri birbirini
   göremez (her biri kendi IIFE'sinde). */
function sesCozumle(c) {
  /* Ham metnin düzeltmeleri BURADA, tek giriş noktasında: harf harf
     söylenen plaka birleşiyor, kelimeyle söylenen sayı rakama
     dönüyor. Böylece bütün indeksler aynı metne göre. */
  var metin = sesSayilariCevir(sesHarfleriBirlestir((c || '').trim()));
  return Islem.cozumle(metin, SESLI_NIYET || 'genel', ACIK_KAYIT);
}

/* ⚠️ ÖNERİ ÖZETİN İÇİNDE DEĞİL, KENDİ DÜĞMESİNDE (14.09). Satır olarak
   yazılsaydı ("Benziyor: 34 ABC 123") usta okur ve ne yapacağını
   bilemezdi. Soru bir düğmedir: dokunursan düzeltilir, dokunmazsan ekran
   olduğu gibi kalır. sesCiz `o.oneri`yi görünce çiziyor. */

/* ⚠️ 14.09 — ŞABLON ADLARI veri katmanında (SABLON_AD). Burada kendi
   kopyası vardı ve adlar mesaj ekranındaki çiplerle AYNI DEĞİLDİ — usta
   iki ekranda iki ad görüyordu. 12.10'da ödeme adları da aynı yoldan
   gitti: ses ekranının ODEME_AD_SES kopyası kalktı, teslim şeması
   ODEME_ETIKET'ten okuyor. */

/* ================= UYGULA ================= */
/* ⚠️ BAĞLAM DIŞI İŞ BİTİNCE KAYDA DÖNÜŞ (16.09 — 7.4).
   Usta servis kaydının içindeyken başka bir iş söyleyebiliyor artık
   (7.3). Ama iş bitince başka bir ekranda kalıyordu: kaydı bulmak için
   listeye gidip aramak gerekiyordu. Kayıt hâlâ AÇIK (`ACIK_KAYIT`
   duruyor) — eksik olan yalnız kapıydı.

   ⚠️ İLK YAZIŞIM ZAMANLAYICIYLA İDİ VE DENETİM YAKALADI: balonu 400 ms
   sonra gösteriyordum ki işin kendi balonu ("Gider eklendi") önce
   okunsun. Zamanlayıcı denetimin işi bittikten SONRA ateşleniyor,
   bıraktığı düğme bir sonraki koşuda "çekmece odak sızıntısı" olarak
   çıkıyordu — yani ekranda kimsenin beklemediği bir anda beliren bir
   düğme. Gerçek kullanımda da aynısı olurdu: usta çoktan başka bir
   şeye bakarken balon açılır.

   Artık TEK BALON: işin kendi mesajının üstüne dönüş düğmesi
   ekleniyor. İki bilgi bir yerde, zamanlayıcı yok. */
function sesDonusHedefi(o) {
  if (SESLI_NIYET !== 'kayit-icinde' || !ACIK_KAYIT) return null;
  /* Kaydın kendi işleri zaten kayıtta kalıyor; teklif yalnız BAŞKA
     bir ekrana götüren işler için. "Kendi işi" listesi artık burada
     elle tutulmuyor — şema hangi bağlamın işi olduğunu kendisi söylüyor. */
  if (Islem.kendiIsiMi(o.tur, SESLI_NIYET)) return null;
  return kayitBul(ACIK_KAYIT) || null;
}

function sesKaydaDonusEkle(k) {
  var t = document.getElementById('toast');
  var mevcut = t ? (t.textContent || '').trim() : '';
  var don = function () { Ekran.ac('kayit'); };
  window.SES_DONUS = { kayit: k.id, plaka: k.plaka, ac: don };
  balonEylem((mevcut || k.plaka + ' kaydı açık.'), 'Kayda dön', don, 6000);
}

function sesUygula(o) {
  var donus = sesDonusHedefi(o);
  Islem.uygula(o);
  if (donus) sesKaydaDonusEkle(donus);
}

/* ================= ÇİZİM ================= */
/* Sorulan bir alan, TİPİNE göre çizilir:
     secim     → çip grubu. Söylenen seçili gelir; usta tek dokunuşla
                 değiştirir. Çip bir SEÇİM aracıdır — doğru bileşen.
     uzunMetin → düzenlenebilir kutu. Onay ekranı "ne yapılacağını"
                 söylüyor; mesajda yapılacak şey METNİN KENDİSİ —
                 göstermeseydik usta neyi onayladığını bilmeden onaylardı. */
function sesSoruHtml(a) {
  var v = sesIslem[a.ad];
  if (a.tip === 'secim') {
    return '<div class="section-label" style="margin-top:14px">' + (a.soru || a.etiket) + '</div>' +
      '<div class="cip-grup" role="group" aria-label="' + a.etiket + '">' +
        Object.keys(a.secenek).map(function (k) {
          return '<button class="cip" data-ses-secim="' + a.ad + '" data-deger="' + k +
            '" aria-pressed="' + (v === k) + '">' + a.secenek[k] + '</button>';
        }).join('') +
      '</div>';
  }
  var id = 'sesAlan-' + a.ad;
  return '<div class="field" style="margin-top:12px">' +
      '<label for="' + id + '">' + a.etiket + '</label>' +
      '<textarea id="' + id + '" data-ses-alan="' + a.ad + '" rows="5" aria-label="' +
        a.etiket + '">' + (v || '') + '</textarea>' +
    '</div>';
}

function sesCiz() {
  var b = sesBaglam();
  document.getElementById('sesBaslik').textContent =
    (SESLI_NIYET && SESLI_NIYET !== 'genel') ? 'Sesli işlem · ' + b.ad : 'Sesli işlem';

  var orb = document.getElementById('sesOrb');
  orb.className = 'ses-orb' +
    (sesDurumu === 'dinliyor' ? ' dinliyor'
     : sesDurumu === 'anlasildi' ? ' tamam'
     : sesDurumu === 'anlasilmadi' ? ' hata' : '');

  /* ⚠️ GIZLEYINCE ICERIK DE SILINIR (06.09). Eskiden yalniz
     `hidden` veriliyordu ve eski cumle iceride duruyordu. Gozle
     gorunmuyor — ama `textContent` onu okuyor ve beni bir kez
     yanilltti: `ac` kancasinin cumleyi temizlemedigini sandim,
     oysa temizlemisti. Ekranda olmayan bir sey DOM'da da durmasin;
     duran bir sey er ya da gec okunur. */
  var duy = document.getElementById('sesDuyulan');
  duy.hidden = !sesCumle;
  /* ⚠️ DÜZELTİLEN CÜMLE "DUYULAN" DEĞİLDİR (14.09). Plaka önerisi
     kabul edilince cümle değişiyor; etiketi "Duyulan" bırakmak,
     ustaya söylemediği bir şeyi söylemiş gibi göstermek olurdu. */
  duy.innerHTML = sesCumle
    ? '<span class="sd-lbl">' + (sesDuzeltildi ? 'Düzeltildi' : 'Duyulan') +
      '</span>' + sesCumle
    : '';

  var durum = document.getElementById('sesDurum');
  var acik = document.getElementById('sesAciklama');
  var gov = document.getElementById('sesGovde');

  /* ⚠️ ÖRNEKLER YALNIZ BOŞ HÂLDE (Cemil, 07.09): *"Ses kaydı alırken
     'şunları da diyebilirsin' olmasın. Kafa karıştırmasın."*

     Haklı: usta konuşmuşken ekranın altında ona başka cümleler
     önermek, söylediğinin yanlış olduğunu ima ediyor. Örnek, cümleyi
     KURMADAN ÖNCE işe yarar; kurulduktan sonra gürültü.

     Tamamen silmedim çünkü prototipte **konuşmanın tek yolu** bu
     çipler — gerçek mikrofon yalnız güvenli adreste çalışıyor (K-015).
     Silseydim sesli yol prototipte denenemez olurdu. Cemil onayına
     açık (A-M16). */
  var ornekAcik = (sesDurumu === 'bos');
  document.getElementById('sesOrnekBas').hidden = !ornekAcik;
  document.getElementById('sesOrnekler').hidden = !ornekAcik;

  if (sesDurumu === 'bos') {
    durum.textContent = sesMotorVar() ? 'Dokun ve söyle' : 'Örneklerden birine dokun';
    acik.textContent = b.ipucu;
    gov.innerHTML = ''; return;
  }
  if (sesDurumu === 'dinliyor') {
    durum.textContent = 'Dinliyorum…';
    acik.textContent = 'Bitince duraklaman yeter.';
    gov.innerHTML = ''; return;
  }
  if (sesDurumu === 'anlasilmadi') {
    durum.textContent = 'Anlayamadım';
    acik.textContent = 'Ne yapılacağını çıkaramadım. Tekrar söyler misin?';
    gov.innerHTML = '<div class="notice warn">' +
      '<span class="n-ic"><svg class="ico ico-sm"><use href="#i-triangle-alert"></use></svg></span>' +
      '<span class="n-body">Yanlış anladıysam <b>hiçbir şey yapmadım</b> — ' +
      'kayıt açılmadı, bir şey değişmedi.</span></div>';
    return;
  }

  var o = Islem.ozet(sesIslem);
  var baskaOzet = sesIslem.baskaIslem ? Islem.ozet(sesIslem.baskaIslem) : null;
  durum.textContent = o.baslik;
  acik.textContent = 'Doğruysa onayla, değilse tekrar söyle.';
  gov.innerHTML =
    (o.notice ? '<div class="notice"><span class="n-ic">' +
      '<svg class="ico ico-sm"><use href="#i-info"></use></svg></span>' +
      '<span class="n-body">' + o.notice + '</span></div>' : '') +
    '<div class="tutar-serit">' +
      o.satirlar.map(function (s) {
        return '<div class="tutar-sat"><span>' + s[0] + '</span>' +
               '<span class="tv">' + s[1] + '</span></div>';
      }).join('') +
    '</div>' +
    /* ⚠️ YANLIŞ DUYULAN PLAKA — SORU, DÜZELTME DEĞİL (A-M27).
       Tanıma "34 ABC 123" yerine "34 QBC 123" duyunca akış duruyordu.
       Kendiliğinden düzeltmek yanlış araca iş açardı; düzeltmemek
       ustayı ruhsat çekmeye gönderiyordu. Üçüncü yol: SOR. */
    (sesIslem.oneri
      ? '<button class="btn btn-ghost" id="sesOneri" style="margin-top:12px">' +
          '<svg class="ico"><use href="#i-search-check"></use></svg>' +
          ' Bunu mu demek istedin: ' + sesIslem.oneri + '</button>'
      : '') +
    /* ⚠️ BAŞKA İŞ ÖNERİSİ (16.09) — plaka önerisinin kardeşi.
       Orada "başka bir ARAÇ mı demek istedin", burada "başka bir İŞ
       mi". İkisi de SORU: dokunmazsan hiçbir şey değişmiyor. Kendi
       kendine bağlam değiştirmek, ustanın onayladığından başka bir
       işi yapmak olurdu. */
    /* Önerinin de şeması olmalı; yoksa öneri hiç gösterilmez (51. test
       ayrıca raporlar). */
    (baskaOzet
      ? '<button class="btn btn-ghost" id="sesBaskaIs" style="margin-top:12px">' +
          '<svg class="ico"><use href="#i-search-check"></use></svg>' +
          ' Bunu mu demek istedin: ' + baskaOzet.baslik + '</button>'
      : '') +
    /* SORULAN ALANLAR — şema `sor: true` dediği alanı satır olarak
       değil, SORU olarak çizer; usta cevabı burada değiştirir.
       Bugün mesajın kanalı (çip) ve metni (kutu) böyle. */
    o.sorulan.map(sesSoruHtml).join('') +
    '<div class="btn-row" style="margin-top:14px">' +
      '<button class="btn btn-ghost" id="sesVazgec">' +
        '<svg class="ico"><use href="#i-x"></use></svg> Tekrar söyle</button>' +
      '<button class="btn btn-primary" id="sesOnayla">' +
        '<svg class="ico"><use href="#i-check"></use></svg> ' + o.eylem + '</button>' +
    '</div>' +
    (o.eylem2
      ? '<button class="btn btn-ghost" id="sesEkrandaAc" style="margin-top:10px">' +
          '<svg class="ico"><use href="#i-message-square"></use></svg> ' +
          o.eylem2 + '</button>'
      : '');
}

/* ⚠️ MOTOR TESPİTİ ÇEKİRDEĞE TAŞINDI (08.09).
   `sesMotorSinifi` / `sesMotorVar` / `sesMotorNotu` artık
   betik/01-cekirdek.js içinde. Sebep: mikrofon ARTIK İKİ İŞ yapıyor —
   bu ekranda KOMUT çözümlüyor, mesaj ekranında DİKTE ediyor. İkisi
   aynı motoru soruyor; iki kopya olsaydı biri "https şart" der öteki
   demezdi. Aşağıdaki çağrılar aynen duruyor. */

function sesDinlemeyiBaslat() {
  var Sinif = sesMotorSinifi();
  if (!Sinif || !sesMotorVar()) {
    balon('Mikrofon açılamıyor — aşağıdaki örneklerden birine dokun.', false, 3200);
    return;
  }
  try {
    sesTanima = new Sinif();
    sesTanima.lang = 'tr-TR';
    /* ARA SONUÇ AÇIK: usta konuşurken metni GÖRSÜN. Kapalıyken ekran
       konuşma bitene kadar hiçbir şey göstermiyor ve "beni duyuyor mu"
       sorusu cevapsız kalıyor. */
    sesTanima.interimResults = true;
    sesTanima.maxAlternatives = 1;

    sesTanima.onresult = function (e) {
      var kesin = '', gecici = '';
      for (var i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) kesin += e.results[i][0].transcript;
        else gecici += e.results[i][0].transcript;
      }
      if (kesin) { sesCumleIsle(kesin); return; }
      /* Geçici metni yalnız GÖSTER, çözümleme yapma — yarım cümleyi
         işleme çevirmek yanlış işlem demek. */
      sesCumle = gecici;
      var duy = document.getElementById('sesDuyulan');
      duy.hidden = !gecici;
      if (gecici) duy.innerHTML = '<span class="sd-lbl">Duyuluyor…</span>' + gecici;
    };

    sesTanima.onerror = function (e) {
      sesDurumu = 'bos'; sesCiz();
      /* Hata kodlarını TÜRKÇE VE EYLEMLİ söyle: "not-allowed" yazan bir
         balon ustaya hiçbir şey anlatmıyor. */
      var mesaj = ({
        'not-allowed': 'Mikrofon izni verilmedi. Adres çubuğundaki kilit simgesinden izin ver.',
        'service-not-allowed': 'Tarayıcı mikrofonu engelledi. Sayfayı https ya da localhost üzerinden aç.',
        'no-speech': 'Ses duyulmadı. Mikrofona biraz daha yakın söyle.',
        'audio-capture': 'Mikrofon bulunamadı.',
        'network': 'Tanıma sunucusuna ulaşılamadı — internet bağlantısını kontrol et.',
        'aborted': ''
      })[e.error];
      if (mesaj === undefined) mesaj = 'Mikrofon hatası: ' + (e.error || 'bilinmiyor');
      if (mesaj) balon(mesaj, false, 4000);
    };
    sesTanima.onend = function () {
      if (sesDurumu === 'dinliyor') { sesDurumu = 'bos'; sesCiz(); }
    };
    sesDurumu = 'dinliyor'; sesCumle = ''; sesCiz();
    sesTanima.start();
  } catch (x) {
    sesDurumu = 'bos'; sesCiz();
    balon('Mikrofon başlatılamadı.', false, 2600);
  }
}

/* ---- TEST KÖPRÜSÜ ----
   Ekran betikleri derlemede kendi IIFE'sine sarılıyor (v1'in sekiz
   var-sızıntısı hatası bu yüzden imkânsız). İyi bir kural, ama
   çözümlemeyi dışarıdan sınamayı da imkânsız kılıyordu: gerçek tanıma
   metinleri ("34 abc 123" gibi küçük harfli, noktalamasız) ancak
   mikrofonla denenebiliyordu.
   Denetimin showScreen köprüsüyle aynı gerekçe: sınanamayan kod,
   sınanmamış koddur. */
window.SES_COZUMLE = function (c) { return sesCozumle(c); };
/* ⚠️ ÖRNEK ÇİPLER DE SINANABİLİR OLMALI (14.09). Bağlam tablosu bu
   ekranın IIFE'sinde duruyordu ve denetim onu göremiyordu; ekranın
   ustaya önerdiği cümlelerin çalıştığını kimse ölçmüyordu. Nitekim
   biri çalışmıyordu ("servistekileri göster"). */
window.SES_BAGLAMLAR = function () {
  var c = {};
  Object.keys(SES_BAGLAM).forEach(function (ad) {
    /* Denetim ekranda GÖRÜNEN cümleyi sınamalı — yer tutucu hâlini
       değil. Doldurma bağlamdan bağımsız olduğu için burada tek tek
       geçiliyor. */
    c[ad] = (SES_BAGLAM[ad].ornekler || []).map(sesOrnekDoldur);
  });
  return c;
};
/* Ham metnin düzeltilmiş hâli — hata ararken hangi adımın bozduğunu
   görmek için. */
window.SES_METIN = function (c) {
  var h = sesHarfleriBirlestir((c || '').trim());
  return { harf: h, sayi: sesSayilariCevir(h) };
};
window.SES_SOYLE = function (c) { sesCumleIsle(c); return sesIslem; };

/* Duyulan cümleyi işle — motordan da gelse, örnekten de gelse AYNI yol.
   İki ayrı yol yazmak, örneklerle çalışıp gerçekte çalışmayan bir
   ekran demek olurdu. */
function sesCumleIsle(cumle) {
  sesCumle = cumle;
  sesIslem = sesCozumle(cumle);
  /* ⚠️ ŞEMASI OLMAYAN İŞ "ANLAŞILMADI"DIR (12.10). Tanıyıcı ile onay
     ekranı artık ayrı parçalar; biri bir iş üretip öteki onu
     bulamazsa ekran çöküyordu — usta yarım çizilmiş bir ekranla
     kalırdı. Güvenli yön: hiçbir şey yapma, söyle, izine yaz. 51. test
     bu durumu ayrıca BULGU olarak raporluyor; burası yalnız ustayı
     korur, hatayı gizlemez. */
  var bilinen = sesIslem.tur !== 'plakasiz' && Islem.ozet(sesIslem);
  if (sesIslem.tur !== 'plakasiz' && !bilinen) {
    Iz.hata('ses-semasiz-is', new Error('Şeması olmayan iş: ' + sesIslem.tur));
  }
  sesDurumu = bilinen ? 'anlasildi' : 'anlasilmadi';
  sesCiz();
}

Ekran.tanim('ses', {
  /* ⚠️ DUYULAN CUMLE ACILISTA SILINIR, HER CIZIMDE DEGIL (K-040).
     Bu ucu `ciz`in ilk satirindaydi: ekranı tazeleyen herhangi bir
     sey ustanin az once soyledigi cumleyi siliyordu. Bugun tek
     tazeleyen yol sesleAc()'ti ve orada silmek DOGRUydu (yeni baglam,
     eski cumle bayat) — ama dogru olusu tesadüftü, kural degil.
     sesleAc artik goster() cagiriyor: acilis acikca acilis. */
  ac: function () {
    sesDurumu = 'bos'; sesCumle = ''; sesIslem = null;
    gizlilikIlkAcilis('sesGizlilik');
    /* Düzeltme işareti de AÇILIŞA ait: bırakılsa bir sonraki cümle
       "Düzeltildi" diye etiketlenirdi (K-040'ın kuralı). */
    sesDuzeltildi = false;
  },
  ciz: function () {
    var b = sesBaglam();
    document.getElementById('sesOrnekler').innerHTML = sesOrnekleri().map(function (c, i) {
      return '<button class="cip" data-ornek="' + i + '">' + c + '</button>';
    }).join('');
    /* ⚠️ MOTOR NOTU ARTIK YAZILMIYOR (Cemil, 07.09): *"Altta
       mikrofona dokun ve şöyle alanı da olmasın. Bu bilgi gereksiz."*
       Şerit "mikrofon yalnız güvenli adreste açılır" diyordu — bu
       PROTOTIPIN sorunu, ustanın değil. Ustaya kendi telefonunda
       hiç karşılaşmayacağı bir kısıtı anlatıyordu. */
    document.getElementById('sesMotorNot').textContent = '';
    sesCiz();
  }
});

document.addEventListener('click', function (e) {
  var t = e.target.closest('button');
  if (!t) return;

  var o = t.getAttribute('data-ornek');
  if (o !== null) {
    /* Örnek de gerçek cümle gibi işlenir; kısa gecikme "dinliyor"
       hâlinin görülmesi için. */
    var c = sesOrnekleri()[parseInt(o, 10)];
    sesCumle = c; sesDurumu = 'dinliyor'; sesCiz();
    setTimeout(function () { sesCumleIsle(c); }, 700);
    return;
  }
  if (t.id === 'sesOrb') { sesDinlemeyiBaslat(); return; }
  if (t.id === 'sesVazgec') {
    if (sesTanima) { try { sesTanima.abort(); } catch (x) {} }
    sesDurumu = 'bos'; sesCumle = ''; sesIslem = null;
    sesDuzeltildi = false; sesCiz(); return;
  }
  /* KANAL DEĞİŞİNCE YAZILAN METİN KAYBOLMAZ (14.09). Çizim `sesIslem`
     üzerinden üretiliyor; usta metni elle düzeltmişse önce oraya
     yazılır, sonra ekran tazelenir. Yoksa tek bir kanal dokunuşu
     ustanın cümlesini siler — v1'in "ciz() kararı da siliyor"
     hatasının (K-033.12) aynısı. */
  var secilen = t.getAttribute('data-ses-secim');
  if (secilen && sesIslem) {
    sesMetniAl();
    sesIslem[secilen] = t.getAttribute('data-deger');
    sesCiz();
    return;
  }

  if (t.id === 'sesOneri' && sesIslem && sesIslem.oneri) {
    sesPlakayiDuzelt(sesIslem.oneri);
    return;
  }

  /* Öneriye dokunmak işlemi DEĞİŞTİRİR, yapmaz: ekranda yine onay
     bekliyor. Eski işlem yeni öneri oluyor — usta fikir değiştirirse
     tek dokunuşla geri dönüyor, yoksa cümleyi tekrar söylemesi
     gerekirdi. */
  if (t.id === 'sesBaskaIs' && sesIslem && sesIslem.baskaIslem) {
    var eski = sesIslem, yeni = sesIslem.baskaIslem;
    eski.baskaIslem = null;
    yeni.baskaIslem = eski;
    sesIslem = yeni;
    sesDurumu = 'anlasildi';
    Iz.supheli('ses-baglam-disi-is', { kabul: true });
    sesCiz();
    return;
  }

  if (t.id === 'sesEkrandaAc' && sesIslem) {
    sesMetniAl();
    sesIslem.ekranaGit = true;
    sesUygula(sesIslem);
    return;
  }

  if (t.id === 'sesOnayla' && sesIslem) { sesMetniAl(); sesUygula(sesIslem); return; }
});

/* ⚠️ ÖNERİ KABUL EDİLİNCE CÜMLE DÜZELTİLİR, İŞLEM DEĞİL (A-M27).
   İşlemi elle düzeltmek ikinci bir çözümleme yolu açardı: plakayı
   değiştirip şablonu, kanalı ve metni eski hâlinde bırakan bir işlem,
   ustanın onayladığından başka bir şey gönderirdi. Cümledeki plaka
   değiştirilip AYNI çözümleyiciye veriliyor — tek yol, tek sonuç.

   Onaysız hiçbir şey olmuyor: bu fonksiyon yalnız ekranı yeniden
   çiziyor, gönderme sesOnayla'da duruyor. */
function sesPlakayiDuzelt(yeniPlaka) {
  var metin = sesSayilariCevir(sesHarfleriBirlestir((sesCumle || '').trim()));
  var p = sesPlakaBul(metin);
  if (!p || !yeniPlaka) return;
  var duzeltilmis = metin.slice(0, p.indeks) + yeniPlaka +
                    metin.slice(p.indeks + p.uzunluk);
  sesCumleIsle(duzeltilmis);
  sesDuzeltildi = true;
  sesCiz();
  balon('Plaka ' + yeniPlaka + ' olarak düzeltildi — göndermeden önce bak.', false, 3000);
}

/* Onay ekranındaki metin kutularının içeriğini işleme yaz — yapılan şey
   ustanın EKRANDA GÖRDÜĞÜ olsun. Kutunun hangi alana yazacağını şema
   söylüyor (`data-ses-alan`), burada alan adı yazılı değil. */
function sesMetniAl() {
  if (!sesIslem) return;
  var kutular = document.querySelectorAll('#sesGovde [data-ses-alan]');
  for (var i = 0; i < kutular.length; i++) {
    sesIslem[kutular[i].getAttribute('data-ses-alan')] = kutular[i].value;
  }
}
</script>
