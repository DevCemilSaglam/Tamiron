<!-- ekran: muhasebe · PARA
     03.09'da menüden geldi.

     ⚠️ 05.09 — CEMİL'İN TARİFİYLE YENİDEN KURULDU:

       "Basit tabının altına Bugün, bulunduğumuz ay hangisi ise, sonra
        da bulunduğumuz yıl hangisi ise butonları olacak."
       "Bu rakam kâr değil diye açıklama var. Onu kaldır."
       "Toplam parça alışı alanını kaldır."
       "Gider alanı excel gibi tablo şeklinde olsun."
       "Sayfadaki alanları yukarı gün, ay filtresine göre yap."
       "Alınamayan (Veresiye) değil Alacak olsun başlık. Yine tablo gibi
        okunabilir olabilir."
       "En alttaki karar bilgisini kaldır. Sende var zaten karar."
       "Detaylı alanda ise, muhasebe modüllerine gidebilsin. Çek, senet,
        fatura vb. Menü şeklinde olsun."

     İKİ KİP, İKİ FARKLI İŞ:
       BASİT    — bir BAKIŞ ekranı. Dönem seç, rakamları oku.
       DETAYLI  — bir MENÜ. Muhasebenin derin işleri buradan açılır.

     ⚠️ DÖNEM ARTIK HER ŞEYİ SÜZÜYOR. Önce yalnız "bugün" kartı sabitti
     ve ödeme dağılımı BÜTÜN kayıtları topluyordu; iki rakam aynı
     ekranda farklı pencerelere bakıyordu ve hangisinin ne olduğu
     yazmıyordu.

     ⚠️ "BU RAKAM KÂR DEĞİL" AÇIKLAMASI KALKTI — ve rakamın kendisi de
     kalktı. "Kalan" satırı artık yok. Açıklamayı kaldırıp rakamı
     bırakmak, UYARISIZ BİR YANLIŞ RAKAM bırakmak olurdu (K-014: eksik
     giderle çıkan kâr, kârdan kötüdür). Yerine iş başına fark var ve o
     her zaman doğru — kendi sayfasında (`is-basina`).

     BİLEŞENLER: .screen-head .eyebrow .eb-say · .tab-grup .tab
     · .cip-grup .cip · .card · .section-label .with-action .lbl-txt
     · .tutar-serit .tutar-sat .tv · .tablo-sar .tablo · .menu-list
     .menu-row .main .ic-badge .txt .lbl .sub · .field · .btn .btn-row
     · .daire-btn · .pill · .bos-durum. Yeni bileşen yazılmadı. -->
<section class="screen" id="screen-muhasebe">

  <div class="screen-head">
    <span class="eyebrow">
      <svg class="ico ico-sm"><use href="#i-receipt"></use></svg> Muhasebe
      <span class="eb-say" id="muhSay"></span>
    </span>
  </div>

  <div class="tab-grup" role="tablist" aria-label="Muhasebe görünümü">
    <button class="tab" id="muhSekBasit" role="tab" aria-selected="true">
      <svg class="ico"><use href="#i-wallet"></use></svg> Basit
    </button>
    <button class="tab" id="muhSekDetay" role="tab" aria-selected="false">
      <svg class="ico"><use href="#i-receipt"></use></svg> Detaylı
    </button>
  </div>

  <!-- ================= BASİT ================= -->
  <div id="muhBasitGovde" class="yigin">

    <!-- Dönem: Bugün · [ay adı] · [yıl]. Adı yazıyor, "bu ay" demiyor —
         rakam kendi tarihini taşısın. -->
    <div class="cip-grup" id="muhDonem" role="group" aria-label="Dönem"></div>

    <div class="card">
      <div class="section-label">
        <svg class="ico ico-sm"><use href="#i-wallet"></use></svg>
        <span id="muhOzetBaslik">Bugün</span>
      </div>
      <div class="tutar-serit" id="muhOzet"></div>
    </div>

    <!-- İKİ YUVARLAK DÜĞME, AYNI BİÇİM (Cemil, 05.09: "Gider ekle
         button mikrofonun solunda olsun. Aynı yuvarlak içinde + olan
         button"). Elle giriş ve sesle giriş aynı işin iki yolu; ikisi
         iki farklı biçimde durursa biri "asıl", öteki "yedek" gibi
         okunuyordu. Elle giriş yedek değil (K-021.1: mikrofonsuz
         tarayıcıda tek yol o). -->
    <div class="section-label with-action">
      <span class="lbl-txt">
        <svg class="ico ico-sm"><use href="#i-receipt"></use></svg> Giderler
      </span>
      <span class="lbl-eylem">
      <button class="daire-btn ghost" id="muhGiderEkle" aria-label="Gider ekle" title="Gider ekle">
        <svg class="ico"><use href="#i-plus"></use></svg>
      </button>
      <button class="daire-btn" id="muhSesleGider" aria-label="Gideri sesle ekle" title="Sesle ekle">
        <svg class="ico"><use href="#i-mic"></use></svg>
      </button>
      </span>
    </div>

    <div class="card" id="muhGiderForm" hidden>
      <div class="field">
        <label for="muhGiderAd">Açıklama</label>
        <input id="muhGiderAd" placeholder="ör. elektrik faturası, kira, çay ocağı" autocomplete="off" />
      </div>
      <div class="field">
        <label for="muhGiderTutar">Tutar (₺)</label>
        <input id="muhGiderTutar" class="mono" data-giris="tutar" inputmode="numeric" placeholder="0" autocomplete="off" />
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="muhGiderKaydet">Ekle</button>
        <button class="btn btn-ghost" id="muhGiderVazgec">Vazgeç</button>
      </div>
    </div>

    <div id="muhGiderler"></div>

    <!-- "Alınamayan (veresiye)" DEĞİL "Alacak" (Cemil, 05.09). Ustanın
         kelimesi bu; "alınamayan" bir KAYIP gibi okunuyordu, oysa para
         duruyor — yalnız henüz alınmadı. -->
    <div class="section-label">
      <svg class="ico ico-sm"><use href="#i-wallet"></use></svg> Alacak
    </div>
    <div id="muhAlacak"></div>

  </div>

  <!-- ================= DETAYLI — MODÜL MENÜSÜ ================= -->
  <div id="muhDetayGovde" class="yigin" hidden>
    <div class="modul-grid" id="muhModuller" role="group" aria-label="Muhasebe modülleri"></div>
    <p class="plate-hint" id="muhModulNot"></p>
  </div>

</section>

<script>
var ODEME_AD = { nakit: 'Nakit', kart: 'Kart', havale: 'Havale', almadim: 'Almadım' };
var muhKip = 'basit';
/* Hangi gider silinmek üzere — onay satırı bu id'ye göre çiziliyor. */

/* ---- MUHASEBE MODÜLLERİ (Detaylı sekmesi) ----
   Cemil: "Detaylı alanda ise, muhasebe modüllerine gidebilsin. Çek,
   senet, fatura vb. Menü şeklinde olsun."

   ⚠️ YAZILMAMIŞ MODÜL AÇILIR GİBİ DURMAZ. Menüde görünüp dokununca
   hiçbir şey yapmayan bir madde tam olarak 27. testin kovaladığı şeydir
   (ÖLÜ UÇ) — ve en pahalı hâli budur, çünkü usta "bu program bunu
   yapıyor" sanır. Yazılmamış olanlar DEVRE DIŞI duruyor ve nedenini
   söylüyor.

   `hazir: false` olanların hepsi ustadan YENİ VERİ ister; kapsam kararı
   MUH'ta bekliyor (K-022 önerisi: "kasa + gider"). Cemil kapsamı
   genişletirse buraya ekran bağlanır — menü zaten yerinde. */
/* SIRA OTOMIX'İN SIRASI DEĞİL, TAMİRONUN SIRASI: çalışanlar önce.
   Otomix'te modüller alfabetik/klasik sırada duruyor çünkü hepsi
   yazılmış. Burada yarısı yazılmadı; çalışanı aşağı atmak, ustayı
   çalışmayanların arasında aratmak olurdu. */
var MUH_MODUL = [
  { anahtar: 'kasa', ikon: 'i-wallet', ad: 'Kasa',
    alt: 'Tahsilat, gider, alacak', hazir: true },
  { anahtar: 'rapor', ikon: 'i-clipboard-list', ad: 'Raporlar',
    alt: 'İş başına fark, parça alışı', hazir: true },
  { anahtar: 'sms', ikon: 'i-message-square', ad: 'SMS',
    alt: 'Özet ve bakım hatırlatması', hazir: true },
  { ikon: 'i-users', ad: 'Cari', alt: 'Müşteri ve parçacı bakiyesi', hazir: false },
  { ikon: 'i-file-text', ad: 'Fatura', alt: 'Satış faturası, e-Arşiv', hazir: false },
  { ikon: 'i-wallet', ad: 'Banka', alt: 'Hesap hareketleri', hazir: false },
  { ikon: 'i-receipt', ad: 'Çek', alt: 'Alınan ve verilen çekler', hazir: false },
  { ikon: 'i-receipt', ad: 'POS', alt: 'Kart tahsilat dökümü', hazir: false },
  { ikon: 'i-package', ad: 'Stok', alt: 'Parça deposu, sayım', hazir: false },
  { ikon: 'i-file-text', ad: 'Teklif', alt: 'Müşteriye fiyat teklifi', hazir: false }
];

/* Formu açıp kapatmak EKRANI TAZELEMEZ: tazele() gövdeyi yeniden yazar
   ve yarım yazılmış gider uçup giderdi. */
function muhFormGoster(acik) {
  var f = document.getElementById('muhGiderForm');
  if (!f) return;
  f.hidden = !acik;
  document.getElementById('muhGiderEkle').hidden = acik;
  if (acik) document.getElementById('muhGiderAd').focus();
  else {
    document.getElementById('muhGiderAd').value = '';
    document.getElementById('muhGiderTutar').value = '';
  }
}

function muhModulleriCiz() {
  document.getElementById('muhModuller').innerHTML = MUH_MODUL.map(function (m) {
    /* ⚠️ GEZİNME HEDEFİ KODDA BİRLEŞTİRİLMEZ (05.09).
       Önce ' data-git="' + m.git + '"' yazılıyordu. Sonuç: derlemedeki
       "ölü data-git hedefi" denetimi ve sağlık denetiminin YETİM testi
       bu hedefi GÖREMİYORDU — ekran gerçekten açılıyordu ama hiçbir
       araç bunu bilmiyordu. `git` alanına yazım hatası girseydi düğme
       sessizce hiçbir şey yapmazdı.
       Aynı sınıf renk kutucuğunda yaşanmıştı (K-019: sınıf adı kodda
       birleştirilmez, haritadan okunur). Hedef artık bir ETİKET;
       ekran adı aşağıda LİTERAL olarak yazılıyor. */
    var hedef = m.hazir ? ' data-muhmodul="' + m.anahtar + '"' : ' disabled';
    return '<button class="modul-kutu"' + hedef +
        ' aria-label="' + m.ad + ' — ' + (m.hazir ? m.alt : 'yazılmadı') + '">' +
      '<span class="mk-ic"><svg class="ico"><use href="#' + m.ikon + '"></use></svg></span>' +
      '<span class="mk-ad">' + m.ad + '</span>' +
      '<span class="mk-alt">' + (m.hazir ? m.alt : 'yazılmadı') + '</span>' +
    '</button>';
  }).join('');
  document.getElementById('muhModulNot').innerHTML =
    'Soluk duran modüller ustadan <b>yeni veri</b> ister; kapsam kararı ' +
    'verilmeden yazılmıyor. Tahtada yerleri duruyor ki neyin nereye ' +
    'geleceği belli olsun.';
}

Ekran.tanim('muhasebe', {
  ciz: function () {
    /* Ekran kipini HER ÇİZİMDE uygular — hâl bir tıklamanın yan etkisi
       değil (K-026.7). */
    muhFormGoster(false);
    document.getElementById('muhSekBasit').setAttribute('aria-selected', String(muhKip === 'basit'));
    document.getElementById('muhSekDetay').setAttribute('aria-selected', String(muhKip === 'detay'));
    document.getElementById('muhBasitGovde').hidden = (muhKip !== 'basit');
    document.getElementById('muhDetayGovde').hidden = (muhKip !== 'detay');

    if (muhKip === 'detay') {
      document.getElementById('muhSay').textContent = 'modüller';
      muhModulleriCiz();
      return;
    }

    /* ---------- BASİT ---------- */
    document.getElementById('muhDonem').innerHTML = donemCipleriHtml();
    var ad = donemAdi(muhDonemSecili);
    document.getElementById('muhOzetBaslik').textContent = ad;
    document.getElementById('muhSay').textContent = ad;

    /* HER RAKAM AYNI PENCEREDEN (Cemil: "sayfadaki alanları yukarı
       filtreye göre yap"). */
    var kayitlar = donemKayitlari(muhDonemSecili);
    var d = { nakit: 0, kart: 0, havale: 0 };
    kayitlar.forEach(function (k) {
      if (k.odemeYolu && d[k.odemeYolu] !== undefined) d[k.odemeYolu] += kayitToplami(k);
    });
    var toplam = d.nakit + d.kart + d.havale;

    document.getElementById('muhOzet').innerHTML =
      '<div class="tutar-sat"><span>Teslim edilen</span><span class="tv">' +
        kayitlar.length + ' araç</span></div>' +
      ['nakit', 'kart', 'havale'].map(function (y) {
        return '<div class="tutar-sat"><span>' + ODEME_AD[y] + '</span>' +
               '<span class="tv">' + tutar(d[y]) + ' ₺</span></div>';
      }).join('') +
      '<div class="tutar-sat genel"><span>Tahsil edilen</span>' +
        '<span class="tv">' + tutar(toplam) + ' ₺</span></div>';

    /* ---- GİDERLER — TABLO. Silinebilir: gider sesle giriliyor ve ses
       yanlış duyabilir; geri alınamayan bir giriş ustayı sesle
       girmekten caydırır. */
    /* ⚠️ ÜÇ SÜTUN, DÖRT DEĞİL. Tarih kendi sütununda değil, açıklamanın
       ALTINDA — dört sütun 375 px'e sığmıyordu ve tablo sağa kayıyordu
       (Cemil: "kullanıcı sağa kaydıracağını bilmez"). */
    /* ⚠️ SİLME SÜTUNU YOK (05.09). Sola kaydırma onay satırını açıyor;
       böylece tutarlar kartın SAĞ KENARINA yaslanıyor — x düğmesi
       40 px yer kaplıyor ve rakamlar içeride duruyordu. */
    var gid = GIDERLER.filter(function (g) { return donemIcinde(g.tarih, muhDonemSecili); });
    document.getElementById('muhGiderler').innerHTML = gid.length
      ? '<div class="card"><div class="tablo-sar"><table class="tablo">' +
          '<thead><tr><th>Açıklama</th>' +
            '<th class="sayi">Tutar</th></tr></thead><tbody>' +
          gid.slice().reverse().map(function (g) {
            return '<tr class="kaydirilir" data-kaydir="' + g.id + '"' +
                ' tabindex="0" aria-label="' + g.aciklama + ' — silmek için sola kaydır">' +
              '<td>' + g.aciklama +
                '<span class="t-alt">' + g.tarih + '</span></td>' +
              '<td class="sayi">' + tutar(g.tutar) + ' ₺</td></tr>';
          }).join('') +
          '<tr class="genel"><td>Toplam</td>' +
            '<td class="sayi">' + tutar(gid.reduce(function (t, g) {
              return t + (g.tutar || 0); }, 0)) + ' ₺</td></tr>' +
          '</tbody></table></div></div>' +
        /* ⚠️ AÇIKLAMA ŞERİDİ KALDIRILDI (Cemil, 05.09: "Buraya araç
           işleri dışında açıklamayı kaldır"). Kural duruyor — araç
           işleri buraya yazılmaz, parça alışı servis kaydından
           düşülüyor — ama kuralı HER AÇILIŞTA tekrar etmek ustayı
           azarlamak oluyordu. Yeri BOŞ DURUM: ilk kez gider yazan
           usta orada okuyor, sonra bir daha görmüyor. */
        ''
      : bosDurumHtml('i-receipt', 'Gider yazılmamış',
          'Araç işleri dışındaki giderler buraya: kira, elektrik, çay ocağı. ' +
          'Parça alışı servis kaydından düşülüyor, buraya yazılmaz. ' +
          'Yuvarlak + düğmesine dokun ya da mikrofona basıp ' +
          '"2400 TL elektrik faturası ekle" de.');

    /* ---- ALACAK — TABLO. "Almadım" bir ödeme yoludur (K-004), yani
       alacak uydurma bir alan değil; var olan verinin okunması.
       Ustanın sorusu "ne kadar alacağım" değil, KİMDEN alacağım —
       o yüzden ilk sütun KİM. */
    /* ⚠️ ALACAK DÖNEME TABİ DEĞİL (Cemil, 05.09: "Alacak olmalı").
       Alacak bir HAREKET değil, bir BAKİYE: geçen aydan kalan alacak
       bu ay da alacaktır. Dönem süzgecine sokunca "Bugün" seçiliyken
       alacak GİZLENİYORDU — ustanın en çok sorduğu şey ekrandan
       kayboluyordu. Tahsilat ve gider döneme tabi, alacak değil. */
    var borclu = KAYITLAR.filter(function (k) {
      return k.odemeYolu === 'almadim';
    });
    /* İKİ SÜTUN. Plaka ve teslim tarihi müşterinin ALTINDA — dört
       sütun 375 px'e sığmıyordu. Başlık "Kim" değil MÜŞTERİ
       (Cemil, 05.09): ustanın kelimesi bu. */
    document.getElementById('muhAlacak').innerHTML = borclu.length
      ? '<div class="card"><div class="tablo-sar"><table class="tablo">' +
          '<thead><tr><th>Müşteri</th>' +
            '<th class="sayi">Tutar</th></tr></thead><tbody>' +
          borclu.slice().reverse().map(function (k) {
            var a = aracBul(k.plaka) || {};
            return '<tr data-kayit="' + k.id + '" role="button" tabindex="0">' +
              /* Plaka DÜZ METİN DEĞİL, gerçek plaka bileşeni (Cemil,
                 05.09: "Alacakta plaka geçerli plakalar şeklinde
                 olsun"). Plaka her ekranda aynı dili konuşur —
                 plakaHtml() ortak nesnesi (K-008). */
              '<td>' + (a.sahipAd || 'sahip yazılmamış') +
                '<span class="t-alt">' + plakaHtml(k.plaka) +
                (k.teslimTarihi ? ' <span class="t-tarih">' + k.teslimTarihi +
                  '</span>' : '') + '</span></td>' +
              '<td class="sayi">' + tutar(kayitToplami(k)) + ' ₺</td></tr>';
          }).join('') +
          '<tr class="genel"><td>Toplam alacak</td>' +
            '<td class="sayi">' + tutar(borclu.reduce(function (t, k) {
              return t + kayitToplami(k); }, 0)) + ' ₺</td></tr>' +
          '</tbody></table></div></div>'
      : bosDurumHtml('i-circle-check', 'Alacak yok',
          'Teslim edilen her işin parası alınmış.');
  }
});

document.addEventListener('click', function (e) {
  if (Ekran.adi() !== 'muhasebe') return;

  if (e.target.closest('#muhSekBasit')) { muhKip = 'basit'; Ekran.tazele(); return; }
  if (e.target.closest('#muhSekDetay')) { muhKip = 'detay'; Ekran.tazele(); return; }

  /* [data-donem] delegasyonu ÇEKİRDEKTE — aynı çipler iş başına
     sayfasında da var ve orada ölüydü (bkz. 01-cekirdek.js). */

  var mk = e.target.closest('[data-muhmodul]');
  if (mk) {
    var anahtar = mk.getAttribute('data-muhmodul');
    /* Ekran adları LİTERAL — hem okunuyor hem araçlar görüyor. */
    if (anahtar === 'kasa') {
      /* "Kasa" modülü BASİT KİPİN KENDİSİDİR — ayrı ekran açmıyor.
         Tahsilat, gider ve alacak zaten orada; ikinci bir kasa ekranı
         aynı rakamı iki yerde çizmek ve zamanla iki ayrı rakam demek. */
      muhKip = 'basit'; Ekran.tazele();
    } else if (anahtar === 'rapor') {
      Ekran.ac('is-basina');
    } else if (anahtar === 'sms') {
      Ekran.ac('mesaj');
    } else {
      /* Bilinmeyen anahtar SESSİZ KALMAZ: menüye modül eklenip
         buraya bağlanmayı unutmak, tam olarak ölü uçtur. */
      balon('Bu modül henüz bağlanmadı: ' + anahtar, false, 3000);
    }
    return;
  }

  if (e.target.closest('#muhSesleGider')) { sesleAc('muhasebe'); return; }
  if (e.target.closest('#muhGiderEkle')) { muhFormGoster(true); return; }
  if (e.target.closest('#muhGiderVazgec')) { muhFormGoster(false); return; }

  if (e.target.closest('#muhGiderKaydet')) {
    var gAd = (document.getElementById('muhGiderAd').value || '').trim();
    /* Rakam dışındaki her şey atılır: usta "2.400 TL" ya da "2400 tl"
       yazabilir. parseInt tek başına "2.400"ü 2 okurdu. */
    var tut = parseInt(String(document.getElementById('muhGiderTutar').value)
                .replace(/[^0-9]/g, ''), 10) || 0;
    if (!gAd || !tut) {
      balon('Gider için hem açıklama hem tutar gerekiyor.', false, 2600);
      return;
    }
    GIDERLER.push({ id: (GIDERLER.length ? Math.max.apply(null,
      GIDERLER.map(function (g) { return g.id; })) : 0) + 1,
      tarih: bugunMetin(), aciklama: gAd, tutar: tut, tur: 'elle' });
    balon(gAd + ' — ' + tutar(tut) + ' ₺ eklendi.', false, 2600);
    muhFormGoster(false);
    Ekran.tazele();
    return;
  }

});

/* ---- SOLA KAYDIRMA ----
   ⚠️ HAREKETİN KENDİSİ ÇEKİRDEKTE (06.09). Aynı hareket servis
   kaydının "yapılanlar" tablosunda da var; iki kopya iki ayrı eşik ve
   iki ayrı yön hatası demekti. Burada kalan tek şey, kaydırmanın BU
   ekranda ne anlama geldiği: hangi gider silinecek. */
/* ⚠️ 07.09 — KAYDIRMA ARTIK DOĞRUDAN SİLİYOR (Cemil: "Gideri sola
   kaydırdığında sil.") ve K-032'yi geri alıyor.

   K-032'de onay satırı koymuştum; gerekçe *"görünmeyen bir hareket
   görünmeyen bir sonuç doğurmasın"*dı. Gerekçe duruyor ama çözüm
   değişti: onay **soru sorarak** koruyordu, geri alma **cevabı geri
   vererek** koruyor. İkincisi bir dokunuş ucuz ve silme işi bittikten
   sonra düşünmeye izin veriyor — onay, düşünmeyi silmeden ÖNCE
   zorunlu kılıyordu.

   Sonuç GÖRÜNÜR olduğu sürece hareket görünmez kalabilir. */
Kaydirma.tanim('muhasebe', function (anahtar) {
  var id = parseInt(anahtar, 10);
  var i = GIDERLER.map(function (g) { return g.id; }).indexOf(id);
  if (i < 0) return;
  var silinen = GIDERLER[i];
  var yeri = i;
  GIDERLER.splice(i, 1);
  Ekran.tazele();
  balonGeriAl(silinen.aciklama + ' silindi.', function () {
    /* AYNI YERİNE geri konur — listenin sonuna eklenirse sıra değişir
       ve usta "geri aldım ama başka yere gitti" der. */
    GIDERLER.splice(yeri, 0, silinen);
    Ekran.tazele();
  });
});

/* ================= SESLİ İŞLER — bu ekranın şeması (Tur 8.3) ================= */

/* TAHSİLAT SORUSU (14.09) — tamircinin DÖRDÜNCÜ işinin ta kendisi
   (*"teslimde ödemeyi nasıl aldığını bilmek"*) ve cevabı kayıtlı
   veriden çıkıyor. Yeni alan istemeyen bir soru, yeni özellik değil.
   SORUNUN CEVABI ONAY EKRANINDA: muhasebeyi açıp ustayı rakamı aramaya
   bırakmak, sorduğu şeyi cevaplamamaktır.
   ⚠️ TUTAR VARSA BU BİR SORU DEĞİL, GİDER GİRİŞİDİR — en önde (10)
   duruyor ama "2400 TL elektrik faturası" buraya düşmesin diye tutarı
   olan cümleyi geri çeviriyor. */
Islem.tanim('tahsilat-sor', {
  ekran: 'muhasebe', baglam: ['muhasebe'], oncelik: 10,
  baslik: function (o) { return donemAdi(o.donem) + ' tahsilat'; },
  tarif: 'Tahsilat sorusu — cevap kayıtlı veriden',
  eylem: 'Muhasebeyi aç',
  alanlar: [
    { ad: 'donem', etiket: 'Dönem', tip: 'secim', ozette: false, zorunlu: true,
      secenek: { bugun: 'Bugün', ay: 'Bu ay', yil: 'Bu yıl' } },
    { ad: 'tahsil', etiket: 'Tahsil edilen', turet: function (o) {
        return tutar(tahsilatToplami(o.donem)) + ' ₺'; } },
    { ad: 'alacak', etiket: 'Alacak (veresiye)', turet: function () {
        return tutar(veresiyeToplami()) + ' ₺'; } }
  ],
  tani: function (c) {
    var d = c.d;
    if (sesTutarBul(d) || (d.indexOf('tahsil') < 0 && d.indexOf('kasa') < 0)) return null;
    var donem = (d.indexOf('bugun') >= 0) ? 'bugun'
              : (d.indexOf('yil') >= 0) ? 'yil'
              : (d.indexOf('ay') >= 0) ? 'ay' : 'bugun';
    return { tur: 'tahsilat-sor', donem: donem };
  },
  /* Dönem muhasebe ekranıyla ORTAK (çekirdekteki muhDonemSecili):
     usta sorduğu pencereyi ekranda da bulsun. */
  uygula: function (o) {
    muhDonemSecili = o.donem;
    Ekran.ac('muhasebe');
  }
});

/* GİDER EKLE — muhasebe bağlamında yalnız tutar yeter ("850 lira"); başka
   yerde "gider/fatura/kira" kelimesi aranır. */
Islem.tanim('gider-ekle', {
  ekran: 'muhasebe', baglam: ['muhasebe'], oncelik: 20,
  baslik: 'Gider eklenecek',
  eylem: 'Gideri ekle',
  alanlar: [
    { ad: 'aciklama', etiket: 'Açıklama', tip: 'metin', zorunlu: true },
    { ad: 'tutar', etiket: 'Tutar', tip: 'para', zorunlu: true },
    { ad: 'tarih', etiket: 'Tarih', turet: function () { return bugunMetin(); } }
  ],
  tani: function (c) {
    var d = c.d;
    if (!(d.indexOf('gider') >= 0 || d.indexOf('fatura') >= 0 || d.indexOf('kira') >= 0 ||
          (c.baglam === 'muhasebe' && sesTutarBul(d)))) return null;
    var t = sesTutarBul(d), metin = sesTutarsiz(c.metin);
    /* "TL/lira" düşmüşse (tanıyıcı sık düşürüyor) gider cümlesindeki
       çıplak sayı tutardır — 04-islem.js sesCiplakTutar notu. Plaka
       varsa plakasız kalandan okunur. */
    if (!t) {
      var ciplak = sesCiplakTutar(c.p ? c.kalan : c.metin);
      if (ciplak) { t = ciplak.tutar; metin = metin.replace(ciplak.parca, ''); }
    }
    if (!t) return null;
    var aciklama = kelimeleriAt(metin,
                                ['ekle', 'gider', 'olarak', 'için', 'icin']);
    return { tur: 'gider-ekle', tutar: t, aciklama: aciklama || 'Gider' };
  },
  uygula: function (o) {
    GIDERLER.push({ id: GIDERLER.length + 1, tarih: bugunMetin(),
      aciklama: o.aciklama, tutar: o.tutar, tur: 'fatura' });
    balon(o.aciklama + ' — ' + tutar(o.tutar) + ' ₺ eklendi.', false, 3000);
    Ekran.ac('muhasebe');
  }
});
</script>
