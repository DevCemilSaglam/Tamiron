<!-- ekran: home · ANA MENÜ
     03.09 — Cemil'in verdiği sıra: Sesli işlem (en üstte, ötekilerle
     AYNI biçimde) · Servis kaydı ekle · Servis kayıtları · Araçlar ·
     Müşteriler · Muhasebe · Müşteriye mesaj.

     "ARAÇ KAYDI" KALDIRILDI (Cemil, 03.09). Araç zaten servis kaydı
     açılırken ruhsattan giriyordu; ayrı bir menü maddesi olması aynı
     işi iki yerde gösteriyor ve "hangisinden gireceğim" sorusunu
     doğuruyordu.

     SESLİ İŞLEM ÖTEKİLERLE AYNI SATIR BİÇİMİNDE: ayrı duran büyük bir
     düğme "bu başka bir şey" diye okunuyordu. Oysa sesli işlem menünün
     bir maddesi — farkı, hangi işi yapacağını senin söylemen.

     HER SATIRIN SAĞ UCUNDA MİKROFON: iş hem dokunarak hem söyleyerek
     başlatılabiliyor; mikrofon o satırın BAĞLAMIYLA sesli işleme gider.

     BİLEŞENLER v1'DEN: .greeting · .menu-list .menu-row .main
     .ic-badge .txt .lbl .sub .mic · .notice .n-ic .n-body.
     Yeni bileşen yazılmadı (K-008). -->
<section class="screen" id="screen-home">

  <div class="greeting">
    <h1 id="selam">Hayırlı işler, usta</h1>
    <p>Mikrofona basıp <b>plaka söyleyebilir</b>, ne yapılacağını <b>yazdırabilirsin</b>.</p>
  </div>

  <div id="homeHatirlatma"></div>

  <nav class="menu-list" aria-label="Ana menü">

    <!-- ⚠️ data-git="ses" DEĞİL, data-sesle="genel".
         data-git ile açılınca SESLI_NIYET değişmiyor ve ekran BİR
         ÖNCEKİ bağlamda kalıyordu: muhasebeden çıkıp menüden "Sesli
         işlem"e basınca başlık "Sesli işlem · Muhasebe" diyor ve
         gider örnekleri gösteriyordu (04.09'da bulundu). -->
    <div class="menu-row">
      <button class="main" data-sesle="genel">
        <span class="ic-badge"><svg class="ico"><use href="#i-mic"></use></svg></span>
        <span class="txt"><span class="lbl">Sesli işlem</span>
          <span class="sub">Söyle, gerisini o bulsun</span></span>
      </button>
      <button class="mic" data-sesle="genel" aria-label="Sesli işlem — dinlemeye başla">
        <svg class="ico"><use href="#i-mic"></use></svg>
      </button>
    </div>

    <div class="menu-row">
      <button class="main" data-git="ruhsat">
        <span class="ic-badge"><svg class="ico"><use href="#i-plus"></use></svg></span>
        <span class="txt"><span class="lbl">Servis kaydı ekle</span>
          <span class="sub">Araç geldi · iş açılıyor</span></span>
      </button>
      <button class="mic" data-sesle="servis-ekle" aria-label="Servis kaydını sesle aç">
        <svg class="ico"><use href="#i-mic"></use></svg>
      </button>
    </div>

    <div class="menu-row">
      <button class="main" data-git="kayitlar">
        <span class="ic-badge"><svg class="ico"><use href="#i-clipboard-list"></use></svg></span>
        <span class="txt"><span class="lbl">Servis kayıtları</span>
          <span class="sub" id="menuKayitlarAlt">—</span></span>
      </button>
      <button class="mic" data-sesle="kayitlar" aria-label="Servis kayıtlarında sesle ara">
        <svg class="ico"><use href="#i-mic"></use></svg>
      </button>
    </div>

    <div class="menu-row">
      <button class="main" data-git="araclar">
        <span class="ic-badge"><svg class="ico"><use href="#i-car"></use></svg></span>
        <span class="txt"><span class="lbl">Araçlar</span>
          <span class="sub" id="menuAraclarAlt">—</span></span>
      </button>
      <button class="mic" data-sesle="araclar" aria-label="Araçlarda sesle ara">
        <svg class="ico"><use href="#i-mic"></use></svg>
      </button>
    </div>

    <div class="menu-row">
      <button class="main" data-git="musteriler">
        <span class="ic-badge"><svg class="ico"><use href="#i-users"></use></svg></span>
        <span class="txt"><span class="lbl">Müşteriler</span>
          <span class="sub" id="menuMusterilerAlt">—</span></span>
      </button>
      <button class="mic" data-sesle="musteriler" aria-label="Müşterilerde sesle ara">
        <svg class="ico"><use href="#i-mic"></use></svg>
      </button>
    </div>

    <div class="menu-row">
      <button class="main" data-git="mesaj">
        <span class="ic-badge"><svg class="ico"><use href="#i-message-square"></use></svg></span>
        <span class="txt"><span class="lbl">Müşteriye mesaj</span>
          <span class="sub">WhatsApp · özet · hatırlatma</span></span>
      </button>
      <button class="mic" data-sesle="mesaj" aria-label="Mesajı sesle yaz">
        <svg class="ico"><use href="#i-mic"></use></svg>
      </button>
    </div>

    <div class="menu-row">
      <button class="main" data-git="muhasebe">
        <span class="ic-badge"><svg class="ico"><use href="#i-receipt"></use></svg></span>
        <span class="txt"><span class="lbl">Muhasebe</span>
          <span class="sub" id="menuMuhasebeAlt">—</span></span>
      </button>
      <button class="mic" data-sesle="muhasebe" aria-label="Gideri sesle ekle">
        <svg class="ico"><use href="#i-mic"></use></svg>
      </button>
    </div>

  </nav>

</section>

<script>
Ekran.tanim('home', {
  ciz: function () {
    /* Selamlama havuzu çekirdekte (selamMetni) — saat penceresi ve
       cuma orada. Ekran yalnız çağırıyor. */
    document.getElementById('selam').textContent = selamMetni();

    var ic = icerideki().length;
    document.getElementById('menuKayitlarAlt').textContent =
      ic ? ic + ' araç içeride · ' + KAYITLAR.length + ' kayıt'
         : KAYITLAR.length + ' kayıt · içeride araç yok';
    document.getElementById('menuAraclarAlt').textContent =
      ARACLAR.length + ' araç kayıtlı';
    document.getElementById('menuMusterilerAlt').textContent =
      musteriler().length + ' müşteri';
    document.getElementById('menuMuhasebeAlt').textContent =
      'Bugün ' + tutar(bugunTahsilat()) + ' ₺ · ' +
      tutar(veresiyeToplami()) + ' ₺ veresiye';

    /* Bakım hatırlatması ana ekranda KALIYOR (T-17): ustanın "bugün
       kimi arayacağım" sorusu ilk ekranda cevaplanmalı. */
    var h = hatirlatmasiGelenler();

    /* ŞERİT TIKLANABİLİR. "Bakım zamanı geldi" deyip hiçbir yere
       götürmeyen bir uyarı ustaya iş çıkarıyordu: plakayı okuyup
       listeden aramak zorunda kalıyordu. Tek araçsa doğrudan aracına,
       birden fazlaysa listeye. */
    document.getElementById('homeHatirlatma').innerHTML = h.length
      ? '<button class="notice warn"' +
          (h.length === 1 ? ' data-arac="' + h[0].plaka + '"' : ' data-git="kayitlar"') +
          ' aria-label="Bakım zamanı gelen araçları aç">' +
          '<span class="n-ic"><svg class="ico ico-sm"><use href="#i-clock"></use></svg></span>' +
          '<span class="n-body"><b>' + h.length + ' aracın</b> bakım zamanı geldi — ' +
            h.map(function (k) { return k.plaka; }).join(', ') + '</span>' +
          '<svg class="ico ico-sm n-ok"><use href="#i-chevron-right"></use></svg>' +
        '</button>'
      : '';
  }
});

/* Mikrofonlar sesli işleme NE İÇİN basıldığı bilgisiyle gider:
   "araçlarda ara" ile "gider ekle" aynı ekranı açıyor ama ekran ne
   beklediğini biliyor ve örneklerini ona göre gösteriyor. */
document.addEventListener('click', function (e) {
  var m = e.target.closest('[data-sesle]');
  if (!m) return;
  sesleAc(m.getAttribute('data-sesle'));
});
</script>
