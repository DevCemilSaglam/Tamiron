<!-- ekran: home · İÇERİDEKİ ARAÇLAR (EKRANLAR.md §1)
     Liste = TESLİM EDİLMEMİŞ KAYITLAR. Başka tanım yok (K-004).

     BİLEŞENLER v1'DEN: .screen-head .eyebrow .eb-say · .btn .btn-primary
     .btn-lg · .search-box · .tl-item (kayıt satırı) · .bos-durum
     · .notice. Yeni bileşen yazılmadı. -->
<section class="screen" id="screen-home">

  <div class="screen-head">
    <span class="eyebrow">
      <svg class="ico ico-sm"><use href="#i-car"></use></svg> İçerideki araçlar
      <span class="eb-say" id="homeSay"></span>
    </span>
  </div>

  <button class="btn btn-primary btn-lg" data-git="ruhsat">
    <svg class="ico"><use href="#i-camera"></use></svg> Ruhsatı çek
  </button>

  <div class="search-box" id="homeArama">
    <svg class="ico"><use href="#i-search"></use></svg>
    <input type="search" id="homeQ" placeholder="Plaka ara…" autocomplete="off" aria-label="Plaka ara" />
    <button class="clear" id="homeQTemiz" aria-label="Aramayı temizle">
      <svg class="ico ico-sm"><use href="#i-x"></use></svg>
    </button>
  </div>

  <div id="homeListe"></div>

  <div id="homeHatirlatma"></div>

</section>

<script>
Ekran.tanim('home', {
  ciz: function () {
    var q = norm((document.getElementById('homeQ') || {}).value || '');
    var liste = icerideki().filter(function (k) {
      return !q || norm(k.plaka).indexOf(q) >= 0;
    });

    var say = document.getElementById('homeSay');
    if (say) say.textContent = liste.length + (q ? ' bulundu' : ' araç');

    document.getElementById('homeArama').classList.toggle('filled', !!q);

    document.getElementById('homeListe').innerHTML = liste.length
      ? liste.map(kayitSatiriHtml).join('')
      : (q
          ? bosDurumHtml('i-search', 'Eşleşen araç yok', 'Plakanın bir kısmını yazman yeter.')
          : bosDurumHtml('i-circle-check', 'İçeride araç yok',
              'Hepsi teslim edilmiş. Yeni iş için yukarıdan ruhsatı çek.'));

    /* Bakım hatırlatması — ayrı ekran değil, bir uyarı şeridi
       (T-17, K-002). Ustaya bugün kimi arayacağını söyler. */
    var h = KAYITLAR.filter(function (k) {
      return k.tur === 'bakim' && k.hatirlatmaTarihi && !k.hatirlatmaGonderildi;
    });
    document.getElementById('homeHatirlatma').innerHTML = h.length
      ? '<div class="notice warn">' +
          '<svg class="ico n-ic"><use href="#i-clock"></use></svg>' +
          '<span class="n-body"><b>' + h.length + ' araç bakım zamanına yaklaştı.</b> ' +
          h.map(function (k) { return k.plaka; }).join(' · ') + '</span>' +
        '</div>'
      : '';
  }
});

document.addEventListener('input', function (e) {
  if (e.target && e.target.id === 'homeQ') Ekran.tazele();
});
document.addEventListener('click', function (e) {
  if (e.target.closest && e.target.closest('#homeQTemiz')) {
    document.getElementById('homeQ').value = '';
    Ekran.tazele();
  }
});
</script>
