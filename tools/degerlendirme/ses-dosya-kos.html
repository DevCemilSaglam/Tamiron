<!-- ============ SES DOSYASI KOŞUCUSU (12.10.2026 · A-M48 · Tur 8.4) ============
     Ayrıntı ve gerekçe: docs/arastirma/SES-OLCUM.md

     NE YAPAR: kayıtlı ses dosyalarını tarayıcının KENDİ tanıyıcısına
     (Web Speech) verir — mikrofon, hoparlör, kablo yok:
       dosya → AudioContext → MediaStreamDestination → start(track)
     Çıkan yazı prototipin çözümleyicisine (SES_COZUMLE, gizli çerçevede
     omurga.html) ve AYNI cetvele (puanla.js) gider. Bozma türü başına
     ayrı karne: temiz · snr18 · snr12 · snr6 · uzak · kirpik.

     DOSYA ADI SÖZLEŞMESİ — ses-kaydet.html ve ses-bozucu.js'in ürettiği:
       s07.wav        → 7. cümle, temiz
       s07.snr12.wav  → 7. cümle, 12 dB dükkân gürültüsü

     GÜRÜLTÜ (12.10): bir gürültü dosyası da seçilirse (MP3 olabilir —
     Freesound önizlemeleri), her temiz kayıttan uzak · kırpık · snr18/12/6
     varyantları BURADA üretilir — ses-bozucu.js'in AYNI fonksiyonuyla
     (ses-bozma.js). Dosyaya yazmaya, ffmpeg'e gerek yok. Cemil 12.10'da
     "gürültü uydurulmaz" kuralının açık arşivden gerçek atölye sesiyle
     esnetilmesini onayladı (SES-OLCUM.md §8).

     DERLEM KİPİ (12.10): ses dosyasıyla AYNI ADLI bir .txt de seçilmişse
     (MediaSpeech TR: <uuid>.flac + <uuid>.txt) doğru metin odur; yalnız
     KELİME HATASI ölçülür — dükkân cümlesi olmadığı için çözümleme yok.
     Bu, tanıyıcının GENEL Türkçe tabanı (SES-OLCUM.md §5, adım 2).
     Sabit 100'lük alt küme: tools/degerlendirme/sesler/derlem-100/

     ⚠️ DOĞRULANMADI (12.10): uygulama bölmesindeki tarayıcı Google'ın
     tanıma sunucusuna ulaşamıyor (`error:network`). Yol API düzeyinde
     denendi — iz verilince tanıyıcı dinlemeye başlıyor — ama bir dosyanın
     baştan sona yazıya döndüğü GERÇEK Chrome'da henüz görülmedi. İlk
     koşu tek dosyayla yapılır (SES-OLCUM.md §5, adım 1).

     NASIL: depo kökünden yerel sunucu (`.claude/launch.json`), sonra
     masaüstü Chrome'da  http://localhost:8123/tools/degerlendirme/ses-dosya-kos.html

     ÖLÇÜM ALETİ ÖLÇTÜĞÜ ŞEYİ DEĞİŞTİRMEZ (K-024.1): çözümleyici yalnız
     çağrılıyor, hiçbir şey uygulanmıyor; ses hoparlöre verilmiyor. -->
<style>
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); }
  main { max-width: 960px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 48px; display: flex; flex-direction: column; gap: 16px; }
  h1 { font-family: var(--font-display); font-size: var(--tip-xl); margin: 0; }
  p { margin: 0; color: var(--muted); }
  .kutu { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  button, input[type=file] { min-height: var(--dokun); font: inherit; }
  button { background: var(--primary); color: var(--on-primary); border: 0; border-radius: var(--radius-sm); padding: 0 16px; cursor: pointer; }
  button[disabled] { opacity: .5; }
  label { display: flex; gap: 8px; align-items: center; }
  .tablo-kap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: var(--tip-sm); }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-size: var(--tip-xs); text-transform: uppercase; letter-spacing: .05em; }
  td.s { font-family: var(--font-mono); text-align: right; white-space: nowrap; }
  .hata { color: var(--crit); }
  pre { white-space: pre-wrap; font-family: var(--font-mono); font-size: var(--tip-xs); margin: 0; max-height: 240px; overflow: auto; }
</style>

<body>
<main>
  <h1>Ses dosyası koşucusu</h1>
  <p>Kayıtları seç (<code>s01.wav</code>, <code>s01.snr12.wav</code> …). Her dosya gerçek zamanlı çalınır — 40 cümle bir bozma türü için yaklaşık 4 dakika.</p>

  <div class="kutu">
    <label for="dosyalar">Konuşma kayıtları</label>
    <input type="file" id="dosyalar" accept=".wav,.flac,.txt,audio/*" multiple aria-label="Ses dosyaları">
    <label for="gurultu">Gürültü (isteğe bağlı — tek dosya; seçilirse bozulmuş varyantlar da koşar)</label>
    <input type="file" id="gurultu" accept="audio/*,.mp3,.wav" aria-label="Gürültü dosyası">
    <label><input type="checkbox" id="ifadeler"> Beklenen kelimeleri bildir (<code>phrases</code> — karşılaştırma için ayrı koşu)</label>
    <label><input type="checkbox" id="esitle" checked> Seviyeyi eşitle (konuşma −20 dB — mikrofonun otomatik kazancının taklidi)</label>
    <label><input type="checkbox" id="dinamik"> Dinamik kazanç (kısık kelimeyi yükselt — mikrofonun otomatik kazancının taklidi)</label>
    <label><input type="checkbox" id="kirp" checked> Baştaki ve sondaki sessizliği kırp (koşu biraz kısalır — s01: 17,2 → 14,9 sn; ortadaki duraklamalara dokunmaz)</label>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
      <button id="kos" disabled>Koş</button>
      <span id="durum" aria-live="polite"></span>
    </div>
  </div>

  <!-- SUNUCUDAN AL (13.10) — dosya seçmeden, depo klasöründen:
       sesler/kayitlar (dizin.json) · sesler/derlem-100 · sesler/gurultu.
       Cemil'in tek tıkla koşturması için; sonuç JSON olarak İNER ve
       lider İndirilenler'den okur. -->
  <div class="kutu">
    <strong>Sunucudan al — tek tık</strong>
    <!-- Hangi kayıt seti (13.10): ilk 40 kayıt korunuyor, yenileri ayrı
         klasörde — karşılaştırılabilsinler. -->
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center" id="klasorSec">
      <span>Kayıt seti:</span>
      <label><input type="radio" name="klasor" value="kayitlar" checked> İlk kayıtlar (dizüstü, 13.10)</label>
      <label><input type="radio" name="klasor" value="kayitlar-pc2"> Bilgisayar — yeniden</label>
      <label><input type="radio" name="klasor" value="kayitlar-tel"> Telefon</label>
      <label><input type="radio" name="klasor" value="buyuk"> Büyük set, parti: <input id="buyukKlasor" value="buyuk-1" size="10" aria-label="Büyük set klasörü"></label>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button data-sunucu="dogrula">1 · Tek dosyayla doğrula</button>
      <button data-sunucu="temiz">2 · Klasördeki tüm kayıtlar (temiz)</button>
      <button data-sunucu="derlem5">Derlem 5 (hızlı kontrol, ~1,5 dk)</button>
      <button data-sunucu="derlem">3 · Derlem 100 (genel Türkçe)</button>
    </div>
    <label for="gurultuSec">4 · 40 cümle + gürültü (temiz · uzak · kırpık · 18/12/6 dB):</label>
    <div style="display:flex;gap:10px;flex-wrap:wrap" id="gurultuSec">
      <button data-sunucu="gurultu" data-g="tamirhane-ortami">Tamirhane ortamı</button>
      <button data-sunucu="gurultu" data-g="kompresor">Kompresör</button>
      <button data-sunucu="gurultu" data-g="havali-somun-sokucu">Havalı somun sökücü</button>
      <button data-sunucu="gurultu" data-g="atolye-taslama">Taşlama</button>
      <button data-sunucu="gurultu" data-g="circir">Cırcır</button>
      <button data-sunucu="gurultu" data-g="metal-metale">Metal metale</button>
    </div>
    <button id="indir" disabled>Son sonucu JSON olarak indir</button>
  </div>

  <div class="kutu">
    <strong>Karne — bozma türüne göre</strong>
    <div class="tablo-kap"><table id="karne"></table></div>
  </div>

  <div class="kutu" id="derlemKutu" hidden>
    <strong>Derlem — genel Türkçe tabanı (yalnız kelime hatası)</strong>
    <div class="tablo-kap"><table id="derlem"></table></div>
  </div>

  <div class="kutu">
    <strong>Dosya dosya</strong>
    <div class="tablo-kap"><table id="ayrinti"></table></div>
  </div>

  <div class="kutu">
    <strong>Ham sonuç (JSON)</strong>
    <pre id="ham"></pre>
  </div>
</main>

<iframe id="prototip" src="../../prototypes/omurga.html" style="position:fixed;left:-10000px;width:375px;height:700px" title="Prototip (çözümleyici)"></iframe>

<script src="ses-olcu.js"></script>
<script src="ses-bozma.js"></script>
<script>
var KOK = './';
var SET = null, PUANLA = null;
/* BÜYÜK SET (14.10): kayıt klasörünün dizini `set: 'buyuk'` diyorsa
   cümleler buyuk-set.json'dan, çözümleme KURMACA DÜKKÂNDA yapılır —
   o cümlelerin plakaları prototipin tohum verisinde yok. */
var SET_ESAS = null, SET_BUYUK = null;
var S = window.SpeechRecognition || window.webkitSpeechRecognition;
/* Tamiron'un en sık yanlış duyulacak kelimeleri (SES-OLCUM.md §6). Ölçmeden
   ürüne girmez; burada yalnız açık/kapalı farkı ölçülsün diye. */
var BEKLENEN = ['triger', 'balata', 'devirdaim', 'işçilik', 'teslim', 'tahsilat', 'kilometre', 'WhatsApp'];

function $(id) { return document.getElementById(id); }
function durum(m) { $('durum').textContent = m; }

(async function hazirla() {
  if (!S) { durum('Bu tarayıcıda Web Speech yok — masaüstü Chrome gerekli.'); return; }
  SET = SET_ESAS = await (await fetch(KOK + 'ses-seti.json?t=' + Date.now())).json();
  eval(await (await fetch(KOK + 'puanla.js?t=' + Date.now())).text());
  PUANLA = window.DEGERLENDIRME_PUANLA;
  $('dosyalar').addEventListener('change', function () { $('kos').disabled = !this.files.length; });
  /* ?klasor=buyuk-3 (16.10): klasör ADRESTEN seçilir. Önceki hâlde varsayılan
     radyo düğmesi ("İlk kayıtlar") SESSİZCE ölçülüyordu — 16.10'da beş koşu
     büyük set yerine 13.10'un eski kayıtlarını ölçtü. */
  var adresKlasor = new URLSearchParams(location.search).get('klasor');
  /* &ipucu=1 — "beklenen kelimeleri bildir" adresten açılır (16.10). */
  if (new URLSearchParams(location.search).get('ipucu') === '1') $('ifadeler').checked = true;
  if (adresKlasor) {
    var radyo = document.querySelector('input[name="klasor"][value="' + adresKlasor + '"]');
    if (radyo) radyo.checked = true;
    else { document.querySelector('input[name="klasor"][value="buyuk"]').checked = true; $('buyukKlasor').value = adresKlasor; }
  }
  durum('Hazır — ' + SET.cumleler.length + ' cümlelik set yüklendi.' +
        (adresKlasor ? ' Klasör: ' + adresKlasor : '') + ($('ifadeler').checked ? ' · İPUCU AÇIK' : ''));
})();

/* s07.snr12.wav → { id: 7, tur: 'snr12' } */
function adCoz(ad) {
  var m = ad.match(/^s(\d+)(?:\.([a-z0-9]+))?\.wav$/i);
  return m ? { id: parseInt(m[1], 10), tur: m[2] || 'temiz' } : null;
}

/* SESSİZLİK KIRPMA (13.10): kayıtların yarısı sessizlik (dizin.json:
   ortalama %50) ve her dosya GERÇEK ZAMANLI çalınıyor — 40 cümle bir
   bozma türü için ~8 dk. Baştaki ve sondaki sessizlik atılır (0,3 sn
   pay bırakılır); ORTADAKİNE dokunulmaz — duraklama konuşmanın parçası.
   Eşik: en gürültülü 20 ms çerçevenin -30 dB altı. Gürültü KARIŞTIRMADAN
   ÖNCE kırpılır; karışımın kendisi kırpılmaz. */
function sessizlikKirp(a, hiz) {
  var cer = Math.round(hiz * 0.02), n = Math.floor(a.length / cer), en = 0, r = [];
  for (var i = 0; i < n; i++) {
    var t = 0;
    for (var j = i * cer; j < (i + 1) * cer; j++) t += a[j] * a[j];
    r[i] = Math.sqrt(t / cer); if (r[i] > en) en = r[i];
  }
  var esik = en * Math.pow(10, -30 / 20), bas = 0, son = n - 1;
  while (bas < n && r[bas] < esik) bas++;
  while (son > bas && r[son] < esik) son--;
  /* Sona 0,8 sn pay (önce 0,3): son hece sönerken eşiğin altına düşüp
     kırpılıyordu. Başa 0,3 sn yeter. */
  var pay = Math.round(0.3 / 0.02), sonPay = Math.round(0.8 / 0.02);
  bas = Math.max(0, bas - pay) * cer; son = Math.min(n, son + 1 + sonPay) * cer;
  return a.slice(bas, son);
}

/* Dosya → tek kanal örnekler (ortak çözücü; tanıyıcıyla aynı hız). */
var COZUCU = null;
async function ornekleriAl(dosya) {
  COZUCU = COZUCU || new AudioContext();
  var t = await COZUCU.decodeAudioData(await dosya.arrayBuffer());
  var a = new Float32Array(t.length);
  for (var c = 0; c < t.numberOfChannels; c++) {
    var k = t.getChannelData(c);
    for (var i = 0; i < a.length; i++) a[i] += k[i] / t.numberOfChannels;
  }
  return { ornekler: a, hiz: t.sampleRate };
}

/* Tek kayıt → yazı. Kaynak bir DOSYA ya da hazır örnekler {ornekler, hiz}
   (bozulmuş varyant). Ses hoparlöre GİTMEZ: yalnız MediaStreamDestination'a. */
function tani(kaynak, ifadeAcik) {
  return new Promise(async function (bitti) {
    var ctx = new AudioContext();
    var tampon;
    try {
      if (kaynak instanceof Blob) tampon = await ctx.decodeAudioData(await kaynak.arrayBuffer());
      else {
        tampon = ctx.createBuffer(1, kaynak.ornekler.length, kaynak.hiz);
        tampon.copyToChannel(kaynak.ornekler, 0);
      }
    }
    catch (e) { ctx.close(); return bitti({ hata: 'çözülemedi: ' + e.message }); }
    /* SESSİZLİK PAYI (13.10): telefon kayıtları son heceden HEMEN sonra
       bitiyor ("yağ filtresi 300 lira" 1,71 sn). Tanıyıcı son kelimeyi
       kesinleştirmek için arkasında sessizlik bekliyor; yoksa kelime
       kayboluyordu ("yağ filtresi 3"). Gerçek kullanımda mikrofon
       konuşmadan sonra açık kalır — burada 0,5 sn baş, 1,0 sn son
       sessizlik ekleniyor. Konuşmaya dokunulmuyor. */
    (function () {
      var hz = tampon.sampleRate, bas = Math.round(hz * 0.5), son = Math.round(hz * 1.0);
      var yeni = ctx.createBuffer(tampon.numberOfChannels, tampon.length + bas + son, hz);
      for (var kn = 0; kn < tampon.numberOfChannels; kn++) yeni.getChannelData(kn).set(tampon.getChannelData(kn), bas);
      tampon = yeni;
    })();
    /* SEVİYE EŞİTLEME (13.10): mikrofondan dinlerken Chrome otomatik
       kazanç uyguluyor; dosyadan beslerken uygulamıyor. Cemil'in kayıtları
       ortalama −35 dB RMS — mikrofondan gelen sesten ~15 dB kısık. Konuşma
       seviyesi ses-olcu.js'in AYNI tanımıyla (%90'lık çerçeve) −20 dB'ye
       getirilir; tepe 0,98'i aşmaz. Seçenek: sonuç JSON'unda yazılı. */
    if ($('esitle').checked) {
      var kanal0 = tampon.getChannelData(0);
      var kon = SesOlcu.seviyeler(kanal0, tampon.sampleRate).konusma || 1e-6;
      var tepe = 0;
      for (var ci = 0; ci < tampon.numberOfChannels; ci++) {
        var kd0 = tampon.getChannelData(ci);
        for (var ii = 0; ii < kd0.length; ii++) { var av = Math.abs(kd0[ii]); if (av > tepe) tepe = av; }
      }
      var kaz = Math.min(Math.pow(10, -20 / 20) / kon, tepe > 0 ? 0.98 / tepe : 1);
      for (var cj = 0; cj < tampon.numberOfChannels; cj++) {
        var kd1 = tampon.getChannelData(cj);
        for (var jj = 0; jj < kd1.length; jj++) kd1[jj] *= kaz;
      }
    }
    var hedef = ctx.createMediaStreamDestination();
    /* ⚠️ ADI "oynatici" — "kaynak" DEĞİL. İlk yazışta `var kaynak` idi ve
       `var` fonksiyonun başına taşındığı için PARAMETREYİ gölgeledi: her
       kayıt "çözülemedi" döndü. v1'in sekiz kez yaşadığı hata sınıfı. */
    var oynatici = ctx.createBufferSource();
    oynatici.buffer = tampon;
    /* DİNAMİK KAZANÇ (13.10, seçenek): ilk gerçek koşuda tanıyıcı yavaş
       ve parça parça okunan cümlelerin İLK öbeğini duyup kısık öbekleri
       kaçırıyordu ("35 KLM 45 teslim ettim parayı almadım" → "35 kalemle
       45 parayı al"). Kayıtta öbekler arası fark 15–20 dB. Mikrofondan
       dinlerken Chrome DİNAMİK kazanç uygular (kısık kelimeyi o an
       yükseltir); sabit eşitleme öbekler arasındaki farkı korur. Tarayıcının
       kendi sıkıştırıcısı + telafi kazancı bu farkı daraltır. */
    if ($('dinamik').checked) {
      var sik = ctx.createDynamicsCompressor();
      sik.threshold.value = -40; sik.knee.value = 10; sik.ratio.value = 8;
      sik.attack.value = 0.005; sik.release.value = 0.25;
      var telafi = ctx.createGain(); telafi.gain.value = Math.pow(10, 12 / 20);
      oynatici.connect(sik); sik.connect(telafi); telafi.connect(hedef);
    } else {
      oynatici.connect(hedef);
    }
    var t = new S();
    t.lang = 'tr-TR'; t.interimResults = true; t.maxAlternatives = 1; t.continuous = true;
    /* ⚠️ SÜREKLİ (13.10): `continuous = false` cümlenin ortasındaki İLK
       duraklamada keser — usta "34 ABC 123 … triger seti" derken nefes
       alır. Çalma bitince 1,2 sn sonra elle durduruluyor (onended). */
    if (ifadeAcik && window.SpeechRecognitionPhrase && 'phrases' in t) {
      t.phrases = BEKLENEN.map(function (k) { return new SpeechRecognitionPhrase(k, 5.0); });
    }
    var yazi = '', hata = null, kapandi = false;
    var kapat = function () {
      if (kapandi) return; kapandi = true;
      try { oynatici.stop(); } catch (e) {}
      ctx.close();
      bitti(hata ? { hata: hata, yazi: yazi } : { yazi: yazi });
    };
    /* ⚠️ CÜMLE SONU KESİLİYORDU (13.10, telefon ve bilgisayar setleri):
       "yağ filtresi 300 lira" → "yağ filtresi 3", "balata ara" → "Balat".
       Yalnız KESİNLEŞEN sonuçlar toplanıyordu; son kelime GEÇİCİ sonuçta
       beklerken dinleme kapanıyor ve kayboluyordu. Artık her olayda
       bütün sonuç listesi yeniden okunuyor: kesinler + varsa en son
       geçici parça. Kapanışta elde ne varsa o yazı.
       İkinci kusur: parçalar BOŞLUKSUZ ekleniyordu (`yazi += …`) — iki
       parçaya bölünen cümlede kelimeler yapışırdı. Boşlukla birleşiyor. */
    t.onresult = function (e) {
      var parcalar = [];
      for (var i = 0; i < e.results.length; i++) parcalar.push(e.results[i][0].transcript.trim());
      yazi = parcalar.filter(Boolean).join(' ');
    };
    t.onerror = function (e) { if (e.error !== 'no-speech' && e.error !== 'aborted') hata = e.error; };
    t.onend = kapat;
    /* Ses bitince 2,5 sn daha dinlenir (önce 1,2): tanıyıcı son kelimeyi
       kesinleştirmek için sessizlik bekliyor. */
    oynatici.onended = function () { setTimeout(function () { try { t.stop(); } catch (e) {} }, 2500); };
    setTimeout(function () { try { t.abort(); } catch (e) {} kapat(); }, (tampon.duration + 12) * 1000);
    try { t.start(hedef.stream.getAudioTracks()[0]); }
    catch (e) { hata = 'start(track) desteklenmiyor: ' + e.message; return kapat(); }
    oynatici.start();
  });
}

/* Kelime hata oranı — beklenen cümleye göre, normalize edilmiş. Türkçede
   sınır aranmaz, boşluktan bölünür (K-018). */
function kelimeler(s) {
  return (s || '').toLocaleLowerCase('tr').replace(/[.,!?;:"]/g, ' ').split(/\s+/).filter(Boolean);
}
function kho(beklenen, duyulan) {
  var a = kelimeler(beklenen), b = kelimeler(duyulan);
  var d = [];
  for (var i = 0; i <= a.length; i++) { d[i] = [i]; for (var j = 1; j <= b.length; j++) d[i][j] = i ? 0 : j; }
  for (i = 1; i <= a.length; i++) for (j = 1; j <= b.length; j++) {
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  }
  return a.length ? d[a.length][b.length] / a.length : 0;
}

var SECIM = null, SON_HAM = null, SON_AD = '', KOSUYOR = false, MESGUL = false;
/* ART ARDA AĞ HATASINDA DUR (13.10): ikinci gerçek koşuda tanıma sunucusu
   cevap vermedi ve koşucu 40 dosyayı ~9 dk boşuna denedi. Art arda 3
   "network" = sunucuya ulaşılamıyor; koşu durur ve SÖYLER. Bugün kısa
   sürede ~130 oturum açılmıştı — ücretsiz hizmetin kotası olabilir. */
var AG_SINIRI = 3;
function agKesildiMi(sonuclar) {
  if (sonuclar.length < AG_SINIRI) return false;
  return sonuclar.slice(-AG_SINIRI).every(function (x) { return x.hata === 'network'; });
}
var AG_UYARI = ' Tanıma sunucusuna art arda ulaşılamadı — koşu durduruldu. İnternet ' +
  'bağlantısını kontrol et; bağlantı varsa ücretsiz hizmetin kotası dolmuş olabilir, bir süre sonra dene.';
function secenekler() {
  return { esitle: $('esitle').checked, dinamik: $('dinamik').checked, kirp: $('kirp').checked, ifadeler: $('ifadeler').checked };
}
async function sunucuDosya(yol, ad) {
  var r = await fetch(yol + '?t=' + Date.now());
  if (!r.ok) throw new Error(yol + ' — ' + r.status);
  return new File([await r.blob()], ad || yol.split('/').pop());
}
document.addEventListener('click', async function (e) {
  var b = e.target.closest('[data-sunucu]');
  if (b) {
    /* ⚠️ KOŞU SÜRERKEN İKİNCİ DÜĞME YOK (13.10): ilk gerçek koşuda iki
       düğmeye art arda basıldı; ikincisi koşmadı ama DOSYA ADINI değiştirdi
       — 40 cümlenin sonucu "derlem" adıyla indi. */
    /* MESGUL basıldığı ANDA konur — dosyalar sunucudan inerken de koşu
       sürüyor sayılır (ilk yazışta işaret indirmeden SONRA konuyordu ve
       indirme sırasında basılan ikinci düğme geçiyordu). */
    if (KOSUYOR || MESGUL) { durum('Bir koşu sürüyor — bitmesini bekle.'); return; }
    MESGUL = true;
    var tur = b.getAttribute('data-sunucu');
    try {
      durum('Sunucudan alınıyor…');
      var klasor = (document.querySelector('input[name="klasor"]:checked') || {}).value || 'kayitlar';
      if (klasor === 'buyuk') klasor = ($('buyukKlasor').value || 'buyuk-1').replace(/[^a-z0-9-]/gi, '');
      durum('Sunucudan alınıyor — klasör: ' + klasor + '…');
      var dzYanit = await fetch(KOK + 'sesler/' + klasor + '/dizin.json?t=' + Date.now());
      if (!dzYanit.ok) throw new Error('sesler/' + klasor + '/ klasöründe kayıt yok (zip oraya açılmalı)');
      var dz = await dzYanit.json();
      if (dz.set === 'buyuk') {
        SET_BUYUK = SET_BUYUK || await (await fetch(KOK + 'buyuk-set.json?t=' + Date.now())).json();
        SET = SET_BUYUK;
      } else {
        SET = SET_ESAS;
      }
      var adlar = dz.kayitlar.map(function (k) { return k.dosya; });
      /* Yeni setlerde dizinin başında ortam.wav var — "tek dosya" ilk
         CÜMLEYİ almalı (13.10: ortamı alıp "dosya yok" diyordu). */
      adlar = adlar.filter(function (a) { return /^s\d+\.wav$/i.test(a); });
      if (tur === 'dogrula') adlar = adlar.slice(0, 1);
      var tum = [], g = null;
      if (tur === 'derlem' || tur === 'derlem5') {
        var liste = await (await fetch(KOK + 'sesler/derlem-100/')).text();
        var dos = (liste.match(/href="([^"]+\.(?:flac|txt))"/g) || []).map(function (h) { return decodeURIComponent(h.slice(6, -1)); }).sort();
        if (tur === 'derlem5') dos = dos.slice(0, 10);   /* ilk 5 ses + 5 metin */
        for (var i = 0; i < dos.length; i++) tum.push(await sunucuDosya(KOK + 'sesler/derlem-100/' + dos[i], dos[i]));
      } else {
        for (var j = 0; j < adlar.length; j++) tum.push(await sunucuDosya(KOK + 'sesler/' + klasor + '/' + adlar[j], adlar[j]));
        if (tur === 'gurultu') g = await sunucuDosya(KOK + 'sesler/gurultu/' + b.getAttribute('data-g') + '.mp3');
      }
      SECIM = { tum: tum, gurultu: g };
      SON_AD = 'ses-olcum-' + tur + (tur === 'derlem' || tur === 'derlem5' ? '' : '-' + klasor) +
               (g ? '-' + b.getAttribute('data-g') : '') + ($('ifadeler').checked ? '-ipucu' : '') + '.json';
      $('kos').disabled = false;
      $('kos').click();
    } catch (x) { durum('Alınamadı: ' + x.message + ' — yerel sunucu açık mı?'); SECIM = null; MESGUL = false; }
    return;
  }
  if (e.target.id === 'indir' && SON_HAM) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([SON_HAM], { type: 'application/json' }));
    a.download = SON_AD || 'ses-olcum.json';
    document.body.appendChild(a); a.click(); a.remove();
  }
});

$('kos').addEventListener('click', async function () {
  if (KOSUYOR) return;
  var P = $('prototip').contentWindow;
  if (!P || typeof P.SES_COZUMLE !== 'function') { durum('Prototip yüklenmedi — sayfayı yenile.'); return; }
  var ifadeAcik = $('ifadeler').checked;
  /* İPUCU LİSTESİ SÖZLÜKTEN (16.10): dükkânın plakaları + marka/modelleri
     + terimler + işlerin sözleri (betik/05-soyleyis.js). Kurmaca dükkânla
     koşuluyorsa ONUN araçları. Sabit 8 kelime yalnız eski prototipte kalır. */
  if (ifadeAcik && typeof P.SOYLEYIS_IFADELER === 'function') {
    BEKLENEN = P.SOYLEYIS_IFADELER(SET.dukkan ? SET.dukkan.araclar : P.ARACLAR);
  }
  var tum = SECIM ? SECIM.tum : Array.prototype.slice.call($('dosyalar').files);
  KOSUYOR = true;

  /* DERLEM KİPİ — ses + aynı adlı .txt */
  var metinler = {};
  tum.forEach(function (f) { if (/\.txt$/i.test(f.name)) metinler[f.name.replace(/\.txt$/i, '')] = f; });
  var derlem = tum.filter(function (f) { return !/\.txt$/i.test(f.name) && metinler[f.name.replace(/\.[^.]+$/, '')]; });
  if (derlem.length) {
    this.disabled = true;
    var ds = [];
    for (var d = 0; d < derlem.length; d++) {
      durum('Derlem ' + (d + 1) + ' / ' + derlem.length + ' — ' + derlem[d].name);
      var dogru = (await metinler[derlem[d].name.replace(/\.[^.]+$/, '')].text()).trim();
      var kd = derlem[d];
      if ($('kirp').checked) { var od = await ornekleriAl(kd); kd = { ornekler: sessizlikKirp(od.ornekler, od.hiz), hiz: od.hiz }; }
      var rr = await tani(kd, ifadeAcik);
      ds.push({ dosya: derlem[d].name, beklenen: dogru, duyulan: rr.yazi || '', hata: rr.hata || null,
                kho: kho(dogru, rr.yazi) });
      if (agKesildiMi(ds)) break;
    }
    var basarili = ds.filter(function (x) { return !x.hata; });
    var ort = basarili.length ? basarili.reduce(function (t, x) { return t + x.kho; }, 0) / basarili.length : null;
    $('derlemKutu').hidden = false;
    $('derlem').innerHTML = '<thead><tr><th>Dosya</th><th>Tanınan</th><th>Ortalama kelime hatası</th><th>Tanıma hatası</th></tr></thead><tbody>' +
      '<tr><td class="s">' + ds.length + '</td><td class="s">' + basarili.length + '</td><td class="s">' +
      (ort === null ? '—' : '%' + Math.round(ort * 100)) + '</td><td class="s' + (ds.length - basarili.length ? ' hata' : '') + '">' +
      (ds.length - basarili.length) + '</td></tr></tbody>';
    $('ham').textContent = JSON.stringify({ tarih: new Date().toISOString(), kip: 'derlem', ifadeler: ifadeAcik,
      tarayici: navigator.userAgent, ortalamaKho: ort, sonuc: ds }, null, 1);
    durum('Derlem bitti — ' + ds.length + ' dosya.' + (agKesildiMi(ds) ? AG_UYARI : ''));
    kosuBitti();
    this.disabled = false;
    return;
  }

  var dosyalar = tum
    .map(function (f) { return { f: f, ad: adCoz(f.name) }; })
    .filter(function (x) { return x.ad && SET.cumleler.some(function (c) { return c.id === x.ad.id; }); });
  if (!dosyalar.length) { KOSUYOR = false; MESGUL = false; durum('Adı sözleşmeye uyan dosya yok (s01.wav …).'); return; }
  this.disabled = true;

  /* GÜRÜLTÜ SEÇİLDİYSE: her TEMİZ kayıttan varyantlar — ortak modülden. */
  var gf = SECIM ? SECIM.gurultu : $('gurultu').files[0];
  var kirpAcik = $('kirp').checked;
  var is = [];
  for (var q = 0; q < dosyalar.length; q++) {
    var kay = dosyalar[q].f;
    if (kirpAcik) { var oo = await ornekleriAl(kay); kay = { ornekler: sessizlikKirp(oo.ornekler, oo.hiz), hiz: oo.hiz }; }
    is.push({ ad: dosyalar[q].f.name, id: dosyalar[q].ad.id, tur: dosyalar[q].ad.tur, kaynak: kay });
  }
  if (gf) {
    durum('Gürültü çözülüyor — ' + gf.name);
    var ortam = (await ornekleriAl(gf)).ornekler;
    var gAd = gf.name.replace(/\.[^.]+$/, '');
    for (var v = 0; v < dosyalar.length; v++) {
      if (dosyalar[v].ad.tur !== 'temiz') continue;
      var o = await ornekleriAl(dosyalar[v].f);
      if (kirpAcik) o = { ornekler: sessizlikKirp(o.ornekler, o.hiz), hiz: o.hiz };
      SesBozma.varyantlar(o.ornekler, ortam, o.hiz).forEach(function (vr) {
        is.push({ ad: dosyalar[v].f.name.replace(/\.wav$/i, '') + '.' + vr[0] + (/^snr/.test(vr[0]) ? '·' + gAd : '') + '.wav',
                  id: dosyalar[v].ad.id, tur: vr[0] + (/^snr/.test(vr[0]) ? '·' + gAd : ''),
                  kaynak: { ornekler: vr[1], hiz: o.hiz } });
      });
    }
  }

  var sonuc = [];
  /* Kurmaca dükkân koşu süresince prototipe yüklenir, sonda geri konur
     (ölçüm aleti ölçtüğü şeyi değiştirmez — K-024.1). */
  var veriYedek = SET.dukkan ? { araclar: P.ARACLAR, kayitlar: P.KAYITLAR } : null;
  if (veriYedek) {
    P.ARACLAR = JSON.parse(JSON.stringify(SET.dukkan.araclar));
    P.KAYITLAR = JSON.parse(JSON.stringify(SET.dukkan.kayitlar));
  }
  var kayitId = P.eval("(icerideki().filter(function(k){return (k.satirlar||[]).length>1;})[0]||{}).id");
  try {
  for (var n = 0; n < is.length; n++) {
    var x = { f: { name: is[n].ad }, ad: { id: is[n].id, tur: is[n].tur } };
    durum((SET.dukkan ? 'BÜYÜK SET · ' : 'esas set · ') + (n + 1) + ' / ' + is.length + ' — ' + x.f.name);
    var r = await tani(is[n].kaynak, ifadeAcik);
    var c = SET.cumleler.filter(function (k) { return k.id === x.ad.id; })[0];
    var yed = { niyet: P.SESLI_NIYET, kayit: P.ACIK_KAYIT };
    P.SESLI_NIYET = c.baglam;
    P.ACIK_KAYIT = c.baglam === 'kayit-icinde' ? (c.kayitId || kayitId) : null;
    var islem = null;
    try { islem = r.yazi ? P.SES_COZUMLE(r.yazi) : { tur: 'plakasiz', metin: '' }; } catch (e) { islem = { hata: e.message }; }
    P.SESLI_NIYET = yed.niyet; P.ACIK_KAYIT = yed.kayit;
    sonuc.push({ dosya: x.f.name, id: c.id, tur: x.ad.tur, beklenen: c.cumle, duyulan: r.yazi || '',
                 hata: r.hata || null, kho: kho(c.cumle, r.yazi), islem: islem });
    if (agKesildiMi(sonuc)) break;
  }
  } finally {
    if (veriYedek) { P.ARACLAR = veriYedek.araclar; P.KAYITLAR = veriYedek.kayitlar; }
  }

  /* Bozma türü başına karne — AYNI cetvel (puanla.js). */
  var turler = {};
  sonuc.forEach(function (s) { (turler[s.tur] = turler[s.tur] || []).push(s); });
  /* ⚠️ TANINAMAYAN KAYIT PUANA GİRMEZ (12.10). İlk yazışta girdi: ağ
     hatası veren her kayıt "yanlış" sayıldı ve karne "%0 · kelime hatası
     %100" yazdı — tanıyıcıya HİÇ ULAŞILMADIĞI hâlde. "Her şeyi yanlış
     duydu" ile "duyamadı" aynı şey değil; ikincisi ayrı sayılır. */
  var karne = Object.keys(turler).sort().map(function (tur) {
    var tamam = turler[tur].filter(function (s) { return !s.hata; });
    var agHata = turler[tur].length - tamam.length;
    if (!tamam.length) return { tur: tur, dosya: turler[tur].length, puan: '— (tanınan yok)', kho: null, hata: agHata };
    var cevap = {};
    tamam.forEach(function (s) { cevap[s.id] = s.islem; });
    var altSet = { cumleler: SET.cumleler.filter(function (c) { return cevap[c.id]; }), kurallar: SET.kurallar };
    var p = PUANLA(altSet, cevap);
    var ort = tamam.reduce(function (t, s) { return t + s.kho; }, 0) / tamam.length;
    return { tur: tur, dosya: turler[tur].length, puan: p.ozet, kho: Math.round(ort * 100), hata: agHata };
  });

  $('karne').innerHTML = '<thead><tr><th>Bozma</th><th>Dosya</th><th>Çözümleme (aynı cetvel)</th><th>Kelime hatası</th><th>Tanıma hatası</th></tr></thead><tbody>' +
    karne.map(function (k) {
      return '<tr><td>' + k.tur + '</td><td class="s">' + k.dosya + '</td><td>' + k.puan + '</td><td class="s">' + (k.kho === null ? '—' : '%' + k.kho) +
        '</td><td class="s' + (k.hata ? ' hata' : '') + '">' + k.hata + '</td></tr>';
    }).join('') + '</tbody>';
  $('ayrinti').innerHTML = '<thead><tr><th>Dosya</th><th>Beklenen</th><th>Duyulan</th><th>İşlem</th></tr></thead><tbody>' +
    sonuc.map(function (s) {
      return '<tr><td>' + s.dosya + '</td><td>' + s.beklenen + '</td><td>' + (s.hata ? '<span class="hata">' + s.hata + '</span> ' : '') +
        (s.duyulan || '—') + '</td><td>' + ((s.islem && s.islem.tur) || '—') + '</td></tr>';
    }).join('') + '</tbody>';
  $('ham').textContent = JSON.stringify({ tarih: new Date().toISOString(), ifadeler: ifadeAcik,
    tarayici: navigator.userAgent, karne: karne, sonuc: sonuc }, null, 1);
  durum('Bitti — ' + sonuc.length + ' dosya.' + (agKesildiMi(sonuc) ? AG_UYARI
    : karne.some(function (k) { return k.hata; }) ? ' Tanıma hataları var: ağ bağlantısını kontrol et.' : ''));
  kosuBitti();
  this.disabled = false;
});

/* Koşu bitince: sonuç saklanır, sunucudan alınan seçim temizlenir ve
   sunucu kipinde JSON KENDİLİĞİNDEN iner (İndirilenler) — lider oradan
   okur. Elle seçilen dosyalarda yalnız düğme açılır. */
function kosuBitti() {
  KOSUYOR = false; MESGUL = false;
  /* Hangi seçeneklerle koşulduğu sonucun İÇİNDE — iki karne ancak
     böyle karşılaştırılır. */
  try { var hj = JSON.parse($('ham').textContent); hj.secenekler = secenekler(); $('ham').textContent = JSON.stringify(hj, null, 1); } catch (x) {}
  SON_HAM = $('ham').textContent;
  $('indir').disabled = false;
  var sunucudan = !!SECIM;
  SECIM = null;
  if (sunucudan) $('indir').click();
}
</script>
